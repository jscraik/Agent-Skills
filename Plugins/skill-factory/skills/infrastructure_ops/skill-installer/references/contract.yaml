schema_version: "1.1"
purpose: >
  Define the install-stage contract for skill-installer so remote skills are
  imported with trusted provenance, staged validation, and atomic rollback-safe activation.
triggers:
  - user asks to list available skills from curated or explicit repo sources
  - user asks to install contract-valid skills from GitHub repo paths
  - user asks to repair missing installed-skill visibility
  - user asks to attach custom-agent roles while installing skills
inputs:
  - source repository and skill path(s)
  - pinned source ref or explicit unpinned override
  - optional destination skill root override (defaults to canonical repository category root)
  - install method preference (download, git, auto)
  - optional agent injection mode and source role path
outputs:
  - installed skills under canonical repository category roots (or explicit override root when provided)
  - provenance manifest with requested ref and resolved commit
  - rollback journal capturing staged and promoted install events
  - optional role-injection outcome with reuse/create decision and validated role file path
non_goals:
  - authoring or lifecycle hardening of skill behavior
  - plugin package creation or marketplace scaffolding
  - bypassing trust and provenance checks silently
risks:
  - supply chain drift from moving refs; mitigated by enforced ref pinning
  - partial activation failures; mitigated by quarantine-to-promote and rollback
  - weak traceability; mitigated by persisted manifest and journal artifacts
  - attaching unrelated roles to installed skills; mitigated by explicit source-path checks and role validation via codex-agent-builder scripts
rollback_procedure: >
  If an install produces an unusable or malicious skill, use the rollback journal artifact to
  identify the staged install entry and delete the promoted skill directory from the canonical repository category root.
  Re-run with the previous pinned ref or a known-good commit SHA. For regressions in skill-installer
  itself, restore the entire Plugins/skill-factory/skills/infrastructure_ops/skill-installer/ asset set (including SKILL.md,
  Infrastructure/scripts/install-skill-from-github.py, and any other runtime scripts) from git, re-run the exact authoring-family
  gate command (bash Infrastructure/scripts/validation-and-linting/validate_skill_authoring_family.sh) to validate the authoring family before redeploying,
  and verify the provenance manifest and quarantine paths are intact before re-deploying.
  Do not skip the quarantine-to-promote step during recovery.
observability: >
  Monitor skill-installer via: (1) provenance manifest presence and ref-resolved-commit fields
  after each install run — missing entries indicate journal drift; (2) quarantine-to-promote
  success rate; installs that stall in quarantine signal validation failures requiring investigation;
  (3) family gate CI pass/fail for Plugins/skill-factory/skills/infrastructure_ops/skill-installer; (4) supply chain alerts from
  openclaw_skill_guard.py --mode security run against newly installed skills.
