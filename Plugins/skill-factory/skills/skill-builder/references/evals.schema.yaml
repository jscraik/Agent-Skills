$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Skill Evals"
description: "JSON Schema for skill-authoring family evals.yaml files (schema_version 2.0)"
type: object

required:
  - schema_version
  - skill_name
  - cases

additionalProperties: true

properties:
  schema_version:
    type: string
    description: "Evals schema version, e.g. '2.0'"

  skill_name:
    type: string
    minLength: 1
    description: "Slug of the skill these evals target"

  neutral_baseline_approvals:
    type: array
    items:
      type: object
      required: [id, rationale, approved_by, recorded_at, source_of_truth]
      additionalProperties: true
      properties:
        id:
          type: string
        rationale:
          type: string
        approved_by:
          type: string
        recorded_at:
          type: string
        source_of_truth:
          type: string

  cases:
    type: array
    minItems: 1
    description: "Eval test cases"
    items:
      type: object
      required:
        - id
        - name
        - category
        - eval_modes
        - should_trigger
        - prepend_skill
        - prompt
        - acceptance
      additionalProperties: true
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
          description: "Unique case identifier in kebab-case"

        name:
          type: string
          minLength: 1

        category:
          type: string
          enum: [happy, edge, negative, pressure]
          description: "Case classification"

        eval_modes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [smoke, release]

        should_trigger:
          type: boolean

        prepend_skill:
          type: boolean

        prompt:
          type: string
          minLength: 10

        smoke_mode:
          type: string
          description: "Optional override for smoke-mode evaluation strategy"

        timeout_profile:
          type: string
          description: "Named timeout profile for long-running cases"

        baseline_type:
          type: string
          enum: [no_skill, prior_skill_snapshot, neutral_repo_baseline]

        neutral_baseline_approval_id:
          type: string

        comparison_inputs:
          type: object
          additionalProperties: true

        iteration_round_state:
          type: string

        metric_availability:
          type: string

        readiness_state:
          type: string

        comparison_review_artifact:
          type: string

        deterministic_checks:
          type: object
          additionalProperties: false
          description: "Commands checked against actual JSONL tool-call event streams"
          properties:
            required_commands:
              type: array
              items:
                type: string
              description: "Commands that MUST appear in the tool-call trace"
            forbidden_commands:
              type: array
              items:
                type: string
              description: "Commands that MUST NOT appear in the tool-call trace"

        acceptance:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, value]
            additionalProperties: false
            properties:
              type:
                type: string
                enum: [contains, not_contains, regex, not_regex]
              value:
                type: string
                minLength: 1
