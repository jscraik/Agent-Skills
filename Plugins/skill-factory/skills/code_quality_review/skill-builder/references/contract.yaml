purpose: >
  Define expected behavior, scope boundaries, and measurable outputs for skill-builder.
schema_version: 1.1
triggers:
  - user asks to create, improve, audit, compare, benchmark, or package a Codex skill
  - user asks to tighten skill routing, validation gates, or safety contracts
  - user asks to wire skill lifecycle work to existing or purpose-built custom agents
inputs:
  - mode selection (create, improve, eval, benchmark-lite, graph, package, install-distribute)
  - skill objective and constraints
  - target environment (codex, claude, portable)
  - conformance profile (native or imported)
  - prompt coverage (happy, edge, should-not-trigger)
  - optional agent injection strategy (`reuse-existing` from `/Users/jamiecraik/dev/configs/codex/agents` or `create-purpose-built` via `codex-agent-builder`, with global installs targeting `/Users/jamiecraik/dev/configs/codex/config.toml`)
outputs:
  - scoped response with required headings
  - implementation plan or concrete file edits
  - validator/eval evidence for non-trivial work
  - dual-grade evidence when upstream eval metadata is present (gold gates + upstream-grade pass)
  - deterministic JSON summary block for improve/eval/benchmark-lite responses
  - optional agent-injection decision with selected/generated role file path
output_contract:
  schema_version: "1.0"
  required_fields:
    - mode
    - skill_path
    - findings
    - validations
    - next_step
  optional_fields:
    - ui_metadata
    - trace_budget
    - remediation
    - conformance_profile
    - upstream_grade
non_goals:
  - unrelated app feature coding
  - generic docs rewrites without skill workflow impact
  - skipping validation for speed
  - splitting grading into a separate standalone skill
risks:
  - trigger ambiguity; mitigated by explicit use-when and should-not-trigger prompts
  - frontmatter parser risk from XML-style angle brackets; mitigated by frontmatter sanitization checks
  - quality drift from unbounded iteration; mitigated by retry caps and fail-fast validation gates
  - Codex UX mismatch; mitigated by optional agents/openai.yaml generation when metadata is needed
  - duplicate/foldable installs; mitigated by mandatory full-scan deconflict across installed operational skills before any install/update write
  - false overlap from system/meta skills; mitigated by default exclusion of `.system` and creator/meta scaffolding skills (for example `skill-creator`) unless explicitly requested
  - upstream/native grading drift; mitigated by unified conformance profiles that always run gold gates and optionally run upstream-grade checks when source metadata exists
  - incorrect role reuse across unrelated skills; mitigated by explicit `reuse-existing` versus `create-purpose-built` decision and role-file validation
rollback_procedure: >
  If skill-builder produces degraded output (missing required headings, incorrect mode routing, or
  invalid validator evidence), revert to the previous SKILL.md by restoring the last known-good git
  commit for Plugins/skill-factory/skills/code_quality_review/skill-builder/SKILL.md. Re-run the family gate
  (bash Infrastructure/scripts/validate_skill_authoring_family.sh) to confirm the rollback candidate passes all
  structural checks before re-deploying. If the regression is in a validator script, revert the
  relevant script and re-run: python Skills/skill-builder/Infrastructure/scripts/skill_gate.py <skill> --format text.
observability: >
  Monitor skill-builder health via: (1) validate_skill_authoring_family.sh gate results in CI — any
  non-zero exit is a regression signal; (2) skill quality scores from analyze_skill.py --min-pass 60
  dropping below threshold across multiple consecutive runs; (3) eval pass rate in
  Infrastructure/artifacts/validation/latest/ — a drop in smoke pass rate below 70% warrants investigation;
  (4) upgrade_skill.py HIGH-priority findings increasing across the family over time indicates
  systematic quality drift requiring a lifecycle review.
