schema_version: "1.1"
purpose: "Operational contract for skill-builder routing and execution boundaries."
triggers:
  - "user requests skill-builder behavior"
  - "user asks to harden, audit, validate, or patch an existing skill package"
  - "user asks to fold a long skill-review or Codex-harness workflow into an existing skill"
inputs:
  - "task intent"
  - "target path or source context"
  - "canonical source path or enough evidence to resolve it"
  - "optional validator output, eval evidence, media requirements, or lifecycle notes"
outputs:
  - "structured response with explicit status"
  - "context lifecycle stage changed or blocked"
  - "validator evidence using pass/fail/blocked/not applicable"
  - "media artifact evidence or blocked status when image generation is requested"
non_goals:
  - "unrelated implementation work outside skill scope"
risks:
  - "ambiguous intent can cause wrong lane selection"
  - "copying long review prompts into SKILL.md can inflate invoke cost and hide routing"
  - "runtime projection edits can silently drift from canonical source"
  - "generated media can be falsely claimed if cache-copy and existence checks are skipped"
output_contract:
  schema_version: "1"
  required_fields:
    - "schema_version"
    - "mode"
    - "validation_evidence"
    - "context_lifecycle_status"
    - "context.lifecycle.stage"
  optional_fields:
    - "blocked_by"
rollback_procedure: "Revert edited files and rerun validation gates before continuing."
observability: "Track pass/fail/blocked outcomes for each validation command in run output."
context_lifecycle:
  required_stages: [generate, test, distribute, observe, adapt]
  minimum_for_behavior_change:
    - "realistic eval or validation route updated"
    - "future observation source named"
    - "raw transcripts and reviewer text kept out of SKILL.md"
