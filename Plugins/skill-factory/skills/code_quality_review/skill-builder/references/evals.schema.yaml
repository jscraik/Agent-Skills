$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required: [schema_version, skill_name, cases]
properties:
  schema_version:
    type: string
  skill_name:
    type: string
  claims:
    type: array
    items:
      type: object
      required: [id, statement, source, claim_type, evidence_required]
      properties:
        id: {type: string}
        statement: {type: string}
        source: {type: string}
        claim_type: {type: string, enum: [activation, execution, safety, efficiency, governance, portability, observability]}
        risk: {type: string, enum: [critical, high, medium, low]}
        hard_gate: {type: boolean}
        evidence_required:
          type: array
          minItems: 1
          items: {type: string}
        scenario_families:
          type: array
          items: {type: string}
  baselines:
    type: array
    items:
      type: object
      required: [id, baseline_type]
      properties:
        id: {type: string}
        baseline_type: {type: string, enum: [no_skill, previous_version, prior_skill_snapshot, neutral_repo_baseline, competing_skill, human_reference]}
        command: {type: string}
        artifact: {type: string}
        rationale: {type: string}
  reporting:
    type: object
    properties:
      preferred_source_format: {type: string, enum: [mdx, markdown, json]}
      report_template: {type: string}
      component_bundle: {type: string}
      required_panels:
        type: array
        items: {type: string}
      machine_outputs:
        type: array
        items: {type: string}
  cases:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, name, category, eval_modes, should_trigger, prepend_skill, prompt, acceptance]
      properties:
        id: {type: string}
        name: {type: string}
        category: {type: string, enum: [happy, edge, negative, pressure]}
        eval_modes:
          type: array
          minItems: 1
          items: {type: string, enum: [smoke, release]}
        should_trigger: {type: boolean}
        prepend_skill: {type: boolean}
        prompt: {type: string}
        claim_ids:
          type: array
          items: {type: string}
        realistic: {type: boolean}
        why_realistic: {type: string}
        baseline_id: {type: string}
        comparison_inputs: {type: object}
        hard_gates:
          type: array
          items: {type: string}
        expected_evidence:
          type: array
          items: {type: string}
        deterministic_checks: {type: object}
        acceptance:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  type: {type: string}
                  value: {type: string}
                  expected_skill: {type: string}
                  contains: {type: string}
                  not_contains: {type: string}
                  regex: {type: string}
