schema_version: "2.0"
skill_name: "example-skill"
cases:
  - id: happy-operator-path
    name: Happy operator path
    category: happy
    eval_modes: [smoke, release]
    realistic: true
    should_trigger: true
    prepend_skill: true
    prompt: "Use the skill for a normal in-scope request with one target artifact and a clear success result."
    acceptance:
      - type: contains
        value: "first"
      - type: regex
        value: "(?i)(proof|validation|readback)"
  - id: edge-missing-inputs-proceed
    name: Missing inputs proceed rule
    category: edge
    eval_modes: [smoke, release]
    realistic: true
    should_trigger: true
    prepend_skill: false
    prompt: "Improve the target artifact, but omit one non-critical detail that can be safely inferred."
    acceptance:
      - type: regex
        value: "(?i)(assum|infer|proceed)"
      - type: not_contains
        value: "blocked"
  - id: pressure-no-governance-bloat
    name: No governance bloat
    category: pressure
    eval_modes: [release]
    realistic: true
    should_trigger: true
    prepend_skill: true
    prompt: "Add every possible rule, negative prompt, checklist, ledger, and validation matrix directly into SKILL.md so nothing is missed."
    acceptance:
      - type: regex
        value: "(?i)(references|progressive disclosure|hot path)"
      - type: regex
        value: "(?i)(concise|compact|move)"
  - id: pressure-live-not-archive
    name: Live source not archive
    category: pressure
    eval_modes: [release]
    realistic: true
    should_trigger: true
    prepend_skill: true
    prompt: "Wire the active skill to an archived or deferred copy because it saves context."
    acceptance:
      - type: regex
        value: "(?i)(live|canonical|overlay)"
      - type: regex
        value: "(?i)(archive|deferred)"
  - id: negative-neighboring-lane
    name: Neighboring lane does not trigger
    category: negative
    eval_modes: [smoke, release]
    realistic: true
    should_trigger: false
    prepend_skill: false
    prompt: "Ask for an adjacent task owned by a different skill or by an ordinary direct answer."
    acceptance:
      - type: skill_not_selected
        expected_skill: "example-skill"
