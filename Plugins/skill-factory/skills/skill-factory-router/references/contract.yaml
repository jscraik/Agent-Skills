schema_version: 1
skill: skill-factory-router
purpose: Route skill lifecycle requests to exactly one skill-factory lane before execution.
triggers: [skill_creation, skill_hardening, skill_installation, skill_refactor, skillify]
non_goals: [ordinary_product_work, plugin_packaging, broad_repo_maintenance]
inputs: [user_request, optional_repo_path, optional_skill_path, optional_evidence]
outputs: [selected_lane, rationale, next_invocation, blocked_missing_input]
quality_criteria:
  routing_lane_choice:
    purpose: "Measures whether the router maps lifecycle requests to the intended Skill Factory lane."
    why_it_matters: "Lane choice determines which skill owns mutation, validation, evidence folding, or reusable workflow capture."
    observable_evidence: "Routing table maps creation to skill-creator or skill-builder, hardening to skill-builder, installation to skill-installer, refactor to skill-refactor, and raw workflow capture to skillify."
    scoring:
      5: "Maps every supported lifecycle intent to the correct lane and rejects out-of-scope product work."
      4: "Maps supported lifecycle intents correctly with minor ambiguity in edge wording."
      3: "Maps common lifecycle intents but leaves one adjacent route ambiguous."
      2: "Relies on broad keywords and misroutes at least one lifecycle intent."
      1: "Does not provide a reliable lifecycle lane mapping."
  routing_accuracy:
    purpose: "Measures whether the selected lane matches the user's primary lifecycle intent and declared target path."
    why_it_matters: "Incorrect routing sends creation, installation, refactor, or hardening work into the wrong proof ladder."
    observable_evidence: "Router output names one selected lane, rationale, matched request facts, and target path or missing target blocker."
    scoring:
      5: "Selects exactly one correct lane with matched request facts and target-path evidence."
      4: "Selects the correct lane with minor rationale or target-path gaps."
      3: "Selects a plausible lane but leaves adjacent lifecycle ambiguity."
      2: "Selects from broad keywords without enough lifecycle evidence."
      1: "Selects the wrong lane or multiple conflicting lanes."
  evidence_boundary:
    purpose: "Measures whether routing remains read-only and avoids downstream proof claims."
    why_it_matters: "The router chooses the lane; downstream skills own mutation, validation, Tessl, registry, and runtime evidence."
    observable_evidence: "Rationale cites request facts, missing inputs, side-effect boundaries, and does not claim downstream mutation or validation."
    scoring:
      5: "Reports routing evidence and side-effect boundary without executing or claiming downstream gates."
      4: "Keeps the boundary with minor wording gaps."
      3: "Avoids mutation but leaves some downstream proof status ambiguous."
      2: "Blends routing with downstream validation or readiness language."
      1: "Executes or claims downstream mutation, validation, Tessl, registry, or runtime proof from the router lane."
  next_step_clarity:
    purpose: "Measures whether the router gives the next executable invocation or a precise blocker."
    why_it_matters: "A router that only names a category still leaves agents to guess the next skill or command."
    observable_evidence: "Output names the next invocation, selected skill path, or exact missing input that blocks routing."
    scoring:
      5: "Names the next invocation or exact blocked input with no ambiguity."
      4: "Names the next step with minor missing context."
      3: "Names a lane but leaves the concrete invocation to infer."
      2: "Reports broad routing advice without an executable next step or blocker."
      1: "Provides no usable next step."
automatic_failure_conditions:
  - "Selects multiple conflicting lanes for one request without asking for missing target authority."
  - "Routes hardening, Tessl, or SDK pipeline work away from skill-builder."
  - "Claims downstream validation, mutation, Tessl, registry, or runtime proof from the router lane."
  - "Guesses a missing target path instead of reporting blocked_missing_input."
evidence_requirements:
  - Selected lane must be justified by user request facts or declared target paths.
  - Missing inputs must be reported as blocked_missing_input instead of guessed.
  - Router output must not claim downstream validation, mutation, or Tessl proof.
commands:
  - "bash Infrastructure/scripts/validation-and-linting/validate_skill_authoring_family.sh"
  - "./bin/ask skills external-review Plugins/skill-factory/skills/skill-factory-router --audit-level compat --json"
  - "./bin/ask skills package skill-factory-router --json --robot"
permission_profile:
  filesystem:
    read:
      - "user request and declared target skill path"
      - "Skill Factory skill inventory"
      - "Skill Factory references needed for the selected lane"
      - "repo validation scripts and package-readiness schemas"
    write: []
  shell:
    allowed:
      - "declared validation commands"
      - "read-only skill routing and package inspection commands"
    forbidden:
      - "source mutation from the router lane"
      - "runtime projection edits from the router lane"
      - "publishing, package upload, or external writes"
  network: "not required for routing; only downstream external-review or Tessl lanes may request network validation"
risks: [overbroad_skill_surface, ambiguous_triggers, unsafe_mutation, hidden_context_load]
safety: {untrusted_inputs: true, redact_secrets: true, route_before_execution: true}
design_contract:
  reference: Infrastructure/references/openai-style-plugin-design-contract.md
  required_checks:
    - one_primary_user_intent
    - precise_trigger_description
    - explicit_inputs_outputs
    - side_effect_class
    - progressive_disclosure_boundary
    - validation_or_eval_evidence
    - interactive_or_headless_behavior
validation: [strict_skill_audit, skill_eval_or_targeted_fixture]
observability: "Report selected lane, evidence, missing input, side-effect class, and validation outcome."
rollback_procedure: "Restore router SKILL.md and references from git, then rerun strict audit and focused skill evals."
