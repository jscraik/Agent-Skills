schema_version: 1
skill: skill-factory-router
purpose: Route skill lifecycle requests to exactly one skill-factory lane before execution.
triggers: [skill_creation, skill_hardening, skill_installation, skill_refactor, skillify]
non_goals: [ordinary_product_work, plugin_packaging, broad_repo_maintenance]
inputs: [user_request, optional_repo_path, optional_skill_path, optional_evidence]
outputs: [selected_lane, rationale, next_invocation, blocked_missing_input]
quality_criteria:
  routing_lane_choice:
    creation: new skill request routes to skill-creator or skill-builder path
    hardening: existing skill improvement routes to skill-builder and SDK pipeline
    installation: external skill intake routes to skill-installer path
    refactor: source extraction, restructuring, or reuse analysis routes to skill-refactor
    skillify: raw content conversion routes to skillify before package hardening
  routing_accuracy: selected lane matches the user's primary lifecycle intent and declared target path
  evidence_boundary: rationale cites request facts, missing inputs, and side-effect boundaries without executing downstream mutation
  next_step_clarity: output names the next invocation or the exact missing input that blocks routing
evidence_requirements:
  - Selected lane must be justified by user request facts or declared target paths.
  - Missing inputs must be reported as blocked_missing_input instead of guessed.
  - Router output must not claim downstream validation, mutation, or Tessl proof.
commands:
  - "bash Infrastructure/scripts/validation-and-linting/validate_skill_authoring_family.sh"
  - "./bin/ask skills external-review Plugins/skill-factory/skills/skill-factory-router --audit-level compat --json"
  - "./bin/ask skills package skill-factory-router --json --robot"
permission_profile:
  filesystem:
    read:
      - "user request and declared target skill path"
      - "Skill Factory skill inventory"
      - "Skill Factory references needed for the selected lane"
      - "repo validation scripts and package-readiness schemas"
    write: []
  shell:
    allowed:
      - "declared validation commands"
      - "read-only skill routing and package inspection commands"
    forbidden:
      - "source mutation from the router lane"
      - "runtime projection edits from the router lane"
      - "publishing, package upload, or external writes"
  network: "not required for routing; only downstream external-review or Tessl lanes may request network validation"
risks: [overbroad_skill_surface, ambiguous_triggers, unsafe_mutation, hidden_context_load]
safety: {untrusted_inputs: true, redact_secrets: true, route_before_execution: true}
design_contract:
  reference: Infrastructure/references/openai-style-plugin-design-contract.md
  required_checks:
    - one_primary_user_intent
    - precise_trigger_description
    - explicit_inputs_outputs
    - side_effect_class
    - progressive_disclosure_boundary
    - validation_or_eval_evidence
    - interactive_or_headless_behavior
validation: [strict_skill_audit, skill_eval_or_targeted_fixture]
observability: "Report selected lane, evidence, missing input, side-effect class, and validation outcome."
rollback_procedure: "Restore router SKILL.md and references from git, then rerun strict audit and focused skill evals."
