schema_version: "1.1"
purpose: "Operational contract for skill-builder routing and execution boundaries."
triggers:
  - "user requests skill-builder behavior"
inputs:
  - "task intent"
  - "target path or source context"
outputs:
  - "structured response with explicit status"
  - "context lifecycle stage changed or blocked"
non_goals:
  - "unrelated implementation work outside skill scope"
risks:
  - "ambiguous intent can cause wrong lane selection"
output_contract:
  schema_version: "1"
  required_fields:
    - "schema_version"
    - "mode"
    - "validation_evidence"
    - "context.lifecycle.stage"
  optional_fields:
    - "blocked_by"
rollback_procedure: "Revert edited files and rerun validation gates before continuing."
observability: "Track pass/fail/blocked outcomes for each validation command in run output."
context_lifecycle:
  required_stages: [generate, test, distribute, observe, adapt]
  minimum_for_behavior_change:
    - "realistic eval or validation route updated"
    - "future observation source named"
    - "raw transcripts and reviewer text kept out of SKILL.md"
