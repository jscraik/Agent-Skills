schema_version: "1.1"
purpose: "Operational contract for skill-creator routing and execution boundaries."
triggers:
  - "user requests skill-creator behavior"
inputs:
  - "task intent"
  - "target path or source context"
outputs:
  - "structured response with explicit status"
non_goals:
  - "unrelated implementation work outside skill scope"
risks:
  - "ambiguous intent can cause wrong lane selection"
  - "over-applying Linear or Project Brain ceremony to tiny helpers creates bloat"
  - "skipping session evidence during skill improvement can preserve known failure modes"
output_contract:
  schema_version: "1"
  required_fields:
    - "schema_version"
    - "mode"
    - "validation_evidence"
  conditional_required:
    governed_flow:
      - "factory_governance"
      - "session_evidence"
      - "skill_improvement_loop"
  optional_fields:
    - "blocked_by"
rollback_procedure: "Revert edited files and rerun validation gates before continuing."
observability: "Track pass/fail/blocked outcomes for each validation command in run output."
