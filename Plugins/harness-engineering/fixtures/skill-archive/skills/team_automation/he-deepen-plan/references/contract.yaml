schema_version: 1

purpose: >
  Run the plan-deepening stage of the harness-engineering workflow so the user gets
  a stronger, execution-ready plan with better rationale, sequencing, verification,
  and risk treatment before implementation begins.

triggers:
  - the user wants to deepen, stress-test, or strengthen an existing implementation plan
  - the user wants more confidence around decisions, sequencing, rollout, or verification
  - the user explicitly asks for an exhaustive deepen-plan pass before implementation
  - the user has a plan already but wants a second-pass research and review workflow

inputs:
  - a valid plan path
  - repository context and linked spec or brainstorm artifacts when available
  - optional user emphasis on specific weak sections or exhaustive coverage

outputs:
  - a deepening-mode decision such as targeted-confidence or max-coverage
  - a research execution mode decision such as direct or artifact-backed
  - a subagent route decision: automatic delegation when mapped roles exist, otherwise inline/manual fallback
  - a strengthened plan written in place or as a -deepened variant
  - a short enhancement summary plus explicit next-step guidance

non_goals:
  - creating the first implementation plan from scratch
  - implementing code
  - silently changing product scope or inventing requirements
  - turning the plan into a command-by-command implementation script

risks:
  - plan inflation without real confidence gain; mitigate with section scoring and targeted rewrites
  - context bloat from broad fan-out; mitigate with targeted-confidence default and artifact-backed mode only when justified
  - missing reviewer roles at runtime; mitigate with manifest checks and codex-agent-creator fallback routing
  - contradiction with source artifacts; mitigate with origin-artifact rereads and explicit preservation checks
  - stale or generic research; mitigate with repo-grounded evidence first and dated primary-source citations for external claims
