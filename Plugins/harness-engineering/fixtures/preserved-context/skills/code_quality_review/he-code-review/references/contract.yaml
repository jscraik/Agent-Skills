schema_version: 1

purpose: >
  Run the broad Harness Engineering code-review stage so PRs, branches, diffs, and
  workflow artifacts receive deduplicated findings, readiness guidance,
  protected-artifact filtering, and clear next-step recommendations.

triggers:
  - the user wants a broad PR or branch review before merge
  - the user wants a package-level review rather than only a narrow technical critique
  - the user wants a spec, plan, UI artifact, or solution document reviewed for readiness
  - the user wants blockers, recommendation, and follow-up guidance synthesized across reviewer lenses
  - merge readiness depends on proving a PR satisfies linked Linear QA issues
  - merge readiness depends on resolving Codex, CodeRabbit, Copilot, or other reviewer threads

inputs:
  - a review target such as PR, branch, current diff, latest PR, file path, spec path, plan path, or solution path
  - access to the relevant diff, files, or markdown artifact
  - optional linked Linear QA issues, reproduction steps, and expected behavior
  - optional human or bot review comments, unresolved threads, check state, and validation logs
  - optional reviewer context from harness-engineering.local.md
  - optional review modifiers such as mode:report-only, mode:autofix, mode:headless, base:<ref>, or plan:<path>

outputs:
  - a chosen review mode such as pr-branch-review or artifact-review
  - a resolved post-review policy such as interactive, report-only, autofix, or headless when the user supplied mode modifiers
  - severity-ranked findings with blockers and unknowns
  - domain-language drift findings when changed code or artifacts introduce unresolved terms, aliases, or relationships
  - protected-artifact cleanup filtering
  - merge or readiness recommendation
  - Linear QA closure assessment when linked issues define the acceptance target
  - security and supply-chain review status for PRs with relevant changed surfaces
  - review-thread disposition for actionable human and bot findings
  - suggested next action such as fix, deepen, re-review, or proceed
  - optional todo-follow-up artifacts using the file-based todos workflow when the repo uses it or the user requests it, with autofix residual work landing as ready

non_goals:
  - implementing fixes from review mode
  - collapsing broad review into technical-review semantics
  - deleting, cleanup-flagging, or gitignoring Harness Engineering workflow artifacts
  - using external docs instead of repo evidence when local evidence is sufficient
  - running concurrent mutating review loops and runtime verification on the same checkout

risks:
  - reviewing the wrong branch or target; mitigate with explicit target resolution and setup checks
  - missing domain drift; mitigate with `CONTEXT-MAP.md` or `CONTEXT.md` checks for changed domain terms
  - conflicting override tokens; mitigate with fail-fast mode parsing before analysis
  - noisy reviewer fanout; mitigate with bounded reviewer selection and serial fallback
  - stale or unsupported external claims; mitigate with repo-first review and current-source checks only when needed
  - accidental artifact-cleanup findings; mitigate with explicit protected-artifact filtering
  - missing readiness context; mitigate with linked-artifact reads and agent-native/learnings coverage
  - approving code that only appears related to a QA issue; mitigate by checking expected behavior, repro coverage, and validation evidence
  - approving code with unresolved review threads; mitigate by requiring each actionable Codex, CodeRabbit, Copilot, or human finding to be addressed, disproven, deferred, or blocking
  - missing security or supply-chain regressions; mitigate with a dedicated PR security pass on CI, dependencies, publishing, credentials, permissions, and code-execution surfaces