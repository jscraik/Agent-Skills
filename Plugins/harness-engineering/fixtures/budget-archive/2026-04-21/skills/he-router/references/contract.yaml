schema_version: 1

purpose: >
  Route incoming Harness Engineering requests to the correct single next stage and return one
  exact next command.

triggers:
  - user asks for Harness Engineering help but does not specify a stage
  - stage selection is ambiguous across ideation, spec, plan, optimization, implementation, or review
  - user asks where to resume the Harness Engineering workflow

inputs:
  - user request text
  - optional artifact paths
  - optional constraints such as timeline, risk, or rollout sensitivity

outputs:
  - one selected HE stage
  - one-sentence rationale
  - one exact next command
  - subagent policy (`always`, `conditional`, or `manual-only`)
  - mapped roles for the selected stage (baseline + conditional)
  - stage-map role selection prefers `he-*` aliases before fallback reviewer-name resolution
  - available roles resolved from `~/.codex/agents/manifest.json` when present
  - missing mapped roles
  - fallback guidance when auto-spawn is unavailable
  - fallback guidance when mapped roles are missing, including `[[codex-agent-creator]]` install/create path

non_goals:
  - implementing product code
  - running multiple HE stages in one router response
  - replacing `he-compound` lifecycle orchestration when orchestration is needed

risks:
  - wrong-stage routing; mitigate with explicit rule checks and one blocking clarification when needed
  - stage sprawl; mitigate by enforcing exactly one primary stage
  - generic handoff text; mitigate by requiring one executable next command
  - optimize-vs-implement confusion; mitigate by routing measurable experiment loops to `he-improve`
  - refine-vs-implement confusion; mitigate by routing browser-first polish loops to `he-refine`
  - debug-vs-implement confusion; mitigate by routing root-cause bug loops to `he-fix-bugs`
  - branch-hygiene-vs-debug confusion; mitigate by routing stale branch cleanup requests to `he-prune-branches`

observability: >
  Track stage selection accuracy, fallback frequency when mapped roles are
  unavailable, and validation pass/fail outcomes for each run.

rollback_procedure: >
  Restore the previous contract/evals/task-profile files from git, then rerun
  strict skill audit and plugin-builder validation before re-promoting.
