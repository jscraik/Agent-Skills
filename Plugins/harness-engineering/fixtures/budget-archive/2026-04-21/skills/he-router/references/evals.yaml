schema_version: "2.0"

skill_name: "he-router"

cases:
  - id: ambiguous-he-request
    name: route ambiguous he request
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    prepend_skill: false
    prompt: "Can you inspect my Linear issue, partial spec, and branch with no clear next step, then tell me which Harness Engineering stage should run first?"
    deterministic_checks:
      forbidden_commands:
        - "curl"
        - "wget"
        - "rm -rf"
        - "nc"
    acceptance:
      - type: skill_selected
        expected_skill: "he-router"
      - type: regex
        value: "(?i)(he-(compound|ideate|brainstorm|spec|deepen-spec|plan|deepen-plan|improve|refine|work|fix-bugs|prune-branches|code-review|technical-review|reliability-review|tdd|compound-refresh))"
      - type: regex
        value: "(?i)(policy|baseline roles|conditional roles|available roles|missing roles|fallback)"

  - id: explicit-implementation-route
    name: route to implementation
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    prepend_skill: false
    prompt: "The approved plan is in Docs/plans/payment-retry-plan.md and I am ready to make the code changes. Can you route me to the HE stage that should take over?"
    deterministic_checks:
      forbidden_commands:
        - "curl"
        - "wget"
        - "rm -rf"
        - "nc"
    acceptance:
      - type: skill_selected
        expected_skill: "he-router"
      - type: regex
        value: "(?i)(he-work|implementation)"
      - type: regex
        value: "(?i)(policy|fallback)"

  - id: explicit-review-route
    name: route to review
    category: edge
    eval_modes: [smoke, release]
    should_trigger: true
    prepend_skill: false
    prompt: "The auth cleanup branch is implemented and passing locally. Can you route it to the HE review stage that should check it before I merge?"
    deterministic_checks:
      forbidden_commands:
        - "curl"
        - "wget"
        - "rm -rf"
        - "nc"
    acceptance:
      - type: skill_selected
        expected_skill: "he-router"
      - type: regex
        value: "(?i)(he-code-review|he-technical-review|he-reliability-review)"
      - type: regex
        value: "(?i)(policy|fallback)"

  - id: implemented-pr-review-beats-work
    name: implemented PR routes to readiness review before more work
    category: edge
    eval_modes: [smoke, release]
    should_trigger: true
    prepend_skill: false
    prompt: "The branch is implemented, CI is green, and there are linked Linear QA issues. Can you route the next HE stage before merge without skipping review?"
    deterministic_checks:
      forbidden_commands:
        - "curl"
        - "wget"
        - "rm -rf"
        - "nc"
    acceptance:
      - type: skill_selected
        expected_skill: "he-router"
      - type: regex
        value: "(?i)(he-code-review|review-before-more-work|go/no-go|Linear QA)"
      - type: regex
        value: "(?i)(next_invocation|\\$harness-engineering:he-code-review|policy|fallback)"

  - id: direct-stage-non-router
    name: direct stage request should not force router
    category: negative
    eval_modes: [smoke, release]
    should_trigger: false
    prepend_skill: false
    prompt: "Use he-spec to write the spec for the approved invite-flow direction."
    deterministic_checks:
      forbidden_commands:
        - "curl"
        - "wget"
        - "rm -rf"
        - "nc"
    acceptance:
      - type: skill_not_selected
        expected_skill: "he-router"
      - type: regex
        value: "(?i)(he-spec|spec)"

