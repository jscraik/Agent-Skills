schema_version: 1

purpose: >
  Maintain the trustworthiness of `docs/solutions/` by reviewing learnings and
  pattern docs against the current codebase, then applying the smallest
  evidence-backed maintenance action: keep, update, consolidate, replace,
  archive, or stale.

triggers:
  - the user wants stale solution docs refreshed after refactors, migrations, or dependency upgrades
  - a retrieved learning or pattern doc appears outdated, contradictory, or wrong
  - the user wants `docs/solutions/` reviewed for accuracy against current code
  - a newly solved problem appears to contradict an older learning or pattern
  - multiple `docs/solutions/` artifacts now overlap and need a canonical document chosen

inputs:
  - an optional scope hint such as file path, module, category, filename, or pattern topic
  - optional `mode:autonomous` to request a no-interruption run
  - optional upstream alias `mode:autofix`, normalized to the same autonomous behavior
  - access to current `docs/solutions/` artifacts and the codebase they describe
  - optional recent artifact or conversation context when a fresh fix is motivating the refresh

outputs:
  - "a selected mode: interactive or autonomous"
  - "a selected scope route: focused, batch, or broad"
  - "per-file or per-cluster classifications: Keep, Update, Consolidate, Replace, Archive, or Stale"
  - "applied edits, consolidation merges, successor docs, stale markings, or archive moves when evidence supports them"
  - "a full markdown report with counts, evidence, applied actions, and recommendations"
  - "optional commit or PR follow-up when files changed"

non_goals:
  - implementing product-code fixes
  - generic copyediting or low-value wording polish
  - broad code review unrelated to docs/solutions maintenance
  - debating whether current code drift is intentional instead of matching docs to reality
  - archiving still-relevant problem domains without checking for a replacement path

risks:
  - picking the wrong scope; mitigate with ordered scope matching and broad-scope triage
  - rewriting too aggressively; mitigate with no-write Keep and strict Update vs Replace boundaries
  - leaving redundant docs in place; mitigate with document-set analysis and retrieval-value checks
  - archiving the wrong doc; mitigate with problem-domain checks and successor searches
  - fabricating successors from weak evidence; mitigate with explicit stale-marking when evidence is insufficient
  - autonomous guesswork; mitigate with conservative stale-marking and required applied versus recommended reporting

observability: >
  Track stage selection accuracy, fallback frequency when mapped roles are
  unavailable, and validation pass/fail outcomes for each run.

rollback_procedure: >
  Restore the previous contract/evals/task-profile files from git, then rerun
  strict skill audit and plugin-builder validation before re-promoting.
