schema_version: 1

purpose: >
  Run the brainstorm stage of the Harness Engineering workflow so the user clarifies
  what to build, compares a few viable directions, captures a right-sized requirements
  document when needed, and decides whether the next step should be spec, planning,
  or lightweight direct work.

triggers:
  - the user wants to brainstorm a feature, improvement, or product direction before planning
  - the user wants the Harness Engineering brainstorm stage explicitly
  - the user needs help deciding whether a spec is required
  - the user wants a durable brainstorm or requirements artifact written to docs/brainstorms
  - the request is vague or ambitious enough that scope, behavior, or success criteria still need to be shaped
  - a QA report or user feedback describes confusing behavior but expected behavior is not clear enough for a Linear issue

inputs:
  - a feature idea, problem, or improvement to explore
  - relevant context, constraints, risks, and success criteria when available
  - optional repo context and prior artifacts, including existing requirements or legacy brainstorm docs
  - optional QA feedback that needs expected-behavior clarification before Linear filing

outputs:
  - a clarified problem frame
  - 2-3 approaches with trade-offs and a recommendation
  - explicit `spec_required`, `risk_level`, and `complexity` values
  - expected-behavior clarification for ambiguous QA reports, with a next route to Linear intake, spec, plan, or fix work
  - exact parallel research support via `repo-research-analyst` and `learnings-researcher` when repo context matters
  - a requirements document in `docs/brainstorms/*-requirements.md` for new substantial work, with compatibility-safe updates to legacy `*-brainstorm.md` files when resuming
  - a recommended next workflow stage, and immediate handoff guidance when the runtime supports it

non_goals:
  - direct implementation
  - detailed task sequencing
  - forcing brainstorm when the request is already clear enough for planning

risks:
  - over-questioning; mitigate with one-question-at-a-time clarification
  - over-design; mitigate with YAGNI and recommendation-first output
  - weak product framing; mitigate with a product pressure test before locking in options
  - weak handoff; mitigate with explicit next-stage guidance and artifact writing
  - planner/source mismatch; mitigate by defaulting new durable docs to `*-requirements.md`
  - shallow recommendations without repo context; mitigate with bounded parallel subagent research when relevant
  - misfiling product ambiguity as a bug; mitigate by clarifying expected behavior before routing to Linear intake

observability: >
  Track stage selection accuracy, fallback frequency when mapped roles are
  unavailable, and validation pass/fail outcomes for each run.

rollback_procedure: >
  Restore the previous contract/evals/task-profile files from git, then rerun
  strict skill audit and plugin-builder validation before re-promoting.
