schema_version: 1

purpose: >
  Run the Harness Engineering refinement stage so users can start a dev server,
  inspect a live feature in-browser, and iterate focused polish changes with
  explicit fallback behavior.

triggers:
  - user asks to polish, refine, or tighten an existing implementation
  - user wants rapid browser-feedback loops before shipping or review
  - the task requires deterministic local dev-server startup and iterative fixes

inputs:
  - branch or PR context
  - launch/startup configuration constraints
  - refinement goals and acceptable scope
  - stop condition and fallback preference

outputs:
  - selected startup command and reachable dev-server URL
  - refinement changelog tied to user feedback
  - fix-check-repeat loop summary
  - next-step route (`continue`, `he-work`, `he-code-review`, or `stop`)
  - subagent route decision: auto delegation when roles exist, inline/manual fallback otherwise

non_goals:
  - broad greenfield implementation
  - replacing planning/spec/deepening stages
  - blocking the stage solely due to missing subagents

risks:
  - server startup ambiguity; mitigate with launch.json/sentinel handling and fallback recipes
  - false positive readiness when server is down; mitigate with explicit localhost probe gate
  - uncontrolled iteration scope; mitigate with one-feedback-at-a-time refinement loops
  - missing helper roles; mitigate with manifest checks and codex-agent-creator fallback

observability: >
  Track stage selection accuracy, fallback frequency when mapped roles are
  unavailable, and validation pass/fail outcomes for each run.

rollback_procedure: >
  Restore the previous contract/evals/task-profile files from git, then rerun
  strict skill audit and plugin-builder validation before re-promoting.
