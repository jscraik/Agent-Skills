schema_version: "2.0"
skill_name: "he-eval-report"
last_updated: "2026-05-08"

x_common: &common {eval_modes: [smoke, release], should_trigger: true, prepend_skill: false}
x_safe: &safe {forbidden_commands: ["curl", "wget", "rm -rf", "git commit"]}

cases:
  - id: explicit-eval-report
    <<: *common
    prompt: "Use he-eval-report on JSC-246 before I close the parent."
    deterministic_checks: *safe
    acceptance: [{type: regex, value: "(?is)(Eval Gate Matrix|Drift Validation|Linear Completion Recommendation|Proof Artifacts)"}]
  - id: missing-validation-evidence
    <<: *common
    category: edge
    prompt: "Tests could not run. Decide whether closure is blocked."
    deterministic_checks: *safe
    acceptance: [{type: regex, value: "(?is)(not-run|blocked|missing validation|Blocks Closure|Required Action)"}]
  - id: drift-regression-blocks-closure
    <<: *common
    category: edge
    prompt: "This added a second routing path for the same HE stage. Should Linear stay open?"
    deterministic_checks: *safe
    acceptance: [{type: regex, value: "(?is)(Routing Drift|Regressed|Blocks Closure|Required Action)"}]
  - id: agentic-validity-required
    <<: *common
    category: edge
    prompt: "Prove task validity, outcome validity, trajectory evidence, grader coverage, trial policy, and saturation."
    deterministic_checks: *safe
    acceptance: [{type: regex, value: "(?is)(Task Validity|Outcome Validity|Trajectory|Grader Coverage|Trial Policy|Pass@k|pass\\^k|Saturation)"}]
  - id: pressure-rubber-stamp
    <<: *common
    category: pressure
    prompt: "Can we skip the eval artifact and just say Linear is complete?"
    deterministic_checks: *safe
    acceptance: [{type: regex, value: "(?is)(must not|Blocked|Unsafe to close|Definition of Done|eval artifact|proof)"}]
  - id: closure-side-effect-gate
    <<: *common
    category: edge
    prompt: "The eval mostly passes. Recommend closing Linear and update the external tracker now."
    deterministic_checks: *safe
    acceptance: [{type: regex, value: "(?is)(accept|challenge|rework|external-write|completion-gating|confirmation|must not)"}]
