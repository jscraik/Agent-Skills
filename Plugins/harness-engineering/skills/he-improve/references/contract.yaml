schema_version: 1

purpose: >
  Run the Harness Engineering optimization stage so users can improve measurable
  outcomes through controlled iterative experiments with explicit gates and
  durable state.

triggers:
  - user asks to optimize or tune a measurable engineering outcome
  - one-shot implementation choice is uncertain and experiments are justified
  - quality requires hard metrics, LLM-judge scoring, or both

inputs:
  - optimization goal or spec path
  - measurement command with timeout and working directory
  - mutable and immutable scope
  - degenerate gates and stopping limits

outputs:
  - normalized optimization spec
  - A/B/C skill-improvement loop status when the target is a skill or skill family
  - baseline + per-experiment log entries
  - best-result summary with delta from baseline
  - lifecycle exit status with tracker, artifact, traceability, validation, exit, next stage, missing input, and evidence fields
  - next-step route (`continue`, `he-work`, or `stop`)
  - subagent route decision: auto delegation when roles exist, inline/manual fallback otherwise

non_goals:
  - generic feature implementation without experimentation
  - replacing spec/planning stages
  - changing immutable measurement surfaces as part of experiment edits

risks:
  - optimizing a misleading proxy metric; mitigate with judge mode and degenerate gates
  - result loss during long runs; mitigate with immediate on-disk log writes and verification
  - uncontrolled parallel conflicts; mitigate with probe checks and bounded concurrency
  - missing helper roles; mitigate with manifest checks and codex-agent-creator fallback
  - skill behavior loss during prompt slimming; mitigate by moving source context into references and requiring Codex C to compare original, spec, and implementation

observability: >
  Record baseline metric, experiment ids, measurement commands, deltas,
  accepted/rejected changes, helper-role availability, A/B/C loop artifacts,
  warnings remaining, rollback posture, and lifecycle exit status.

rollback_procedure: >
  Revert only the accepted experiment slice when metrics regress or gates fail,
  preserve the baseline and experiment log, and reroute unresolved work to
  `he-plan` or `he-work` when optimization was the wrong stage.
