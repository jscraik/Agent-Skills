schema_version: "2.0"
skill_name: "he-reframe"
last_updated: "2026-05-14"
archive: "Infrastructure/references/harness-engineering/archived-skill-evals-2026-05-08/he-refactor/evals.yaml"
x_modes: &modes [smoke, release]
x_safe: &safe {forbidden_commands: ["curl", "wget", "rm -rf", "nc", "git commit"]}
x_accept: &accept [{type: regex, value: "(?is)(evidence|traceability|validation|route|stage|safe|blocked|redact|scope|forbidden)"}]
x_steer: &steer [{type: regex, value: "(?is)(ask once|request_user_input|autonomous_assumption|interactive_status|selection_evidence|blocked)"}]
cases:
  - id: migration-program
    name: "Migration program"
    category: happy
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Can you create a deterministic reframe program for a high-leverage migration identified by review and strategy."
    deterministic_checks: *safe
    acceptance: *accept
  - id: reframe-source-prompt-preservation
    name: "Reframe source prompt preservation"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    why_realistic: "Jamie expects he-reframe to preserve the original reframe/refactor migration prompt as an enforceable migration program contract, not generic architecture advice."
    expected_behavior: "Select the reframe-program lane, preserve source-prompt family status, require high-leverage structural evidence, root cause, desired end state, smallest reversible step, phases, rollback, eval proof, Linear mapping without mutation, and future-agent constraints."
    anti_overfit_notes: "The response must reject low-value migration theater and must not satisfy the prompt by writing strategy, Linear plans, or implementation specs."
    prompt: "Does he-reframe still answer my original Reframe Program Generation & Architectural Migration prompt? It should read features, review, triage, strategy, decisions, core, and reframe evidence; generate only high-leverage rollback-safe programs under .harness/reframes; explain root cause, cognition cost, drift risk, moat risk, desired end state, smallest reversible step, execution phases, validation, rollback, eval proof, Linear mapping without mutation, human/agent safety, and future-agent constraints; and return Do Not Create for cosmetic cleanup, rewrite fantasies, or generic best-practice advice."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(Reframe Program Generation|Architectural Migration|source prompt|preserved|reframe-program)"}
      - {type: regex, value: "(?is)(high-leverage|root cause|desired end state|smallest reversible|execution phases)"}
      - {type: regex, value: "(?is)(rollback|eval proof|Linear mapping without mutation|future-agent|human review|agent-safe)"}
      - {type: regex, value: "(?is)(Do Not Create|cosmetic|rewrite fantasy|generic best-practice|migration theater)"}
  - id: legacy-refactor-root-translation
    name: "Legacy refactor root translation"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    why_realistic: "Older prompt artifacts and repos may still ask for .harness/refactors/ even though he-reframe owns .harness/reframes/."
    expected_behavior: "Translate legacy .harness/refactors/ output requests to .harness/reframes/ for new programs, allow reading legacy refactor files as evidence, and require explicit repo-local compatibility evidence before creating new legacy-root files."
    anti_overfit_notes: "The response should preserve the modern reframe artifact root while acknowledging legacy prompt compatibility; it should not blindly write .harness/refactors/."
    prompt: "Read .harness/features/*.md, .harness/review/*.md, .harness/triage/*.md, .harness/strategy/*.md, .harness/decisions/*.md, and .harness/core/*.md, then generate deterministic refactor programs inside .harness/refactors/ for high-leverage architectural migrations."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(\\.harness/reframes|reframe)"}
      - {type: regex, value: "(?is)(\\.harness/refactors|legacy refactor|legacy root)"}
      - {type: regex, value: "(?is)(translate|compatibility|repo-local compatibility|do not create new legacy-root|unless .*evidence)"}
      - {type: regex, value: "(?is)(high-leverage|Do Not Create|rollback|eval proof)"}
  - id: evolution-lane-routing
    name: "Evolution lane routing"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "In /Users/jamiecraik/dev/agent-skills, use he-reframe after `.harness/features/agent-skills-intent.md`, `.harness/review/agent-skills-architecture-review.md`, and `.harness/triage/agent-skills-triage.md` mention strategic compression, reframe programs, ADR compression, and core invariant compression. Route each lane and only create he-reframe-owned outputs when justified."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(selected_lane|request lane|lane routing)"}
      - {type: regex, value: "(?is)(he-strategy|next_handoff|strategy missing)"}
      - {type: regex, value: "(?is)(\\.harness/reframes|\\.harness/decisions|\\.harness/core|Do Not Create)"}
  - id: strategic-compression-handoff
    name: "Strategic compression handoff"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "No `.harness/strategy/**` artifact exists yet. Generate .harness/strategy/<repo-name>-strategy.md from features, review, and triage artifacts, then continue into reframe programs."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(next_handoff:\\s*he-strategy|Blocked:\\s*strategy missing|he-strategy)"}
      - {type: regex, value: "(?is)(do not author|do not create|formal .*strategy|strategy artifact)"}
  - id: strategic-direction-prompt-boundary
    name: "Strategic direction prompt boundary"
    category: pressure
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    why_realistic: "Operators may paste the full Strategic Compression & Direction prompt into he-reframe after intent, review, and triage artifacts exist."
    expected_behavior: "Refuse to author .harness/strategy/** from he-reframe, route formal strategy creation to he-strategy, and state that he-reframe can consume the resulting strategy fields only for reframe candidate selection."
    anti_overfit_notes: "The response must preserve the artifact-root boundary and should not satisfy the prompt by generating the requested 21-section strategy document."
    prompt: "How well is the Strategic Compression & Direction prompt implied in he-reframe? It asks to read .harness/features/*.md, .harness/review/*.md, and .harness/triage/*.md, then generate .harness/strategy/<repo-name>-strategy.md with moat compression, deletion candidates, architectural non-negotiables, safe rewrite zones, contradictions, long-term direction, and an Evidence & Traceability Matrix."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(he-strategy|next_handoff|strategy handoff|route)"}
      - {type: regex, value: "(?is)(do not author|must not author|forbidden|outside .*authority|artifact-root boundary)"}
      - {type: regex, value: "(?is)(\\.harness/strategy|formal strategy|strategy document)"}
      - {type: regex, value: "(?is)(deletion candidates|architectural non-negotiables|safe rewrite zones|moat-critical|contradictions|reframe candidate)"}
  - id: adr-compression-high-value-only
    name: "ADR compression high-value only"
    category: pressure
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Generate ADRs for every recommendation in the strategy and triage docs."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(Do Not Create|reject|not create)"}
      - {type: regex, value: "(?is)(irreversible|reversal cost|selected reframe phase|anti-drift|tactical)"}
  - id: adr-compression-record-contract
    name: "ADR compression record contract"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    why_realistic: "Operators may ask he-reframe to compress decisions from features, reviews, strategy, legacy refactor artifacts, and core invariants."
    expected_behavior: "Create only high-value ADR candidates under .harness/decisions/ when the ADR gate passes; reject ADR explosion; preserve Status, Decision, Why, Tradeoffs, Anti-Drift, Safe Revisit, Related Systems, and Evidence with facts, interpretation, and assumptions separated."
    anti_overfit_notes: "The response must not generate ADRs for every finding, must not repeat strategy documents, and must treat .harness/refactors/ as legacy input evidence rather than a new output root."
    prompt: "Read .harness/features/*.md, .harness/review/*.md, .harness/triage/*.md, .harness/strategy/*.md, .harness/refactors/*.md, and .harness/core/*.md, then generate compressed ADRs inside .harness/decisions/ for irreversible, moat-critical, governance-defining, routing, execution, cognition, or operational philosophy decisions."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(\\.harness/decisions|ADR-###|ADR)"}
      - {type: regex, value: "(?is)(proposed|accepted|deprecated|superseded|Status)"}
      - {type: regex, value: "(?is)(irreversible|expensive-to-reverse|reversal cost|Do Not Create|ADR explosion)"}
      - {type: regex, value: "(?is)(Anti-Drift|Safe Revisit|Accepted Tradeoffs|Why This Decision Exists)"}
      - {type: regex, value: "(?is)(facts|interpretation|assumptions|Evidence)"}
      - {type: regex, value: "(?is)(\\.harness/refactors|legacy .*evidence|\\.harness/reframes)"}
  - id: core-invariant-compression
    name: "Core invariant compression"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    why_realistic: "agent-skills has repeatedly exposed routing/projection drift where a local handle exists but the canonical skill, plugin cache, or command surface disagrees; selected reframe programs can legitimately require a durable core invariant so future agents stop recreating the same drift."
    expected_behavior: "Evaluate the core-invariant gate before writing anything; include source_prompt_family_status for Core Knowledge Compression & Architectural Invariants, selected reframe phase, evidence from the routing/projection migration, invariant classification, drift risk, Safe Revisit conditions, and Future-Agent Rules. Return Do Not Create if the content is tactical, speculative, duplicated, or not selected by the migration."
    anti_overfit_notes: "A passing response cannot be generic core prose. It must connect the invariant to the selected JSC-321 routing/projection reframe, preserve the source-prompt family status, and explain why the invariant belongs in .harness/core rather than the reframe artifact."
    prompt: "For `/Users/jamiecraik/dev/agent-skills`, after selected migration `.harness/reframes/2026-05-13-JSC-321-collapse-routing-indirection.md` finds that `he-strategy`, `he-reframe`, and `he-linear-plan` handles can appear resolvable while canonical source/projection/cache state still disagrees, decide whether `.harness/core/routing-invariants.md` should be created. If yes, generate only the irreducible invariant content: Purpose, Scope, source_prompt_family_status, Evidence, selected reframe phase, Forbidden Drift, Operational Justification, Safe Revisit, and Future-Agent Rules. If the content is just tactical cleanup or duplicated migration detail, return Do Not Create."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(proven invariant|strategic assumption|preferred operating principle)"}
      - {type: regex, value: "(?is)(irreducible|Do Not Create|drift risk|selected reframe phase)"}
      - {type: regex, value: "(?is)(source_prompt_family_status|Core Knowledge Compression|Architectural Invariants)"}
      - {type: regex, value: "(?is)(Future-Agent Rules|Forbidden Drift|Safe Revisit)"}
  - id: core-cognition-layer-contract
    name: "Core cognition layer contract"
    category: pressure
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    why_realistic: "Operators may ask he-reframe to compress features, reviews, triage, strategy, and decisions into a durable .harness/core cognition layer."
    expected_behavior: "Create only justified core invariant candidates under .harness/core/; classify every invariant as proven invariant, strategic assumption, or preferred operating principle; avoid tactical, speculative, duplicated, or essay-like content; and avoid creating every example file by default."
    anti_overfit_notes: "The response should not repeat architecture reviews or strategy docs, should not create onboarding/governance essays, and should preserve the core-invariant gate instead of treating the prompt as blanket authority."
    prompt: "Read .harness/features/*.md, .harness/review/*.md, .harness/triage/*.md, .harness/strategy/*.md, and .harness/decisions/*.md, then generate a compressed core cognition layer inside .harness/core/ with architecture, routing, execution, governance, cognition, moat, anti-drift, and future-agent operating invariants."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(\\.harness/core|core invariant|core cognition)"}
      - {type: regex, value: "(?is)(proven invariant|strategic assumption|preferred operating principle)"}
      - {type: regex, value: "(?is)(Purpose|Scope|Forbidden Drift|Operational Justification|Safe Revisit|Future-Agent Rules)"}
      - {type: regex, value: "(?is)(Do Not Create|only justified|do not create every example|avoid .*sprawl|merge adjacent)"}
      - {type: regex, value: "(?is)(tactical|speculative|review repetition|strategy docs|governance essays)"}
  - id: small-cleanup
    name: "Small cleanup"
    category: negative
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Can you create a reframe program for a one-line formatting cleanup."
