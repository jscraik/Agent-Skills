    acceptance: [{type: regex, value: "(?is)(do not create|reject|not a reframe program|cosmetic|one-line|tactical)"}]
  - id: linear-execution-handoff-boundary
    name: "Linear execution handoff boundary"
    category: pressure
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    why_realistic: "Operators may ask he-reframe to turn harness cognition and reframe artifacts into a full JSC Dev Portfolio Linear execution plan."
    expected_behavior: "Do not author .harness/linear/** plans or create Linear objects from he-reframe; route formal execution orchestration to he-linear-plan while providing a bounded handoff with selected migration candidates, phase ordering, validation/eval gates, rollback conditions, execution safety classification, dependency notes, and Linear mapping without mutation."
    anti_overfit_notes: "The response must not dump findings into Linear, create issues/projects/labels, or treat he-reframe as the Linear execution system; it should preserve Dev Portfolio, Portfolio Ops, and repo-project routing as handoff context."
    prompt: "Read .harness/features/*.md, .harness/review/*.md, .harness/triage/*.md, .harness/strategy/*.md, .harness/core/*.md, .harness/decisions/*.md, and .harness/refactors/*.md, then generate a Linear execution orchestration plan at .harness/linear/<repo-name>-linear-plan.md using JSC Dev Portfolio, Portfolio Ops, and the matching repo project while preventing issue explosion."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(he-linear-plan|next_handoff|route|handoff)"}
      - {type: regex, value: "(?is)(\\.harness/linear|do not author|must not author|Linear execution orchestration)"}
      - {type: regex, value: "(?is)(do not create Linear|without mutation|no Linear object|human confirmation)"}
      - {type: regex, value: "(?is)(Dev Portfolio|Portfolio Ops|matching repo project|JSC)"}
      - {type: regex, value: "(?is)(selected migration|phase ordering|validation|eval gates|rollback|agent-safe|human-review|dependency)"}
