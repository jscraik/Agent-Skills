schema_version: 1
purpose: "Generate deterministic, evidence-backed Harness Engineering architecture-evolution artifacts, with reframe programs as the primary owned lane."

triggers:
  - structural complexity reduction
  - orchestration simplification
  - routing redesign
  - cognition compression
  - governance simplification
  - execution determinism improvement
  - context-load reduction
  - anti-drift hardening
  - moat-critical stabilization
  - skill or plugin boundary correction
  - eval reliability improvement
  - Linear execution hygiene where migration ordering matters
  - high-value ADR compression required by a migration
  - core invariant compression required by architecture evolution

inputs:
  - .harness/features/*.md
  - .harness/review/*.md
  - .harness/triage/*.md
  - .harness/strategy/*.md
  - .harness/decisions/*.md
  - .harness/core/*.md
  - .harness/linear/*.md
  - .harness/reframes/*.md
  - relevant source files
  - validation commands and test evidence
  - existing skill, plugin, routing, and workflow contracts

outputs:
  - root: .harness/reframes
    pattern_when_linear_known: "YYYY-MM-DD-JSC-###-<reframe-slug>.md"
    pattern_without_linear: "YYYY-MM-DD-<repo-name>-<reframe-slug>.md"
    legacy_supported_pattern: "<reframe-slug>.md"
    note: "Dated Linear identifiers are preferred for new programs."

  - root: .harness/decisions
    mode: decision-compression
    pattern: "ADR-###-<slug>.md"
    note: "Only when a selected migration needs durable architectural memory; otherwise Do Not Create."
  - root: .harness/core
    mode: core-invariant-compression
    pattern: "<invariant-domain>.md"
    note: "Only for irreducible migration or anti-drift invariants; keep stable names."
  - visual_references: "Required when the program spans multiple modules, phases, boundaries, coexistence states, rollback paths, or eval gates; prefer Mermaid before/after diagrams and migration maps."

non_goals:
  - cosmetic cleanup
  - isolated one-file tactical fixes
  - generic best-practice recommendations
  - speculative rewrites
  - implementation tickets
  - strategic direction documents; route formal strategy authoring to he-strategy
  - routine dependency updates
  - Linear object creation
  - source code mutation
  - generic skill package refactoring

risks:
  - reframe theater
  - big-bang rewrites
  - issue explosion
  - hidden migration coupling
  - rollback-free architecture changes
  - eval-free closure
  - creating new abstraction before deleting old abstraction
  - migration coupling hidden in prose instead of a before/after boundary or phase diagram

observability: "Record selected lane, source artifacts read, affected systems and blast radius, fact/interpretation/assumption separation, migration phases or decision/invariant rationale, validation requirements, rollback conditions, visual reference status, Linear mapping without mutation, expected eval artifact pattern .harness/evals/YYYY-MM-DD-JSC-###-<repo-name>-<slug>-eval.md when a migration is created, dated output path or Do Not Create classification, required sections present, and validation outcomes recorded as pass, fail, or blocked."

rollback_procedure: "If evidence is weak, do not create the reframe program; if migration cannot be staged safely, mark the program Blocked; if a phase regresses routing, context load, eval quality, or rollback safety, stop the migration and keep legacy behavior active; do not delete legacy paths until eval and drift proof pass."

authority:
  primary_artifact_root: .harness/reframes
  optional_artifact_roots:
    - .harness/decisions
    - .harness/core
  forbidden_artifact_roots:
    - .harness/strategy
  execution_rule: "A reframe program becomes execution input only when selected by the user or .harness/linear."

safety:
  redact_by_default: true
  fail_fast: true
  command_policy_ref: "Use repository approval policy and plugin safety gates; this skill does not run network, destructive filesystem, git write, or Linear mutation commands without explicit authorization."
  runtime_projection_rule: "Do not edit .agents/**, plugin caches, mirrored skillsets, or generated handles as canonical source."
