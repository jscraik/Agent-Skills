    acceptance: *accept
  - id: dated-artifact-style
    name: "Dated artifact style"
    category: happy
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: false
    prompt: "Can you record updated JSC-246 lifecycle documents under `.harness/plan/2026-05-09-JSC-246-*.md` using dated Linear-style artifact names so regressions are searchable."
    deterministic_checks: *safe
    acceptance: *accept
  - id: missing-linear-id
    name: "Missing Linear id"
    category: edge
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: false
    prompt: "Can you inspect `.harness/session-evidence/latest.md`; the evidence is useful but the Linear issue id is absent, so state the assumption or ask once if interactive."
