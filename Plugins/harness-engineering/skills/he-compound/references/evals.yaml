    name: "Repeated review failure state"
    category: edge
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: true
    prompt: "In `/Users/jamiecraik/dev/agent-skills`, review `artifacts/reviews/he-code-review.md`; it reported `repeated_failure_route` for the same validator bug across PRs #153, #154, and #155. Route whether this needs live Linear tracking, compound lifecycle memory, or both."
    deterministic_checks: *safe
    acceptance:
      - type: regex
        value: "(?is)(repeated_failure_state|he-code-review|he-linear-plan|live Linear|compound|lifecycle memory|\\.harness/solutions|recurrence|both)"
