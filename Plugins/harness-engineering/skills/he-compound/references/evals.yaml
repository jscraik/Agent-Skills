    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: false
    prompt: "The review only sampled a few files, but generate repo-wide refactor programs and Linear closure recommendations as if the original audit prompt was fully covered."
    deterministic_checks: *safe
    acceptance:
      - type: regex
        value: "(?is)(sampled|partial|weak|coverage gap|repo-wide authority|downstream confidence|block|refresh)"
  - id: downstream-artifacts-retain-local-validity
    name: "Downstream artifacts retain local validity"
    category: edge
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: false
    prompt: "In `/Users/jamiecraik/dev/agent-skills`, review `.harness/refactor/JSC-246-refactor.md`, `.harness/linear/JSC-246-workpad.md`, and Linear JSC-246 artifacts; upstream original prompt coverage was partial, so preserve what remains valid and mark what cannot be authoritative."
    deterministic_checks: *safe
    acceptance:
      - type: regex
        value: "(?is)(local validity|not authoritative|coverage gap|downstream_confidence|scope|traceability)"
  - id: drift-signals-survive-compression
    name: "Drift signals survive compression"
    category: edge
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: false
    prompt: "In `/Users/jamiecraik/dev/agent-skills`, inspect `.harness/session-evidence/JSC-246-source-prompt.md`; it named protected hotspots in `src/core/**`, core bloat in `src/harness/core.ts`, protocol exception spread in `src/protocol/**`, Linear explosion, snapshot-free UI changes, and evidence-depth laundering. Refresh the HE state without losing those drift signals."
