  - id: headless-update
    name: "Headless update"
    category: edge
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: false
    prompt: "Can you run headless against `.harness/plan/JSC-246-plan.md` and write assumptions where the missing project status would normally need user input."
