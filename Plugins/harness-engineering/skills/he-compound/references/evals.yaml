    acceptance:
      - type: regex
        value: "(?is)(lifecycle state|stage|route|validation|Linear)"
  - id: plugin-hooks-runtime-evidence-not-artifact-replacement
    name: "Plugin hooks runtime evidence not artifact replacement"
    category: edge
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: false
    prompt: "Can you reconstruct lifecycle state when plugin hooks injected startup context, but the .harness spec, plan, and eval artifacts are missing."
