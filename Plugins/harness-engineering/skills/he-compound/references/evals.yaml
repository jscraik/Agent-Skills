    acceptance: *steer
  - id: archive-vs-active
    name: "Archive versus active"
    category: happy
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: false
    prompt: "Can you keep `.harness/plan/JSC-246-plan.md` concise and move verbose historical evidence to `.harness/archive/JSC-246-history.md`."
