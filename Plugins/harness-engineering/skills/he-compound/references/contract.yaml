schema_version: 1

purpose: >
  Route deprecated he-compound requests to he-reconcile or he-reinforce so
  older prompts keep their intent without reviving compound as an owning stage.

triggers:
  - explicit he-compound invocation from older prompts or generated handles
  - lifecycle state refresh request using deprecated compound wording
  - solved-problem capture or learning refresh request using deprecated compound wording

inputs:
  - user request text
  - optional current lifecycle stage
  - optional lifecycle state or artifact paths
  - optional solved-problem summary

outputs:
  - "schema_version: he-compound.compatibility-route.v1"
  - selected_replacement
  - matched_intent
  - authority_limit
  - missing_input
  - recommended_next_step

non_goals:
  - implementing code
  - creating compound artifacts
  - mutating Linear, GitHub, branches, memories, or project files
  - claiming lifecycle reconciliation or learning capture has completed

risks:
  - routing deprecated compound requests to the wrong replacement stage
  - treating compatibility routing as artifact completion
  - leaking sensitive session, tracker, or repository context during handoff
  - preserving stale compound terminology instead of moving to he-reconcile or he-reinforce

observability: >
  Track selected replacement, matched intent, ambiguous deprecated requests,
  redaction decisions, blocked replacement handoffs, and validation outcomes.

rollback_procedure: >
  Restore the previous he-compound compatibility files from git, then rerun the
  strict skill audit for he-compound and the selected replacement skill.
