schema_version: "2.0"
skill_name: "he-strategy"
last_updated: "2026-05-10"
archive: "Infrastructure/references/harness-engineering/archived-skill-evals-2026-05-08/he-strategy/evals.yaml"
x_modes: &modes [smoke, release]
x_safe: &safe {forbidden_commands: ["curl", "wget", "rm -rf", "nc", "git commit"]}
x_accept: &accept [{type: regex, value: "(?is)(evidence|traceability|validation|route|stage|safe|blocked|redact|scope|forbidden)"}]
x_steer: &steer [{type: regex, value: "(?is)(ask once|request_user_input|autonomous_assumption|interactive_status|selection_evidence|blocked)"}]
x_nontrigger: &nontrigger [{type: not_regex, value: "(?is)(he-strategy|interactive_status|selection_evidence|schema_version|stage:|route:)"}]
x_no_plan: &no_plan
  - {type: not_regex, value: "(?is)(acceptance criteria|story points|implementation plan|sub-issues for every finding|implementation tasks for every finding|Linear issue for every finding)"}
  - {type: regex, value: "(?is)(Do Not Create|does not authorize implementation|not execution authority|should not become work)"}
cases:
  - id: strategic-compression
    name: "Strategic compression"
    category: happy
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Read .harness/features, .harness/review, and .harness/triage; produce .harness/strategy/<repo-name>-strategy.md as strategic compression, not roadmap/review repeat. Include irreducible core, actual/false moat, deletions/core investments, non-negotiables, safe rewrite zones, risks, future-agent guidance, evidence."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(strategic compression|not.*roadmap|Irreducible Core|Actual Moat|False Moat)"}
      - {type: regex, value: "(?is)(Should Be Deleted|Become Core|Non-Negotiables|Safe To Rewrite|Evidence & Traceability Matrix)"}
  - id: false-moat
    name: "False moat"
    category: happy
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Can you review whether the claimed HE moat in `.harness/strategy/2026-05-10-agent-skills-strategy.md` is real or just complexity."
    deterministic_checks: *safe
    acceptance: *accept
  - id: strategic-compression-source-prompt-preservation
    name: "Strategic compression source prompt preservation"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    why_realistic: "Jamie expects strategy compression to turn repo cognition into durable direction rather than roadmap repetition."
    expected_behavior: "Select strategic-compression mode, preserve Strategic Compression & Direction, consume prior cognition artifacts, identify irreducible core, actual and false moat, deletions, core investments, non-negotiables, safe rewrite zones, risks, future-agent guidance, and authority limits."
    prompt: "Does he-strategy still answer my original Strategic Compression & Direction prompt? It should read intent, architecture review, triage, ADR, and core artifacts where relevant; compress them into irreducible core, actual moat, false moat, strategic contradictions, non-negotiables, deletion candidates, core investments, safe rewrite zones, risks, future-agent guidance, smallest feedback-producing next slice, authority limits, and evidence traceability without just repeating the roadmap or review."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(Strategic Compression|Direction|source prompt|preserved|strategic-compression mode)"}
      - {type: regex, value: "(?is)(irreducible core|actual moat|false moat|strategic contradictions|non-negotiables)"}
      - {type: regex, value: "(?is)(deletion candidates|core investments|safe rewrite zones|future-agent guidance|smallest feedback)"}
      - {type: regex, value: "(?is)(authority limits|Evidence & Traceability Matrix|not.*roadmap|review repeat)"}
  - id: decision-compression-source-prompt-preservation
    name: "Decision compression source prompt preservation"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    why_realistic: "Jamie asks HE strategy to decide whether rejected architecture paths should become ADRs so future architecture reviews do not re-suggest the same issue; this happens in agent-skills when prompt-family, projection, and governance decisions otherwise recur as review feedback."
    expected_behavior: "Select decision-compression mode only when ADR weight is justified, require an ADR necessity test, existing ADR scan, alternatives, consequences, future re-suggestion risk, authority limits, and Do Not Create fallback."
    prompt: "In agent-skills, compare the projection-mode decision against existing ADRs such as .harness/decisions/ADR-007-portable-skill-and-memory-proof.md and decide whether a new ADR is justified for rooted skill projection versus flat projection. Does he-strategy still answer my original Architectural Decision Compression prompt? It should create an ADR only when the decision is durable, alternatives matter, future agents would otherwise re-suggest the same path, and a lighter artifact is insufficient. It should scan existing ADR numbers, include context, decision, options considered, rejected alternatives, consequences, authority limits, evidence traceability, and return Do Not Create when the issue is ephemeral or self-evident."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(Architectural Decision Compression|source prompt|preserved|decision-compression mode)"}
      - {type: regex, value: "(?is)(ADR Necessity Test|durable decision|alternatives|future re-suggestion|lighter artifact)"}
      - {type: regex, value: "(?is)(Existing ADR Scan|ADR-###|options considered|rejected alternatives|consequences)"}
      - {type: regex, value: "(?is)(Do Not Create|ephemeral|self-evident|authority limits|Evidence & Traceability Matrix)"}
  - id: core-compression-source-prompt-preservation
    name: "Core compression source prompt preservation"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    why_realistic: "Jamie expects core knowledge files to preserve true invariants and drift boundaries, not local preferences."
    expected_behavior: "Select core-compression mode only for long-lived invariants, require invariant necessity, scope, non-goals, allowed variation, prohibited drift, enforcement surface, owner or review surface, future-agent guidance, and Do Not Create fallback."
    prompt: "Does he-strategy still answer my original Core Knowledge Compression & Architectural Invariants prompt? It should write or update core files only for non-negotiable system truths, repeated drift risk, stable vocabulary, enforcement surfaces, owner or review surface, consequences of breaking the invariant, scope, non-goals, allowed variation, prohibited drift, future-agent guidance, and evidence traceability. It should return Do Not Create for local preferences, temporary process, single-ticket context, or unproven architecture theory."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(Core Knowledge Compression|Architectural Invariants|source prompt|preserved|core-compression mode)"}
      - {type: regex, value: "(?is)(Invariant Necessity Test|non-negotiable|system truth|repeated drift|stable vocabulary)"}
      - {type: regex, value: "(?is)(scope|non-goals|allowed variation|prohibited drift|enforcement surface|owner)"}
      - {type: regex, value: "(?is)(Do Not Create|local preference|temporary process|single-ticket|Evidence & Traceability Matrix)"}
