schema_version: 1
purpose: "Map approved Harness Engineering cognition into a small, traceable Linear execution plan without mutating Linear."

triggers:
  - Linear execution orchestration
  - ADR readiness gating before Linear execution
  - mapping .harness reframes into milestones and parent issues
  - mapping compressed .harness decisions into execution constraints
  - matching repo project lookup in the JSC Dev Portfolio model
  - repo/location label and bounded deliverable routing
  - Now / Next / Later / Do Not Create classification
  - dependency and eval gate planning
  - human versus agent execution routing
  - label and priority recommendations
  - existing-label-first reconciliation before proposing reusable new labels
  - project or cycle justification when bounded delivery or active execution is proven

inputs:
  - .harness/features/*.md
  - .harness/review/*.md
  - .harness/triage/*.md
  - .harness/strategy/*.md
  - .harness/core/*.md
  - .harness/decisions/*.md
  - .harness/reframes/*.md
  - .harness/refactors/*.md legacy input, read-only compatibility for older reframe program prompts
  - existing .harness/linear/*.md
  - source-prompt coverage or original-method comparison artifacts when present
  - live Linear project, label, initiative, and duplicate-project evidence when tool access is available
  - Linear issue, project, milestone, and initiative identifiers when available
  - actual Linear plugin/app evidence for team, project, initiative, label, duplicate, archived, canceled, and trashed state when the Linear connector is available
  - actual Linear plugin/app evidence for issue-label, project-label, tag, template, state, cycle, milestone, and status compatibility when creation or update is planned

outputs:
  - root: .harness/linear
    pattern_when_linear_known: "YYYY-MM-DD-JSC-###-<repo-name>-<slice-slug>-linear-plan.md"
    pattern_without_linear: "YYYY-MM-DD-<repo-name>-<slice-slug>-linear-plan.md"
    legacy_supported_pattern: "<repo-name>-linear-plan.md"
    note: "Dated Linear identifiers are preferred for new plans."
  - ready_to_create_payloads: "Included in the artifact only; not applied without explicit confirmation."
  - legacy_refactor_input_status: "When .harness/refactors inputs are present, report read, absent, translated_to_reframes, or blocked; do not create new legacy refactor-root artifacts."
  - story_value_basis: "Required for each Now item; include user/operator value, expected feedback signal, and risk-reduction reason."
  - decision_artifact_status: "Required when architecture-shaping, governance-defining, moat-critical, routing, or expensive-to-reverse decisions influence execution; use present, missing, blocked, not_applicable, or upstream_required."
  - core_artifact_status: "Required when architecture, routing, execution, governance, cognition, moat, anti-drift, or future-agent invariants influence execution; use present, missing, blocked, not_applicable, or upstream_required. This skill consumes .harness/core evidence but does not generate it."
  - existing_project_match: "Required when repo-specific work is routed; identify the matched repo project, the evidence source, duplicate/canceled alternatives, and whether mutation is safe."
  - live_linear_setup_status: "Required when Linear connector evidence is available or requested; use verified, blocked, partial, unavailable, or not_applicable and include team, initiative, repo project, Portfolio Ops, labels, duplicate, archived, canceled, trashed, and mutation-safety evidence."
  - label_status: "Required when planned objects need labels/tags; use verified, blocked, partial, unavailable, or not_applicable and distinguish issue labels, project labels, repo/location labels, type labels, roadmap labels, policy labels, and reusable ready-to-create label payloads."
  - template_status: "Required when issue creation/update is planned; use selected, blocked, unavailable, or not_applicable and include the selected Bug, Feature, Research, Release, or Governance / Policy template or the blocker preventing template-safe creation."
  - linear_mutation_status: "Required on every output; use not_requested, confirmation_required, blocked, created, updated, or not_applicable."
  - git_staging_status: "Required when a local Linear plan artifact is written or updated; stage only current-turn files."
  - staged_paths: "Repo-relative paths staged for handoff, or empty when staging is blocked/not_applicable."
  - bug_payload: "When issue_type is bug, preserve reproduction, expected behavior, actual behavior, affected surface, severity, and validation evidence."
  - visual_references: "Required when issue trees, dependencies, eval gates, Now/Next/Later classifications, or human/agent route splits benefit from Mermaid or table-first review."

non_goals:
  - create Linear labels
  - create milestones
  - create issues
  - update issue statuses
  - close or reopen work
  - write strategy artifacts
  - write core cognition or invariant artifacts under .harness/core
  - write reframe programs
  - create noisy ADRs or decision records without a high-value architecture decision
  - implement code
  - edit generated command handles or runtime projections as canonical source

conditional_capabilities:
  - "With explicit post-plan approval, known destination, and a small confirmed object set, the skill may perform the approved Linear mutation and must report exact object IDs."
  - "Without explicit approval, ready-to-create payloads remain unapplied plan data."
  - "When request_user_input is available, use it for post-plan mutation confirmation; otherwise record required_confirmation and keep mutation blocked."
  - "When ADR compression is part of the workflow, require .harness/decisions readiness before live Linear routing or hand off upstream; do not bury missing decision reasoning in Linear issue text."
  - "When core cognition compression is part of the workflow, require .harness/core readiness before live Linear routing or hand off to he-strategy or he-reframe; do not turn missing invariant reasoning into Linear issue text or generate .harness/core files from this skill."

risks:
  - Linear issue explosion
  - creating new initiatives or projects unnecessarily
  - recreating repo-container projects instead of carrying repo identity in labels
  - assigning cycles to important-but-not-current work
  - treating every finding as work
  - treating legacy .harness/refactors paths as permission to revive old artifact roots
  - hiding cross-repo work in a repo-specific project
  - closure without eval proof
  - treating missing ADRs as permission to create more Linear work
  - treating missing core invariants as permission to create more Linear work
  - ignoring existing repo control projects and creating duplicate projects
  - reopening canceled, archived, or trashed projects without explicit approval
  - treating contradictory live project state, such as canonical plus trashed or backlog plus mutation target, as safe routing
  - treating labels, tags, or templates as implied by prose when the live Linear setup has not been verified
  - conflating issue labels with project labels and silently filing objects with the wrong label surface
  - creating untemplated Linear issues when template availability, template name, or template ID cannot be verified
  - ready-to-create payloads being mistaken for applied changes
  - technically neat work being promoted to Now without story value or a feedback signal
  - local artifacts hiding missing live Linear mutation, confirmation, or connector blockers
  - multi-issue plans hiding dependency or route complexity that should be visible as an issue tree, dependency map, or eval-gate table

observability: "Record source artifacts read, ADR status, core artifact status, live Linear setup status, live Linear evidence or blocker, destination, repo/location label, existing project match, duplicate/canceled/archived/trashed findings, issue-label status, project-label status, tag compatibility, template status, project/cycle reasons, Now/Next/Later/Do Not Create, Now value basis, dependencies, eval gates, human/agent route, visual reference status, PR/release evidence rules, traceability, output path or Do Not Create, Linear mutation status, and pass/fail/blocked validation."

rollback_procedure: "If the destination is wrong, mark needs_human_triage and do not create objects; if the plan creates backlog noise, collapse to fewer parent issues or classify as Do Not Create; if a Linear object was accidentally created, stop and ask the user before modifying or deleting it; do not recommend closure unless eval and drift proof are present."

linear_operating_model:
  authority: "Use this model only when existing artifacts, connector context, or the user request confirms Jamie/JSC-managed work; otherwise mark needs_human_triage."
  workspace_team: Jscraik
  team_key: JSC
  top_level_initiative: Dev Portfolio
  repo_location_label_preferred_format: "Repo › <repo-name>"
  repo_location_label_legacy_allowed: true
  portfolio_control_project: Portfolio Ops
  repo_project_policy: "When a matching live repo control project exists, route repo-specific execution there and keep active milestones small; do not create a duplicate repo project. If no matching project exists, recommend creation only when continuing repo-specific execution cannot be represented cleanly under Portfolio Ops or labels/views."
  project_policy: "projects are execution control surfaces with bounded milestones, not unfiltered backlog dumps"
  cycle_policy: "cycles are current execution commitments only"
  cross_repo_project_policy: "use a bounded project only when coordination, delivery tracking, or multi-issue execution requires it"
  default_new_initiative_policy: "do not create unless existing structure cannot represent the work cleanly"
  label_policy: "Use existing labels first. Recommend new labels only when repeated work cannot fit existing Developer Experience, Reliability, Governance, Automation, type, roadmap, repo/location, or policy labels without losing routing value."
  active_set_rule: "keep active sets intentionally small"
  confirmation_required_when_unverified: true

safety:
  redact_by_default: true
  fail_fast: true
  command_policy_ref: "Use repository approval policy and plugin safety gates; this skill does not run network, destructive filesystem, git write, or Linear mutation commands without explicit authorization."
  runtime_projection_rule: "Do not edit .agents/**, plugin caches, mirrored skillsets, or generated handles as canonical source."
  media_artifact_rule: "Review-only generated media belongs under .harness/media/, not inside this skill package."
