    <<: *common
    name: "Explicit Fix Bugs Stage"
    category: happy
    prompt: "Can you inspect the explicit fix bugs stage workflow and keep the traceability evidence?"
    deterministic_checks: *safe
    acceptance: *accept_trace
  - id: reproduce-first
    <<: *common
    name: "Reproduce First"
    category: edge
    prompt: "Can you inspect the reproduce first workflow and keep the traceability evidence?"
    deterministic_checks: *safe
    acceptance: *accept_trace
  - id: qa-linear-intake
    <<: *common
    name: "Qa Linear Intake"
    category: happy
    prompt: "Can you inspect the qa linear intake workflow and keep the traceability evidence?"
    deterministic_checks: *safe
    acceptance: *accept_trace
  - id: he-fix-bugs-linear-trace
    <<: *common
    name: "Linear Trace"
    category: happy
    prompt: "Can you inspect the Linear issue, spec, plan, PR, and validation links before closeout?"
    deterministic_checks: *safe
    acceptance: *accept_trace
  - id: he-fix-bugs-missing-evidence
    <<: *common
    name: "Missing Evidence"
    category: edge
