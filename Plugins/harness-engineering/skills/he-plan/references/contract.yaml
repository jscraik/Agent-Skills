schema_version: 1

purpose: >
  Turn approved or sufficiently clear Harness Engineering work into a durable,
  traceable implementation plan without performing the implementation.

triggers:
  - explicit he-plan invocation
  - turning a spec, brainstorm, requirements doc, bug report, Linear issue, or feature request into a delivery plan
  - sequencing related Linear issues or blockers before he-work
  - creating validation, rollout, rollback, or test strategy for planned delivery
  - revising a plan while preserving stable IDs and traceability
  - deepening a plan or running technical review before he-work
  - reviewing a plan with professional engineering confidence standards
  - prompts that frame Codex as a senior software engineering reviewer, systems architect, implementation-risk analyst, specification maintainer, Codex harness engineer, Skill Factory validation partner, media artifact operator, or adversarial validation partner

inputs:
  - approved execution slice: one milestone, one parent issue, one refactor phase, or one execution slice
  - authoritative source artifact or clear direct request
  - Linear issue and relationship graph for non-trivial tracked work, or enough Linear metadata to create it before planning
  - source acceptance IDs, actors, flows, examples, UI criteria, or invariants when supplied
  - repo constraints, paths, patterns, validation requirements, and rollout rules

outputs:
  - selected execution slice type, source path, and explicit planning boundary
  - mode and depth decision: fresh/resume/deepen plus lightweight/standard/deep
  - concrete current-state resolution for `current` plan/spec requests, or blocked unclear_source_of_truth status
  - professional_confidence_review output when triggered, including initial/final confidence, evidence classifications, adversarial findings, fixes, revised plan, associated spec update status, iterative re-review summary, and confidence plateau
  - claim-level evidence pack or evidence debt for non-trivial professional reviews, including source path, freshness, blocker, and confidence impact
  - execution-first durable plan artifact with objective, source contract, scope, implementation strategy, work units, validation, rollback, review, and handoff
  - stable PU plan-unit identifiers mapped to source FR, NFR, SA, VAC, issue, or decision IDs when available
  - visual references or diagrams when dependencies, rollout phases, review lanes, state transitions, service boundaries, or cross-surface sequencing benefits from visual explanation
  - resolved or created Linear issue key/URL for tracked plans, or linear_blocked status with missing fields and ready-to-create payload
  - explicit linear_action_required boolean and linear_mutation_status enum: not_applicable, already_linked, confirmation_required, approved_small_set_created, or blocked
  - Linear/spec/plan/PR traceability matrix for tracked work
  - post_plan_handoff state: handoff_executed, explicit_stop, blocked, or awaiting_user_choice
  - coding_harness lifecycle block including plan-gate status when the repo is coding-harness-managed
  - requirements, dependencies, test scenarios, verification outcomes, rollback, and risk notes
  - subtractive compression units before additive metadata when first-contact or cockpit surfaces are in scope
  - exact first-contact budget decision for cockpit/compression plans, including default-help rails, agent-catalog rails, commands to demote or hide, and the advanced/all escape hatch
  - "XP operating artifacts: slack_policy for allowable uncertainty and blackboard_delta for durable plan-state updates"
  - explicit classification of assumptions, blockers, and deferred implementation unknowns
  - evidence-backed confidence statement with verified facts, assumptions, blocked validations, and confidence ceilings
  - "reviewability surface for non-trivial plans: Command Summary with exactly one opening BLUF paragraph, Do/Do Not boundaries where useful, stop conditions, rollback notes, and No-Fog Gate"
  - next-stage handoff to he-work, Linear workflow, document review, or folded he-deepen-plan

observability: >
  Source-to-plan coverage is visible through stable IDs and a traceability
  matrix; validation commands and blocked gates are recorded in the plan or
  handoff; assumptions, blockers, and deferred implementation unknowns remain
  explicit.

rollback_procedure: >
  Stop before he-work when validation or traceability fails; revise the plan as
  a complete replacement while preserving stable IDs where possible; route
  unresolved product blockers back to he-brainstorm or he-spec.

non_goals:
  - implementing code or running mutating commands
  - expanding beyond the selected execution slice from secondary review, strategy, triage, or feature docs
  - replacing he-brainstorm or he-spec when product behavior is unresolved
  - using update_plan as the durable plan artifact
  - creating vague task lists without source traceability or test specificity
  - mutating tracker state outside the Linear workflow or skipping the Linear tracker gate
  - deferring help/catalog/docs compression while allowing implementation-presence criteria to pass
  - describing command compression as a direction without listing the visible rails, demoted commands, and admission tests that make it enforceable

risks:
  - asking user questions that repo inspection could answer; mitigate with explore-first rules
  - dropping source requirements; mitigate with source coverage validation
  - plan/state drift; mitigate with stable IDs and complete-replacement revisions
  - missing Linear traceability; mitigate by requiring active issue resolution or issue creation for tracked work
  - local plan artifact mistaken for live tracker mutation; mitigate with required linear_action_required and linear_mutation_status output plus confirmation-gated Linear handoff
  - missing Harness gate evidence in coding-harness-managed repos; mitigate by running or explicitly blocking plan-gate and transition commands
  - plan-only drift after the user asked to continue; mitigate with the post-plan handoff contract and same-turn routing when authorized
  - weak tests; mitigate with behavior-focused scenarios and mock anti-pattern guidance
  - over-planning into implementation; mitigate with plan-only boundaries and deferred implementation notes
  - additive compatibility dominating subtractive clarity; mitigate by sequencing default-help budget, agent-catalog budget, docs front-door collapse, standalone-command admission tests, fresh-agent eval, and ablation proof as blocking units
  - compression plans remaining too subjective to implement; mitigate by requiring exact public command names, hidden command names, future command admission criteria, and generated snapshot commands in the plan artifact
  - execution-slice drift; mitigate by loading `references/execution-slice-contract.md` and blocking any plan unit that is not admitted by the selected Linear/refactor slice
  - first-pass plan reviews remaining too shallow; mitigate by routing deepen/technical-review/professional-confidence prompts to `references/professional-confidence-review.md`
  - current shorthand producing invented plan/spec context; mitigate by requiring concrete source resolution or blocked unclear_source_of_truth status
  - plan/spec drift after material plan revision; mitigate by requiring associated spec update, proposed patch, or blocked status
  - overconfident readiness claims; mitigate with confidence ceilings tied to missing spec, ownership, validation, rollback, smoke/release evidence, runtime testing, and implementation testing
  - stale proof artifacts mistaken for current evidence; mitigate by verifying referenced artifact existence and classifying evidence freshness before citation
  - source-contract evals passing while generated-handle runtime remains unproven; mitigate with fail-closed generated-handle current-state evals, explicit runtime projection evidence debt, and separate sync or projection proof before runtime-visibility claims
  - model fog in dense plans; mitigate with one opening Bottom Line Up Front paragraph and No-Fog Gate before handoff
  - process-heavy plans that obscure execution order; mitigate by keeping Harness metadata in frontmatter, status blocks, or appendices and making the main plan objective -> source contract -> work units -> validation -> rollback -> handoff
  - visual ambiguity in complex plans; mitigate with Mermaid/table-first diagrams and generated media only when it materially improves human review
