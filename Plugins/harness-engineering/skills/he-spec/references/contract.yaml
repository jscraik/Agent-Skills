schema_version: 1

purpose: >
  Run the specification stage of the Harness Engineering workflow so the user gets
  an implementation-grade system spec or UI spec with explicit boundaries, stable
  acceptance IDs, validation, and handoff guidance before planning begins.

triggers:
  - the user wants to turn a brainstorm, feature description, or existing spec into a specification
  - the user wants the he-spec stage explicitly
  - the user wants a dedicated UI spec or companion UI contract before planning
  - the user needs explicit behavior, lifecycle, failure, observability, or validation rules before planning

inputs:
  - "approved execution slice: one milestone, one parent issue, one reframe phase, or one execution slice"
  - "`.harness/linear/<repo-name>-linear-plan.md` for tracked coding-harness execution"
  - "selected `.harness/reframes/<selected-reframe>.md` when the route is reframe or migration work"
  - "`.harness/decisions/*.md`, `.harness/core/*.md`, and `.harness/brainstorm/*.md` as primary constraints and intent"
  - "a brainstorm path, existing spec path, parent spec path, UI source path, or clear feature description"
  - "Linear issue key/URL, or enough Linear metadata to create the tracker issue for non-trivial tracked work"
  - "Linear label metadata or permission to create missing approved reusable labels when tracked work requires them"
  - "relevant constraints, success criteria, risks, and linked documents when available"
  - "optional `.harness/strategy/*.md`, `.harness/triage/*.md`, `.harness/review/*.md`, `.harness/features/*.md`, platform, design-system, accessibility, performance, or operational context as secondary evidence only"

outputs:
  - schema_version: 1 status reports and machine-readable contract metadata
  - a spec-mode choice such as standard-spec or dedicated-ui-spec
  - selected execution slice type and source path
  - a depth decision for standard specs such as none, lite, or full
  - a reader-first written spec artifact with problem, scenarios, scope, behavior, requirements, contracts, validation, and stable SA or VAC identifiers
  - stable FR and NFR requirement identifiers when the spec contains binding functional or non-functional requirements
  - conformance rules for data formats, ledgers, manifests, APIs, CLIs, protocols, or generated files
  - visual references or diagrams when state, lifecycle, data/domain model, workflow, UI flow, service boundary, or safety boundary complexity benefits from visual explanation
  - Linear Work Item Contract and Linear Acceptance Traceability for tracked specs
  - Linear Delta Capture status with label reconciliation for existing tracked plans
  - linear_mutation_status as not_needed, confirmation_required, blocked, created, updated, or deferred_to_he-linear-plan
  - linear_action_required with target project, issue type, proposed title, ready-to-create/update payload, required confirmation, and blocker when live tracking is missing
  - coding_harness lifecycle block with Harness command gate status, `project_brain_status`, and companion `project_brain_evidence_state` when the target repo is coding-harness-managed
  - source-parity notes covering current active source, superseded/latest-only artifacts, and session evidence used
  - compression recovery gates when cockpit, command catalog, README front door, default help, golden-path command, or other first-contact UX is in scope
  - "XP operating artifact: blackboard_delta for new or changed durable requirements"
  - exact parallel research support via repo-research-analyst, learnings-researcher, and conditional external-research roles when needed
  - "reviewability surface for non-trivial specs: Command Summary with exactly one opening BLUF paragraph, Do/Do Not boundaries where useful, and No-Fog Gate"
  - deterministic generated-artifact shape validation for non-trivial specs, including reader-first section order, stable IDs, conformance rules, and visual-reference decision
  - git_staging_status and staged_paths for any spec artifacts written or updated in the current turn
  - explicit validation and next-stage handoff guidance

observability: >
  Specs must state the expected runtime, validation, telemetry, audit-log, or UX
  signals that prove the contract is working. When no runtime observability is
  applicable, the spec must say which validation artifact acts as proof instead.

rollback_procedure: >
  Specs must identify how the behavior can be disabled, reverted, or safely
  superseded before planning begins. For spec-only or documentation-only changes,
  rollback is the previous accepted spec revision plus any Linear decision log.

non_goals:
  - direct implementation
  - turning the spec into a task plan
  - creating a giant programme spec from the whole review stack
  - letting secondary review, strategy, triage, or feature material drive implementation directly
  - inventing contract-level behavior that is not grounded in source artifacts or research
  - skipping or weakening the Linear tracker gate for non-trivial tracked work
  - presenting local `.harness` state as proof that a live Linear object exists
  - skipping the companion UI-spec need when the work clearly requires it
  - treating additive metadata, classification, docs routing, or command existence as product compression

risks:
  - weak source grounding; mitigate with authoritative-source resolution and one focused blocker question
  - contract ambiguity; mitigate with explicit reader-first section requirements, stable FR/NFR/SA identifiers, and acceptance IDs
  - process-heavy specs that obscure the product contract; mitigate by keeping Harness metadata in frontmatter, status blocks, or appendices
  - visual ambiguity in complex specs; mitigate with Mermaid/table-first diagrams and generated media only when it materially improves human review
  - UI ambiguity causing planning churn; mitigate with ui_required detection and dedicated UI-spec mode
  - missing Linear traceability; mitigate by resolving the issue, creating it only when approved, or returning a confirmation-gated ready payload
  - missing or one-off labels; mitigate by reusing existing labels, creating only approved reusable labels, or blocking with a ready-to-create payload
  - coding-harness Project Brain drift; mitigate by recording whether Project Brain is updated, blocked, or not applicable
  - stale or generic external guidance; mitigate with bounded primary-source research and dated citations
  - prior-session drift; mitigate by treating session-collector output as supporting evidence, not tracker authority
  - advisory compression language; mitigate by making first-contact budget, standalone command admission, docs deletion budget, fresh-agent eval, ablation proof, and evidence-backed metrics blocking acceptance gates
  - review-stack sprawl; mitigate by requiring one selected execution slice and treating secondary Harness roots as context unless admitted by the Linear/reframe slice
  - model fog in dense specs; mitigate with one opening Bottom Line Up Front paragraph and No-Fog Gate for non-trivial artifacts
  - generated specs passing skill-source audits while remaining hard to review; mitigate with `check_generated_artifact_shape.py --kind spec` before handoff
