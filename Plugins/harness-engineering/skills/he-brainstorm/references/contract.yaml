schema_version: 1

purpose: >
  Clarify early Harness Engineering ideas, compare warranted directions, decide
  whether a spec is needed, and preserve durable requirements when useful.

triggers:
  - user asks to brainstorm, ideate, compare, or sharpen a direction
  - user asks what to improve, asks for strong options, or asks for surprising directions before selecting one
  - user asks for the HE brainstorm stage
  - scope, expected behavior, terminology, or success criteria are unclear
  - QA feedback is real but expected behavior is not clear enough to file
  - a durable requirements artifact or handoff is requested

inputs:
  - feature idea, problem, opportunity, or improvement subject
  - relevant repo, Linear, strategy, spec, plan, transcript, or QA artifacts
  - Linear team, project, priority, labels, cycle, assignee, or issue key when tracked work is likely
  - constraints, risks, source artifacts, and success criteria
  - user thinking, rejected ideas, and stakeholder preferences

outputs:
  - problem frame and success criteria
  - mode and scope tier
  - options with tradeoffs, warrants, and recommendation
  - for folded he-ideate mode: ranked survivors, basis tags, rejection summary, and selected handoff route
  - web research status for folded he-ideate: ran, skipped, or unavailable
  - "`spec_required`, `risk_level`, and `complexity`"
  - pressure-test result: solve now, simplify, defer, reject, or split
  - domain-language note when terminology affects behavior
  - synthesis checkpoint before artifact writing
  - requirements artifact path when a durable handoff is created
  - Linear issue key/URL for tracked handoffs, or linear_blocked status with missing fields and ready-to-create payload
  - coding_harness lifecycle block when the target repo exposes Harness gates or Project Brain
  - "XP operating artifact: blackboard_delta describing changed shared understanding and persistence targets"
  - recommended next HE stage

non_goals:
  - implementation
  - detailed task sequencing
  - replacing spec or plan stages when the request is already clear
  - hiding unconfirmed assumptions as requirements

risks:
  - over-questioning; ask one useful question at a time
  - decision sprawl; record only hard-to-reverse domain decisions
  - weak handoff; name blockers, next artifact, and HE stage explicitly
  - optional tracker drift; mitigate by running the Linear tracker gate before durable handoff
  - coding-harness state drift; mitigate by preserving Harness transition state and blocked command evidence
  - generic ideation; require warrants for survivor options
  - scattered ideation; require an identifiable subject or explicit surprise/delegated focus before candidate generation
  - hallucinated external context; mark web research unavailable when it cannot run and forbid external basis claims without evidence
  - stale evidence; verify repo or Linear claims before using as facts

observability: >
  Track selection accuracy, scope tier, spec_required decisions, artifact
  handoffs, and validation outcomes.

rollback_procedure: >
  Restore the previous contract/evals/task-profile files from git, then rerun
  strict skill audit and plugin evaluation.

operator_contract:
  description_contract: "Harness Engineering stage: verbs, artifacts, lifecycle boundary, and authority constraints."
  immediate_operator_path:
    first_action: "Read the request and the smallest relevant product/repo artifact, then decide whether ambiguity blocks spec/plan handoff."
    proceed_rule: "Infer harmless missing details conservatively; ask only when stage ownership, destructive behavior, tracker mutation, publication, external writes, or closure proof would change."
  source_order:
    - "local AGENTS.md and canonical repo or .harness artifacts"
    - "current live tracker, PR, branch, runtime, or validation state before mutation or closure"
    - "HE references, routing map, source docs, dependency source, and project contracts"
    - "user confirmation for irreversible, external, destructive, credential, or broad-scope action"
  tool_resolution:
    preferred: "repo wrapper or HE script documented for this stage"
    fallback: "read-only local inspection with the missing tool or permission reported"
    doctor_or_status: "run the smallest status, resolve, audit, or validation command when tool state affects the result"
  freshness_rule:
    discovery: "Cached, indexed, or deferred references may locate candidates and background context."
    action_state: "Use live targeted reads before writes, tracker updates, closure decisions, or status changes."
    readback: "After writes or mutations, verify only the changed surface unless package, release, or lifecycle scope requires more."
  scope_defaults:
    default: "smallest HE stage, artifact, issue, phase, or approved slice implied by the request"
    broaden_when:
      - "shared lifecycle contract or routing behavior changes"
      - "tracker, PR, package, release, or projection behavior changes"
      - "validation proves adjacent artifacts must move together"
  boundaries:
    forbidden_without_explicit_request:
      - "tracker mutation or external publication"
      - "destructive file, branch, data, or workspace operation"
      - "credential, secret, permission, or auth-scope expansion"
      - "completion or closure claim without proof"
    no_drift:
      - "do not turn HE stages into generic productivity or implementation prompts"
      - "do not put long gotcha lists, rubrics, examples, or validation matrices in the hot path"
      - "do not use archive, deferred, or cache paths as active stage authority"
  retry_and_stop:
    retry: "Retry transient tool, network, UI, or validation discovery failures once when safe and cheap."
    stop: "Stop after bounded retry with exact blocker, attempted fallback, and the next safe HE action."
  validation_tiers:
    fast: "touched-file format, schema, route, or stage-specific lint/check"
    standard: "stage audit, routing proof, smoke eval, or repository wrapper for changed behavior"
    deep: "release eval, projection, security, marketplace, tracker, or cross-stage checks only for package-impacting changes"
  concise_output:
    default_fields: ["changed_artifacts", "important_decisions", "validation", "residual_risks", "next_stage_or_blocker"]
    full_ledger_when: ["closure proof", "release", "tracker mutation", "multi-stage migration", "explicit user request"]
  references:
    - "Plugins/harness-engineering/references/operator-shape.md"
