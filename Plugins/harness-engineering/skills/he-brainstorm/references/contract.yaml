schema_version: 1

purpose: >
  Clarify early Harness Engineering ideas, compare warranted directions, decide
  whether a spec is needed, and preserve durable requirements when useful.

triggers:
  - user asks to brainstorm, ideate, compare, or sharpen a direction
  - user asks for the HE brainstorm stage
  - scope, expected behavior, terminology, or success criteria are unclear
  - QA feedback is real but expected behavior is not clear enough to file
  - a durable requirements artifact or handoff is requested

inputs:
  - feature idea, problem, opportunity, or improvement subject
  - relevant repo, Linear, strategy, spec, plan, transcript, or QA artifacts
  - Linear team, project, priority, labels, cycle, assignee, or issue key when tracked work is likely
  - constraints, risks, source artifacts, and success criteria
  - user thinking, rejected ideas, and stakeholder preferences

outputs:
  - problem frame and success criteria
  - mode and scope tier
  - options with tradeoffs, warrants, and recommendation
  - "`spec_required`, `risk_level`, and `complexity`"
  - pressure-test result: solve now, simplify, defer, reject, or split
  - domain-language note when terminology affects behavior
  - synthesis checkpoint before artifact writing
  - requirements artifact path when a durable handoff is created
  - Linear issue key/URL for tracked handoffs, or linear_blocked status with missing fields and ready-to-create payload
  - coding_harness lifecycle block when the target repo exposes Harness gates or Project Brain
  - "XP operating artifact: blackboard_delta describing changed shared understanding and persistence targets"
  - recommended next HE stage

non_goals:
  - implementation
  - detailed task sequencing
  - replacing spec or plan stages when the request is already clear
  - hiding unconfirmed assumptions as requirements

risks:
  - over-questioning; ask one useful question at a time
  - decision sprawl; record only hard-to-reverse domain decisions
  - weak handoff; name blockers, next artifact, and HE stage explicitly
  - optional tracker drift; mitigate by running the Linear tracker gate before durable handoff
  - coding-harness state drift; mitigate by preserving Harness transition state and blocked command evidence
  - generic ideation; require warrants for survivor options
  - stale evidence; verify repo or Linear claims before using as facts

observability: >
  Track selection accuracy, scope tier, spec_required decisions, artifact
  handoffs, and validation outcomes.

rollback_procedure: >
  Restore the previous contract/evals/task-profile files from git, then rerun
  strict skill audit and plugin evaluation.
