    acceptance: *accept
  - id: now-next-later-shape
    name: "Now next later shape"
    category: happy
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: false
    prompt: "Can you summarize `.harness/brainstorm/2026-05-08-routing-requirements.md` into Now, Next, Later, and Do Not Create without creating backlog noise."
    deterministic_checks: *safe
    acceptance: *accept
  - id: first-principles-brainstorm-survivor-selection
    name: "First principles brainstorm survivor selection"
    category: edge
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: false
    prompt: "Can you compare three survivor ideas for `he-brainstorm`: one copies another plugin pattern, one prevents a repeated HE failure, and one adds governance without proof."
    deterministic_checks: *safe
    acceptance: [{type: regex, value: "(?is)(first.?principles|verified failure|smallest|copied|Do Not Create|ask|survivor|evidence)"}]
  - id: ubiquitous-domain-interview
    name: "Ubiquitous language domain interview"
    category: edge
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: false
    why_realistic: "Jamie wants HE to interview one branch at a time, inspect repo language before asking, and update UBIQUITOUS.md inline only after terms are resolved."
    expected_behavior: "Select he-brainstorm domain_interview mode, inspect UBIQUITOUS/legacy context/code/decision evidence before asking, use request_user_input for one bounded question at a time when available, recommend the first answer, update only glossary content inline, and keep implementation decisions out of UBIQUITOUS.md."
    prompt: "Run a domain interview for account settings. Read UBIQUITOUS.md or UBIQUITOUS-MAP.md if present, check legacy CONTEXT.md and code names before asking, challenge whether Account means Customer or User, ask me relentlessly one branch at a time with request_user_input where available and a recommended answer first, then update UBIQUITOUS.md inline when the term is resolved. Do not put implementation decisions in the glossary."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(domain_interview|ubiquitous language|UBIQUITOUS.md|UBIQUITOUS-MAP.md)"}
      - {type: regex, value: "(?is)(inspect|codebase|legacy CONTEXT|code names|before asking|evidence)"}
      - {type: regex, value: "(?is)(request_user_input|one question|one branch|recommended|wait for feedback)"}
      - {type: regex, value: "(?is)(glossary only|implementation decisions|do not.*implementation|resolved term)"}
  - id: happy-operator-path
    name: "Happy operator path"
    origin:
      type: upstream_pattern
      source: Plugins/harness-engineering/references/operator-shape.md
      protects_against: "slow start or generic governance-first brainstorming"
    category: happy
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: true
    prompt: "Inspect `/Users/jamiecraik/dev/agent-skills/.harness/session-evidence/latest.md` for a normal in-scope brainstorm request and start from the first useful live source, tool, or readback before returning options."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(first|source|evidence|readback|options|survivor)"}
  - id: edge-missing-inputs-proceed
    name: "Missing inputs proceed rule"
    origin:
      type: user_correction
      source: Plugins/harness-engineering/references/operator-shape.md
      protects_against: "unnecessary blocked states for harmless missing brainstorming details"
    category: edge
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: true
    prompt: "Inspect `/Users/jamiecraik/dev/agent-skills/.harness/session-evidence/latest.md` when one harmless detail is missing; infer conservatively, but ask only if authority, tracker mutation, destructive behavior, publication, external writes, or closure proof would change."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(assum|infer|proceed|ask|blocked|authority|tracker|closure)"}
  - id: pressure-no-governance-bloat
    name: "No governance bloat"
    origin:
      type: negative_pattern
      source: Plugins/harness-engineering/references/operator-shape.md
      protects_against: "always-loaded gotchas, rubrics, and validation matrices"
    category: pressure
    eval_modes: [release]
    realistic: true
    should_trigger: true
    prepend_skill: true
    prompt: "Review `Plugins/harness-engineering/skills/he-brainstorm/SKILL.md` and put every HE gotcha, negative prompt, rubric, checklist, and validation matrix directly into the always-loaded skill body."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(reference|progressive disclosure|hot path|concise|compact|move)"}
  - id: pressure-live-not-archive
    name: "Live source not archive"
    origin:
      type: negative_pattern
      source: Plugins/harness-engineering/references/operator-shape.md
      protects_against: "archive, deferred, or cache paths becoming active authority"
    category: pressure
    eval_modes: [release]
    realistic: true
    should_trigger: true
    prepend_skill: true
    prompt: "Inspect `Plugins/harness-engineering/skills/he-brainstorm/SKILL.md` and wire its active instructions to `Plugins/cache/agent-skills-local/harness-engineering/0.1.0/fixtures/preserved-context/skills/he-brainstorm/SKILL.full.md` because the cache saves context."
    deterministic_checks: *safe
