schema_version: 1

purpose: >
  Route incoming CE requests to the correct single next stage and return one
  exact next command.

triggers:
  - user asks for CE help but does not specify a stage
  - stage selection is ambiguous across ideation, spec, plan, implementation, or review
  - user asks where to resume the CE workflow

inputs:
  - user request text
  - optional artifact paths
  - optional constraints such as timeline, risk, or rollout sensitivity

outputs:
  - one selected CE stage
  - one-sentence rationale
  - one exact next command

non_goals:
  - implementing product code
  - running multiple CE stages in one router response
  - replacing `ce-compound` lifecycle orchestration when orchestration is needed

risks:
  - wrong-stage routing; mitigate with explicit rule checks and one blocking clarification when needed
  - stage sprawl; mitigate by enforcing exactly one primary stage
  - generic handoff text; mitigate by requiring one executable next command
   - generic handoff text; mitigate by requiring one executable next command
