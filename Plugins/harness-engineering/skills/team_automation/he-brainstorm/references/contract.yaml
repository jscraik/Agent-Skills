schema_version: 1

purpose: >
  Clarify an early Harness Engineering idea, compare viable directions, decide
  whether a spec is needed, and capture a durable requirements handoff when useful.

triggers:
  - user asks to brainstorm a feature, improvement, or product direction
  - user asks for the HE brainstorm stage
  - scope, behavior, or success criteria are still unclear
  - a durable brainstorm or requirements artifact is requested

inputs:
  - feature idea, problem, or improvement
  - relevant constraints, risks, source artifacts, and success criteria

outputs:
  - clarified problem frame
  - 2-3 options with trade-offs and a recommendation
  - "`spec_required`, `risk_level`, and `complexity`"
  - domain-language note when terminology affects behavior
  - requirements artifact path when a durable handoff is created
  - recommended next HE stage

non_goals:
  - implementation
  - detailed task sequencing
  - replacing spec or plan stages when the request is already clear

risks:
  - over-questioning; ask one useful question at a time
  - decision sprawl; record only hard-to-reverse domain decisions
  - weak handoff; name the next artifact and HE stage explicitly

observability: >
  Track brainstorm selection accuracy, spec_required decisions, artifact handoff
  creation, and validation outcomes.

rollback_procedure: >
  Restore the previous contract/evals/task-profile files from git, then rerun
  strict skill audit and plugin evaluation.
