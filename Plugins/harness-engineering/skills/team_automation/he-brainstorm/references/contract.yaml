schema_version: 1
purpose: Clarify vague Harness Engineering product or feature ideas before spec, plan, or work.
triggers:
  - ambiguous feature or improvement request
  - explicit brainstorm stage request
  - decision between 2-3 viable directions
inputs:
  - idea, constraints, risks, repo context, and Linear issue context when present
outputs:
  - problem frame, options, tradeoffs, recommendation, risk, spec_required, complexity, and next stage
non_goals:
  - direct implementation
  - detailed execution planning
risks:
  - ambiguous domain language; resolve through CONTEXT.md language and Linear comments, not ADRs
  - shallow recommendations; use bounded repo and learning research when context matters
rollback_procedure: Restore the previous contract, evals, and task-profile from git, then rerun strict audit.
