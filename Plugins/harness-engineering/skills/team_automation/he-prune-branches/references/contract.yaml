schema_version: 1

purpose: >
  Run the Harness Engineering branch hygiene stage to discover and remove local
  branches whose remote tracking branches are gone, with explicit user
  confirmation and worktree-safe deletion sequencing.

triggers:
  - user asks to prune stale local branches
  - user asks to delete branches removed from remote
  - branch hygiene cleanup is requested before ongoing work

inputs:
  - repository path and git context
  - yes/no confirmation for deleting discovered branch set
  - permission to remove associated worktrees when present

outputs:
  - gone-branch discovery result (`found`, `none`, or `blocked`)
  - explicit confirmation result (`approved` or `declined`)
  - per-branch cleanup outcomes including worktree removal and branch deletion state
  - final cleanup summary count and partial-failure details when applicable

non_goals:
  - multi-repo governance policy authoring
  - implementation or feature delivery work
  - deleting branches without explicit confirmation

risks:
  - destructive branch deletion mistakes; mitigate with whole-set confirmation gate
  - orphaned worktree paths; mitigate with worktree-first cleanup sequencing
  - partial cleanup ambiguity; mitigate with per-branch outcome reporting
  - missing helper roles when delegation is requested; mitigate with manifest check and `[[codex-agent-creator]]` fallback
