schema_version: "2.0"

skill_name: "he-prune-branches"

cases:
  - id: explicit-prune-trigger
    name: explicit prune request routes here
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    prepend_skill: true
    prompt: "Use $he-prune-branches to clean local branches whose remote is gone."
    acceptance:
      - type: skill_selected
        expected_skill: "he-prune-branches"
      - type: regex
        value: "(?i)(clean-gone|gone branches|prune|confirm)"

  - id: no-gone-branches-path
    name: none found path is explicit
    category: edge
    eval_modes: [smoke, release]
    should_trigger: true
    prepend_skill: false
    prompt: "Run he-prune-branches; assume discovery returns __NONE__."
    acceptance:
      - type: skill_selected
        expected_skill: "he-prune-branches"
      - type: regex
        value: "(?i)(__NONE__|no stale branches|none found)"
      - type: not_regex
        value: "(?i)(Deleted branch)"

  - id: confirmation-required
    name: asks yes-no before deletion
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    prepend_skill: false
    prompt: "Use he-prune-branches and show me the exact list before deleting anything."
    acceptance:
      - type: skill_selected
        expected_skill: "he-prune-branches"
      - type: regex
        value: "(?i)(Delete all of them\\?|yes/no|confirm)"

  - id: decline-stops-cleanup
    name: user decline path makes no deletions
    category: edge
    eval_modes: [smoke, release]
    should_trigger: true
    prepend_skill: false
    prompt: "Use he-prune-branches. I will decline deletion after seeing the list."
    acceptance:
      - type: skill_selected
        expected_skill: "he-prune-branches"
      - type: regex
        value: "(?i)(declin|stop|no changes)"
      - type: not_regex
        value: "(?i)(Deleted branch)"

  - id: worktree-first-cleanup
    name: removes associated worktree before branch delete
    category: edge
    eval_modes: [smoke, release]
    should_trigger: true
    prepend_skill: false
    prompt: "Run he-prune-branches where one stale branch has its own worktree path."
    acceptance:
      - type: skill_selected
        expected_skill: "he-prune-branches"
      - type: regex
        value: "(?i)(Removed worktree|worktree remove)"
      - type: regex
        value: "(?i)(Deleted branch)"

  - id: implementation-negative
    name: implementation request routes away
    category: negative
    eval_modes: [smoke, release]
    should_trigger: false
    prepend_skill: false
    prompt: "Implement this approved feature plan now."
    acceptance:
      - type: skill_not_selected
        expected_skill: "he-prune-branches"
      - type: regex
        value: "(?i)(he-work|implement)"

  - id: manifest-unavailable-fallback
    name: manifest unavailable fallback guidance
    category: edge
    eval_modes: [smoke, release]
    should_trigger: true
    prepend_skill: false
    prompt: "Use he-prune-branches, but ~/.codex/agents/manifest.json is unavailable."
    acceptance:
      - type: skill_selected
        expected_skill: "he-prune-branches"
      - type: regex
        value: "(?i)(manifest|unavailable|manual|fallback)"

  - id: missing-role-fallback
    name: missing role fallback includes creator route
    category: edge
    eval_modes: [smoke, release]
    should_trigger: true
    prepend_skill: false
    prompt: "Use he-prune-branches and assume requested helper roles are missing from the manifest."
    acceptance:
      - type: skill_selected
        expected_skill: "he-prune-branches"
      - type: regex
        value: "(?i)(missing roles|manual launch|codex-agent-creator)"

metadata:
  last_updated: "2026-04-21"
  author: "Codex"
  review_status: "draft"
