    origin:
      type: upstream_pattern
      source: Plugins/harness-engineering/references/operator-shape.md
      protects_against: 'slow start or generic governance-first execution'
    category: happy
    eval_modes: *modes
    realistic: true
    should_trigger: true
    prepend_skill: true
    prompt: "Inspect `/Users/jamiecraik/dev/agent-skills/.harness/session-evidence/latest.md` for a normal in-scope HE request and start from the first useful source/tool/read before returning proof."
