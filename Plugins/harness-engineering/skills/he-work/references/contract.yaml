schema_version: 1
purpose: >
  Run Harness Engineering implementation so approved work lands with traceable
  task state, contract-drift control, validation evidence, and PR-ready handoff.
triggers:
  - user wants an approved plan, todo file, or tiny low-risk spec implemented
  - user explicitly requests the he-work stage
  - execution needs Linear, PR, spec/plan, IDs, and validation traceability
inputs:
  - plan path, todo path, small spec path, or obviously tiny low-risk bare request
  - linked issue, branch, PR, acceptance IDs, invariants, non-goals, and validation gates
  - optional execution notes such as test-first, characterization-first, or external-delegate
outputs:
  - chosen lane and synchronized task progress
  - implemented code plus validation evidence
  - traceability evidence linking Linear, spec, plan, PR, IDs, and validation
  - delegation_overlap_status when delegate or parallel mode is considered
  - mandatory coding_harness lifecycle block for coding-harness-managed repos, with blast-radius, policy, preflight, validation-plan, and transition evidence; if a gate cannot run, record explicit blocked evidence
  - lifecycle exit status with schema_version, he_stage, mode, tracker_status, artifact_status, traceability_status, validation_status, exit_status, next_stage, missing_inputs, and evidence fields
  - git_staging_status and staged_paths for files changed in the current turn
  - drift updates when execution changes the contract
  - "XP operating artifacts: slack_policy for scoped uncertainty and blackboard_delta for durable implementation-state updates"
  - handoff with Linear, PR, completed IDs, risks, rollback, and monitoring notes
  - UI evidence when user-visible surfaces changed
  - visual references or screenshot proof when user-visible behavior, rollback,
    validation, or before/after state cannot be reviewed clearly from text alone
non_goals:
  - first-pass specs or plans
  - silent product scope expansion
  - validation shortcuts
  - prototype artifacts as production by default
risks:
  - wrong artifact; mitigate with current-vs-latest checks
  - missing tracker; mitigate by stopping non-trivial tracked work
  - contract drift; mitigate with artifact update before off-plan work
  - missed Harness admission gates; mitigate by recording every available gate as run or blocked with exact command/path evidence
  - dirty worktree damage; mitigate by preserving user changes
  - delegate drift; mitigate by parent review and validation
  - overlapping delegated edits; mitigate by file/module overlap checks, worktree isolation, or serial execution
observability: >
  Record validation commands/outcomes, Linear result or blocker, monitoring or
  no-impact note, visual reference status, and screenshot evidence for
  user-visible changes.
rollback_procedure: >
  Keep logical commits scoped to verified slices, document rollback triggers
  and smallest revert path, and do not hand off tracked work until validation
  and traceability align.

operator_contract:
  description_contract: "Harness Engineering stage: verbs, artifacts, lifecycle boundary, and authority constraints."
  immediate_operator_path:
    first_action: "Read the approved plan/slice and current repo state, then implement only the approved slice."
    proceed_rule: "Infer harmless missing details conservatively; ask only when stage ownership, destructive behavior, tracker mutation, publication, external writes, or closure proof would change."
  source_order:
    - "local AGENTS.md and canonical repo or .harness artifacts"
    - "current live tracker, PR, branch, runtime, or validation state before mutation or closure"
    - "HE references, routing map, source docs, dependency source, and project contracts"
    - "user confirmation for irreversible, external, destructive, credential, or broad-scope action"
  tool_resolution:
    preferred: "repo wrapper or HE script documented for this stage"
    fallback: "read-only local inspection with the missing tool or permission reported"
    doctor_or_status: "run the smallest status, resolve, audit, or validation command when tool state affects the result"
  freshness_rule:
    discovery: "Cached, indexed, or deferred references may locate candidates and background context."
    action_state: "Use live targeted reads before writes, tracker updates, closure decisions, or status changes."
    readback: "After writes or mutations, verify only the changed surface unless package, release, or lifecycle scope requires more."
  scope_defaults:
    default: "smallest HE stage, artifact, issue, phase, or approved slice implied by the request"
    broaden_when:
      - "shared lifecycle contract or routing behavior changes"
      - "tracker, PR, package, release, or projection behavior changes"
      - "validation proves adjacent artifacts must move together"
  boundaries:
    forbidden_without_explicit_request:
      - "tracker mutation or external publication"
      - "destructive file, branch, data, or workspace operation"
      - "credential, secret, permission, or auth-scope expansion"
      - "completion or closure claim without proof"
    no_drift:
      - "do not turn HE stages into generic productivity or implementation prompts"
      - "do not put long gotcha lists, rubrics, examples, or validation matrices in the hot path"
      - "do not use archive, deferred, or cache paths as active stage authority"
  retry_and_stop:
    retry: "Retry transient tool, network, UI, or validation discovery failures once when safe and cheap."
    stop: "Stop after bounded retry with exact blocker, attempted fallback, and the next safe HE action."
  validation_tiers:
    fast: "touched-file format, schema, route, or stage-specific lint/check"
    standard: "stage audit, routing proof, smoke eval, or repository wrapper for changed behavior"
    deep: "release eval, projection, security, marketplace, tracker, or cross-stage checks only for package-impacting changes"
  concise_output:
    default_fields: ["changed_artifacts", "important_decisions", "validation", "residual_risks", "next_stage_or_blocker"]
    full_ledger_when: ["closure proof", "release", "tracker mutation", "multi-stage migration", "explicit user request"]
  references:
    - "Plugins/harness-engineering/references/operator-shape.md"
