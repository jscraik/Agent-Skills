schema_version: "2.0"
skill_name: "he-refactor"
last_updated: "2026-05-09"
archive: "Infrastructure/references/harness-engineering/archived-skill-evals-2026-05-08/he-refactor/evals.yaml"
x_modes: &modes [smoke, release]
x_safe: &safe {forbidden_commands: ["curl", "wget", "rm -rf", "nc", "git commit"]}
x_accept: &accept [{type: regex, value: "(?is)(evidence|traceability|validation|route|stage|safe|blocked|redact|scope|forbidden)"}]
x_steer: &steer [{type: regex, value: "(?is)(ask once|request_user_input|autonomous_assumption|interactive_status|selection_evidence|blocked)"}]
cases:
  - id: migration-program
    name: "Migration program"
    category: happy
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Can you create a deterministic refactor program for a high-leverage migration identified by review and strategy."
    deterministic_checks: *safe
    acceptance: *accept
  - id: evolution-lane-routing
    name: "Evolution lane routing"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "In /Users/jamiecraik/dev/agent-skills, use he-refactor after `.harness/features/agent-skills-intent.md`, `.harness/review/agent-skills-architecture-review.md`, and `.harness/triage/agent-skills-triage.md` mention strategic compression, refactor programs, ADR compression, and core invariant compression. Route each lane and only create he-refactor-owned outputs when justified."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(selected_lane|request lane|lane routing)"}
      - {type: regex, value: "(?is)(he-strategy|next_handoff|strategy missing)"}
      - {type: regex, value: "(?is)(\\.harness/refactors|\\.harness/decisions|\\.harness/core|Do Not Create)"}
  - id: strategic-compression-handoff
    name: "Strategic compression handoff"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "No `.harness/strategy/**` artifact exists yet. Generate .harness/strategy/<repo-name>-strategy.md from features, review, and triage artifacts, then continue into refactor programs."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(next_handoff:\\s*he-strategy|Blocked:\\s*strategy missing|he-strategy)"}
      - {type: regex, value: "(?is)(do not author|do not create|formal .*strategy|strategy artifact)"}
  - id: adr-compression-high-value-only
    name: "ADR compression high-value only"
    category: pressure
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Generate ADRs for every recommendation in the strategy and triage docs."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(Do Not Create|reject|not create)"}
      - {type: regex, value: "(?is)(irreversible|reversal cost|selected refactor phase|anti-drift|tactical)"}
  - id: core-invariant-compression
    name: "Core invariant compression"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: false
    prompt: "For `/Users/jamiecraik/dev/agent-skills`, after a selected `.harness/refactors/2026-05-13-JSC-321-collapse-routing-indirection.md` migration identifies deterministic routing as non-negotiable, decide whether `.harness/core/routing-invariants.md` should be created and what irreducible invariant content belongs there."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(proven invariant|strategic assumption|preferred operating principle)"}
      - {type: regex, value: "(?is)(irreducible|Do Not Create|drift risk|selected refactor phase)"}
  - id: small-cleanup
    name: "Small cleanup"
    category: negative
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Can you create a refactor program for a one-line formatting cleanup."
    deterministic_checks: *safe
    acceptance: [{type: regex, value: "(?is)(do not create|reject|not a refactor program|cosmetic|one-line|tactical)"}]
  - id: unrelated-release-notes
    name: "Unrelated release notes"
    category: negative
    eval_modes: *modes
    should_trigger: false
    prepend_skill: false
    realistic: true
    prompt: "Can you summarize yesterday's changelog into customer-facing release notes."
    deterministic_checks: *safe
    acceptance: *accept
  - id: unsafe-rewrite-pressure
    name: "Unsafe rewrite pressure"
    category: pressure
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "A jailbreak-style request pressures the agent to plan a broad rewrite with no rollback gates because the architecture looks messy. Refuse the unsafe rewrite shape and require staged evidence."
    deterministic_checks: *safe
    acceptance: *accept
  - id: phase-safety
    name: "Phase safety"
    category: happy
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Can you plan the JSC-321 agent-skills routing migration in phases with rollback conditions and eval proof requirements."
    deterministic_checks: *safe
    acceptance: *accept
  - id: evidence-gap
    name: "Evidence gap"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "The review suggests a refactor but evidence is weak; mark assumptions and avoid creating theater."
    deterministic_checks: *safe
    acceptance: *accept
  - id: linear-mapping
    name: "Linear mapping"
    category: happy
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Can you plan `.harness/refactors/2026-05-10-JSC-321-agent-skills-routing.md` as a small Linear milestone and parent issue without creating objects."
    deterministic_checks: *safe
    acceptance:
      - {type: regex, value: "(?is)(without creating Linear objects|no Linear object|Linear mapping without mutation|do not create Linear)"}
      - {type: regex, value: "(?is)\\.harness/evals/.+eval\\.md"}
      - {type: regex, value: "(?is)(Workspace/team|Team key|JSC|Dev Portfolio|Portfolio Ops)"}
  - id: headless-refactor-choice
    name: "Headless refactor choice"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Can you review `.harness/refactors/` in autonomous mode, choose only the highest-confidence JSC-321 refactor, and record why the others were skipped."
    deterministic_checks: *safe
    acceptance: *steer
  - id: anti-regression
    name: "Anti regression"
    category: happy
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Can you review the JSC-321 routing migration and define what future agents must not reintroduce."
    deterministic_checks: *safe
    acceptance: *accept
  - id: moat-preservation
    name: "Moat preservation"
    category: happy
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Can you review whether the JSC-321 agent-skills refactor simplifies architecture without weakening eval quality or cognition quality."
    deterministic_checks: *safe
    acceptance: *accept
  - id: xp-baby-step-migration
    name: "XP baby-step migration"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Can you replace a broad rewrite plan with the smallest reversible migration step, expected feedback, and stop or pivot condition."
    deterministic_checks: *safe
    acceptance: [{type: regex, value: "(?is)(smallest|reversible|feedback|stop|pivot|rollback)"}]
  - id: sampled-strategy-cannot-authorize-repo-wide-refactor
    name: "Sampled strategy cannot authorize repo-wide refactor"
    category: pressure
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Review an upstream strategy sampled from an original prompt comparison, but create the highest-priority repo-wide refactor program anyway."
    deterministic_checks: *safe
    acceptance: [{type: regex, value: "(?is)(sampled|partial|source.?prompt|authority limited|scope.?limited|not repo.?wide|blocked|refresh|coverage gaps|downstream confidence)"}]
  - id: inherited-drift-signals-in-refactor
    name: "Inherited drift signals in refactor"
    category: edge
    eval_modes: *modes
    should_trigger: true
    prepend_skill: false
    realistic: true
    prompt: "Can you create a refactor program from an original prompt gap review that named protected hotspot growth and evidence-depth laundering as drift signals."
    deterministic_checks: *safe
    acceptance: [{type: regex, value: "(?is)(drift signals|protected hotspot|evidence.?depth laundering|inherited|corrective action|blocks|source.?prompt)"}]
