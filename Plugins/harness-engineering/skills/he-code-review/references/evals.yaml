    <<: *common
    name: "Explicit Code Review Stage"
    category: happy
    prompt: "he-code-review case explicit-code-review-stage: preserve traceability, evidence, validation, and safe routing."
    deterministic_checks: *safe
    acceptance: *accept_trace
