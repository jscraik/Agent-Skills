    <<: *common
    name: "Explicit Heartbeat Stage"
    category: happy
    prompt: "he-heartbeat case explicit-heartbeat-stage: preserve traceability, evidence, validation, and safe routing."
    deterministic_checks: *safe
    acceptance: *accept_trace
