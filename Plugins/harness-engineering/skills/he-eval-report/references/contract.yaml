schema_version: 1
purpose: "Post-implementation HE eval reports that decide whether an approved Linear slice is safe to close."
triggers:
  - completed HE implementation needs closure proof
  - Linear issue, milestone, or execution slice is about to close
  - drift validation or proof linkage is requested
inputs:
  - source slice, Linear IDs, diff, validation output, PR/commit evidence, ADR/core/reframe/spec links
outputs:
  - .harness/evals/YYYY-MM-DD-JSC-###-<repo-name>-<linear-parent-issue-or-milestone>-eval.md
  - .harness/evals/YYYY-MM-DD-<repo-name>-<linear-parent-issue-or-milestone>-eval.md when no Linear issue is known
  - closure recommendation: Complete, Complete with follow-up, Blocked, Needs rework, or Unsafe to close
  - gate matrix, drift validation, proof artifacts, follow-up classification, core/ADR update decision
  - git_staging_status and staged_paths for eval reports or proof artifacts written in the current turn
  - visual references when evidence chains, gate matrices, visual proof, screenshots, or generated media materially affect closure confidence
required_validity_checks:
  - task_validity
  - outcome_validity
  - trajectory_validity
  - grader_calibration
  - trial_policy
  - maintenance_saturation
  - authorization_validation
side_effect_authorization:
  protected_actions: [send, publish, invite, delete, approve, external_comment]
  exempt_actions: [direct_user_reply, draft_only, local_read_only]
  decisions: [approved, blocked, exempt, not-run]
  rule: "Only explicit user authorization can approve protected side effects; missing validator evidence blocks closure."
risks:
  - missing validation evidence can create false closure confidence
  - over-broad reports can evaluate adjacent work instead of the approved slice
  - protected side effects can be approved from agent claims or external-party requests
  - repeated review or CI remediation can be dismissed as noise instead of becoming eval seeds
  - generated media can be mistaken for persisted proof when only a prompt or cache-only image exists
  - non-linear proof chains can hide blockers; mitigate with table-first gate matrices or Mermaid evidence chains
observability: "Track validator status, warnings, first blocking error, command outcomes, visual reference status, and side-effect authorization fields."
rollback_procedure: "Keep Linear open, mark Blocked or Needs rework, patch or revert the failing slice, and rerun report plus narrow implementation validation."
media_artifact_policy:
  repository_root: ".harness/media/"
  required_when_media_is_proof:
    - cache path when available
    - repository PNG path
    - prompt metadata path
    - sidecar path
    - existence verification
  rule: "Prompt-only, visible-only, or cache-only media is incomplete proof for closure."
non_goals:
  - repeat specs, duplicate architecture review, generic QA, rubber-stamp status, or create Linear noise

operator_contract:
  description_contract: "Harness Engineering stage: verbs, artifacts, lifecycle boundary, and authority constraints."
  immediate_operator_path:
    first_action: "Collect the claimed completion evidence and validation outputs before deciding closure readiness."
    proceed_rule: "Infer harmless missing details conservatively; ask only when stage ownership, destructive behavior, tracker mutation, publication, external writes, or closure proof would change."
  source_order:
    - "local AGENTS.md and canonical repo or .harness artifacts"
    - "current live tracker, PR, branch, runtime, or validation state before mutation or closure"
    - "HE references, routing map, source docs, dependency source, and project contracts"
    - "user confirmation for irreversible, external, destructive, credential, or broad-scope action"
  tool_resolution:
    preferred: "repo wrapper or HE script documented for this stage"
    fallback: "read-only local inspection with the missing tool or permission reported"
    doctor_or_status: "run the smallest status, resolve, audit, or validation command when tool state affects the result"
  freshness_rule:
    discovery: "Cached, indexed, or deferred references may locate candidates and background context."
    action_state: "Use live targeted reads before writes, tracker updates, closure decisions, or status changes."
    readback: "After writes or mutations, verify only the changed surface unless package, release, or lifecycle scope requires more."
  scope_defaults:
    default: "smallest HE stage, artifact, issue, phase, or approved slice implied by the request"
    broaden_when:
      - "shared lifecycle contract or routing behavior changes"
      - "tracker, PR, package, release, or projection behavior changes"
      - "validation proves adjacent artifacts must move together"
  boundaries:
    forbidden_without_explicit_request:
      - "tracker mutation or external publication"
      - "destructive file, branch, data, or workspace operation"
      - "credential, secret, permission, or auth-scope expansion"
      - "completion or closure claim without proof"
    no_drift:
      - "do not turn HE stages into generic productivity or implementation prompts"
      - "do not put long gotcha lists, rubrics, examples, or validation matrices in the hot path"
      - "do not use archive, deferred, or cache paths as active stage authority"
  retry_and_stop:
    retry: "Retry transient tool, network, UI, or validation discovery failures once when safe and cheap."
    stop: "Stop after bounded retry with exact blocker, attempted fallback, and the next safe HE action."
  validation_tiers:
    fast: "touched-file format, schema, route, or stage-specific lint/check"
    standard: "stage audit, routing proof, smoke eval, or repository wrapper for changed behavior"
    deep: "release eval, projection, security, marketplace, tracker, or cross-stage checks only for package-impacting changes"
  concise_output:
    default_fields: ["changed_artifacts", "important_decisions", "validation", "residual_risks", "next_stage_or_blocker"]
    full_ledger_when: ["closure proof", "release", "tracker mutation", "multi-stage migration", "explicit user request"]
  references:
    - "Plugins/harness-engineering/references/operator-shape.md"
