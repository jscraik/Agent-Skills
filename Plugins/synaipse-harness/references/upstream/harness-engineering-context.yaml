quality_audit:
  schema_version: 1
  status_values:
  - adopted
  - needs_synaipse_rewrite
  - legacy_context_only
  - archive_candidate
  - remove_candidate
  required_fields:
  - adoption_status
  - stage_map
  - quality_notes.stale_terms
  - quality_notes.link_check
  - quality_notes.accuracy_certification
  stale_term_policy: References with Harness Engineering or he-* lifecycle terms are not certified as
    SynAIpse-native; they must be marked needs_synaipse_rewrite or legacy_context_only until rewritten.
  link_policy: Every relative Markdown link in copied upstream Markdown references must resolve inside
    the repository.
  accuracy_policy: The index records structural and terminology audit status; adopted means no legacy
    lifecycle terms were detected, not that domain claims were externally re-proven.
