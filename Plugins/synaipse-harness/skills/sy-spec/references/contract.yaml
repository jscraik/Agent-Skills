schema_version: 1
skill: sy-spec
purpose: Run the explicit sy-spec stage with bounded evidence and no router-side guessing.
triggers:
  - explicit sy-spec invocation
  - sy-router selected sy-spec as the next stage
inputs:
  - user request or routed handoff
  - current workspace root
  - relevant artifact, tracker, PR, validation, or session evidence when available
outputs:
  - stage result that follows SKILL.md procedure
  - exact validation status using pass, fail, or blocked
  - authority and external-write limits
non_goals:
  - implicit invocation from generic requests
  - cross-stage completion claims
  - external mutation without explicit authorization
risks:
  - stale or contradictory evidence
  - collapsed proof lanes across local validation, CI, reviews, tracker, and merge readiness
  - accidental tracker, GitHub, branch, or artifact mutation
archive:
  full_reference_source: .harness/archives/synaipse-harness-full/plugin-root
