schema_version: "1.1"
purpose: >
  Define the hardening-stage contract for plugin-builder so plugin packages are
  converted, scaffolded, and validated with deterministic safety and compatibility gates.
triggers:
  - user asks to scaffold or harden a Codex plugin package
  - user asks to convert a third-party plugin source into Codex structure
  - user asks to validate plugin contract and marketplace compatibility before release
inputs:
  - plugin name and package root
  - source URL/path and pinned ref when conversion is requested
  - requested plugin surfaces and optional marketplace wiring
  - validation depth and acceptance threshold
outputs:
  - contract-valid plugin package rooted at Plugins/<plugin-name>
  - validation summary for plugin contract, compatibility, and marketplace checks
  - deconflict and conversion evidence when external sources are involved
non_goals:
  - standalone skill lifecycle hardening prior to plugin packaging
  - pure plugin installation/distribution operations
  - bypassing validation gates to ship unverified plugin manifests
risks:
  - conversion drift from incomplete source inspection; mitigated by inspect-before-write workflow
  - marketplace policy drift; mitigated by audit and normalize checks
  - unsafe execution of third-party scripts; mitigated by explicit no-execute posture
rollback_procedure: >
  If plugin hardening introduces regressions, remove the generated package surfaces,
  restore the prior plugin directory from git, and rerun scaffold plus validation gates.
  Never keep partially validated marketplace updates; normalize and validate before re-adding.
observability: >
  Track plugin-builder health via validator pass rates, marketplace audit findings,
  and failed conversion attempts caused by malformed manifests or unsafe source content.
