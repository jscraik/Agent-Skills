# Canonical prek configuration for agent-skills
# Run: prek install

default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "hooks-pre-commit"
name = "Run pre-commit validation"
entry = "make hooks-pre-commit"
language = "system"
stages = ["pre-commit"]
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "hooks-commit-msg"
name = "Validate commit message policy"
entry = "bash -lc 'make hooks-commit-msg HOOK_COMMIT_MSG_FILE=\"$1\"' --"
language = "system"
stages = ["commit-msg"]
pass_filenames = true
always_run = false

[[repos.hooks]]
id = "hooks-pre-push"
name = "Run pre-push diagnostics"
entry = "make hooks-pre-push"
language = "system"
stages = ["pre-push"]
pass_filenames = false
always_run = true
