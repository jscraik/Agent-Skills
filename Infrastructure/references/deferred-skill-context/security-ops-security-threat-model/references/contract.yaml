purpose: Repository-grounded threat modeling that enumerates trust boundaries, assets,
  attacker capabilities, abuse paths, and mitigations, and writes a concise Markdown
  threat model. Trigger only when the user explicitly asks to threat model a codebase
  or path, enumerate threats/abuse paths, or perform AppSec threat modeling. Do not
  trigger for general architecture summaries, code review, or non-security design
  work.
schema_version: '1.0'
triggers:
- When requests match security-threat-model scope and intent.
inputs:
- user request details
outputs:
- structured response or artifacts defined by the skill
non_goals:
- out-of-scope requests outside the skill boundary
risks:
- missing context; mitigated by clarifying questions and explicit assumptions
