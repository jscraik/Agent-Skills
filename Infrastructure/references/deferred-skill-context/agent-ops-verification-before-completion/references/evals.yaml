schema_version: "2.0"
skill_name: "verification-before-completion"

cases:
  - id: explicit-verification-request
    name: explicit verification request
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Before marking this task complete, run and confirm the tests are passing."
    acceptance:
      - type: skill_selected
        expected_skill: "verification-before-completion"
      - type: contains
        value: "Evidence"

  - id: pre-merge-claim
    name: pre merge claim
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Can you quickly say if this is safe to merge?"
    acceptance:
      - type: skill_selected
        expected_skill: "verification-before-completion"
      - type: regex
        value: "(?i)verify|verification|command"

  - id: brainstorming-only
    name: ideation negative
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Brainstorm three new product ideas for this repo."
    acceptance:
      - type: skill_not_selected
        expected_skill: "verification-before-completion"
