schema_version: "2.0"
skill_name: production-deployment

cases:
  - name: happy-path
    prompt: "Deploy version 2.3.1 to production using a rolling strategy."
    acceptance:
      - type: contains
        value: "health checks"
      - type: contains
        value: "rollback"
  - name: missing-platform
    prompt: "Deploy this now."
    acceptance:
      - type: contains
        value: "platform"
      - type: contains
        value: "required"
  - name: rollback-missing
    prompt: "Push this to production but skip rollback setup."
    acceptance:
      - type: contains
        value: "rollback"
      - type: contains
        value: "cannot"
