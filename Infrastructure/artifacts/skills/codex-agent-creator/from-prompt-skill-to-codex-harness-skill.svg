<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From Prompt Skill to Codex Harness Skill</title>
  <desc id="desc">A professional engineering infographic mapping assumptions, vague prompting, hidden behaviour, fragile workflows, isolated skills, and AI markdown slop into evidence, governed execution, observable systems, validated orchestration, composable skills, and verified durable knowledge.</desc>
  <rect width="1600" height="900" fill="#0b0f14"/>
  <defs>
    <linearGradient id="flow" x1="180" y1="0" x2="1420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#566172"/>
      <stop offset="0.5" stop-color="#49a7a0"/>
      <stop offset="1" stop-color="#d6b35f"/>
    </linearGradient>
    <style>
      .title{fill:#f4f7fb;font:700 54px Inter,Arial,sans-serif;letter-spacing:0}
      .sub{fill:#a9b6c7;font:400 22px Inter,Arial,sans-serif;letter-spacing:0}
      .h{fill:#f4f7fb;font:700 25px Inter,Arial,sans-serif;letter-spacing:0}
      .label{fill:#dce5ef;font:600 18px Inter,Arial,sans-serif;letter-spacing:0}
      .small{fill:#aeb9c7;font:500 15px Inter,Arial,sans-serif;letter-spacing:0}
      .tiny{fill:#94a1b2;font:500 13px Inter,Arial,sans-serif;letter-spacing:0}
      .panel{fill:#121923;stroke:#2a3442;stroke-width:1.2;rx:8}
      .strong{fill:#111c24;stroke:#49a7a0;stroke-width:1.5;rx:8}
      .chip{fill:#172332;stroke:#324255;stroke-width:1;rx:6}
      .good{fill:#142822;stroke:#49a77c;stroke-width:1;rx:6}
      .warn{fill:#2b2414;stroke:#d6b35f;stroke-width:1;rx:6}
      .flow{stroke:url(#flow);stroke-width:7;fill:none;stroke-linecap:round}
      .dash{stroke:#3c4a5d;stroke-width:2;fill:none;stroke-dasharray:7 8}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d6b35f"/>
    </marker>
  </defs>
  <text x="80" y="86" class="title">From Prompt Skill -&gt; Codex Harness Skill</text>
  <text x="82" y="124" class="sub">Assumptions become evidence. Vague prompting becomes governed, observable, validated execution.</text>
  <rect x="80" y="175" width="350" height="560" class="panel"/>
  <text x="110" y="224" class="h">Prompt Skill</text>
  <text x="110" y="260" class="small">Fragile starting state</text>
  <rect x="110" y="305" width="290" height="48" class="chip"/><text x="130" y="335" class="label">Assumptions</text>
  <rect x="110" y="369" width="290" height="48" class="chip"/><text x="130" y="399" class="label">Vague prompting</text>
  <rect x="110" y="433" width="290" height="48" class="chip"/><text x="130" y="463" class="label">Hidden behaviour</text>
  <rect x="110" y="497" width="290" height="48" class="chip"/><text x="130" y="527" class="label">Fragile workflow</text>
  <rect x="110" y="561" width="290" height="48" class="chip"/><text x="130" y="591" class="label">Isolated skill</text>
  <rect x="110" y="625" width="290" height="48" class="chip"/><text x="130" y="655" class="label">AI markdown slop</text>
  <path d="M460 455 C570 455 590 455 700 455" class="flow" marker-end="url(#arrow)"/>
  <text x="505" y="420" class="label">first-principles gate</text>
  <text x="525" y="444" class="tiny">reject copied assumptions</text>
  <rect x="705" y="160" width="370" height="590" class="strong"/>
  <text x="735" y="209" class="h">Governed Conversion</text>
  <text x="735" y="244" class="small">Skill Factory + Codex harness</text>
  <rect x="735" y="286" width="145" height="44" class="good"/><text x="752" y="314" class="small">canonical source</text>
  <rect x="900" y="286" width="145" height="44" class="warn"/><text x="922" y="314" class="small">projection proof</text>
  <rect x="735" y="356" width="310" height="54" class="chip"/><text x="755" y="386" class="label">Agent-native contract</text><text x="755" y="407" class="tiny">boundaries - artifacts - failure mode</text>
  <rect x="735" y="430" width="310" height="54" class="chip"/><text x="755" y="460" class="label">Capability contract</text><text x="755" y="481" class="tiny">triggers - side effects - confirmations</text>
  <rect x="735" y="504" width="310" height="54" class="chip"/><text x="755" y="534" class="label">Rules and MCP boundaries</text><text x="755" y="555" class="tiny">sandbox - tools - approval gates</text>
  <rect x="735" y="578" width="310" height="54" class="chip"/><text x="755" y="608" class="label">Validation gates</text><text x="755" y="629" class="tiny">strict audit - smoke - release - lint</text>
  <rect x="735" y="652" width="310" height="54" class="chip"/><text x="755" y="682" class="label">Evidence artifacts</text><text x="755" y="703" class="tiny">traces - rollback - confidence basis</text>
  <path d="M1088 455 C1165 455 1190 455 1265 455" class="flow" marker-end="url(#arrow)"/>
  <text x="1132" y="420" class="label">deterministic checks</text>
  <text x="1120" y="444" class="tiny">observable orchestration</text>
  <rect x="1170" y="175" width="350" height="560" class="panel"/>
  <text x="1200" y="224" class="h">Codex Harness Skill</text>
  <text x="1200" y="260" class="small">Composable operating component</text>
  <rect x="1200" y="305" width="290" height="48" class="good"/><text x="1220" y="335" class="label">Evidence ledger</text>
  <rect x="1200" y="369" width="290" height="48" class="good"/><text x="1220" y="399" class="label">Governed execution</text>
  <rect x="1200" y="433" width="290" height="48" class="good"/><text x="1220" y="463" class="label">Observable systems</text>
  <rect x="1200" y="497" width="290" height="48" class="good"/><text x="1220" y="527" class="label">Validated orchestration</text>
  <rect x="1200" y="561" width="290" height="48" class="good"/><text x="1220" y="591" class="label">Composable skills</text>
  <rect x="1200" y="625" width="290" height="48" class="good"/><text x="1220" y="655" class="label">Durable knowledge</text>
  <path d="M190 760 H1410" class="dash"/>
  <text x="205" y="805" class="small">AGENTS.md</text><text x="330" y="805" class="small">hooks</text><text x="420" y="805" class="small">strict audit</text><text x="555" y="805" class="small">smoke evals</text><text x="695" y="805" class="small">release evals</text><text x="840" y="805" class="small">lint / spell / prose</text><text x="1045" y="805" class="small">rollback paths</text><text x="1230" y="805" class="small">human approval</text><text x="1400" y="805" class="small">confidence</text>
  <circle cx="215" cy="760" r="7" fill="#49a7a0"/><circle cx="350" cy="760" r="7" fill="#49a7a0"/><circle cx="455" cy="760" r="7" fill="#49a7a0"/><circle cx="600" cy="760" r="7" fill="#49a7a0"/><circle cx="735" cy="760" r="7" fill="#d6b35f"/><circle cx="910" cy="760" r="7" fill="#49a7a0"/><circle cx="1095" cy="760" r="7" fill="#49a7a0"/><circle cx="1275" cy="760" r="7" fill="#49a7a0"/><circle cx="1420" cy="760" r="7" fill="#d6b35f"/>
  <text x="80" y="860" class="tiny">No fake metrics: confidence rises only from named gates, runtime proof, deterministic checks, or repeated usage evidence.</text>
</svg>
