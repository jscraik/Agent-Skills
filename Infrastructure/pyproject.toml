[project]
name = "agent-skills-infrastructure"
version = "0.1.0"
description = "Infrastructure-only Python dependency environment for Agent Skills Kit validation and SDK contracts."
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.25,<5",
  "pydantic>=2.13,<3",
  "PyYAML>=6.0.2,<7",
  "skills-sdk @ git+https://github.com/jscraik/skills-sdk.git@5f38e978b93465a142a45a8773e05c808e3df81b",
]

[dependency-groups]
test = [
  "defusedxml>=0.7.1,<0.8",
  "pytest>=9.0.3,<10",
]
lint = [
  "ruff>=0.14,<0.15",
]

[tool.uv]
package = false
