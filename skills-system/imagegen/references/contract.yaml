schema_version: 1
name: imagegen
purpose: Generate or edit raster images for project assets or preview concepts.
triggers:
  - User asks to create a new bitmap image.
  - User asks to edit an existing image while preserving selected parts.
  - User needs multiple prompt-driven image variants for selection.
non_goals:
  - Replacing established vector/icon/logo systems in the repository.
  - Building deterministic code-native visuals in SVG/HTML/CSS/canvas.
risks:
  - Text rendering may drift from exact spelling or placement requirements.
  - Edit requests can unintentionally alter protected regions without explicit invariants.
  - Assets can be misplaced if final workspace destination is not confirmed.
description: Generate or edit raster images with built-in image tooling by default, with explicit CLI fallback only.
inputs:
  - name: request
    type: string
    description: User prompt describing desired image generation or edit.
  - name: source_images
    type: array
    items: string
    optional: true
    description: Attached image references or edit targets.
  - name: constraints
    type: array
    items: string
    optional: true
    description: Must-keep invariants, avoid list, and exact text constraints.
  - name: destination
    type: string
    optional: true
    description: Intended final path when the output is project-bound.
outputs:
  - name: image_paths
    type: array
    items: string
    description: Saved output image paths.
  - name: final_prompt
    type: string
    description: Final prompt specification used for the chosen output.
  - name: mode_used
    type: string
    description: "built-in or cli-fallback."
constraints:
  - Default to built-in `image_gen`; only use CLI when explicitly requested.
  - Never request raw API keys in chat or log secret values.
  - Preserve protected regions and listed invariants during edits.
  - Use non-destructive naming unless replacement is explicitly approved.
