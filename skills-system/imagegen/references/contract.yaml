schema_version: 1
purpose: Generate or edit raster images for project assets or preview concepts.
triggers:
  - User asks to create a new bitmap image.
  - User asks to edit an existing image while preserving selected parts.
  - User needs multiple prompt-driven image variants for selection.
inputs:
  - User request describing desired generation or edit outcome.
  - Optional source images used as references or edit targets.
  - Optional constraints such as preserved regions, avoid-list items, and exact text requirements.
  - Optional destination path when output must be persisted to the workspace.
outputs:
  - Final saved image path(s), or inline preview selection when output is exploratory.
  - Final prompt specification used for the selected output.
  - Mode disclosure indicating built-in image tool or explicit CLI fallback.
observability: "Record selected execution mode (built-in vs explicit CLI fallback), final asset path outcomes, and generate-vs-edit routing decisions for ambiguous requests."
rollback_procedure: "Revert changed skill files to the last passing commit and rerun strict audit plus family benchmark validation before promoting updates."
non_goals:
  - Replacing established vector/icon/logo systems in the repository.
  - Building deterministic code-native visuals in SVG/HTML/CSS/canvas.
risks:
  - Text rendering may drift from exact spelling or placement requirements.
  - Edit requests can unintentionally alter protected regions without explicit invariants.
  - Assets can be misplaced if final workspace destination is not confirmed.
