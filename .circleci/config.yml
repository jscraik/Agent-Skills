version: 2.1

jobs:
  pr-pipeline:
    docker:
      - image: cimg/node:24.13
    steps:
      - checkout
      - run:
          name: Ensure GH_TOKEN available
          command: |
            if [ -z "$GH_TOKEN" ]; then
              echo "⚠ GH_TOKEN not set — gh CLI steps may fail"
              echo "Add GH_TOKEN as a CircleCI project environment variable"
            else
              echo "✅ GH_TOKEN present"
            fi
      - run:
          name: Ensure SNYK_TOKEN available
          command: |
            export SNYK_TOKEN="${SNYK_TOKEN:-${SNYK_API_TOKEN:-}}"
            if [ -z "${SNYK_TOKEN:-}" ]; then
              # Detect sandboxed or forked PR contexts where secrets are unavailable
              if [ -n "${CODEX_SANDBOX_RUN:-}" ] || [ -n "${CI_PULL_REQUEST:-}" ]; then
                echo "⚠ SNYK_TOKEN/SNYK_API_TOKEN not available in sandboxed/forked context; skipping Snyk scan"
              else
                echo "❌ SNYK_TOKEN/SNYK_API_TOKEN not set; mandatory Snyk scan cannot run"
                echo "Add a Snyk API token as a CircleCI project environment variable"
                exit 1
              fi
            fi
      - run:
          name: Run Snyk scan (token-aware)
          command: |
            export SNYK_TOKEN="${SNYK_TOKEN:-${SNYK_API_TOKEN:-}}"

            restore_root_lockfile() {
              if [ -f /tmp/agent-skills-root-package-lock.json ]; then
                mv /tmp/agent-skills-root-package-lock.json package-lock.json
              fi
            }
            trap restore_root_lockfile EXIT
            if [ -f package-lock.json ] && [ ! -f package.json ]; then
              mv package-lock.json /tmp/agent-skills-root-package-lock.json
            fi

            set +e
            npm exec --yes -- snyk@1.1304.2 test \
              --severity-threshold=high \
              --all-projects \
              --detection-depth=6 \
              --exclude=node_modules,cache,artifacts,tmp
            SNYK_EXIT=$?
            set -e

            if [ "$SNYK_EXIT" -eq 1 ]; then
              echo "❌ Snyk reported high-or-above vulnerabilities"
              exit 1
            fi

            if [ "$SNYK_EXIT" -ne 0 ]; then
              echo "❌ Snyk exited with code $SNYK_EXIT (runtime/configuration error)"
              echo "See Snyk CLI output above for remediation details"
              exit "$SNYK_EXIT"
            else
              echo "✅ Snyk scan passed"
            fi
      - run:
          name: Validate Repository
          command: |
            python3 Infrastructure/scripts/lifecycle-and-sync/diagnose_skill.py --all

workflows:
  pr-pipeline:
    jobs:
      - pr-pipeline
