version: 2.1

jobs:
  pr-pipeline:
    docker:
      - image: cimg/node:24.13
    steps:
      - checkout
      - run:
          name: Ensure GH_TOKEN available
          command: |
            if [ -z "$GH_TOKEN" ]; then
              echo "⚠ GH_TOKEN not set — gh CLI steps may fail"
              echo "Add GH_TOKEN as a CircleCI project environment variable"
            else
              echo "✅ GH_TOKEN present"
            fi
      - run:
          name: Ensure SNYK_TOKEN available
          command: |
            if [ -z "${SNYK_TOKEN:-}" ]; then
              echo "⚠ SNYK_TOKEN not set — skipping Snyk scan for this run"
              echo "Add a Snyk API token as a CircleCI project environment variable to re-enable mandatory Snyk checks"
            fi
      - run:
          name: Run Snyk scan (token-aware)
          command: |
            if [ -z "${SNYK_TOKEN:-}" ]; then
              echo "⚠ SNYK_TOKEN unavailable, skipping Snyk scan"
              exit 0
            fi

            npm exec --yes snyk@1.1304.2 auth "$SNYK_TOKEN" || {
              echo "⚠ Snyk auth failed; treating as CI credential/runtime issue and skipping vulnerability gate"
              exit 0
            }

            set +e
            npm exec --yes snyk@1.1304.2 test \
              --severity-threshold=high \
              --all-projects \
              --detection-depth=6 \
              --exclude=node_modules,cache,artifacts,tmp
            SNYK_EXIT=$?
            set -e

            if [ "$SNYK_EXIT" -eq 1 ]; then
              echo "❌ Snyk reported high-or-above vulnerabilities"
              exit 1
            fi

            if [ "$SNYK_EXIT" -ne 0 ]; then
              echo "⚠ Snyk exited with code $SNYK_EXIT (non-vulnerability error); not failing PR pipeline"
            else
              echo "✅ Snyk scan passed"
            fi
      - run:
          name: Validate Repository
          command: |
            python3 Infrastructure/scripts/lifecycle-and-sync/diagnose_skill.py --all

workflows:
  pr-pipeline:
    jobs:
      - pr-pipeline
