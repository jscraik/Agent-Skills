version: 2.1

orbs:
  snyk: snyk/snyk@2.3.0

jobs:
  pr-pipeline:
    docker:
      - image: cimg/node:24.13
    steps:
      - checkout
      - run:
          name: Ensure GH_TOKEN available
          command: |
            if [ -z "$GH_TOKEN" ]; then
              echo "⚠ GH_TOKEN not set — gh CLI steps may fail"
              echo "Add GH_TOKEN as a CircleCI project environment variable"
            else
              echo "✅ GH_TOKEN present"
            fi
      - run:
          name: Ensure SNYK_TOKEN available
          command: |
            if [ -z "${SNYK_TOKEN:-}" ]; then
              echo "❌ SNYK_TOKEN not set — add a Snyk API token as a CircleCI project environment variable"
              exit 1
            fi
            echo "✅ SNYK_TOKEN present"
      - run:
          name: Install Snyk CLI
          command: |
            curl -fsSL --compressed --retry 6 --retry-all-errors \
              https://static.snyk.io/cli/latest/snyk-linux -o /tmp/snyk
            curl -fsSL --compressed --retry 6 --retry-all-errors \
              https://static.snyk.io/cli/latest/snyk-linux.sha256 -o /tmp/snyk.sha256
            (cd /tmp && sha256sum -c snyk.sha256)
            sudo install -m 0755 /tmp/snyk /usr/local/bin/snyk
            snyk config set disableSuggestions=true
      - run:
          name: Run Snyk
          command: |
            snyk test \
              --severity-threshold=high \
              --all-projects \
              --detection-depth=6 \
              --exclude=node_modules,cache,artifacts,tmp
      - run:
          name: Validate Repository
          command: |
            python3 Infrastructure/scripts/lifecycle-and-sync/diagnose_skill.py --all

workflows:
  pr-pipeline:
    jobs:
      - pr-pipeline
