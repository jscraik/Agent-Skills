schema_version: 1
name: code-review
purpose: Run and interpret CodeRabbit CLI review results with severity-prioritized actions and optional iterative fix loops.
triggers:
  - User requests CodeRabbit code review or quality/security check.
  - User asks for CodeRabbit review in autonomous implement-review-fix workflow.
inputs:
  - name: change_scope
    type: enum
    values: [all, committed, uncommitted]
    description: Diff scope for CodeRabbit review.
  - name: base_reference
    type: string
    description: Optional base branch or commit for comparison.
  - name: output_mode
    type: enum
    values: [prompt-only, plain]
    description: Review output format.
  - name: auth_state
    type: string
    description: Result of CodeRabbit auth status check.
outputs:
  - name: schema_version
    type: integer
    description: Output envelope schema version (always 1).
  - name: summary
    type: string
    description: High-level review outcome summary.
  - name: findings
    type: object
    description: Severity-keyed findings map where each severity contains an array of finding entries.
    properties:
      critical:
        type: array
        items:
          type: string
      warning:
        type: array
        items:
          type: string
      info:
        type: array
        items:
          type: string
  - name: actions
    type: array
    description: Prioritized tasks for critical and warning issues.
  - name: validation
    type: array
    description: Validation commands and outcomes (pass, fail, blocked).
  - name: risk_note
    type: string
    description: Key risks, caveats, or unresolved blockers.
  - name: next_step
    type: string
    description: Safest immediate follow-up action.
  - name: rerun_status
    type: string
    description: Outcome after iterative fix and rerun cycle.
success_criteria:
  - Review command matches requested scope and mode.
  - Critical/warning findings are surfaced before informational notes.
  - Safety constraints and redaction are enforced in summaries.
non_goals:
  - Direct mutation of CodeRabbit SaaS account state.
  - Non-CodeRabbit generic architecture reviews.
risks:
  - False confidence when review is run against the wrong diff scope.
  - Sensitive data leakage if review summaries include raw secrets.
execution_primitives:
  - python3 plugins/coderabbit/skills/code-review/scripts/parse_plain_review.py --input <file-or-stdin>
