schema_version: 1
name: simplify
purpose: Review changed code for reuse, quality, efficiency, and behavior-preserving refactor polish.
triggers:
  - user asks to simplify or clean up changed files before merge
  - user asks for a refactor polish pass on an existing diff
  - user asks to extract methods, improve naming, or remove code smells in changed code
  - user asks for duplication, quality, and efficiency improvements without feature expansion
inputs:
  - name: diff_source
    type: enum
    values: [staged, unstaged, fallback-files]
    description: Source of changes under review.
  - name: changed_files
    type: array
    description: Changed file paths and nearby code context.
  - name: focus_areas
    type: array
    description: Optional user-prioritized areas.
outputs:
  - name: schema_version
    type: integer
    description: Output envelope schema version (always 1).
  - name: summary
    type: string
    description: High-level cleanup outcome summary.
  - name: execution_mode
    type: string
    description: inline|delegated-parallel|delegated-serial.
  - name: files_reviewed
    type: array
    description: Reviewed file list.
  - name: actions
    type: array
    description: Applied findings grouped by lane.
  - name: skipped
    type: array
    description: Skipped findings with concise reason.
  - name: validation
    type: array
    description: Validation commands and outcomes (pass, fail, blocked).
  - name: risk_note
    type: string
    description: Key caveats or residual risks.
  - name: next_step
    type: string
    description: Safest immediate follow-up action.
success_criteria:
  - Output always includes the standard envelope keys: schema_version, summary, execution_mode, files_reviewed, actions, skipped, validation, risk_note, next_step.
  - Cleanup remains behavior-preserving unless user explicitly requests semantic changes.
  - Reuse, quality, and efficiency lanes are each evaluated.
  - Validation evidence is deterministic and command-specific.
non_goals:
  - introducing new product features unrelated to current diffs
  - broad architecture rewrites outside changed scope
  - speculative optimization with no concrete signal
risks:
  - behavior drift from aggressive refactors
  - false positives from static-only review
  - cleanup churn that harms readability
rollback_procedure: >
  If simplify edits introduce regressions, revert only simplify-touched files, rerun targeted
  checks, and reapply fixes incrementally in smaller batches while preserving finding traceability.
observability: >
  Track diff source, lane findings, applied versus skipped fixes, and post-fix validation outcomes.
  When modern hardening is active, also track compare base, risk tiers, and cross-cutting findings.
