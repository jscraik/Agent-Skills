schema_version: 1

purpose: >
  Run the planning stage of the compound-engineering workflow so the user gets an
  execution-ready implementation plan with stable IDs, traceability, validation,
  rollout guidance, and mode-aware UI planning when relevant.

triggers:
  - the user wants to turn a spec, brainstorm, bug report, or feature description into an implementation plan
  - the user wants the compound-engineering planning stage explicitly
  - the user wants a UI implementation plan or a UI-aware delivery plan
  - the user needs sequencing, test strategy, acceptance criteria, or rollout guidance before implementation

inputs:
  - a spec path, brainstorm path, UI spec path, or clear planning source
  - relevant constraints, success criteria, risks, and linked documents when available
  - optional framework, design-system, rollout, and testing context

outputs:
  - a plan-mode choice such as generic-plan, standard-plan, ui-enhanced-plan, or dedicated-ui-plan
  - a written plan artifact with stable phase and acceptance IDs
  - exact parallel research support via `repo-research-analyst`, `learnings-researcher`, and conditional external-research roles when needed
  - explicit validation, rollout, and execution-control guidance
  - carry-forward treatment of any authoritative requirements doc or existing plan when present
  - optional directional technical-design sketches only when they materially reduce planning ambiguity
  - a recommended next workflow stage, including a tracker-workflow handoff path (default `gh-workflow`) when the user wants issue creation

non_goals:
  - direct implementation
  - inventing contract-level behavior that belongs in a spec or UI spec
  - skipping the spec step when the source indicates planning is premature
  - producing UI prototypes during the planning stage
  - mutating tracker state directly from the planning skill instead of handing off to a dedicated tracker workflow

risks:
  - planning from weak inputs; mitigate with authoritative-source selection and one focused blocker question
  - silently dropping requirements-doc content or prior plan context; mitigate with explicit source carry-forward and validation
  - inventing behavior; mitigate with spec-first and UI-spec-first rules plus traceability checks
  - shallow plans without repo grounding; mitigate with bounded parallel subagent research
  - under-scoping a plan that touches external contract surfaces; mitigate with post-research reclassification from lightweight to standard when env vars, exported APIs, CI, shared types, or external docs are affected
  - mixing planning with execution-time unknowns; mitigate with deferred-implementation notes and directional-only technical-design guidance
  - UI ambiguity causing execution churn; mitigate with explicit mode selection, prototype-planning rules, and prototype-to-production mapping
  - plan/state drift during execution; mitigate with the Execution Ledger and planning-mode handshake
