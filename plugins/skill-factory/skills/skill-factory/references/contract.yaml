schema_version: "1.0"
purpose: "Route broad skill-authoring requests to the correct Skill Factory lane before execution."
triggers:
  - user asks generally for help with creating, improving, installing, or skillifying a skill
  - user request mixes multiple lanes and needs explicit routing
inputs:
  - primary intent or best-guess intent candidate
  - key constraints (security, portability, policy)
  - artifact/source path details when present
outputs:
  - selected lane (`create|improve|install|skillify`)
  - explicit downstream skill handoff
  - missing inputs list when blocked
non_goals:
  - do not run lane-specific scripts from the router
  - do not perform destructive actions
risks:
  - misrouting due to ambiguous intent, mitigated by one direct clarification question
  - partial handoff context, mitigated by explicit required_inputs list
rollback_procedure: >
  If routing is incorrect, stop execution, restate the ambiguity, ask one clarification,
  and hand off to the corrected lane without applying lane-specific changes from the prior route.
observability: >
  Track routing quality by lane-selection accuracy, count of clarification-needed requests,
  and downstream corrections requested by users.
