schema_version: "1.1"
purpose: >
  Define the starter-authoring contract for skill-creator so first-pass skill
  scaffolds are consistent, handoff-ready, and bounded to creation-stage ownership.
triggers:
  - user asks to create a new Codex skill from scratch
  - user asks to finish a just-created skill scaffold
  - user requests starter authoring before lifecycle hardening
  - user asks to inject or attach custom-agent roles while creating/updating a skill
inputs:
  - skill objective and intended user outcomes
  - target category and boundaries
  - example trigger and non-trigger prompts
  - required resources (scripts, references, assets) if known
  - optional agent injection mode (`reuse-existing` from `/Users/jamiecraik/dev/configs/codex/agents` or `create-purpose-built` via `codex-agent-builder`)
outputs:
  - first-pass SKILL.md scaffold with valid frontmatter and routing description
  - starter resource layout (agents, references, scripts, assets) when needed
  - creator-to-builder handoff artifact for non-trivial work
  - optional agent-injection summary with validated role file path
non_goals:
  - deep lifecycle hardening or benchmarking for existing mature skills
  - install/distribute execution tasks
  - plugin packaging ownership
risks:
  - overscoped starter drafts; mitigated by explicit scaffold boundary and handoff
  - routing ambiguity; mitigated by trigger and non-trigger examples
  - missing safety posture; mitigated by mandatory validation and handoff notes
  - role mismatch during injection; mitigated by role-file validation and explicit reuse/create mode
rollback_procedure: >
  If skill-creator produces an invalid scaffold (malformed frontmatter, missing required sections,
  or incorrect handoff artifact), discard the generated SKILL.md and re-invoke with an explicit
  mode=create prompt. For regressions in the skill itself, restore the previous
  skills-system/skill-creator/SKILL.md from git and revalidate with the family gate before
  re-deploying. Incomplete scaffolds should be handed off to skill-builder for repair rather than
  left in a broken state.
observability: >
  Monitor skill-creator via: (1) quick_validate.py pass rate on generated scaffolds — any
  FAIL on FM_NAME_MISSING or FM_DESC_MISSING indicates scaffold regression; (2) handoff artifact
  presence in creator-generated output — missing handoff notes signal scope boundary drift;
  (3) family gate CI results for skills-system/skill-creator; (4) downstream skill-builder
  rejection rate on creator-originated scaffolds as a quality proxy.
