schema_version: "1.1"
purpose: >
  Define the install-stage contract for plugin-installer so third-party plugins are
  imported with trusted provenance, staged validation, and atomic rollback-safe activation.
triggers:
  - user asks to install a Codex plugin from GitHub
  - user asks to verify installed plugin integrity before activation
  - user asks to restore missing plugin visibility via reinstall
  - user asks to wire plugin installs to existing or purpose-built custom-agent roles
inputs:
  - source repository and plugin path
  - pinned ref or explicit unpinned override
  - trust policy (allowlist default with optional explicit override)
  - destination plugin root
  - validation policy strict|compat
  - optional role injection mode and candidate role path
outputs:
  - installed plugin under <destination root>/<plugin-name>
  - provenance manifest with source ref, resolved commit, destination-root-relative install path, trust_policy, trust_overridden, and pin_overridden
  - rollback journal with staged and promoted install events relative to the destination root, including trust_overridden and pin_overridden on staged/promoted events
  - optional role-injection outcome with validated role file path and reuse/create mode
non_goals:
  - plugin package conversion or hardening workflows
  - standalone skill authoring/hardening
  - bypassing trust and provenance checks silently
risks:
  - supply-chain drift from moving refs; mitigated by pinning policy
  - partial activation failures; mitigated by quarantine-to-promote and rollback
  - weak traceability; mitigated by persisted manifest and journal artifacts
  - activating plugins with incorrect role mapping; mitigated by explicit role-source checks and codex-agent-builder validation scripts
rollback_procedure: >
  If an install produces an unusable plugin, use the rollback journal to identify
  promoted directories, remove them from the configured destination root, and reinstall from the
  previous pinned ref. Preserve trust_policy/override metadata in the recovery record and never
  skip quarantine validation during recovery.
observability: >
  Monitor plugin-installer via provenance manifest presence, quarantine-to-promote
  success rate, validator pass rate, and rollback frequency.
