schema_version: "1.1"
purpose: >
  Define the scaffold contract for plugin-creator so plugin skeletons and optional
  marketplace entries are generated with consistent policy-safe defaults.
triggers:
  - user asks to scaffold a new Codex plugin directory
  - user asks to create optional plugin companion folders/files
  - user asks to create or update local marketplace entries for plugin visibility
inputs:
  - plugin name and desired parent path
  - local scope choice (repo-local or home-local)
  - optional folders and metadata overrides
  - marketplace update intent
outputs:
  - normalized plugin folder with required .codex-plugin/plugin.json
  - optional folders/files requested by flags
  - marketplace entry with required policy and category fields when enabled
non_goals:
  - authoring lifecycle hardening for bundled skills
  - installing remote skills from curated/github sources
  - bypassing required plugin manifest structure
risks:
  - malformed plugin metadata; mitigated by deterministic scaffold defaults
  - marketplace policy drift; mitigated by required explicit policy fields
  - accidental overwrite; mitigated by force-only replacement semantics
rollback_procedure: >
  If plugin-creator generates a malformed scaffold (invalid plugin.json, missing required policy
  fields, or incorrect directory structure), delete the generated plugin directory and re-invoke
  with corrected inputs. Validate the scaffold with: python utilities/skill-builder/scripts/skill_gate.py
  <plugin-dir> --format text before use. For regressions in the skill itself, restore
  skills-system/plugin-creator/SKILL.md from git, re-run the family gate, and confirm
  plugin.json schema compliance before re-deploying.
observability: >
  Monitor plugin-creator via: (1) plugin.json schema compliance on generated scaffolds —
  missing required_policy fields are a scaffold regression signal; (2) marketplace entry
  completeness (policy and category fields present) after each generation run; (3) family gate
  CI pass/fail for skills-system/plugin-creator; (4) accidental overwrite incidents logged
  via force-flag usage frequency — high frequency suggests caller confusion that warrants
  improved trigger discrimination.
