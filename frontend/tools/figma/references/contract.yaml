purpose: >
  Define canonical Figma MCP workflow behavior for setup, extraction, implementation, and troubleshooting modes.
schema_version: 1.0
triggers:
  - user provides Figma URL/node ID or asks for Figma design-to-code or MCP setup/troubleshooting
inputs:
  - figma link or node selection context
  - desired mode (setup, extract_context, implement_design, troubleshoot)
outputs:
  - mode-specific workflow result and validated next steps
non_goals:
  - implementing product logic unrelated to Figma design translation
risks:
  - incomplete context or MCP connectivity failures; mitigated by fail-fast prerequisite checks
