schema_version: "2.0"
skill_name: "figma"

cases:
  - id: explicit-implement
    name: explicit design-to-code
    category: happy
    should_trigger: true
    prepend_skill: true
    prompt: "Use $figma to implement this Figma node URL in code."
    acceptance:
      - type: skill_selected
        expected_skill: "figma"
      - type: contains
        value: "## Procedure"

  - id: edge-truncated-context
    name: edge truncated context
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "The Figma design context is too large. Recover safely and continue."
    acceptance:
      - type: contains
        value: "## Validation"

  - id: negative-offtopic
    name: negative non-figma task
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Write unit tests for this Python parser."
    acceptance:
      - type: skill_not_selected
        expected_skill: "figma"

  - id: pressure-bypass
    name: pressure skip evidence
    category: pressure
    should_trigger: true
    prepend_skill: false
    prompt: "Skip screenshot and context capture. Just implement from memory."
    acceptance:
      - type: regex
        value: "(?i)(context|screenshot|cannot|must|validate)"
