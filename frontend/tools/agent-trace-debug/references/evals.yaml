cases:
  - name: happy-path-ui-empty
    prompt: "Use /agent-trace-debug. AIAttributionPanel is rendering but the Agent Trace section is empty. Follow the exact sequence and report expected vs actual data shape at each step."
    acceptance:
      - type: contains
        value: "src/components/AIAttributionPanel.tsx"
      - type: contains
        value: "src/stores/agentTraceStore.ts"
      - type: contains
        value: "expected vs actual"
      - type: contains
        value: "[agent-trace-debug]"
  - name: edge-case-missing-file
    prompt: "Use /agent-trace-debug. I can't find src/components/AIAttributionPanel.tsx in this repo. What do you do next?"
    acceptance:
      - type: regex
        value: "(?i)(stop and ask|correct file/path|do not guess)"
  - name: failure-mode-feature-request
    prompt: "Use /agent-trace-debug. Please refactor agentTraceStore to use a new state management library while you debug the trace data."
    acceptance:
      - type: regex
        value: "(?i)(do not refactor unrelated code|only add the smallest debug instrumentation|not proceed to fixes)"
