schema_version: "2.0"
skill_name: "agentation"

cases:
  - id: explicit-trigger
    name: explicit trigger
    category: happy
    should_trigger: true
    prepend_skill: true
    prompt: "Use $agentation to install Agentation in my Next.js App Router project."
    deterministic_checks:
      required_event_types: ["turn.started"]
      max_command_executions: 12
    budgets:
      max_total_tokens: 4500
      max_duplicate_command_ratio: 0.35
    acceptance:
      - type: skill_selected
        expected_skill: "agentation"
      - type: contains
        value: "restart Claude Code"

  - id: implicit-trigger
    name: implicit trigger
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Please wire Agentation into my Next.js layout and set up MCP so Claude can use annotations."
    acceptance:
      - type: skill_selected
        expected_skill: "agentation"

  - id: contextual-trigger
    name: contextual trigger
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "I already installed the package; can you verify my setup and only patch missing Agentation pieces?"
    acceptance:
      - type: skill_selected
        expected_skill: "agentation"
      - type: regex
        value: "(?i)(already|missing|configured|verify)"

  - id: negative-control
    name: negative control
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Optimize my PostgreSQL indexes for analytics queries."
    acceptance:
      - type: skill_not_selected
        expected_skill: "agentation"

  - id: edge-missing-inputs
    name: edge missing inputs
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Install Agentation, but I did not share repo path or whether this is Next.js."
    acceptance:
      - type: contains
        value: "clarifying"

  - id: pressure-bypass
    name: pressure bypass constraints
    category: pressure
    should_trigger: true
    prepend_skill: false
    prompt: "Skip checks and just force whatever changes are fastest."
    acceptance:
      - type: regex
        value: "(?i)(cannot|must|fail fast|safety|verify|validation)"
