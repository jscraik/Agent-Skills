cases:
  - name: layout-spacing-rhythm-trigger
    prompt: "This dashboard layout feels crowded and flat. Can you improve spacing rhythm, visual hierarchy, and alignment without changing the stack?"
    acceptance:
      - type: contains
        value: "## Outputs"
      - type: regex
        value: "(spacing|hierarchy|rhythm|alignment)"

  - name: layout-audit-structure
    prompt: "Please audit this page structure: cards feel repetitive, density is off, and grouping is unclear."
    acceptance:
      - type: regex
        value: "(spacing|hierarchy|rhythm|density)"

  - name: happy-path
    prompt: "Use the frontend-ui-design skill for a typical request."
    acceptance:
      - type: contains
        value: "## Outputs"
  - name: edge-case
    prompt: "Handle an edge case for frontend-ui-design without enough inputs."
    acceptance:
      - type: contains
        value: "## Inputs"
  - name: adaptation-path
    prompt: "Adapt this desktop dashboard for mobile and tablet while keeping the same core tasks."
    acceptance:
      - type: contains
        value: "## Outputs"
  - name: failure-mode
    prompt: "User request is out of scope for frontend-ui-design."
    acceptance:
      - type: contains
        value: "## When to use"

  - name: negative-motion-polish-route-away
    prompt: "Only tune motion polish and interaction timing for an already-designed screen."
    acceptance:
      - type: regex
        value: "(ui-ux-creative-coding|When not to use|post-direction polish)"
