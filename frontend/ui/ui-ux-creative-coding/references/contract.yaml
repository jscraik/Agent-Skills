purpose: >
  Define expected behavior and outputs for the ui-ux-creative-coding skill,
  including intertwined and separate persona composition modes.
schema_version: 1.4
triggers:
  - user requests UI/UX direction plus implementation-ready delivery artifacts
  - user asks for motion polish, micro-interactions, or creative coding accents in UI
  - user asks to apply one or more personas (benjitaylor, jh3yy, jenny_wen, emilkowalski, kubadesign)
  - user asks for component benchmarking/references (component.gallery or equivalent)
  - user explicitly opts into a style profile overlay (for example design-taste-frontend)
inputs:
  - product brief or target workflow
  - platform and stack constraints
  - existing assets, tokens, and references
  - acceptance criteria and required checks
  - optional overlay selection and whether strict enforcement is required
outputs:
  - UI brief and user-model summary
  - component/system plan and motion rules
  - implementation-ready plan with concrete next steps
  - validation checklist and handoff artifacts
  - component benchmark rationale when requested
  - overlay summary when enabled (active dials + enforced guardrails)
  - persona-specific constraints on motion intensity or default behavior when requested
response_format:
  headings_order:
    - "## When to use"
    - "## Inputs"
    - "## Outputs"
  notes:
    - Always include the three headings in this order.
    - Keep concise by default; cap at <=12 bullets when explicitly asked for concise output.
persona_modes:
  default: intertwined
  supported:
    - intertwined
    - separate
persona_markers:
  benjitaylor: "@benjitaylor — references/benjitaylor-persona.md"
  jh3yy: "@jh3yy — references/jhey-tompkins-persona.md 🧑‍🍳"
  jenny_wen: "@jenny_wen — references/jenny_wen-persona.md — clarity over process"
  emilkowalski: "@emilkowalski — references/emilkowalski-persona.md"
  kubadesign: "@kubadesign — references/kubadesign-persona.md — conversion-first visual direction"
output_rules:
  - Do not omit required headings.
  - If persona guidance is requested, first Outputs bullet(s) must contain requested persona marker(s).
  - For multi-persona requests, include each selected marker once in requested order.
  - If a style overlay is requested, include active dial values or explicit user overrides.
  - If component benchmarking is requested, include source comparison rationale.
  - If `@emilkowalski` guidance is requested, include at least one explicit note about motion frequency, reduced-motion/default behavior, or interaction interruptibility.
non_goals:
  - brand-only work without UI deliverables
  - full WebGL apps or games unless explicitly requested
risks:
  - missing inputs; mitigate with minimal clarifying questions
  - over-animation; mitigate with reduced-motion and performance gates
  - pattern cargo-culting from references; mitigate with adaptation rationale
  - persona drift; mitigate by keeping persona-specific rules concrete and behavior-oriented
