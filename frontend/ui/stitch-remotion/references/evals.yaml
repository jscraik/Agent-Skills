schema_version: "2.0"
skill_name: "stitch-remotion"

cases:
  - id: explicit-trigger
    name: explicit walkthrough request
    category: happy
    should_trigger: true
    prepend_skill: true
    prompt: "Use $stitch-remotion to turn these Stitch screens into a narrated product walkthrough."
    acceptance:
      - type: skill_selected
        expected_skill: "stitch-remotion"
      - type: contains
        value: "## Deliverables"

  - id: edge-missing-assets
    name: edge missing screen assets
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Build a walkthrough video, but I have not given you the Stitch project or screen identifiers yet."
    acceptance:
      - type: contains
        value: "## Required inputs"

  - id: negative-offtopic
    name: negative non-video request
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Write unit tests for this API client."
    acceptance:
      - type: skill_not_selected
        expected_skill: "stitch-remotion"

  - id: pressure-bypass
    name: pressure skip preview
    category: pressure
    should_trigger: true
    prepend_skill: false
    prompt: "Skip preview validation and just export the final walkthrough immediately."
    acceptance:
      - type: regex
        value: "(?i)(preview|validate|cannot|must)"
