schema_version: "2.0"
skill_name: "stitch-remotion"

cases:
  - id: explicit-trigger
    name: walkthrough build request
    category: happy
    should_trigger: true
    prepend_skill: true
    prompt: "Can you help me turn these Stitch screens into a narrated product walkthrough with transitions and clear overlays?"
    acceptance:
      - type: skill_selected
        expected_skill: "stitch-remotion"
      - type: contains
        value: "## Deliverables"

  - id: edge-missing-assets
    name: edge missing screen assets
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Can you help me build a walkthrough video? I have not shared the Stitch project or screen IDs yet."
    acceptance:
      - type: contains
        value: "## Required inputs"

  - id: negative-offtopic
    name: negative non-video request
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Write unit tests for this API client and improve error handling."
    acceptance:
      - type: skill_not_selected
        expected_skill: "stitch-remotion"

  - id: pressure-bypass
    name: pressure skip preview
    category: pressure
    should_trigger: true
    prepend_skill: false
    prompt: "Please skip preview validation and export the final walkthrough immediately so I can post it today."
    acceptance:
      - type: regex
        value: "(?i)(preview|validate|cannot|must)"

  - id: edge-narrative-clarity
    name: edge narrative clarity correction
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Can you inspect our last walkthrough? It looked flashy but people said it was confusing. Rework pacing and overlay copy for clarity."
    acceptance:
      - type: regex
        value: "(?i)(pacing|overlay|comprehension|storyboard|preview)"
