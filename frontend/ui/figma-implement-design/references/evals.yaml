cases:
  - name: happy-path-alias-routing
    prompt: "Use figma-implement-design for this Figma URL."
    acceptance:
      - type: contains
        value: "figma"
  - name: edge-case-mode-check
    prompt: "Invoke figma-implement-design and verify mode handoff."
    acceptance:
      - type: contains
        value: "implement_design"
  - name: failure-mode-loop-prevention
    prompt: "Ensure figma-implement-design does not self-route recursively."
    acceptance:
      - type: contains
        value: "no circular route"
