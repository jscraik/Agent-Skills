purpose: Interface Craft helps design and refine high-quality interfaces through storyboarded
  motion, live tuning controls, critique workflows, conceptual range/depth thinking,
  concern-focused prototyping, reverse-engineering practice, and industry-standard benchmarking.
schema_version: '1.1'
triggers:
- Build or refactor staged motion animation in React/Motion.
- Add live parameter tuning with DialKit.
- Critique and refine UI quality with concrete observations.
- Explore structurally different concept directions before implementation.
- Push one selected concept to higher quality through iterative depth.
- Isolate one design concern with minimal-fidelity prototypes.
- Recreate inspiring interactions to learn underlying techniques.
- Benchmark against platform/category industry standards.
inputs:
- user request details
- screenshots, code snippets, or file paths when available
- stated quality goals or facets (optional)
outputs:
- storyboarded animation structure and config constants
- copy-paste DialKit config + usage
- structured critique report with ranked opportunities
- conceptual range options and recommendation
- conceptual depth iteration plan and validation signals
- concern-isolated prototype plan
- industry baseline gap analysis
non_goals:
- unrelated backend/system requests with no interface craft component
- generic implementation work that does not require this framework
risks:
- missing visual context; mitigated by labeling inferred vs observed findings
- premature optimization without range/depth checks; mitigated by workflow sequencing
