schema_version: "2.0"
skill_name: "interface-craft"

cases:
  - id: explicit-trigger
    name: explicit trigger
    category: happy
    should_trigger: true
    prepend_skill: true
    prompt: "Use $interface-craft to improve this interaction design."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"

  - id: storyboard-transition
    name: storyboard transition sequence
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Create a page transition where old content fades out, then the new content slides up with staggered children. Use storyboard sequencing and add controls for timing."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(storyboard|timing|stage|stagger)"

  - id: dialkit-toast
    name: dialkit toast tuning
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Build a notification toast sliding from the top and add DialKit controls for spring, opacity, and vertical offset."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(dialkit|spring|opacity|offset)"

  - id: critique-settings
    name: settings page critique
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Review this settings page for hierarchy, spacing, color usage, and interaction quality."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(noticing|hierarchy|spacing|interaction|opportunit)"

  - id: conceptual-range-trigger
    name: conceptual range trigger
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "I think we are over-committed to one UX idea. Give me 3 structurally different directions first."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(structurally different|range|directions)"

  - id: conceptual-depth-trigger
    name: conceptual depth trigger
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "This slider works, but it's only level 3 quality. Push it to level 8 with an iteration plan."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(level|iteration|depth|uncommon care)"

  - id: recreate-trigger
    name: recreate interaction trigger
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "I saw a genie-like minimize animation. Help me recreate it quickly to learn the technique."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(recreate|learning objective|playground|iterate)"

  - id: coding-tech-baseline
    name: coding baseline guidance
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Refactor this React menu with compound components, CSS variable theming, and DialKit spring controls."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(compound component|css variable|dialkit|spring|visualduration|bounce)"

  - id: critique-accessibility-order
    name: critique order includes a11y gates
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Use interface craft to critique this interaction with keyboard and reduced-motion checks first-class."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(keyboard|aria|tabindex|reduced-motion|prefers-reduced-motion)"

  - id: repo-anchored-guidance
    name: repo anchored josh implementation guidance
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Strengthen this UI guidance using concrete patterns from Pasito, DialKit, and Bloom."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(pasito|dialkit|bloom)"
      - type: regex
        value: "(?i)(css variable|compound|spring|morph|useautoplay|usedialkit)"

  - id: critique-repo-grounding
    name: critique references project patterns
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Critique this UI interaction and include concrete improvements grounded in Bloom and DialKit patterns."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(bloom|dialkit)"
      - type: regex
        value: "(?i)(compound|openchange|spring|anchor|morph)"
      - type: regex
        value: "(?i)(repo pattern to borrow|source:)"

  - id: depth-repo-grounding
    name: depth iteration references pasito style architecture
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Push this component from level 4 to 8 and use Pasito-style CSS variable theming and hook extraction guidance."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(pasito|css variable|hook|reduced-motion|theme)"
      - type: regex
        value: "(?i)(repo pattern to borrow|apply in next pass|source:)"

  - id: range-repo-grounding
    name: conceptual range references project patterns
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Give me three structurally different UI directions and ground one in Bloom morphing, one in DialKit tuning, and one in Pasito-style minimal theming."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(bloom|dialkit|pasito)"
      - type: regex
        value: "(?i)(structurally different|direction|tradeoff)"
      - type: regex
        value: "(?i)(repo pattern to borrow|prototype first|source:)"

  - id: component-gallery-reference
    name: component gallery benchmark usage
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Use interface-craft to benchmark this component against https://component.gallery and suggest adapted improvements."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(component\\.gallery|component gallery)"
      - type: regex
        value: "(?i)(adapt|borrow|pattern|benchmark|reference notes)"

  - id: negative-backend-control
    name: negative backend control
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Optimize my Postgres query planner and add Redis caching for API throughput."
    acceptance:
      - type: skill_not_selected
        expected_skill: "interface-craft"

  - id: pressure-shortcut
    name: pressure shortcut
    category: pressure
    should_trigger: true
    prepend_skill: false
    prompt: "Skip critique, skip baseline checks, and just ship the visual tweaks."
    acceptance:
      - type: regex
        value: "(?i)(cannot|must|baseline|check|critique|skip)"
