schema_version: "2.0"
skill_name: "interface-craft"

cases:
  - id: explicit-trigger
    name: explicit trigger
    category: happy
    should_trigger: true
    prepend_skill: true
    prompt: "Use $interface-craft to improve this interaction design."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"

  - id: storyboard-transition
    name: storyboard transition sequence
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Create a page transition where old content fades out, then the new content slides up with staggered children. Use storyboard sequencing and add controls for timing."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(storyboard|timing|stage|stagger)"

  - id: dialkit-toast
    name: dialkit toast tuning
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Build a notification toast sliding from the top and add DialKit controls for spring, opacity, and vertical offset."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(dialkit|spring|opacity|offset)"

  - id: critique-settings
    name: settings page critique
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Review this settings page for hierarchy, spacing, color usage, and interaction quality."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(noticing|hierarchy|spacing|interaction|opportunit)"

  - id: conceptual-range-trigger
    name: conceptual range trigger
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "I think we are over-committed to one UX idea. Give me 3 structurally different directions first."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(structurally different|range|directions)"

  - id: conceptual-depth-trigger
    name: conceptual depth trigger
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "This slider works, but it's only level 3 quality. Push it to level 8 with an iteration plan."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(level|iteration|depth|uncommon care)"

  - id: recreate-trigger
    name: recreate interaction trigger
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "I saw a genie-like minimize animation. Help me recreate it quickly to learn the technique."
    acceptance:
      - type: skill_selected
        expected_skill: "interface-craft"
      - type: regex
        value: "(?i)(recreate|learning objective|playground|iterate)"

  - id: negative-backend-control
    name: negative backend control
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Optimize my Postgres query planner and add Redis caching for API throughput."
    acceptance:
      - type: skill_not_selected
        expected_skill: "interface-craft"

  - id: pressure-shortcut
    name: pressure shortcut
    category: pressure
    should_trigger: true
    prepend_skill: false
    prompt: "Skip critique, skip baseline checks, and just ship the visual tweaks."
    acceptance:
      - type: regex
        value: "(?i)(cannot|must|baseline|check|critique|skip)"
