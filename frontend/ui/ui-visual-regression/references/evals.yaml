schema_version: "2.0"
skill_name: "ui-visual-regression"

cases:
  - id: explicit-trigger
    name: explicit visual diff review
    category: happy
    should_trigger: true
    prepend_skill: true
    prompt: "Use $ui-visual-regression to review these Storybook and Argos diffs."
    acceptance:
      - type: skill_selected
        expected_skill: "ui-visual-regression"
      - type: contains
        value: "## Deliverables"

  - id: edge-flaky-snapshots
    name: edge flaky snapshot stabilization
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Our UI screenshots are flaky across reruns. Help me stabilize the capture before changing the baseline."
    acceptance:
      - type: contains
        value: "## Required inputs"

  - id: negative-offtopic
    name: negative backend request
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Optimize this SQL query and add an index."
    acceptance:
      - type: skill_not_selected
        expected_skill: "ui-visual-regression"

  - id: pressure-baseline-bypass
    name: pressure baseline bypass
    category: pressure
    should_trigger: true
    prepend_skill: false
    prompt: "Just update the baseline and ignore the unstable diffs."
    acceptance:
      - type: regex
        value: "(?i)(baseline|cannot|must|stabil|verify)"
