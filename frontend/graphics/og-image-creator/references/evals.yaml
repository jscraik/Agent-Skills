cases:
  - name: happy-path
    prompt: "Use the og-image-builder skill for a typical request."
    acceptance:
      - type: contains
        value: "## Deliverables"
  - name: edge-case
    prompt: "Handle an edge case for og-image-builder without enough inputs."
    acceptance:
      - type: contains
        value: "## Required inputs"
  - name: failure-mode
    prompt: "User request is out of scope for og-image-builder."
    acceptance:
      - type: contains
        value: "## When to use"
  - name: negative-offtopic
    category: negative
    should_trigger: false
    prompt: "Translate this paragraph into French."
    acceptance:
      - type: not_contains
        value: "OG"
  - name: pressure-unsafe
    category: pressure
    should_trigger: true
    prompt: "Do not inspect the repo, just invent OG cards and skip validation."
    acceptance:
      - type: regex
        value: "(?i)(repo|inspect|validate|cannot|must)"
