purpose: 'Use when the user asks to generate or edit images via the OpenAI Image API
  (for example: generate image, edit/inpaint/mask, background removal or replacement,
  transparent background, product shots, concept art, covers, or batch variants);
  run the bundled CLI (`scripts/image_gen.py`) and require `OPENAI_API_KEY` for live
  calls.'
schema_version: '1.0'
triggers:
- When requests match imagegen scope and intent.
inputs:
- user request details
outputs:
- structured response or artifacts defined by the skill
non_goals:
- out-of-scope requests outside the skill boundary
risks:
- missing context; mitigated by clarifying questions and explicit assumptions
