<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152" role="img" aria-labelledby="title desc">
  <title id="title">From Refactor-Only Migration Skill to Lane-Gated Architecture Evolution Skill</title>
  <desc id="desc">Technical review artifact for he-refactor hardening, showing before and after artifact lane ownership and validation evidence.</desc>
  <rect width="2048" height="1152" fill="#0f172a"/>
  <rect x="72" y="72" width="1904" height="1008" rx="36" fill="#111827" stroke="#334155" stroke-width="4"/>
  <text x="120" y="150" fill="#f8fafc" font-family="Arial, sans-serif" font-size="54" font-weight="700">From Refactor-Only Migration Skill -&gt; Lane-Gated Architecture Evolution Skill</text>
  <text x="122" y="205" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="30">he-refactor hardening review artifact</text>

  <g transform="translate(120 280)">
    <rect width="520" height="470" rx="24" fill="#1e293b" stroke="#ef4444" stroke-width="3"/>
    <text x="36" y="58" fill="#fecaca" font-family="Arial, sans-serif" font-size="34" font-weight="700">Before</text>
    <text x="36" y="115" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28">Prompt family could flatten:</text>
    <text x="58" y="170" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">strategy</text>
    <text x="58" y="220" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">refactors</text>
    <text x="58" y="270" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">ADRs</text>
    <text x="58" y="320" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">core invariants</text>
    <path d="M260 158 C380 175 390 260 250 305" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
    <path d="M260 215 C385 235 390 150 250 170" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
    <text x="36" y="395" fill="#fca5a5" font-family="Arial, sans-serif" font-size="24">Risk: artifact theater + wrong owner</text>
  </g>

  <g transform="translate(760 280)">
    <rect width="520" height="470" rx="24" fill="#172554" stroke="#38bdf8" stroke-width="3"/>
    <text x="48" y="70" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="38" font-weight="700">he-refactor lane gate</text>
    <rect x="48" y="120" width="424" height="62" rx="14" fill="#0f172a" stroke="#38bdf8"/>
    <text x="72" y="160" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25">selected_lane required</text>
    <rect x="48" y="205" width="424" height="62" rx="14" fill="#0f172a" stroke="#38bdf8"/>
    <text x="72" y="245" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25">Do Not Create subtraction</text>
    <rect x="48" y="290" width="424" height="62" rx="14" fill="#0f172a" stroke="#38bdf8"/>
    <text x="72" y="330" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25">reversal cost + phase link</text>
    <rect x="48" y="375" width="424" height="62" rx="14" fill="#0f172a" stroke="#38bdf8"/>
    <text x="72" y="415" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25">eval artifact before closure</text>
  </g>

  <g transform="translate(1400 280)">
    <rect width="500" height="470" rx="24" fill="#052e16" stroke="#22c55e" stroke-width="3"/>
    <text x="36" y="58" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="34" font-weight="700">After</text>
    <text x="36" y="120" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27">he-strategy owns strategy</text>
    <text x="36" y="175" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27">he-refactor owns refactors</text>
    <text x="36" y="230" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27">ADR output is gated</text>
    <text x="36" y="285" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27">core invariant output is gated</text>
    <text x="36" y="365" fill="#86efac" font-family="Arial, sans-serif" font-size="24">Outcome: deterministic lanes, less drift</text>
  </g>

  <g transform="translate(120 835)">
    <rect width="1780" height="150" rx="24" fill="#020617" stroke="#475569" stroke-width="2"/>
    <text x="32" y="55" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">Evidence strip</text>
    <text x="32" y="105" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">strict audit: pass | skill gate: pass | OpenAI format: pass | boundary validation: pass | Plugin Eval: 91/100 with budget warnings | smoke eval: blocked</text>
