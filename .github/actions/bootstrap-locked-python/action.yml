name: Bootstrap locked Python validation environment
description: Materialize the pinned Python and Infrastructure validation prerequisites.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
      with:
        python-version: "3.12"
    - name: Install locked Python validation deps
      shell: bash
      run: python -m pip install --disable-pip-version-check uv==0.11.3
    - name: Bootstrap locked Infrastructure Python
      shell: bash
      run: uv run --frozen --project Infrastructure --group test --group lint bash scripts/bootstrap-ask.sh --json
