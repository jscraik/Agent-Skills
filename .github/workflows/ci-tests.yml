name: CI Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run docs test lint
        run: python3 scripts/docs_lint.py --mode warn --config docs-policy.json
