name: CI Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run docs test lint
        run: python3 Infrastructure/scripts/validation-and-linting/docs_lint.py --mode warn --config Infrastructure/docs-policy.json

  skill-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Diagnose all skills
        run: python3 Infrastructure/scripts/lifecycle-and-sync/diagnose_skill.py --all
