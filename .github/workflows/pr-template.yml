name: PR Metadata Validation

on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-template:
    name: pr-template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted PR template validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
      - name: Validate PR template completion
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 trusted-base/.github/scripts/validate_pr_template_body.py \
            --template trusted-base/.github/PULL_REQUEST_TEMPLATE.md \
            --body-env PR_BODY

  linear-gate:
    name: linear-gate
    runs-on: ubuntu-latest
    needs: [pr-template]
    if: ${{ always() }}
    steps:
      - name: Require PR template validation
        if: needs.pr-template.result != 'success'
        run: |
          echo "::error::PR template validation did not pass."
          exit 1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc
          fi
      - name: Refresh Linear-first issue tracking policy
        shell: bash
        env:
          HARNESS_CLI_ALLOW_NPM_EXEC: "1"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN is unavailable; edited PR metadata cannot reuse stale Linear evidence."
            printf '{"gate":"linear-gate","status":"blocked","reason":"edited_event_harness_auth_unavailable"}\n'
            exit 1
          fi
          bash Infrastructure/scripts/harness-cli.sh linear-gate \
            --branch "$HEAD_REF" \
            --pr-title "$PR_TITLE" \
            --pr-body "$PR_BODY" \
            --json
