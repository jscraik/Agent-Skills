name: PR Template Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-template:
    name: pr-template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted PR template validator
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
      - name: Validate PR template completion
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 trusted-base/.github/scripts/validate_pr_template_body.py \
            --template trusted-base/.github/PULL_REQUEST_TEMPLATE.md \
            --body-env PR_BODY
      - name: Skip PR template enforcement for merge queue
        if: github.event_name == 'merge_group'
        run: echo "merge_group event detected; PR template enforcement is pull_request-only."
