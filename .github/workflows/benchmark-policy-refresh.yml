name: benchmark-policy-refresh

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build benchmark artifact
        run: |
          python3 Plugins/skill-factory/scripts/skill-builder/benchmark_skill_portfolio.py \
            --root . \
            --config Plugins/skill-factory/references/skill-builder/benchmark-policy.json \
            --mode off \
            --format json \
            --output-json .harness/evidence/industry-benchmark-latest.json

      - name: Refresh benchmark policy
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          python3 Plugins/skill-factory/scripts/skill-builder/refresh_benchmark_policy.py \
            --root . \
            --policy Plugins/skill-factory/references/skill-builder/benchmark-policy.json \
            --benchmark-json .harness/evidence/industry-benchmark-latest.json \
            --schedule-days 7 \
            --require-context7 \
            --apply \
            --report-json .harness/evidence/benchmark-policy-refresh-report.json \
            --format text

      - name: Upload refresh artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-policy-refresh
          path: |
            .harness/evidence/industry-benchmark-latest.json
            .harness/evidence/benchmark-policy-refresh-report.json

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: codex/benchmark-policy-refresh
          delete-branch: true
          commit-message: "chore: refresh benchmark policy baselines"
          title: "chore: refresh benchmark policy baselines"
          body: |
            ## Summary
            This PR refreshes benchmark policy baselines from the latest benchmark artifact and Context7-backed refresh run.

            ## Motivation / Context
            Benchmark policy baselines need periodic refresh to stay aligned with current observed portfolio signals.

            Closes #none (automation maintenance update)

            ## What changed?
            - refreshed `Plugins/skill-factory/references/skill-builder/benchmark-policy.json`
            - ratcheted thresholds from latest benchmark artifact
            - updated policy metadata (`validated_on`, refresh notes)

            ## How to test
            - `python3 Plugins/skill-factory/scripts/skill-builder/benchmark_skill_portfolio.py --root . --config Plugins/skill-factory/references/skill-builder/benchmark-policy.json --mode off --format json --output-json .tmp/agent-skills-artifacts/industry-benchmark-latest.json`
            - `python3 Plugins/skill-factory/scripts/skill-builder/refresh_benchmark_policy.py --root . --policy Plugins/skill-factory/references/skill-builder/benchmark-policy.json --benchmark-json .harness/evidence/industry-benchmark-latest.json --schedule-days 7 --require-context7 --apply --report-json .harness/evidence/benchmark-policy-refresh-report.json --format text`
            - `gh pr checks <PR_NUMBER>`

            - [x] Benchmark artifact generated
            - [x] Policy refresh script executed
            - [x] CI checks reviewed

            ## Risk & rollback
            Risk level: medium

            Rollback plan: close this PR or revert the merge commit if policy ratchets are not desired.

            ## Security / privacy impact
            - [x] No security impact
            - [ ] Security impact (describe at high level; do NOT disclose vulnerabilities publicly)

            Security/AI risk section:
            No new secrets, endpoints, or user-data pathways; policy values only.

            ## Governance evidence

            ### Threat model
            - [x] Threat model exists: existing CI/governance model for workflow automation.
            - [x] Threat model rationale: no new privileged surface added beyond existing repository action scopes.

            ### AI and data impact
            - [x] AI/tool execution impact: GitHub workflow executes local Python scripts and opens a PR.
            - [x] Data handling impact: repository skill metadata and benchmark artifacts only.
            - [x] Privacy / logging changes: standard GitHub Actions logs and artifacts only.

            ### Verification evidence
            - [x] Test evidence included (commands + results)
            - [x] Dependency / secret checks run where applicable
            - [x] PR body includes release artifact notes:
              - [ ] SBOM added (if release path changed)
              - [ ] Provenance/signature artifacts noted (if release path changed)

            ## Review of exception/incident updates
            - [x] New control bypasses documented in `GOVERNANCE/exceptions.md` (if any)
            - [x] Related incidents documented in `GOVERNANCE/incidents.md` (if any)

            ## AI assistance
            - [x] This PR was created with AI assistance (mark with `[AI]` in title if applicable)
            - [x] Testing level: untested / lightly tested / fully tested
            - [x] I understand what the code does and can explain it
            - [ ] Prompts or session logs included (Optional, but helpful)

            Prompt: `N/A`
            Session: `N/A`

            <details>
            <summary>AI Session Log (click to expand)</summary>

            Automated benchmark policy refresh PR generated by workflow `${{ github.workflow }}`.

            - Log file: `N/A`
            - Prompt file: `N/A`
            - Files touched: `Plugins/skill-factory/references/skill-builder/benchmark-policy.json`
            - Tests run: benchmark generation + refresh steps in this workflow
            - Human verification: pending reviewer confirmation

            </details>

            ## Checklist
            - [x] Linked an issue or explained why none exists
            - [x] Added/updated tests or explained why not
            - [x] Updated docs where needed (Required for behavior/Infrastructure/config/API/CLI changes)
            - [x] Internal docs links use full root paths (for example, `/docs/deployment`)
            - [x] Internal docs links do not use trailing slashes
            - [x] Ran docs lint: `python3 Infrastructure/scripts/docs_lint.py --mode warn --config Infrastructure/docs-policy.json`
            - [x] Considered backward compatibility / migrations (Optional)
            - [x] Verified no secrets are committed (tokens, keys, passwords)
            - [x] Confirmed CI is green (or explained failures)

            ## Release notes
            Release note: Refreshed benchmark policy baselines and metadata via automated workflow.
          add-paths: |
            Plugins/skill-factory/references/skill-builder/benchmark-policy.json
