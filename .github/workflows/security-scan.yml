name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 02:00 UTC — catches new CVEs in dependencies without a code change
    - cron: "0 2 * * *"

permissions:
  contents: read
  security-events: write  # required for SARIF upload to GitHub Advanced Security

jobs:
  # ------------------------------------------------------------------
  # Gitleaks — secrets detection
  # L-01: no secrets-leak assertion in CI
  # ------------------------------------------------------------------
  gitleaks:
    name: Gitleaks (secrets scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so Gitleaks can diff commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the workflow on any finding; set to "warn" to soft-fail
          GITLEAKS_ENABLE_COMMENTS: "true"

  # ------------------------------------------------------------------
  # Semgrep — static analysis (Python + TypeScript + shell)
  # Covers prompt-injection patterns not caught by the string-only scan
  # ------------------------------------------------------------------
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep (auto ruleset + secrets)
        shell: bash
        run: |
          set -euo pipefail
          rm -f semgrep.sarif
          git config --global --add safe.directory "$PWD"
          semgrep_args=(
            --config "p/secrets"
            --config "p/python"
            --config "p/typescript"
            --config "p/bash"
            --exclude "artifacts/skill-graphs/**"
            --sarif --output semgrep.sarif
          )

          if [ -n "${SEMGREP_APP_TOKEN:-}" ]; then
            semgrep_args=(--config auto "${semgrep_args[@]}")
          else
            echo "SEMGREP_APP_TOKEN is not set; skipping Semgrep auto ruleset."
          fi

          event_name="${{ github.event_name }}"
          if [ "${event_name}" = "pull_request" ]; then
            base_ref="${{ github.base_ref }}"
            git fetch origin "${base_ref}:${base_ref}" --depth=1

            mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMR "${base_ref}...HEAD")
            if [ "${#changed_files[@]}" -eq 0 ]; then
              echo "No changed files to scan in PR diff; writing empty semgrep.sarif"
              printf '{"version":"2.1.0","runs":[]}\n' > semgrep.sarif
              exit 0
            fi

            semgrep scan "${semgrep_args[@]}" -- "${changed_files[@]}" || semgrep_status=$?
          else
            semgrep scan "${semgrep_args[@]}" -- . || semgrep_status=$?
          fi

          semgrep_status="${semgrep_status:-0}"
          if [ "${semgrep_status}" -ne 0 ]; then
            echo "::error::Semgrep failed with exit status ${semgrep_status}"
            exit "${semgrep_status}"
          fi

          if [ ! -f semgrep.sarif ]; then
            echo "::error::Semgrep did not produce semgrep.sarif"
            exit 1
          fi

          findings_count="$(jq '[.runs[]?.results[]?] | length' semgrep.sarif)"
          if [ "${findings_count}" -gt 0 ]; then
            echo "::error::Semgrep found ${findings_count} finding(s)"
            exit 1
          fi
        env:
          # Set SEMGREP_APP_TOKEN if using Semgrep Cloud for dashboard/PR comments
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN || '' }}

      - name: Upload Semgrep SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ------------------------------------------------------------------
  # Trivy — dependency vulnerability scan (Python lockfiles, node_modules)
  # ------------------------------------------------------------------
  trivy:
    name: Trivy (dependency CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

  # ------------------------------------------------------------------
  # Canonical artifact pre-upload secrets check (L-01)
  # Scans generated telemetry / canonical lesson artifacts for secret
  # patterns before they are uploaded anywhere.
  # ------------------------------------------------------------------
  artifact-secret-check:
    name: Artifact secrets pre-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | tr '[:upper:]' '[:lower:]')"
          case "$arch" in
            x86_64|amd64) arch="x64" ;;
            aarch64|arm64) arch="arm64" ;;
          esac
          asset_url="$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | jq -r --arg os "$os" --arg arch "$arch" '
                .assets[]
                | .browser_download_url
                | select(endswith("_" + $os + "_" + $arch + ".tar.gz"))
              ' \
            | head -n 1)"
          if [ -z "$asset_url" ]; then
            echo "::error::Unable to resolve gitleaks release asset for os=${os} arch=${arch}"
            exit 1
          fi
          curl -sSfL "$asset_url" | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks

      - name: Scan artifacts directory for secrets
        run: |
          if [ -d "artifacts" ]; then
            gitleaks detect \
              --source artifacts/ \
              --no-git \
              --redact \
              --exit-code 1 \
              --report-format json \
              --report-path gitleaks-artifacts.json || {
                echo "::error::Secret pattern detected in artifacts/ — review gitleaks-artifacts.json"
                exit 1
              }
          else
            echo "No artifacts/ directory — skipping."
          fi

      - name: Upload Gitleaks artifact report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-artifacts-report
          path: gitleaks-artifacts.json
          retention-days: 7
