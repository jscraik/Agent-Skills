name: skill-quality

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/references/evals.yaml"
      - "**/references/contract.yaml"
      - "utilities/skill-builder/scripts/**"
      - "templates/evals.yaml"
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run LLM evals (requires codex/claude CLIs and auth on runner)"
        required: false
        default: "false"
      tier2_mode:
        description: "Tier-2 handling for eval run"
        required: false
        default: "warn"

permissions:
  contents: read

jobs:
  structure-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ensure GitHub CLI is installed
        run: bash scripts/ensure-gh-cli.sh
      - name: Install deps
        run: python -m pip install --upgrade pip pyyaml
      - name: Tier-1 structure gate (skill_gate)
        run: |
          python utilities/skill-builder/scripts/run_repo_skill_quality.py \
            --root . \
            --baseline-file utilities/skill-builder/references/skill-quality-baseline.json \
            --benchmark-mode warn \
            --benchmark-config utilities/skill-builder/references/benchmark-policy.json \
            --benchmark-output-json artifacts/industry-benchmark-latest.json \
            --format text
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: skill-portfolio-benchmark
          path: artifacts/industry-benchmark-latest.json

      - name: See Also gate (new skills must have ≥2 cross-skill links)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep SKILL.md || true)
          if [ -n "$CHANGED" ]; then
            python3 scripts/check-see-also.py . --changed-files $CHANGED
          else
            echo "check-see-also: no SKILL.md changes in this PR"
          fi

      - name: Hub stability gate
        run: python3 scripts/check-hub-stability.py .

  eval-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals == 'true'
    runs-on: ubuntu-latest
    needs: [structure-gate]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --upgrade pip pyyaml
      - name: Run dual-run evals (requires codex/claude binaries + auth)
        run: |
          python utilities/skill-builder/scripts/run_repo_skill_quality.py \
            --root . \
            --run-evals \
            --dual-run \
            --capture-jsonl \
            --tier2-mode "${{ inputs.tier2_mode }}" \
            --benchmark-mode warn \
            --benchmark-config utilities/skill-builder/references/benchmark-policy.json \
            --benchmark-output-json artifacts/industry-benchmark-latest.json \
            --format text
      - name: Build dashboard
        run: |
          python utilities/skill-builder/scripts/build_skill_eval_dashboard.py \
            --reports-root artifacts/reports/skills \
            --out-json artifacts/reports/skills/dashboard.json \
            --out-md artifacts/reports/skills/dashboard.md
      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: skill-quality-reports
          path: |
            artifacts/reports/skills
            artifacts/industry-benchmark-latest.json
