name: skill-quality

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/references/evals.yaml"
      - "**/references/contract.yaml"
      - "utilities/skill-creator/scripts/**"
      - "templates/evals.yaml"
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run LLM evals (requires codex/claude CLIs and auth on runner)"
        required: false
        default: "false"
      tier2_mode:
        description: "Tier-2 handling for eval run"
        required: false
        default: "warn"

jobs:
  structure-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ensure GitHub CLI is installed
        run: bash scripts/ensure-gh-cli.sh
      - name: Install deps
        run: python -m pip install --upgrade pip pyyaml
      - name: Tier-1 structure gate (skill_gate)
        run: |
          python utilities/skill-creator/scripts/run_repo_skill_quality.py \
            --root . \
            --baseline-file utilities/skill-creator/references/skill-quality-baseline.json \
            --format text

  eval-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals == 'true'
    runs-on: ubuntu-latest
    needs: [structure-gate]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --upgrade pip pyyaml
      - name: Run dual-run evals (requires codex/claude binaries + auth)
        run: |
          python utilities/skill-creator/scripts/run_repo_skill_quality.py \
            --root . \
            --run-evals \
            --dual-run \
            --capture-jsonl \
            --tier2-mode "${{ inputs.tier2_mode }}" \
            --format text
      - name: Build dashboard
        run: |
          python utilities/skill-creator/scripts/build_skill_eval_dashboard.py \
            --reports-root artifacts/reports/skills \
            --out-json artifacts/reports/skills/dashboard.json \
            --out-md artifacts/reports/skills/dashboard.md
      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: skill-quality-reports
          path: artifacts/reports/skills
