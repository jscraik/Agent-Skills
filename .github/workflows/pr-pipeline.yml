name: Harness PR Pipeline

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-template:
    name: pr-template
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR template completion
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body ?? '';
            const errors = [];

            if (body.trim().length === 0) {
              errors.push('PR body is empty. Fill out the PR template.');
            }

            const requiredSections = ['## Summary', '## Checklist', '## Release notes'];
            for (const section of requiredSections) {
              if (!body.includes(section)) {
                errors.push(`Missing required section: ${section}`);
              }
            }

            if (/\[PROMPT:/i.test(body)) {
              errors.push('PR body still contains template prompt placeholders.');
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            }

  repo-validate:
    name: repo-validate
    needs: [pr-template]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run repo validation
        run: bash scripts/validate_all.sh

      - name: Run skill diagnostics
        run: python3 scripts/diagnose_skill.py --all

      - name: Run docs lint
        run: python3 scripts/docs_lint.py --mode warn --config docs-policy.json

  authoring-family-gate:
    name: authoring-family-gate
    needs: [pr-template]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Run authoring family contract/eval/security gate
        run: bash scripts/validate_skill_authoring_family.sh

  harness-preflight:
    name: harness-preflight
    needs: [repo-validate, authoring-family-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install coding-harness
        run: |
          npm install -g @brainwav/coding-harness@latest || {
            echo "coding-harness is unavailable in this environment; continuing without harness-preflight gate."
          }

      - name: Run harness preflight gate
        run: |
          if ! command -v harness >/dev/null 2>&1; then
            echo "harness CLI not found; skipping harness-preflight gate."
            exit 0
          fi
          CHANGED_FILES="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | paste -sd, -)"
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES="README.md"
          fi
          harness preflight-gate \
            --contract harness.contract.json \
            --files "$CHANGED_FILES" \
            --max-tier high \
            --json
