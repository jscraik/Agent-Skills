name: Harness PR Pipeline

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-template:
    name: pr-template
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR template completion
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = context.payload.pull_request?.body ?? '';
            const errors = [];

            if (body.trim().length === 0) {
              errors.push('PR body is empty. Fill out the full PR template.');
            }

            const requiredSections = [
              '## Summary',
              '## Checklist',
              '## Testing',
              '## Review artifacts',
              '## Notes',
            ];
            for (const section of requiredSections) {
              if (!body.includes(section)) {
                errors.push('Missing required section: ' + section);
              }
            }

            const checklistMatch = body.match(/## Checklist([\s\S]*?)(?:\n## |\n# |$)/i);
            if (!checklistMatch) {
              errors.push('Missing checklist block.');
            } else {
              const checklistBody = checklistMatch[1] ?? '';
              const checklistItems = checklistBody
                .split('\n')
                .map((line) => line.trim())
                .filter((line) => /^- \[[ xX]\]/.test(line));

              if (checklistItems.length === 0) {
                errors.push('Checklist has no checkbox items.');
              }

              const unchecked = checklistItems.filter((line) => /^- \[ \]/.test(line));
              const unresolvedUnchecked = unchecked.filter(
                (line) => !/\*\*\((pending|n\/a|not applicable)\)\*\*/i.test(line),
              );
              if (unresolvedUnchecked.length > 0) {
                errors.push(
                  'Checklist has unchecked item(s) without explicit status marker ((Pending) or (N/A)):\n' +
                    unresolvedUnchecked.join('\n'),
                );
              }
            }

            const placeholders = [
              'pass/fail',
              '<link / artifact path / comment ID>',
              '<0-5>',
              '<reviewer + link>',
              'Add one-paragraph merge rationale here.',
            ];
            for (const placeholder of placeholders) {
              if (body.includes(placeholder)) {
                errors.push('Replace template placeholder: ' + placeholder);
              }
            }

            const reviewArtifactsMatch = body.match(/## Review artifacts([\s\S]*?)(?:\n## |\n# |$)/i);
            if (reviewArtifactsMatch) {
              const reviewArtifactsBody = reviewArtifactsMatch[1] ?? '';
              const unresolvedTokens = reviewArtifactsBody.match(/<[^>\n]+>/g) ?? [];
              for (const token of unresolvedTokens) {
                errors.push('Replace unresolved placeholder token: ' + token);
              }
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            }
      - name: Skip PR template enforcement for merge queue
        if: github.event_name == 'merge_group'
        run: echo "merge_group event detected; PR template enforcement is pull_request-only."

  linear-gate:
    name: linear-gate
    runs-on: ubuntu-latest
    needs: [pr-template]
    if: ${{ always() && (github.event_name == 'merge_group' || needs.pr-template.result == 'success') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc
          fi
      - name: Enforce Linear-first issue tracking policy
        shell: bash
        env:
          HARNESS_CLI_ALLOW_NPM_EXEC: "1"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::notice::NPM_TOKEN is unavailable in GitHub Actions; CircleCI pr-pipeline owns harness package-backed enforcement."
            printf '{"gate":"linear-gate","status":"deferred","enforced_by":"ci/circleci: pr-pipeline","reason":"github_actions_npm_token_unavailable"}\n'
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BRANCH="$HEAD_REF"
            bash Infrastructure/scripts/harness-cli.sh linear-gate \
              --branch "$BRANCH" \
              --pr-title "$PR_TITLE" \
              --pr-body "$PR_BODY" \
              --json
          else
            bash Infrastructure/scripts/harness-cli.sh linear-gate \
              --allow-missing-branch \
              --allow-missing-pr \
              --json
          fi


  risk-policy-gate:
    name: risk-policy-gate
    runs-on: ubuntu-latest
    needs: [pr-template, linear-gate]
    if: ${{ always() && (github.event_name == 'merge_group' || (needs.pr-template.result == 'success' && needs.linear-gate.result == 'success')) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc
          fi
      - name: Run fast preflight policy gate
        env:
          HARNESS_CLI_ALLOW_NPM_EXEC: "1"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::notice::NPM_TOKEN is unavailable in GitHub Actions; CircleCI pr-pipeline owns harness package-backed enforcement."
            printf '{"gate":"risk-policy-gate","status":"deferred","enforced_by":"ci/circleci: pr-pipeline","reason":"github_actions_npm_token_unavailable"}\n'
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
            BASE_REF="$PR_BASE_REF"
            # Load contract from the trusted base branch, not the PR checkout.
            # Prevents a malicious PR from weakening policy by modifying harness.contract.json.
            CONTRACT_PATH="$RUNNER_TEMP/harness.contract.base.json"
            if ! git show "origin/$BASE_REF:harness.contract.json" > "$CONTRACT_PATH"; then
              echo "::error::Unable to load trusted harness.contract.json from origin/$BASE_REF"
              exit 1
            fi
          else
            BASE_SHA="$MERGE_GROUP_BASE_SHA"
            HEAD_SHA="$MERGE_GROUP_HEAD_SHA"
            # Merge queue: contract is committed and protected by branch rules.
            CONTRACT_PATH="harness.contract.json"
          fi
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | paste -sd, -)"
          if [[ -z "$CHANGED_FILES" ]]; then
            CHANGED_FILES="$(git ls-files | paste -sd, -)"
          fi
          bash Infrastructure/scripts/harness-cli.sh preflight-gate \
            --contract "$CONTRACT_PATH" \
            --max-tier medium \
            --files "${CHANGED_FILES}" \
            --json

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    needs: [risk-policy-gate]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Detect dependency review support
        id: dependency-review-support
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.repos.get({ owner, repo });
            const security = response.data.security_and_analysis ?? {};
            const advanced = security.advanced_security?.status === 'enabled';
            const dependencyGraph = security.dependency_graph?.status === 'enabled';
            core.setOutput('supported', advanced && dependencyGraph ? 'true' : 'false');
      - name: Run dependency review (pull_request)
        if: github.event_name == 'pull_request' && ${{ steps.dependency-review-support.outputs.supported == 'true' }}
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
      - name: Skip dependency review when repository support is unavailable
        if: github.event_name == 'pull_request' && ${{ steps.dependency-review-support.outputs.supported != 'true' }}
        run: echo "Dependency review unsupported (requires dependency graph + advanced security); skipping."
      - name: Skip dependency review for merge queue
        if: github.event_name == 'merge_group'
        run: echo "Dependency review enforced on pull_request; merge_group runs are no-op."

  actions-pinning:
    name: actions-pinning
    runs-on: ubuntu-latest
    needs: [risk-policy-gate]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Enforce pinned GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          violations=0
          while IFS=: read -r file line raw; do
            ref="$(printf "%s" "$raw" | sed -E 's/^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*([^[:space:]#]+).*/\2/')"
            if [[ "$ref" == ./* ]] || [[ "$ref" == docker://* ]]; then
              continue
            fi
            if [[ ! "$ref" =~ @[0-9a-f]{40}$ ]]; then
              echo "::error file=$file,line=$line::Action is not pinned to a full commit SHA: $ref"
              violations=1
            fi
          done < <(rg -n "^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*[^[:space:]]+" .github/workflows/*.yml)
          exit "$violations"

  consistency-drift-advisory:
    name: consistency-drift-advisory
    runs-on: ubuntu-latest
    needs: [risk-policy-gate]
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc
          fi
      - name: Prepare baseline seed fallback
        run: |
          mkdir -p artifacts/consistency-gate
          if [[ ! -f artifacts/consistency-gate/consistency-baseline-latest.json ]]; then
            cat > artifacts/consistency-gate/consistency-baseline-latest.json <<'JSON'
          {
            "schemaVersion": "1.0.0",
            "findings": []
          }
          JSON
          fi
      - name: Run advisory drift gate
        continue-on-error: true
        env:
          HARNESS_CLI_ALLOW_NPM_EXEC: "1"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            cat > artifacts/consistency-gate/consistency-drift-advisory-latest.json <<'JSON'
          {
            "schemaVersion": "1.0.0",
            "command": "drift-gate",
            "mode": "advisory",
            "status": "deferred",
            "outcome": "ok",
            "error_class": "none",
            "generated_at": "1970-01-01T00:00:00.000Z",
            "repo_root": ".",
            "enforced_by": "ci/circleci: pr-pipeline",
            "baseline": { "path": "artifacts/consistency-gate/consistency-baseline-latest.json", "loaded": false, "reason": "github_actions_npm_token_unavailable" },
            "summary": { "finding_count": 0, "new_count": 0, "preexisting_count": 0, "error_count": 0 },
            "findings": []
          }
          JSON
            echo "::notice::NPM_TOKEN is unavailable in GitHub Actions; wrote deterministic advisory deferral artifact."
            exit 0
          fi
          bash Infrastructure/scripts/harness-cli.sh drift-gate \
            --mode advisory \
            --out artifacts/consistency-gate/consistency-drift-advisory-latest.json \
            --json
      - name: Advisory guard (soft-fail)
        if: always()
        run: |
          mkdir -p artifacts/consistency-gate
          if [[ ! -s artifacts/consistency-gate/consistency-drift-advisory-latest.json ]]; then
            echo "::warning::advisory report missing; writing deterministic fallback report."
            cat > artifacts/consistency-gate/consistency-drift-advisory-latest.json <<'JSON'
          {
            "schemaVersion": "1.0.0",
            "command": "drift-gate",
            "mode": "advisory",
            "status": "blocked",
            "outcome": "error",
            "error_class": "io",
            "generated_at": "1970-01-01T00:00:00.000Z",
            "repo_root": ".",
            "baseline": { "path": "artifacts/consistency-gate/consistency-baseline-latest.json", "loaded": false, "reason": "missing_report_output" },
            "summary": { "finding_count": 1, "new_count": 1, "preexisting_count": 0, "error_count": 1 },
            "findings": [
              {
                "rule_id": "report.output.missing",
                "surface": "status",
                "rule_result": "error",
                "severity": "error",
                "baseline_state": "new",
                "message": "Advisory report missing; generated deterministic fallback report."
              }
            ]
          }
          JSON
          fi
      - name: Upload advisory artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consistency-drift-advisory-latest
          path: artifacts/consistency-gate/consistency-drift-advisory-latest.json
          if-no-files-found: error

  consistency-drift-health:
    name: consistency-drift-health
    runs-on: ubuntu-latest
    needs: [risk-policy-gate]
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc
          fi
      - name: Detect baseline seed
        id: baseline-seed
        run: |
          mkdir -p artifacts/consistency-gate
          if [[ -f artifacts/consistency-gate/consistency-baseline-latest.json ]]; then
            echo "seeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "seeded=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run health drift gate
        if: steps.baseline-seed.outputs.seeded == 'true'
        continue-on-error: true
        env:
          HARNESS_CLI_ALLOW_NPM_EXEC: "1"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            cat > artifacts/consistency-gate/health.json <<'JSON'
          {
            "schemaVersion": "1.0.0",
            "command": "drift-gate",
            "mode": "health",
            "status": "deferred",
            "outcome": "ok",
            "error_class": "none",
            "generated_at": "1970-01-01T00:00:00.000Z",
            "repo_root": ".",
            "enforced_by": "ci/circleci: pr-pipeline",
            "baseline": { "path": "artifacts/consistency-gate/consistency-baseline-latest.json", "loaded": false, "reason": "github_actions_npm_token_unavailable" },
            "summary": { "finding_count": 0, "new_count": 0, "preexisting_count": 0, "error_count": 0 },
            "findings": []
          }
          JSON
            echo "::notice::NPM_TOKEN is unavailable in GitHub Actions; wrote deterministic health deferral artifact."
            exit 0
          fi
          bash Infrastructure/scripts/harness-cli.sh drift-gate \
            --mode health \
            --out artifacts/consistency-gate/health.json \
            --json
      - name: Ensure health artifact
        if: always()
        env:
          BASELINE_SEEDED: ${{ steps.baseline-seed.outputs.seeded }}
        run: |
          mkdir -p artifacts/consistency-gate
          if [[ ! -s artifacts/consistency-gate/health.json ]]; then
            if [[ "${BASELINE_SEEDED:-false}" != "true" ]]; then
              cat > artifacts/consistency-gate/health.json <<'JSON'
          {
            "schemaVersion": "1.0.0",
            "command": "drift-gate",
            "mode": "health",
            "status": "partial",
            "outcome": "ok",
            "error_class": "none",
            "generated_at": "1970-01-01T00:00:00.000Z",
            "repo_root": ".",
            "baseline": { "path": "artifacts/consistency-gate/consistency-baseline-latest.json", "loaded": false, "reason": "bootstrap_seed_missing" },
            "summary": { "finding_count": 1, "new_count": 1, "preexisting_count": 0, "error_count": 0 },
            "findings": [
              {
                "rule_id": "baseline.seed.bootstrap",
                "surface": "status",
                "rule_result": "not_applicable",
                "severity": "info",
                "baseline_state": "new",
                "message": "Health check running in bootstrap mode until baseline seed is published on default branch."
              }
            ]
          }
          JSON
              echo "::warning::consistency-drift-health wrote bootstrap health artifact."
              exit 0
            fi

            cat > artifacts/consistency-gate/health.json <<'JSON'
          {
            "schemaVersion": "1.0.0",
            "command": "drift-gate",
            "mode": "health",
            "status": "blocked",
            "outcome": "error",
            "error_class": "io",
            "generated_at": "1970-01-01T00:00:00.000Z",
            "repo_root": ".",
            "baseline": { "path": "artifacts/consistency-gate/consistency-baseline-latest.json", "loaded": true, "reason": "health_report_missing_after_drift_gate" },
            "summary": { "finding_count": 1, "new_count": 1, "preexisting_count": 0, "error_count": 1 },
            "findings": [
              {
                "rule_id": "report.output.missing",
                "surface": "status",
                "rule_result": "error",
                "severity": "error",
                "baseline_state": "new",
                "message": "Health report missing after seeded drift-gate run; generated deterministic failure report."
              }
            ]
          }
          JSON
            echo "::error::consistency-drift-health missing report after seeded drift-gate run."
            exit 1
          fi
      - name: Upload health artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consistency-drift-health-latest
          path: artifacts/consistency-gate/health.json
          if-no-files-found: error

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [risk-policy-gate]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run repo validation
        run: ./bin/ask repo validate --scope=lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: [risk-policy-gate]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run repo validation
        run: ./bin/ask repo validate --scope=typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [risk-policy-gate]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install Python validation deps
        run: python -m pip install --upgrade pip pyyaml pytest jsonschema
      - name: Run repo validation
        run: ./bin/ask repo validate --scope=test

  audit:
    name: audit
    runs-on: ubuntu-latest
    needs: [risk-policy-gate]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run repo validation
        run: ./bin/ask repo validate --scope=audit

  check:
    name: check
    runs-on: ubuntu-latest
    needs: [risk-policy-gate]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install Python validation deps
        run: python -m pip install --upgrade pip pyyaml pytest jsonschema
      - name: Run repo validation
        run: ./bin/ask repo validate --scope=check

  memory:
    name: memory
    runs-on: ubuntu-latest
    needs: [risk-policy-gate]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate memory.json
        run: test -f memory.json && jq -e '.meta.version == "1.0" and (.preamble.bootstrap | type == "boolean") and (.preamble.search | type == "boolean") and (.entries | type == "array")' memory.json >/dev/null
