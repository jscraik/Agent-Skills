name: security-scan

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  secret-scan:
    name: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.34.2
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Semgrep Scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          HEAD_REPO_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          set -euo pipefail
          if [[ -z "$SEMGREP_APP_TOKEN" ]]; then
            # Determine if this is a trusted context (not a fork)
            # GITHUB_EVENT_NAME: push, pull_request, merge_group
            # For pull_request, check if it's from a fork using GITHUB_HEAD_REF or repo ownership
            is_trusted=false
            if [[ "${GITHUB_EVENT_NAME:-}" == "push" ]] || [[ "${GITHUB_EVENT_NAME:-}" == "merge_group" ]]; then
              is_trusted=true
            elif [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
              # Check if PR is from the same repo (not a fork)
              # HEAD_REPO_OWNER is set from github.event.pull_request.head.repo.owner.login
              if [[ "${GITHUB_REPOSITORY_OWNER:-}" == "${HEAD_REPO_OWNER:-}" ]]; then
                is_trusted=true
              fi
            fi

            if [[ "$is_trusted" == "true" ]]; then
              echo "ERROR: SEMGREP_APP_TOKEN is required for trusted contexts (${GITHUB_EVENT_NAME})"
              echo "Please ensure the secret is configured in repository settings."
              exit 1
            else
              echo "WARNING: SEMGREP_APP_TOKEN not set - skipping Semgrep scan (forked PR or untrusted context)"
              echo "Other security scans (Gitleaks, Trivy) still run."
              exit 0
            fi
          fi
          python3 -m venv "${RUNNER_TEMP}/semgrep-venv"
          "${RUNNER_TEMP}/semgrep-venv/bin/python" -m pip install --quiet --upgrade pip semgrep
          # Run with token - will fail naturally if token is invalid
          # Append || true to prevent set -e from exiting before we capture the exit code
          semgrep_exit_code=0
          SEMGREP_SEND_METRICS=off "${RUNNER_TEMP}/semgrep-venv/bin/semgrep" scan \
            --config p/security-audit \
            --error \
            --severity ERROR \
            --exclude node_modules \
            --exclude dist \
            . 2>&1 || semgrep_exit_code=$?

          # Exit code 13 = authentication error, 1 = findings found, 0 = success
          if [[ $semgrep_exit_code -ne 0 ]]; then
            if [[ $semgrep_exit_code -eq 13 ]]; then
              echo "ERROR: Semgrep authentication failed (exit code 13) - check SEMGREP_APP_TOKEN"
            else
              echo "ERROR: Semgrep scan failed - see errors above"
            fi
            exit 1
          fi
