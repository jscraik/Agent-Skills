name: recursive-skill-shadow

on:
  workflow_dispatch:
    inputs:
      runs_per_profile:
        description: "Runs per pilot profile"
        required: false
        default: "2"
      window_days:
        description: "Aggregation window in days"
        required: false
        default: "7"
  schedule:
    - cron: "7 6 * * *"

permissions:
  contents: write

jobs:
  shadow-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run recursive shadow cycle
        env:
          RUNS_PER_PROFILE: ${{ inputs.runs_per_profile }}
          WINDOW_DAYS: ${{ inputs.window_days }}
        run: |
          if [ -z "$RUNS_PER_PROFILE" ]; then
            RUNS_PER_PROFILE="2"
          fi
          if [ -z "$WINDOW_DAYS" ]; then
            WINDOW_DAYS="7"
          fi

          bash scripts/run_recursive_skill_shadow_cycle.sh \
            --runs-per-profile "$RUNS_PER_PROFILE" \
            --window-days "$WINDOW_DAYS"

      - name: Docs lint (warn mode)
        run: |
          python3 scripts/docs_lint.py \
            --config docs-policy.json \
            --mode warn \
            --report-json /tmp/docs-lint-shadow.json

      - name: Verify telemetry freshness
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          content = Path("docs/skill-graphs/telemetry/daily-skill-health.md").read_text()
          for line in content.splitlines():
              if line.startswith("- Generated at:"):
                  ts = line.split("`")[1].strip()
                  generated = datetime.fromisoformat(ts.replace("Z", "+00:00"))
                  age = datetime.now(timezone.utc) - generated
                  if age > timedelta(hours=24):
                      print(f"FAIL: daily-skill-health.md is {age} old (limit: 24h)", file=sys.stderr)
                      sys.exit(1)
                  print(f"OK: telemetry age {age}")
                  sys.exit(0)
          print("FAIL: could not parse Generated at timestamp", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Commit telemetry artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add each path separately so missing paths don't block others
          git add docs/skill-graphs/telemetry/daily-skill-health.md 2>/dev/null || true
          git add artifacts/skill-graphs/runs/ 2>/dev/null || true
          git add artifacts/skill-graphs/onboarding/wave-readiness.json 2>/dev/null || true
          git add artifacts/skill-graphs/pilot/artifact-parity-manifest.json 2>/dev/null || true
          git add artifacts/skill-graphs/telemetry/ 2>/dev/null || true
          git diff --cached --quiet || git commit \
            -m "chore(telemetry): daily skill-health refresh [skip ci]"
          git push

      - name: Upload shadow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: recursive-skill-shadow-artifacts
          path: |
            artifacts/skill-graphs
            docs/skill-graphs/pilots/ui-skills-shadow-results.md
            docs/skill-graphs/pilots/ui-skills-pilot-readout.md
            docs/skill-graphs/telemetry/daily-skill-health.md
            artifacts/skill-graphs/telemetry/failure-pattern-candidates.jsonl
            artifacts/skill-graphs/telemetry/promotion-queue.md
            /tmp/docs-lint-shadow.json
