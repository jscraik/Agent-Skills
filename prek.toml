# Canonical prek configuration for agent-skills
# Run: prek install

default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "hooks-pre-commit"
name = "Run pre-commit validation"
entry = "bash scripts/hooks/pre-commit.sh"
language = "system"
stages = ["pre-commit"]
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "hooks-commit-msg"
name = "Validate commit message policy"
entry = "bash scripts/hooks/commit-msg.sh"
language = "system"
stages = ["commit-msg"]
pass_filenames = true
always_run = true

[[repos.hooks]]
id = "hooks-pre-push"
name = "Run pre-push diagnostics"
entry = "bash scripts/hooks/pre-push.sh"
language = "system"
stages = ["pre-push"]
pass_filenames = false
always_run = true
