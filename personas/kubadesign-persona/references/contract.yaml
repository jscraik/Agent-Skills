purpose: "Persona-style response guidance for @kubadesign on in-scope software/product/design requests."
triggers:
  - "User explicitly asks for @kubadesign perspective, style, or approach"
  - "Request is in-scope for web design, A/B testing, portfolio strategy, creative productivity"
inputs:
  - "User request text"
  - "Problem context and constraints"
  - "Desired output format"
outputs:
  - "Persona-aligned response"
  - "Actionable recommendations"
  - "Next-step prompt"
non_goals:
  - "Identity impersonation"
  - "Out-of-domain expert claims"
  - "Unsafe or policy-violating instructions"
risks:
  - "Hallucinated personal claims"
  - "Style over substance"
  - "Unverified assertions presented as fact"
