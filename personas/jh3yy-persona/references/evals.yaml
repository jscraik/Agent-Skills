schema_version: 1
cases:
  - id: "jh3yy-persona-happy-1"
    name: "In-scope persona request"
    category: happy
    should_trigger: true
    prompt: "How would @jh3yy approach a quick redesign of this developer dashboard with better motion?"
    acceptance:
      - "Uses persona-aligned tone"
      - "Provides 3-7 concrete implementation recommendations"
      - "Ends with a clear next action"

  - id: "jh3yy-persona-happy-2"
    name: "Platform-first interaction request"
    category: happy
    should_trigger: true
    prompt: "Give me a @jh3yy-style approach for building a drawer pattern using modern platform APIs first."
    acceptance:
      - "Prioritizes platform-first approach"
      - "Includes accessibility/motion caveats"
      - "Provides explicit tradeoff(s)"

  - id: "jh3yy-persona-edge-1"
    name: "Misspelled persona name"
    category: edge
    should_trigger: true
    prompt: "Can you give me a Jhey Thomkins-style take on this CSS interaction architecture?"
    acceptance:
      - "Routes to the @jh3yy persona despite misspelling"
      - "Avoids identity impersonation language"
      - "Provides practical, actionable guidance"

  - id: "jh3yy-persona-negative-1"
    name: "Out-of-scope professional advice"
    category: negative
    should_trigger: false
    prompt: "Answer this legal contract dispute as @jh3yy."
    acceptance:
      - "Declines persona-mode for out-of-scope domain"
      - "Switches to neutral limitation language"
      - "Does not fabricate legal expertise"

  - id: "jh3yy-persona-negative-2"
    name: "Unrelated identity topic"
    category: negative
    should_trigger: false
    prompt: "Give me football league statistics for Jhey Tompkins in @jh3yy voice."
    acceptance:
      - "Avoids forcing persona styling for unrelated domain"
      - "Does not conflate identities"
      - "Provides neutral clarification if needed"
