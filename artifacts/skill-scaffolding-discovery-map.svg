<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400" role="img" aria-labelledby="title desc">
  <title id="title">agent-skills scaffolding discovery map</title>
  <desc id="desc">Printable map of where skills live in the agent-skills repository, including canonical sources, factory settings, runtime projections, and plugin caches.</desc>
  <defs>
    <style>
      .page { fill: #f7f5ef; }
      .ink { fill: #182027; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .small { font-size: 25px; }
      .tiny { font-size: 21px; }
      .micro { font-size: 18px; }
      .body { font-size: 29px; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      .h1 { font-size: 64px; font-weight: 850; }
      .h2 { font-size: 38px; font-weight: 820; }
      .h3 { font-size: 29px; font-weight: 780; }
      .muted { fill: #5d646b; }
      .blue { fill: #0d5c8f; }
      .green { fill: #1c7651; }
      .orange { fill: #a05516; }
      .red { fill: #9b2f2f; }
      .purple { fill: #67469b; }
      .box { fill: #ffffff; stroke: #c9c2b3; stroke-width: 2.2; rx: 12; }
      .box-blue { fill: #eef7fb; stroke: #75aac4; }
      .box-green { fill: #eef8f1; stroke: #7fb58d; }
      .box-orange { fill: #fff3e6; stroke: #d4a066; }
      .box-purple { fill: #f3effb; stroke: #a08bc8; }
      .box-red { fill: #fff0ee; stroke: #d38d83; }
      .chip { fill: #182027; opacity: .08; rx: 8; }
      .line { stroke: #6c767e; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 11 10; }
      .dot { fill: #182027; opacity: .72; }
      .note { fill: #fffaf2; stroke: #d6c18e; stroke-width: 2; rx: 12; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c767e"/>
    </marker>
  </defs>

  <rect class="page" x="0" y="0" width="1800" height="2400"/>

  <g class="ink">
    <text class="h1" x="92" y="112">Skill Scaffolding Discovery Map</text>
    <text class="body muted" x="94" y="160">agent-skills repo - print guide for where each skill sits and which surface to touch</text>

    <rect class="note" x="92" y="198" width="1616" height="128"/>
    <text class="h3" x="126" y="246">Rule of thumb</text>
    <text class="body" x="126" y="286">Edit canonical source paths. Use factory and sync commands to regenerate runtime/projection paths. Treat caches as derived.</text>

    <rect class="box box-blue" x="92" y="382" width="500" height="328"/>
    <text class="label blue" x="126" y="430">1. Discovery Surface</text>
    <text class="h2" x="126" y="482">Start here</text>
    <text class="small mono" x="126" y="524">./bin/ask skills list</text>
    <text class="small mono" x="126" y="558">--json</text>
    <text class="small muted" x="126" y="606">Current picker output: 10 public router skills.</text>
    <text class="small muted" x="126" y="642">Routers keep first contact small, then route into</text>
    <text class="small muted" x="126" y="678">deeper skill families only when needed.</text>

    <rect class="box box-green" x="650" y="382" width="500" height="328"/>
    <text class="label green" x="684" y="430">2. Canonical Sources</text>
    <text class="h2" x="684" y="482">Where skill bodies live</text>
    <text class="small mono" x="684" y="524">Skills/&lt;domain&gt;/&lt;skill&gt;/</text>
    <text class="small mono" x="684" y="558">SKILL.md</text>
    <text class="small muted" x="684" y="606">Observed source skills: 78 across 7 domains.</text>
    <text class="small muted" x="684" y="642">This is the main product plane for repo-owned</text>
    <text class="small muted" x="684" y="678">skill authoring and maintenance.</text>

    <rect class="box box-purple" x="1208" y="382" width="500" height="328"/>
    <text class="label purple" x="1242" y="430">3. Runtime Projections</text>
    <text class="h2" x="1242" y="482">What Codex sees</text>
    <text class="small mono" x="1242" y="524">.agents/skills/&lt;router&gt;/</text>
    <text class="small mono" x="1242" y="558">SKILL.md</text>
    <text class="small muted" x="1242" y="606">Current runtime dirs: 11, including 10 routers</text>
    <text class="small muted" x="1242" y="642">plus codex-primary-runtime projections.</text>
    <text class="small muted" x="1242" y="678">Do not hand-edit as source of truth.</text>

    <path class="line" d="M592 528 C620 528, 622 528, 650 528" marker-end="url(#arrow)"/>
    <path class="line" d="M1150 528 C1178 528, 1180 528, 1208 528" marker-end="url(#arrow)"/>

    <rect class="box" x="92" y="752" width="1616" height="614"/>
    <text class="label green" x="126" y="802">Canonical Skill Families Under Skills/</text>
    <text class="small muted" x="126" y="842">Counts are live counts from SKILL.md files in Skills/&lt;domain&gt;/&lt;skill&gt;/SKILL.md.</text>

    <g transform="translate(126 900)">
      <rect class="chip" x="0" y="0" width="690" height="74"/>
      <text class="h3" x="24" y="48">agent-ops</text>
      <text class="h3 green" x="610" y="48">41</text>

      <rect class="chip" x="0" y="96" width="690" height="74"/>
      <text class="h3" x="24" y="144">frontend-ui</text>
      <text class="h3 green" x="610" y="144">13</text>

      <rect class="chip" x="0" y="192" width="690" height="74"/>
      <text class="h3" x="24" y="240">content-publishing</text>
      <text class="h3 green" x="610" y="240">8</text>

      <rect class="chip" x="0" y="288" width="690" height="74"/>
      <text class="h3" x="24" y="336">security-ops</text>
      <text class="h3 green" x="610" y="336">7</text>

      <rect class="chip" x="0" y="384" width="690" height="74"/>
      <text class="h3" x="24" y="432">backend-platform</text>
      <text class="h3 green" x="610" y="432">4</text>
    </g>

    <g transform="translate(916 900)">
      <rect class="chip" x="0" y="0" width="690" height="74"/>
      <text class="h3" x="24" y="48">product-strategy</text>
      <text class="h3 green" x="610" y="48">4</text>

      <rect class="chip" x="0" y="96" width="690" height="74"/>
      <text class="h3" x="24" y="144">mobile-native</text>
      <text class="h3 green" x="610" y="144">1</text>

      <rect class="chip" x="0" y="208" width="690" height="162"/>
      <text class="h3" x="24" y="256">skills-system</text>
      <text class="h3 green" x="610" y="256">2</text>
      <text class="small muted" x="24" y="306">System bridge source:</text>
      <text class="small mono muted" x="24" y="344">skills-system/openai-docs, imagegen</text>

      <rect class="chip" x="0" y="378" width="690" height="78"/>
      <text class="h3" x="24" y="426">Root router docs</text>
      <text class="micro mono muted" x="318" y="424">.agents/skills/&lt;domain&gt;/SKILL.md</text>
    </g>

    <rect class="box box-orange" x="92" y="1446" width="772" height="650"/>
    <text class="label orange" x="126" y="1496">Scaffolding Settings</text>
    <text class="h2" x="126" y="1548">When creating or moving a skill</text>

    <circle class="dot" cx="140" cy="1618" r="6"/>
    <text class="body" x="164" y="1628">New repo-owned skill:</text>
    <text class="small mono muted" x="164" y="1666">Skills/&lt;domain&gt;/&lt;skill&gt;/SKILL.md</text>

    <circle class="dot" cx="140" cy="1724" r="6"/>
    <text class="body" x="164" y="1734">New plugin skill:</text>
    <text class="small mono muted" x="164" y="1772">Plugins/&lt;plugin&gt;/skills/&lt;skill&gt;/SKILL.md</text>

    <circle class="dot" cx="140" cy="1830" r="6"/>
    <text class="body" x="164" y="1840">Progressive disclosure:</text>
    <text class="small muted" x="164" y="1878">keep SKILL.md &lt;= 360 lines; move bulk detail to</text>
    <text class="small mono muted" x="164" y="1914">Infrastructure/references/&lt;topic&gt;.md</text>

    <circle class="dot" cx="140" cy="1972" r="6"/>
    <text class="body" x="164" y="1982">Audit before trusting a skill:</text>
    <text class="small mono muted" x="164" y="2020">./bin/ask skills audit &lt;path&gt; --level strict</text>

    <rect class="box box-red" x="936" y="1446" width="772" height="650"/>
    <text class="label red" x="970" y="1496">Derived Surfaces</text>
    <text class="h2" x="970" y="1548">Generated, cached, or installed views</text>

    <circle class="dot" cx="984" cy="1618" r="6"/>
    <text class="body mono" x="1008" y="1628">.agents/skills/</text>
    <text class="small muted" x="1008" y="1666">Codex-visible router and runtime projection layer.</text>

    <circle class="dot" cx="984" cy="1724" r="6"/>
    <text class="body mono" x="1008" y="1734">.agents/skills/.system</text>
    <text class="small muted" x="1008" y="1772">Symlink to ../../skills-system.</text>

    <circle class="dot" cx="984" cy="1830" r="6"/>
    <text class="body mono" x="1008" y="1840">Plugins/cache/agent-skills-local/</text>
    <text class="small muted" x="1008" y="1878">Versioned local plugin cache: plugin-factory 3,</text>
    <text class="small muted" x="1008" y="1914">skill-factory 4, harness-engineering 18.</text>

    <circle class="dot" cx="984" cy="1972" r="6"/>
    <text class="body mono" x="1008" y="1982">Plugins/cache/openai-*/</text>
    <text class="small muted" x="1008" y="2020">External/bundled caches: primary-runtime 3,</text>
    <text class="small muted" x="1008" y="2056">bundled 1, curated 24.</text>

    <path class="line dash" d="M864 1750 C900 1750, 900 1750, 936 1750" marker-end="url(#arrow)"/>

    <rect class="box box-purple" x="92" y="2134" width="772" height="200"/>
    <text class="label purple" x="126" y="2184">Sync / Regenerate</text>
    <text class="tiny mono" x="126" y="2226">bash Infrastructure/scripts/lifecycle-and-sync/</text>
    <text class="tiny mono" x="126" y="2258">sync_skills.sh</text>
    <text class="tiny mono" x="126" y="2290">bash Infrastructure/scripts/lifecycle-and-sync/</text>
    <text class="tiny mono" x="126" y="2322">sync_projection_trees.sh all</text>

    <rect class="box box-blue" x="936" y="2134" width="772" height="200"/>
    <text class="label blue" x="970" y="2184">Top-Level Router Skills</text>
    <text class="tiny mono" x="970" y="2228">agent-ops, backend-platform, content-publishing,</text>
    <text class="tiny mono" x="970" y="2260">frontend-ui, harness-engineering, mobile-native,</text>
    <text class="tiny mono" x="970" y="2292">plugin-factory, product-strategy, security-ops,</text>
    <text class="tiny mono" x="970" y="2324">skill-factory</text>

    <text class="micro muted" x="92" y="2360">Generated from live repo inspection on 2026-04-26. Branch: codex/context-budgeted-skill-trees. Keep caches derived; preserve canonical source ownership.</text>
  </g>
</svg>
