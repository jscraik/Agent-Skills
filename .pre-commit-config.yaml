# Prek configuration (pre-commit compatible)
# Install: prek install
# Run manually: prek run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # Local hooks for this project
  - repo: local
    hooks:
      # Prevent nested .git directories (breaks skill loading)
      - id: check-nested-git
        name: Check for nested .git directories
        entry: bash -c 'find . -path "./.git" -prune -o -name ".git" -type d -print | grep -q . && echo "❌ Nested .git directories found - these break skill loading" && exit 1 || echo "✅ No nested .git" && exit 0'
        language: system
        pass_filenames: false

      # Skill diagnostics on push
      - id: skill-diagnostics
        name: Run skill diagnostics
        entry: python3 scripts/diagnose_skill.py --all
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Docs lint
      - id: docs-lint
        name: Docs lint
        entry: python3 scripts/docs_lint.py --mode warn --config docs-policy.json
        language: system
        pass_filenames: false
        files: ^docs/
