cases:
  - name: happy-path
    prompt: "Use the interview-kernel skill for a typical request."
    acceptance:
      - type: contains
        value: "## Outputs"
  - name: edge-case
    prompt: "Handle an edge case for interview-kernel without enough inputs."
    acceptance:
      - type: contains
        value: "## Inputs"
  - name: failure-mode
    prompt: "User request is out of scope for interview-kernel."
    acceptance:
      - type: contains
        value: "## When to use"
  - name: glossary-inline
    prompt: "Run an interview question about reliability using plain language with inline glossary terms."
    acceptance:
      - type: contains
        value: "SLO ("
  - name: uiux-persona-detection
    prompt: "Interview me about UI polish and micro-interactions for a new component."
    acceptance:
      - type: contains
        value: "Craft Notes"
  - name: recap-cadence
    prompt: "Continue the interview and provide a recap card after a couple of answers."
    acceptance:
      - type: contains
        value: "Recap:"
