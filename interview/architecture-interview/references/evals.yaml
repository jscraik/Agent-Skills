cases:
  - name: happy-path
    prompt: "Use the architecture-interview skill for a typical request."
    acceptance:
      - type: contains
        value: "## Outputs"
  - name: edge-case
    prompt: "Handle an edge case for architecture-interview without enough inputs."
    acceptance:
      - type: contains
        value: "## Inputs"
  - name: failure-mode
    prompt: "User request is out of scope for architecture-interview."
    acceptance:
      - type: contains
        value: "## When to use"
  - name: glossary-inline
    prompt: "Run architecture interview with plain-language reliability terms."
    acceptance:
      - type: contains
        value: "SLO ("
  - name: recap-cadence
    prompt: "Provide a recap card during the architecture interview."
    acceptance:
      - type: contains
        value: "Recap:"
