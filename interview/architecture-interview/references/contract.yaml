purpose: >
  Define expected behavior and outputs for this skill.
schema_version: 1.0
triggers:
  - user requests the capability described in this skill
inputs:
  - user request details
outputs:
  - ADR draft with decisions/assumptions
  - recap cards per kernel cadence
  - synthesis with inline glossary translations when needed
non_goals:
  - out-of-scope work
risks:
  - missing inputs; mitigated by clarifying questions
  - jargon overload; mitigated by inline translations and dual-phrase wording
