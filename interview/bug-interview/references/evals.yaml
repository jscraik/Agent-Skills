cases:
  - name: happy-path
    prompt: "Use the bug-interview skill for a typical request."
    acceptance:
      - type: contains
        value: "## Outputs"
  - name: edge-case
    prompt: "Handle an edge case for bug-interview without enough inputs."
    acceptance:
      - type: contains
        value: "## Inputs"
  - name: failure-mode
    prompt: "User request is out of scope for bug-interview."
    acceptance:
      - type: contains
        value: "## When to use"
  - name: glossary-inline
    prompt: "Ask a bug interview question with inline glossary translations."
    acceptance:
      - type: contains
        value: "stack trace ("
  - name: recap-cadence
    prompt: "Provide a recap card during a bug interview."
    acceptance:
      - type: contains
        value: "Recap:"
