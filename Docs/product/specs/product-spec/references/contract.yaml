purpose: >
  Define expected behavior and outputs for the product-spec skill (documentation/spec generation only).
schema_version: 1.2
triggers:
  - user asks for an end-to-end PRD/Foundation + UX spec + build plan
  - user asks to review an existing PRD/repo and identify product/UX/build-plan gaps (no implementation)
  - user asks to design a robot-mode or agent-operator interface, command surface, or output contract without implementing it
inputs:
  - mode (full_pipeline|clarify_prd|ux_only|api_spec|arch_spec|operator_spec|testplan) and any constraints (timeline, budget, non-negotiables)
  - starting point (idea summary and/or doc paths)
  - evidence sources when available (metrics, feedback, tickets); otherwise mark Evidence gaps
outputs:
  - Foundation Spec (file under .spec/)
  - UX Spec (file under .spec/)
  - Build Plan (file under .spec/)
  - Operator Interface Spec when mode is operator_spec
  - Evidence Gaps + Evidence Map
non_goals:
  - implementing product code, migrations, deployments, or refactors
  - inventing evidence (must mark Evidence gap instead)
risks:
  - missing inputs; mitigated by clarifying questions
output_contracts:
  foundation_spec:
    schema_version: 1
    required_sections:
      - Problem & Job
      - Success Criteria
      - Scope (In / Out)
      - Primary Journey (Happy Path)
      - Assumptions
      - Evidence Gaps
      - Evidence Map
    required_rules:
      - "each paragraph ends with Evidence: or Evidence gap:"
  ux_spec:
    schema_version: 1
    required_sections:
      - Mental Model
      - Information Architecture
      - Affordances & Actions
      - Cognitive Load
      - State Design
      - Flow Integrity
      - UX Acceptance Criteria
      - Evidence Gaps
      - Evidence Map
    required_rules:
      - "each paragraph ends with Evidence: or Evidence gap:"
  build_plan:
    schema_version: 1
    required_sections:
      - Outcome → Opportunities → Solution
      - Key Assumptions & Risks
      - Epics (Sequenced)
      - Stories (with Acceptance Criteria + Tests + Telemetry)
      - Release & Measurement Plan
      - Evidence Gaps
      - Evidence Map
    required_rules:
      - "each paragraph ends with Evidence: or Evidence gap:"
  operator_interface_spec:
    schema_version: 1
    required_sections:
      - Problem Statement
      - Goals and Non-Goals
      - Command Taxonomy
      - Quick-Start Behavior
      - Output Contracts
      - Error Envelope
      - Compatibility and Versioning
      - Operational Workflow
      - Evidence Gaps
      - Evidence Map
    required_rules:
      - "machine-readable mode is the default compatibility surface"
      - "human-readable mode is explicit"
      - "machine-readable examples include schema_version"
      - "error behavior teaches the next correct action"
  adversarial_review_report:
    schema_version: 1
    required_sections:
      - Executive Summary
      - Persona Findings
      - Evidence Gaps
      - Evidence Map
    required_rules:
      - each paragraph ends with Evidence or Evidence gap
      - severity tags used for findings (ERROR/WARN/INFO)
