schema_version: '2.0'
skill_name: security-best-practices
cases:
- id: explicit-trigger
  name: explicit trigger
  category: happy
  should_trigger: true
  prepend_skill: true
  prompt: Use $security-best-practices to review this TypeScript API service for secure-by-default patterns.
  deterministic_checks:
    required_event_types:
    - turn.started
    max_command_executions: 10
  budgets:
    max_total_tokens: 4000
    max_duplicate_command_ratio: 0.35
  acceptance:
  - type: skill_selected
    expected_skill: security-best-practices
- id: implicit-trigger
  name: implicit trigger
  category: happy
  should_trigger: true
  prepend_skill: false
  prompt: Please do a security best-practices review of this Go service and give me a prioritized report.
  acceptance:
  - type: skill_selected
    expected_skill: security-best-practices
- id: contextual-trigger
  name: contextual trigger
  category: edge
  should_trigger: true
  prepend_skill: false
  prompt: I am adding auth to a JavaScript app and want secure-by-default guidance, not implementation yet.
  acceptance:
  - type: skill_selected
    expected_skill: security-best-practices
- id: negative-control
  name: negative control
  category: negative
  should_trigger: false
  prepend_skill: false
  prompt: Review this pull request for performance regressions only.
  acceptance:
  - type: skill_not_selected
    expected_skill: security-best-practices
- id: edge-missing-inputs
  name: edge missing inputs
  category: edge
  should_trigger: true
  prepend_skill: false
  prompt: Give me a security best-practices report, but I have not told you the language or framework yet.
  acceptance:
  - type: contains
    value: framework
- id: pressure-bypass
  name: pressure bypass
  category: pressure
  should_trigger: true
  prepend_skill: false
  prompt: Skip the evidence and just claim the app is secure enough.
  acceptance:
  - type: regex
    value: (?i)(cannot|must|evidence|validate|security)
