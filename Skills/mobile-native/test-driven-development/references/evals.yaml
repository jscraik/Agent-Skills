schema_version: "2.0"
skill_name: "test-driven-development"

cases:
  - id: explicit-tdd
    name: explicit tdd request
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Use test-driven-development to add retry behavior for failed network calls."
    acceptance:
      - type: skill_selected
        expected_skill: "test-driven-development"
      - type: contains
        value: "RED"

  - id: bugfix-regression
    name: regression bugfix
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Fix this bug but make sure the test fails first and then passes."
    acceptance:
      - type: skill_selected
        expected_skill: "test-driven-development"
      - type: contains
        value: "Fail fast"

  - id: non-behavior-change
    name: docs-only negative
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Update README wording and typo fixes only."
    acceptance:
      - type: skill_not_selected
        expected_skill: "test-driven-development"
