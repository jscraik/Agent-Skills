schema_version: 1
skill: video-transcript-downloader
purpose: "Download video/audio sources and extract transcripts, subtitles, or media metadata with local wrappers."
triggers:
  - "Download, transcribe, inspect, summarize, or convert video and audio sources. Use when the user wants transcripts, subtitles, audio extraction, or media downloads from a video source."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "media URL or path"
  - "desired output"
  - "download policy"
  - "transcript/subtitle preference"
  - "destination path"
outputs:
  - "transcript or media artifact"
  - "wrapper command"
  - "validation evidence"
  - "copyright or access blocker"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
