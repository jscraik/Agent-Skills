schema_version: 1
skill: release-notes
purpose: "Draft evidence-backed release notes and changelog entries. Use this skill when PR notes, GitHub releases, or npm handoff need traceability."
triggers: ["Use when the user request matches the skill scope."]
non_goals: ["Route unrelated work away from this skill."]
inputs: [user_request, target_context, evidence]
outputs: [result, evidence_summary, validation_status, release_notes_handoff_v1]
risks: [over_triggering, untrusted_input, validation_drift]
safety: {untrusted_inputs: true, redact_secrets: true, destructive_commands: false}
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
  - release_notes_handoff_v1_required_for_npm_handoff
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
