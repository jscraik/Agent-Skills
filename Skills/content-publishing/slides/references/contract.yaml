schema_version: 1
skill: slides
purpose: "Create, edit, validate, or debug PowerPoint-compatible slide decks with evidence-backed visual review."
triggers:
  - "Use when the user needs .pptx output, deck recreation, slide editing, or deck validation."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "source material or deck path"
  - "output path"
  - "mode"
  - "aspect ratio"
  - "validation tooling"
outputs:
  - "editable deck or blocker"
  - "rebuildable source"
  - "validation evidence"
  - "risks"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
