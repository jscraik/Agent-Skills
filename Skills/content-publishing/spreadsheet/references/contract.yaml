schema_version: 1
skill: spreadsheet
purpose: "Create, edit, analyze, or validate spreadsheets with formula and formatting evidence."
triggers:
  - "Use when the user needs .xlsx, .csv, or .tsv work with formulas, formatting, charts, analysis, or recalculation checks."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "source data or workbook"
  - "destination path"
  - "mode"
  - "formula expectations"
  - "validation tooling"
outputs:
  - "spreadsheet artifact or blocker"
  - "formula evidence"
  - "formatting notes"
  - "validation result"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
