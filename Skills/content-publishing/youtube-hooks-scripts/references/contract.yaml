schema_version: 1
skill: youtube-hooks-scripts
purpose: "Generate, review, or refine technical YouTube hooks, outlines, and scripts."
triggers:
  - "Use when the user wants technical YouTube scripting help tailored to a topic, audience, and runtime."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "topic"
  - "audience"
  - "output shape"
  - "runtime"
  - "source notes"
outputs:
  - "hooks outline or script"
  - "audience fit notes"
  - "evidence gaps"
  - "payoff check"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
