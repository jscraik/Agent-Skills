schema_version: 1.0
purpose: Diagnose process-level resource issues using the bundled process-watch workflow.
triggers:
  - User asks what process is consuming CPU, memory, disk, network, or a port.
  - User needs process-level monitoring or culprit identification.
inputs:
  - Symptom, PID, process name, or port number.
  - Whether diagnostics only or termination is requested.
outputs:
  - Culprit shortlist with supporting process evidence.
  - Safe next-step guidance.
non_goals:
  - Broad system tuning unrelated to process diagnosis.
  - Destructive process termination without explicit direction.
risks:
  - Single-snapshot conclusions can be misleading.
  - Sensitive command-line or environment data may appear in process details.
