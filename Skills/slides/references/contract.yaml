schema_version: "1.0"
purpose: Execute slide deck creation, editing, recreation, and validation workflows with editable PowerPoint output and explicit review evidence.
triggers:
  - user explicitly requests slide or PowerPoint help
  - request semantics clearly match deck creation, editing, recreation, or layout validation
  - a presentation-specific workflow is preferable to generic design advice
inputs:
  - user goal and slide deck context
  - source material, output paths, and formatting constraints
  - dependency, font, rendering, and approval boundaries
outputs:
  - presentation artifact aligned to the request
  - rebuildable source when authoring or substantial edits are in scope
  - evidence-backed summary of rendering, overflow, font, and layout validation
non_goals:
  - unrelated web UI or document formatting tasks
  - general image generation or brand exploration without deck output
  - unverifiable claims about rendering or editability
  - unsafe handling of secrets or sensitive slide content
risks:
  - missing local presentation or image tools can block rendering workflows
  - dense layouts can overflow the canvas without visual review
  - typography can drift if theme fonts are not set explicitly
  - speaker notes or hidden slide metadata can leak if not handled deliberately
