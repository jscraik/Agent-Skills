schema_version: "1.0"

purpose: >
  Ensure completion or success claims are backed by fresh command output and
  explicit verification evidence.

triggers:
  - User asks to confirm completion, correctness, or passing status
  - Agent is about to make a success claim before PR/merge

inputs:
  - The claim being made
  - Verification command(s)
  - Current execution context and output

outputs:
  - Verified status with supporting evidence
  - Blocked status with remediation when verification fails
  - Next-step guidance

non_goals:
  - Root-cause debugging workflow
  - Broad quality reviews beyond the scoped claim

risks:
  - False completion claims from stale output
  - Incomplete checks that miss failing gates
  - Loss of trust from unverified assertions
