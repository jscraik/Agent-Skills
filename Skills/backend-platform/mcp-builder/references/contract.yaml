schema_version: 1
skill: mcp-builder
purpose: "Build or review MCP servers with clear tool contracts, structured outputs, least-privilege auth, and reproducible validation."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "target service"
  - "transport choice"
  - "auth method"
  - "candidate tools"
  - "schemas"
  - "rate limits and data sensitivity"
outputs:
  - "tool and resource plan"
  - "schema contracts"
  - "safety gates"
  - "verification plan"
  - "rollout risks"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
