schema_version: 1
skill: backend-engineer
purpose: "Plan and review safe backend extensions for existing services."
triggers:
  - "Plan, implement, and validate backend service changes. Use when patching or adding backend features in an existing API, data, auth, worker, or service codebase."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "service root"
  - "requested behavior"
  - "existing contract"
  - "data/auth constraints"
  - "validation command"
outputs:
  - "implementation plan"
  - "touch points"
  - "patch guidance"
  - "verification evidence"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
