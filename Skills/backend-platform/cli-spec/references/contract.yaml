schema_version: 1
skill: cli-spec
purpose: "Produce CLI implementation contracts that are deterministic, agent-friendly, testable, and safe to build from."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "CLI goal"
  - "target users and agents"
  - "command tree"
  - "state-changing operations"
  - "output and error requirements"
outputs:
  - "CLI implementation contract"
  - "JSON output schemas"
  - "dry-run behavior"
  - "error model"
  - "validation plan"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
