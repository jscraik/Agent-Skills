schema_version: "1.0"
name: shadcn-ui
purpose: >
  Guide setup, installation, customization, and troubleshooting for shadcn/ui
  components in existing projects while preserving project ownership,
  accessibility, and token alignment.
triggers:
  - Need to initialize or verify shadcn/ui in a repo.
  - Need to add or customize a shadcn/ui component or registry item.
  - Need troubleshooting guidance for shadcn/ui configuration, imports, or theming.
inputs:
  - Target repo or project path.
  - Framework and styling context.
  - Requested component, block, or customization goal.
  - Any accessibility or theming constraints.
outputs:
  - Setup or integration guidance.
  - Required config, dependency, and file-placement changes.
  - Validation steps for the resulting component integration.
non_goals:
  - Full design-system rewrites unrelated to shadcn/ui.
  - Generic frontend work with no shadcn/ui angle.
  - Forcing installation when the host repo is not ready.
risks:
  - Installing components into a repo without matching Tailwind or alias setup.
  - Breaking accessibility when customizing primitives or variants.
  - Drifting from token usage into hardcoded visual values.
