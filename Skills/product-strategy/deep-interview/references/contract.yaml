schema_version: 1
skill: deep-interview
purpose: "Deepen an existing doc, ticket, note, or topic through a structured gap-filling interview."
triggers:
  - "Analyze, deepen, and validate an existing doc or topic through a structured interview. Use when refining PRDs, Linear tickets, notes, or draft specs before planning or execution."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "existing draft"
  - "target outcome"
  - "known decisions"
  - "open questions"
  - "approval posture"
outputs:
  - "gap list"
  - "next interview question"
  - "resolved assumptions"
  - "approval-ready summary"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
