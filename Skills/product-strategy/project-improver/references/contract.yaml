purpose: >
  Improve an existing project by generating many candidate upgrades, rejecting weak ones,
  shortlisting the strongest ideas, pressure-testing the plan, and optionally implementing
  the highest-leverage improvements.
schema_version: 1.0
triggers:
  - improve this project, app, repo, workflow, or system
  - generate many ideas and only keep the best ones
  - run a premortem on an improvement plan
  - compare multiple plans and create a better hybrid
  - tell me what you actually think of this project
inputs:
  - target project, artifact, or codebase
  - goals, constraints, and current pain points when available
  - optional competing plans, critiques, metrics, or user feedback
outputs:
  - candid project assessment
  - candidate improvement list
  - keep or reject decisions with reasons
  - detailed plans for retained ideas
  - premortem and revised plan when requested
  - implementation of top ideas when explicitly requested
non_goals:
  - shallow praise without critical filtering
  - implementing every possible improvement in one pass
  - using this skill for narrow bug fixes that need direct coding instead
grounding:
  - for live project improvement, inspect the current codebase and adjacent docs before major recommendations
  - for live-plan improvement, inspect the plan and validate recommendations against the current codebase before implementation
risks:
  - idea sprawl; mitigate with explicit rejection and top-idea prioritization
  - novelty bias; mitigate with practicality and adoption scoring
  - overbuilding; mitigate by favoring high-leverage reversible improvements
