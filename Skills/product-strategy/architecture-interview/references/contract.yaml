schema_version: 1
skill: architecture-interview
purpose: "Analyze architecture alternatives through a structured interview and capture Linear-ready decisions."
triggers:
  - "Use when the user needs architecture tradeoffs surfaced before implementation or a Linear decision note instead of an ADR."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "decision statement"
  - "candidate options"
  - "constraints"
  - "drivers"
  - "Linear context"
outputs:
  - "next interview question"
  - "recommended option"
  - "sacrifices"
  - "Linear-ready decision note"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
