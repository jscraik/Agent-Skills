schema_version: 1
skill: security-best-practices
purpose: "Provide focused, language-aware security review and remediation guidance tied to real code, architecture, and operational context."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "repo or file scope"
  - "language and framework"
  - "deployment context"
  - "sensitive data handled"
  - "existing security controls"
outputs:
  - "prioritized findings"
  - "risk rationale"
  - "recommended fixes"
  - "verification steps"
  - "residual risks"
risks:
