schema_version: 1
skill: create-auth
purpose: "Implement or migrate Better Auth in TypeScript or JavaScript apps with secure defaults."
triggers:
  - "Create, migrate, or validate Better Auth implementation work. Use when the user wants Better Auth added or changed in code, including OAuth, passkeys, 2FA, magic links, or org flows."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "app framework"
  - "existing auth state"
  - "desired auth features"
  - "data model"
  - "deployment constraints"
outputs:
  - "implementation plan"
  - "code touch points"
  - "security checks"
  - "validation evidence"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
