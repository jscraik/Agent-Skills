schema_version: 1
skill: security-threat-model
purpose: "Produce actionable, repo-grounded threat models that connect assets, trust boundaries, attacker goals, abuse paths, and mitigations."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "repo root or feature scope"
  - "architecture evidence"
  - "deployment and exposure assumptions"
  - "auth and data sensitivity"
  - "existing controls"
outputs:
  - "asset map"
  - "trust boundaries"
  - "attacker goals"
  - "abuse paths"
  - "mitigations"
  - "open assumptions"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
