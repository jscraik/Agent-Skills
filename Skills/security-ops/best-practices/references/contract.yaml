schema_version: 1
skill: best-practices
purpose: "Audit Better Auth integrations for secure patterns, configuration mistakes, and operational gaps."
triggers:
  - "Audit, review, and harden Better Auth integrations. Use when the user wants Better Auth security review, config debugging, provider hardening, session checks, or operational risk guidance."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "auth integration files"
  - "providers"
  - "session config"
  - "deployment context"
  - "known symptom"
outputs:
  - "security findings"
  - "risk priority"
  - "minimal remediation"
  - "validation checks"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
