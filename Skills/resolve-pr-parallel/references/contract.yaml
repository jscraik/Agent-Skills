schema_version: 1
purpose: >
  Batch-resolve unresolved GitHub PR review threads by implementing requested changes,
  answering reviewer questions, committing and pushing updates, resolving completed
  threads, and verifying that no unresolved non-outdated threads remain. Includes
  an interactive summary phase to align with user priorities.

triggers:
  - Requests to handle all remaining PR feedback on a PR
  - Requests to summarize or clear unresolved GitHub review threads after fixes
  - Requests for parallel PR-comment remediation or batch review-comment resolution

inputs:
  - pr identifier (number, URL, or current-branch PR context)
  - repo context (local path or owner/repo) when auto-discovery fails
  - permission to edit code, commit, push, and resolve threads when not already implied

outputs:
  - Interactive status reports of open and resolved threads
  - Human-readable summary of the remediation outcome
  - Structured output matching required_output fields when requested

risks:
  - Missing gh authentication or insufficient repo permissions
  - Dirty working tree conflicting with remediation changes
  - Resolving threads before fixes or replies are actually ready
  - Large PRs with paginated thread data
  - Reviewer questions that still require human judgment

modes:
  - resolve_all
  - verify_only

required_output:
  mode: string
  repo:
    nameWithOwner: string
    localPath: string
  pr:
    number: integer
    url: string
    head: string
    base: string
    state: string
  status:
    enum: [ready, blocked, in_progress, completed, failed]
  unresolved_thread_count_before: integer
  unresolved_thread_count_after: integer
  batches_planned: integer
  actions_taken:
    type: array
    items: string
  threads:
    type: array
    items:
      type: object
      fields:
        thread_id: string
        path: string
        line: integer
        outcome:
          enum: [fixed, replied, blocked, skipped]
        files_changed:
          type: array
          items: string
        tests:
          type: array
          items: string
        still_needs_human: boolean
        reply_text:
          type: string
          required: false
  evidence:
    type: array
    items:
      type: object
      fields:
        kind: string
        label: string
        value: string
  next_step: string
  risks:
    type: array
    items: string

defaults:
  mode: resolve_all
  batch_size: 4
  verify_target: unresolved_non_outdated_threads

non_goals:
  - PR readiness audits or merge recommendations
  - Generic code review without remediation
  - CI-only diagnosis
  - Force-push and history rewriting by default
