schema_version: 1
skill: design-system
purpose: "Keep design-system work grounded in canonical token, alias, component, and documentation contracts instead of generic style advice."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "user goal"
  - "target package or component"
  - "token layer"
  - "theme constraints"
  - "canonical design docs"
outputs:
  - "design-system finding or patch"
  - "canonical file evidence"
  - "layer impact"
  - "validation commands"
  - "open tradeoffs"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
