schema_version: 1
skill: fixing-metadata
purpose: "Audit and fix page metadata, canonical URLs, social cards, icons, structured data, and robots directives."
triggers:
  - "Audit, fix, and validate HTML metadata. Use when shipping pages that need titles, descriptions, canonical URLs, Open Graph tags, Twitter cards, favicons, JSON-LD, or robots directives."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "page or route"
  - "site URL policy"
  - "framework metadata pattern"
  - "preview requirements"
  - "validation tooling"
outputs:
  - "metadata patch"
  - "consistency notes"
  - "preview evidence"
  - "remaining gaps"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
