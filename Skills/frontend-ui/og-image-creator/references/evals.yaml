  - {id: edge-validation, name: validation evidence, category: edge, eval_modes: [release], should_trigger: true, prepend_skill: false, prompt: "Finish and report exact validation evidence.", deterministic_checks: {forbidden_commands: [curl, wget, "rm -rf", nc]}, acceptance: [{type: skill_selected, expected_skill: og-image-creator}, {type: regex, value: "(?i)(validation|pass|fail)"}]}
