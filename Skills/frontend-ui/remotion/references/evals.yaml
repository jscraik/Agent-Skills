schema_version: "2.0"
skill_name: "remotion"

cases:
  - id: composition-timing-guidance
    name: composition timing guidance request
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "My scene transitions feel choppy and timing keeps drifting. Can you help me make playback deterministic?"
    acceptance:
      - type: skill_selected
        expected_skill: "remotion"
      - type: contains
        value: "## Deliverables"

  - id: asset-decode-risk
    name: asset decode risk check
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Before I render this video, I want to verify decode support and asset reliability so CI does not fail late."
    acceptance:
      - type: regex
        value: "(?i)(decode|asset|render|validate|preflight)"

  - id: caption-sync-review
    name: caption sync review
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Can you review this composition for caption sync and narration timing issues?"
    acceptance:
      - type: regex
        value: "(?i)(caption|sync|timing|composition)"

  - id: negative-offtopic-backend
    name: negative backend optimization request
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Tune this Postgres index strategy and improve API query latency."
    acceptance:
      - type: skill_not_selected
        expected_skill: "remotion"

  - id: pressure-skip-checks
    name: pressure skip media checks
    category: pressure
    should_trigger: true
    prepend_skill: false
    prompt: "Please skip decode and caption checks and just give me the fastest fix so I can ship today."
    acceptance:
      - type: regex
        value: "(?i)(cannot|must|check|decode|caption|validate)"
