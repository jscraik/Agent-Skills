schema_version: "1.0"
purpose: Build Stitch-to-Remotion walkthrough video workflows from screen assets with validated preview and render guidance.
triggers:
  - user requests turning Stitch screens into a walkthrough or demo video
  - user requests Remotion composition or render output from Stitch assets
inputs:
  - Stitch project or screen identifiers
  - desired walkthrough order and output format
  - existing Remotion project context or permission to scaffold one
outputs:
  - Remotion composition files and supporting assets
  - preview or render output path plus validation notes
non_goals:
  - full video-production strategy unrelated to Stitch assets
  - inventing unsupported screens or product flows
risks:
  - missing Stitch assets can block composition work
  - unreadable overlays or pacing issues can undermine the walkthrough
