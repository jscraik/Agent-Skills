schema_version: 1
skill: ui-visual-regression
purpose: "Review and validate Storybook, Playwright, and Argos visual regression diffs."
triggers:
  - "Review, triage, and validate visual regression diffs. Use when the user wants snapshot-change analysis, layout regression evidence, Storybook diffs, Playwright screenshots, or Argos review."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "diff artifacts"
  - "baseline context"
  - "changed files"
  - "viewport matrix"
  - "acceptance criteria"
outputs:
  - "diff classification"
  - "regression findings"
  - "approval or fix plan"
  - "validation evidence"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
