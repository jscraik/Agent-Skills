schema_version: 1
skill: shadcn-ui
purpose: "Use shadcn/ui as source-owned component scaffolding with project-aware setup, customization, and validation."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "project root"
  - "components.json state"
  - "target components"
  - "styling and icon conventions"
  - "accessibility constraints"
outputs:
  - "component installation plan"
  - "files changed"
  - "customization notes"
  - "validation commands"
  - "remaining risks"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
