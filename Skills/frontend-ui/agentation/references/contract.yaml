schema_version: 1
skill: agentation
purpose: "Audit, validate, or troubleshoot Agentation frontend integrations with layered evidence."
triggers:
  - "Use when Agentation annotations, MCP registration, endpoint sync, webhook delivery, or watch mode readiness are failing."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "project root"
  - "runtime context"
  - "target mode"
  - "change posture"
  - "scope slice"
outputs:
  - "layer status"
  - "first blocker"
  - "next action"
  - "command evidence"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
