schema_version: 1
skill: better-icons
purpose: "Search and extract consistent Iconify SVG icons for production UI work."
triggers:
  - "Search, compare, and extract SVG icons from Iconify collections. Use when the user needs production-ready UI icons, icon family consistency, or exact SVG markup."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "icon meaning"
  - "target UI surface"
  - "preferred family"
  - "size/color constraints"
  - "accessibility role"
outputs:
  - "icon recommendation"
  - "SVG or extraction command"
  - "accessibility notes"
  - "fallbacks"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
