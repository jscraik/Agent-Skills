schema_version: 1
skill: playwright-interactive
purpose: "Keep browser and Electron debugging fast by reusing a persistent Playwright session with safe visual and interaction checks."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "target URL or app launch command"
  - "viewport or device target"
  - "user flow to inspect"
  - "auth or fixture constraints"
  - "expected visual or interaction result"
outputs:
  - "browser observations"
  - "screenshots or interaction notes"
  - "files or selectors inspected"
  - "validation evidence"
  - "blockers"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
