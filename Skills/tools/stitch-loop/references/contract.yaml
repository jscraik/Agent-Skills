schema_version: "1.0"
purpose: Execute baton-driven iterative Stitch website generation with mandatory state refresh after each pass.
triggers:
  - user requests iterative autonomous website building with Stitch
  - request includes or implies baton-based multi-pass page generation
inputs:
  - next-prompt.md baton
  - project state files such as SITE.md, DESIGN.md, and optional stitch.json
  - Stitch MCP access and optional browser verification access
outputs:
  - integrated page artifact
  - updated SITE.md and next-prompt.md baton
  - optional verification evidence
non_goals:
  - one-off Stitch page generation without baton continuity
  - regeneration of already-complete pages without explicit request
risks:
  - loop stalls if the baton is not refreshed
  - duplicate generation can occur if sitemap state is ignored
