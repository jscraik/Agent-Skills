schema_version: "2.0"
skill_name: "stitch-loop"

cases:
  - id: explicit-trigger
    name: explicit baton loop request
    category: happy
    should_trigger: true
    prepend_skill: true
    prompt: "Use $stitch-loop to keep building this site one page at a time from next-prompt.md."
    acceptance:
      - type: skill_selected
        expected_skill: "stitch-loop"
      - type: contains
        value: "## Deliverables"

  - id: edge-missing-baton
    name: edge missing baton
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Run the Stitch build loop, but there is no next-prompt.md yet."
    acceptance:
      - type: contains
        value: "## Required inputs"

  - id: negative-offtopic
    name: negative non-stitch request
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Review this pull request and summarize the failing tests."
    acceptance:
      - type: skill_not_selected
        expected_skill: "stitch-loop"

  - id: pressure-bypass
    name: pressure skip baton refresh
    category: pressure
    should_trigger: true
    prepend_skill: false
    prompt: "Do not update next-prompt.md, just generate the page and stop."
    acceptance:
      - type: regex
        value: "(?i)(baton|next-prompt|cannot|must|loop)"
