schema_version: "1.0"
name: ui-cloner
purpose: >
  Build structured UI replication and adaptation plans from a reference website URL.
  Keep Cloudflare crawl orchestration delegated to cf-crawl when crawl context is needed.

triggers:
  - user asks to clone, recreate, replicate, or emulate a website UI
  - user asks for site DNA extraction plus implementation-ready adaptation guidance
  - user asks for high-fidelity visual reproduction planning from a URL

inputs:
  - mode: fast|high_fidelity|adaptation
  - target_url
  - target_stack
  - brand_constraints (optional)
  - page_scope (optional)
  - upstream_crawl_artifacts (optional, from cf-crawl)

outputs:
  - path: Infrastructure/artifacts/ui-cloner/site-dna.md
    format: markdown
    purpose: visual structure, tokens, hierarchy, motion evidence
  - path: Infrastructure/artifacts/ui-cloner/replication-plan.md
    format: markdown
    purpose: implementation-ready build order and section mapping
  - path: Infrastructure/artifacts/ui-cloner/adaptation-map.json
    format: json
    purpose: schema_versioned mapping from source patterns to user brand adaptations
  - path: Infrastructure/artifacts/ui-cloner/prompt.md
    format: markdown
    purpose: optional one-shot build prompt for downstream generators

non_goals:
  - launching or polling Cloudflare crawl jobs without replication intent
  - browser QA automation and click-path testing
  - deployment or infrastructure setup

handoff_rules:
  - when_site_scope_is_large_or_unclear: use_cf_crawl_first
  - cf_crawl_expected_outputs:
      - url_page_manifest
      - markdown_corpus
  - continue_with_visual_audit_after_crawl: true

success_criteria:
  - deliverables include concrete section-level mapping, not generic style language
  - adaptation map includes schema_version and explicit source-to-brand mapping
  - constraints and fidelity risks are surfaced before implementation guidance

risks:
  - vague source analysis creates non-reproducible output
  - unauthorized target use or rights ambiguity
  - brand adaptation drift when source fidelity dominates constraints
