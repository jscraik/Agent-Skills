schema_version: 1
name: reproduce-bug
purpose: Reproduce and investigate bugs from tracker issues with Linear-first intake and GitHub support preserved.
triggers:
  - User asks to reproduce or investigate a bug from a Linear issue.
  - User asks to reproduce or investigate a bug from a GitHub issue.
  - User wants confirmed reproduction steps and evidence before starting a fix.
inputs:
  - name: issue_source
    type: enum
    values: [linear, github, manual-context]
    description: Source of the bug report.
  - name: issue_ref
    type: string
    description: Linear issue ID or URL, GitHub issue number or URL, or null for manual context.
  - name: symptoms
    type: array
    description: Observable bug symptoms or reported behavior.
  - name: expected_behavior
    type: string
    description: What should have happened instead.
  - name: environment_clues
    type: array
    description: Browser, OS, version, role, data, or frequency hints.
  - name: reproduction_route
    type: enum
    values: [test, browser, manual]
    description: Investigation route chosen for reproduction.
outputs:
  - name: issue_summary
    type: string
    description: Summary of the tracker issue or manual context.
  - name: reproduction_status
    type: string
    description: confirmed, not_reproduced, blocked, or partial.
  - name: root_cause_hypothesis
    type: string
    description: Highest-confidence cause identified from evidence.
  - name: structured_summary
    type: object
    description: Optional structured output when requested.
    schema:
      schema_version: 1
      issue_source: linear|github|manual-context
      issue_ref: string|null
      reproduction_status: confirmed|not_reproduced|blocked|partial
      root_cause_summary: string|null
      evidence:
        - string
      next_step: string
success_criteria:
  - Tracker intake happens before hypothesis work.
  - Reproduction status is explicit.
  - Evidence supports the reported findings.
  - Linear-first behavior is preserved without removing GitHub support.
non_goals:
  - Generic issue triage with no reproduction work.
  - Automatic code fixes.
  - Automatic tracker mutation.
risks:
  - Treating tracker descriptions as truth without verification.
  - Assuming GitHub-only issue flows in a Linear-first repo.
  - Posting speculative findings externally.
