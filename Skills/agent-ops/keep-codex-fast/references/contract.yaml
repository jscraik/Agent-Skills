schema_version: keep-codex-fast.contract.v1
purpose: Diagnose Codex Desktop or CLI local-state bloat safely before cleanup.
triggers:
  - Codex feels slow after long-running chats.
  - User asks for safe report, backup planning, archive planning, or report-only reminder.
  - Sessions, logs, worktrees, archives, SQLite state, or stale config may be large.
inputs:
  - name: codex_home
    default: CODEX_HOME or ~/.codex
    required: false
  - name: mode
    allowed: [report, backup, apply, handoff, automation]
    required: true
  - name: thresholds
    fields: [age, size, top_n, max_files_per_target, max_seconds_per_target]
    required: false
  - name: confirmation
    description: exact Codex home required for apply
    required_for: [apply]
outputs:
  - schema_version
  - mode
  - status
  - codex_home
  - limits
  - storage_targets
  - large_target_explanations
  - sqlite_diagnostics
  - elapsed_ms
  - mutation_plan
  - created_artifacts
non_goals:
  - automatic cleanup
  - deleting chats or logs
  - unreviewed config pruning
  - recurring apply automation
  - content inspection by default
risks:
  - active Codex processes may be writing SQLite or session files
  - old chats may contain active work history
  - symlinked session stores can be under-reported by local-only scans
  - logs and transcripts may contain sensitive operational details
modes:
  report:
    writes_allowed: false
    follows_top_level_symlinks: true
    content_inspection_default: false
    scan_bounds:
      top_n_default: 10
      max_files_per_target_default: 100000
      max_seconds_per_target_default: 4.0
      recent_files_per_target: 3
  backup:
    writes_allowed: true
    allowed_actions:
      - write backup artifacts only after explicit user request
    forbidden_actions:
      - move sessions
      - rotate logs
      - rewrite config
      - delete local state
  apply:
    writes_allowed: true
    required_gates:
      - report reviewed in current thread
      - exact codex home confirmed
      - Codex closed or explicit wait accepted
      - checked-in implementation path exists
    forbidden_by_default:
      - config pruning
      - recurring cleanup
      - deleting chats
      - deleting logs
      - deleting worktrees

observability: "Report elapsed_ms, per-target elapsed_ms, truncated targets, scan limits, and exact validation command outcomes."
rollback_procedure: "Report mode writes nothing and needs no rollback; backup/apply modes must provide backup manifests, restore paths, and a second report."
