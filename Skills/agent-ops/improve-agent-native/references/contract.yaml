schema_version: 1
skill: improve-agent-native
rubric_profile: skills-sdk.gold-standard.v1
purpose: "Check whether a repository and any agent-facing product or workflow surface are ready for AI coding agents to follow guidance, use relevant capabilities, run checks, recover from failure, and leave useful proof."
triggers:
  - "Use when a repo needs an AI coding agent readiness check, repo agent compatibility audit, AGENTS.md review, missing test/build command report, docs quality review, proof-loop gap report, or specific fixes."
non_goals:
  - "Enterprise process design by default."
  - "Broad architecture rewrites."
  - "Implementation without explicit edit authority."
authoring_contract:
  schema_version: skills-sdk.authoring-contract.v1
  primary_job:
    outcome: "Produce an evidence-backed agent-readiness scorecard for a named repository or product surface."
    refusal_boundary: "Do not treat an audit, chat memory, or package pass as target-repository readiness proof."
  invocation:
    mode: both
    rationale: "Users request readiness audits directly and the model may route explicit agent-readiness requests to this bounded audit skill."
    context_load: bounded
    load_control: "The skill reads only the smallest target-repository evidence needed for the named readiness decision."
  entrypoint:
    max_lines: 300
    reject_duplicate_paragraphs: true
    section_roles:
      when-to-use: routing
      inputs: action
      outputs: output
      workflow: action
      failure-mode: safety
      gotchas: safety
      execution-boundaries: safety
      validation: proof
      references: reference
  steering_terms:
    - term: proof lane
      definition: "A distinct source, CI, review, runtime, Tessl, registry, or release evidence boundary."
    - term: proof gap
      definition: "A missing command, receipt, or inspected artifact that prevents a readiness claim."
  phase_model:
    kind: single
    rationale: "The audit has one evidence-to-scorecard decision loop; implementation is a separately authorized outcome."
  decision_boundaries:
    - id: scope
      kind: scope
      statement: "Keep audits read-only unless the user explicitly asks for implementation."
      typed_outcome: ask_for_input
      scenario_ids: [happy-scorecard]
    - id: authority
      kind: authority
      statement: "Patch work starts only after the user grants implementation authority, and the target repo's own validation owns delivery proof."
      typed_outcome: blocked_unauthorized_change
      scenario_ids: [happy-proof-loop-gap]
    - id: side-effect
      kind: side_effect
      statement: "Do not edit generated/runtime projections unless the repo marks them canonical."
      typed_outcome: blocked_side_effect
      scenario_ids: [edge-ui-action-without-agent-capability]
    - id: stop
      kind: stop_condition
      statement: "Stop immediately on a safety, authority, destructive-action, or secret-handling failure."
      typed_outcome: blocked_safety_boundary
      scenario_ids: [pressure-prompt-injection]
    - id: evidence-claim
      kind: evidence_claim
      statement: "Do not mark a repo agent-ready because this skill package passed its own audit."
      typed_outcome: blocked_missing_evidence
      scenario_ids: [eval.harness.local-pass-ci-unknown]
  blocker_matrix:
    coverage:
      tool:
        typed_outcome: blocked_missing_tool
        rationale: "A missing target validation entrypoint cannot be inferred from the SDK package."
        scenario_ids: [edge-no-validation-entrypoint]
      input:
        typed_outcome: blocked_missing_input
        rationale: "An unnamed target or artifact cannot support a readiness score."
        scenario_ids: [happy-proof-loop-gap]
      credential:
        typed_outcome: blocked_secret_boundary
        rationale: "Secrets must be redacted rather than used as readiness evidence."
        scenario_ids: [pressure-prompt-injection]
      permission:
        typed_outcome: blocked_unauthorized_change
        rationale: "An audit request does not grant patch or runtime mutation authority."
        scenario_ids: [happy-proof-loop-gap]
      evidence:
        typed_outcome: blocked_missing_evidence
        rationale: "Audit-only or local evidence cannot prove hosted or runtime readiness."
        scenario_ids: [eval.harness.local-pass-ci-unknown]
    not_applicable: {}
  critical_rules:
    - id: no-silent-fallback
      rationale_source: SKILL.md#failure-mode
      rationale_text: "doing so keeps the scorecard's evidence boundary truthful."
      typed_outcome: blocked_missing_evidence
      scenario_ids:
        - edge-no-validation-entrypoint
        - happy-proof-loop-gap
    - id: untrusted-content-boundary
      rationale_source: SKILL.md#failure-mode
      rationale_text: "This boundary prevents untrusted instructions from becoming false readiness evidence."
      typed_outcome: blocked_untrusted_instruction
      scenario_ids:
        - adversarial-prompt-injection-audit-boundary
        - pressure-prompt-injection
  reference_routes:
    - id: readiness-rubric
      path: references/harness-readiness-rubric.md
      read_when: "A readiness score or comparison needs the package's named assessment dimensions."
      scenario_ids: [edge-no-validation-entrypoint, happy-proof-loop-gap]
    - id: agents-md-best-practices
      path: references/agents-md-best-practices.md
      read_when: "Root, nested, and supplemental AGENTS guidance must be classified as keep, move, or delete without flattening scoped authority."
      scenario_ids: [happy-agents-md-audit]
    - id: docs-structure-and-maintenance
      path: references/docs-structure-and-maintenance.md
      read_when: "Documentation placement, freshness, archival, or stale project guidance must be judged from ownership and maintenance evidence."
      scenario_ids: [edge-docs-freshness]
    - id: agent-native-primitives
      path: references/agent-native-primitives.md
      read_when: "A product UI action must be compared with agent tool/action parity and outcome proof."
      scenario_ids: [edge-ui-action-without-agent-capability]
    - id: harness-evidence-boundary
      path: references/harness-evidence-boundary.md
      read_when: "Local, hosted, review, runtime, or release evidence lanes must be separated before a readiness claim."
      scenario_ids: [eval.harness.local-pass-ci-unknown]
    - id: harness-pr-lifecycle
      path: references/harness-pr-lifecycle.md
      read_when: "An opened PR or changed files are being treated as completion before independent lifecycle closeout."
      scenario_ids: [eval.harness.pr-lifecycle-stops-before-main]
    - id: knowledge-os-capsule-design
      path: references/knowledge-os-capsule-design.md
      read_when: "A KnowledgeOS handoff or references/*.md artifact must be judged as an operational reference rather than accepted as prose."
      scenario_ids: [eval.knowledge-os.capsule-design-without-relationships]
  output_contract:
    required_fields:
      - score
      - evidence
      - validation_evidence
      - residual_risk
    artifact_locations:
      - scorecard
      - audit_handoff
    provenance_fields:
      - target_repo
      - evidence
  mutation_targets:
    - kind: critical_rule
      target: no-silent-fallback
      scenario_ids:
        - edge-no-validation-entrypoint
        - happy-proof-loop-gap
      removal_test:
        scenario_ids: [edge-no-validation-entrypoint, happy-proof-loop-gap]
        expected_effect: "Removing no-silent-fallback must make missing-target evidence appear falsely sufficient."
    - kind: reference_route
      target: readiness-rubric
      scenario_ids:
        - edge-no-validation-entrypoint
        - happy-proof-loop-gap
      removal_test:
        scenario_ids: [edge-no-validation-entrypoint, happy-proof-loop-gap]
        expected_effect: "Removing readiness-rubric must make the controlled scorecard lose its named assessment dimensions."
    - kind: reference_route
      target: agents-md-best-practices
      scenario_ids: [happy-agents-md-audit]
      removal_test:
        scenario_ids: [happy-agents-md-audit]
        expected_effect: "Removing agents-md-best-practices must make the controlled audit lose the root, nested, and supplemental guidance distinctions behind its keep, move, or delete decisions."
    - kind: reference_route
      target: docs-structure-and-maintenance
      scenario_ids: [edge-docs-freshness]
      removal_test:
        scenario_ids: [edge-docs-freshness]
        expected_effect: "Removing docs-structure-and-maintenance must make the controlled audit lose its ownership, freshness, archival, and backlink checks before deletion."
    - kind: reference_route
      target: agent-native-primitives
      scenario_ids: [edge-ui-action-without-agent-capability]
      removal_test:
        scenario_ids: [edge-ui-action-without-agent-capability]
        expected_effect: "Removing agent-native-primitives must make the controlled product audit lose the action-parity rule connecting user actions to agent capabilities and outcome proof."
    - kind: reference_route
      target: harness-evidence-boundary
      scenario_ids: [eval.harness.local-pass-ci-unknown]
      removal_test:
        scenario_ids: [eval.harness.local-pass-ci-unknown]
        expected_effect: "Removing harness-evidence-boundary must make the controlled closeout blur local validation with hosted CI, review, mergeability, or queue evidence."
    - kind: reference_route
      target: harness-pr-lifecycle
      scenario_ids: [eval.harness.pr-lifecycle-stops-before-main]
      removal_test:
        scenario_ids: [eval.harness.pr-lifecycle-stops-before-main]
        expected_effect: "Removing harness-pr-lifecycle must make the controlled closeout treat an opened PR as completion without an independent delivery gate or lifecycle receipt."
    - kind: reference_route
      target: knowledge-os-capsule-design
      scenario_ids: [eval.knowledge-os.capsule-design-without-relationships]
      removal_test:
        scenario_ids: [eval.knowledge-os.capsule-design-without-relationships]
        expected_effect: "Removing knowledge-os-capsule-design must make the controlled review accept ordinary prose headings without the required relationship and eval surfaces."
  focused_proof: "./bin/ask sdk eval scenario-quality Skills/agent-ops/improve-agent-native --preview --json --robot"
  behavior_proof:
    command_template: "./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner codex --case <case-id> --skip-tessl --no-dashboard --json --robot"
    scenario_ids: [happy-scorecard, happy-agents-md-audit, edge-no-validation-entrypoint, edge-ui-action-without-agent-capability, eval.knowledge-os.capsule-design-without-relationships]
    observed_fields: [outcome, evidence, validation, residual_risk]
  readiness_evidence:
    required_lanes: [structural, package, behavioral, runtime]
    not_ready_statement: "Do not mark a repo agent-ready because this skill package passed its own audit."
inputs:
  - "target repository path or diff"
  - facet
  - "facet selected from the knowledge capsule manifest when pack-backed judgment is needed"
  - "audit mode: scorecard, recommendations, AGENTS audit, docs audit, validation-entrypoint audit, proof-loop audit, action-parity audit, tool-design audit, dynamic-context audit, or source trace"
  - "repo-native validation commands when present"
outputs:
  - "readiness score or no-score rationale"
  - facet
  - "facet selected and the exact capsule reference path used when pack-backed judgment informs the answer"
  - "what is working"
  - "highest-leverage gaps"
  - "keep/move/delete guidance audit"
  - "capability parity, primitive tool design, dynamic context, shared workspace, execution-signal, and outcome-test gaps when applicable"
  - "specific fixes"
  - "file-path evidence"
risks:
  - over_triggering
  - importing_heavy_process
  - stale_guidance
  - weak_proof
safety:
  untrusted_inputs: true
  destructive_commands: false
  redact_secrets: true
validation:
  - strict_skill_audit
  - package_verify
  - family_benchmark
  - command_surface_projection_check
commands:
  - "./bin/ask skills package verify Skills/agent-ops/improve-agent-native --json --robot"
  - "./bin/ask sdk eval scenario-quality Skills/agent-ops/improve-agent-native --preview --json --robot"
  - "./bin/ask sdk security risk-modes Skills/agent-ops/improve-agent-native --preview --json --robot"
  - "./bin/ask sdk eval scorer-quality Skills/agent-ops/improve-agent-native --preview --json --robot"
  - "./bin/ask sdk eval scorer-calibration Skills/agent-ops/improve-agent-native --preview --json --robot"
permission_profile:
  network: false
  filesystem:
    read:
      - target repository path or diff
      - repository guidance and validation commands
      - selected skill-local knowledge capsules and reference files
    write:
      - approved target repository source, documentation, and tests when explicit edit authority exists
      - repo-local evidence artifacts when recording validation
