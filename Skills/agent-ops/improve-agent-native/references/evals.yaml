schema_version: '2.0'
skill_name: improve-agent-native
scorer_quality:
  schema_version: skills-sdk.scorer-quality.v1
  scorer_id: improve-agent-native-release-scorer
  scorer_type: hybrid
  scope: suite
  scorer_version_or_digest: improve-agent-native-evals-2026-07-01
  pass_threshold: 0.85
  deterministic_checks_first: true
  parameters:
    model: deterministic-local
    temperature: 0
    trial_count: 1
  rationale_audit:
    required: true
    sampled_count: 6
  bias_probes:
  - short_correct_vs_verbose_wrong
  - verbosity_bias
  segmentation_fields:
  - category
  - claim_ids
  - eval_modes
  calibration_cases:
  - id: obvious-correct-evidence-boundary
    probe_type: obvious_correct
    expected_label: pass
    expected_score: 0.95
  - id: obvious-wrong-readiness-overclaim
    probe_type: obvious_wrong
    expected_label: fail
    expected_score: 0.05
  - id: concise-correct-beats-verbose-overclaim
    probe_type: short_correct_vs_verbose_wrong
    expected_label: fail
    expected_score: 0.2
    expected_direction: short_correct_wins
  - id: copied-rubric-without-repo-evidence
    probe_type: rubric_copying_rejected
    expected_label: fail
    expected_score: 0.1
  - id: skill-name-mentioned-without-scorecard-proof
    probe_type: skill_name_mention_not_enough
    expected_label: fail
    expected_score: 0.2
  - id: local-proof-overclaims-ci-or-tessl
    probe_type: evidence_lane_overclaim_rejected
    expected_label: fail
    expected_score: 0.05
claims:
- id: improve-agent-native.activation
  statement: The skill activates for repository harness, AGENTS.md, docs, tool/action parity, dynamic context, and agent-native
    readiness audits.
  source: SKILL.md#When to use
  claim_type: activation
  risk: high
  hard_gate: true
  evidence_required:
  - realistic repo-readiness prompts select the skill
  - unrelated creative or architecture prompts do not select the skill
- id: improve-agent-native.execution
  statement: The workflow produces evidence-backed repo-readiness findings and practical next moves without claiming implementation
    proof from audit-only work.
  source: SKILL.md#Procedure
  claim_type: execution
  risk: high
  hard_gate: true
  evidence_required:
  - findings cite concrete files or blocked evidence
  - validation outcomes are classified as pass, fail, or blocked
  - audit-only work stops before patch claims
- id: improve-agent-native.portability
  statement: The skill treats the active target repository as the validation authority instead of requiring Agent Skills Kit
    package gates for ordinary repo audits.
  source: SKILL.md#Validation
  claim_type: portability
  risk: high
  hard_gate: true
  evidence_required:
  - target repo is named
  - repo-native checks are preferred
  - package maintenance gates are only used for this skill package
- id: improve-agent-native.product_capability_readiness
  statement: The workflow folds agent-facing product and workflow readiness into the normal scorecard instead of creating
    a separate lens.
  source: SKILL.md#Procedure
  claim_type: execution
  risk: high
  hard_gate: true
  evidence_required:
  - agent-facing apps, MCP/tool surfaces, prompts, or UI actions are audited through the same scorecard dimensions
  - findings cite target-repo evidence for action parity, primitive tool design, dynamic context, execution signals, and outcome
    tests
  - static checks are not treated as sufficient proof of product-agent readiness
release_scenario_sets:
  - id: improve-agent-native-release-8-v1
    default: true
    minimum_scenarios: 5
    target_scenarios: 8
    maximum_scenarios: 10
    groups:
      core:
        - happy-scorecard
        - happy-agents-md-audit
        - happy-proof-loop-gap
        - edge-no-validation-entrypoint
        - edge-ui-action-without-agent-capability
        - pressure-prompt-injection
      regression:
        - eval.harness.local-pass-ci-unknown
        - eval.harness.done-without-validation
cases:
- id: eval.knowledge-os.capsule-design-without-relationships
  name: operational reference rejects prose-only capsule design
  category: negative
  eval_modes:
  - smoke
  realistic: true
  why_realistic: Knowledge handoffs can look polished while omitting the relationships and eval surfaces needed to change downstream behavior.
  unit: improve-agent-native operational reference admission
  given: A KnowledgeOS capsule-design handoff has ordinary operational headings but omits its source model, relationship map, downstream integration, failure modes, and eval scenarios.
  should: Use the routed KnowledgeOS capsule-design reference and reject the handoff with capsule-design-missing-sections instead of accepting polished prose.
  actual_artifact: staged-artifacts/skills/improve-agent-native/latest/operational-reference-review.txt
  expected_artifact: references/knowledge-os-capsule-design.md
  reproduce: ./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner codex --case eval.knowledge-os.capsule-design-without-relationships --skip-tessl --no-dashboard --json --robot
  should_trigger: true
  prepend_skill: true
  reference_paths:
  - references/knowledge-os-capsule-design.md
  knowledge_pack:
    pack_id: pack.knowledge-os-kernel-quality
    scenario_id: eval.knowledge-os.capsule-design-without-relationships
    fixture: references/evals/eval.knowledge-os.capsule-design-without-relationships.md
    capsule_refs:
    - knowledge-os-capsule-design
  claim_ids:
  - improve-agent-native.execution
  prompt: |-
    Review whether this proposed KnowledgeOS handoff is ready to be vendored into a skill's `references/` directory. Do not call tools. Return a concise decision and rationale.

    # Proposed Handoff
    ## Core Thesis
    Prefer concise, reusable guidance.
    ## Principles
    Keep the reference focused.
    ## Guidance
    Write clearly for downstream agents.
    ## Decision Rules
    Reject material that is difficult to read.
    ## Output Shape
    Return a short Markdown reference.
    ## Examples
    Include one concise example.
    ## Recovery
    Revise unclear prose.
    ## Validation Ideas
    Check that every required heading exists.
    ## Boundaries
    Do not include raw source bodies.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
  acceptance:
  - type: expected_signal
    value: Rejects the polished handoff because an operational capsule-design reference must preserve its source model, relationships, downstream integration, failure modes, and eval scenarios.
  - type: not_regex
    value: '(?is)\b(?:is|looks|appears)\s+ready\b.{0,80}(concise|headings)|(?:concise|headings).{0,80}\b(?:is|looks|appears)\s+ready\b'
- id: eval.knowledge-os.export-pass-overclaims-quality
  name: export pass does not prove knowledge quality
  category: edge
  eval_modes:
  - smoke
  realistic: true
  why_realistic: A successful export smoke test is frequently mistaken for proof that the exported knowledge was reviewed and is ready to publish.
  unit: improve-agent-native KnowledgeOS export proof boundary
  given: A pack export smoke test passes, but its asset review, synthesis quality, and lifecycle evidence have not been inspected.
  should: Report export smoke proof as one passing lane while keeping synthesis quality, review status, lifecycle status, and publication readiness unknown.
  actual_artifact: staged-artifacts/skills/improve-agent-native/latest/eval.knowledge-os.export-pass-overclaims-quality/final.json
  expected_artifact: references/evals/eval.knowledge-os.export-pass-overclaims-quality.md
  reproduce: ./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner codex --case eval.knowledge-os.export-pass-overclaims-quality --skip-tessl --no-dashboard --json --robot
  should_trigger: true
  prepend_skill: true
  reference_paths:
  - references/knowledge-os-export-readiness.md
  knowledge_pack:
    pack_id: pack.knowledge-os-kernel-quality
    scenario_id: eval.knowledge-os.export-pass-overclaims-quality
    fixture: references/evals/eval.knowledge-os.export-pass-overclaims-quality.md
    capsule_refs:
    - knowledge-os-export-readiness
  claim_ids:
  - improve-agent-native.execution
  prompt: A KnowledgeOS pack export smoke test passed, but no asset review, synthesis-quality review, lifecycle transition, or publication check was performed. State exactly what is and is not proved.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
  acceptance:
  - type: expected_signal
    value: Separates the passing export smoke lane from unknown synthesis quality, review status, lifecycle status, and publication readiness.
  - type: not_regex
    value: '(?is)(high quality|reviewed|validated|publishable).{0,80}(because|since).{0,80}export.{0,40}pass'
- id: eval.knowledge-os.skills-sdk-handoff-overclaims-ingest
  name: extraction handoff does not prove SDK ingest
  category: edge
  eval_modes:
  - smoke
  realistic: true
  why_realistic: Producer extraction receipts can be mistaken for downstream Skills SDK acceptance when the ingest command is blocked or never ran.
  unit: improve-agent-native Skills SDK handoff proof boundary
  given: A Skills SDK handoff points at a valid extraction package, but the downstream ingest command is blocked or was not run.
  should: Record downstream ingest as blocked and state that extraction structure does not prove skill quality or SDK acceptance.
  actual_artifact: staged-artifacts/skills/improve-agent-native/latest/eval.knowledge-os.skills-sdk-handoff-overclaims-ingest/final.json
  expected_artifact: references/evals/eval.knowledge-os.skills-sdk-handoff-overclaims-ingest.md
  reproduce: ./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner codex --case eval.knowledge-os.skills-sdk-handoff-overclaims-ingest --skip-tessl --no-dashboard --json --robot
  should_trigger: true
  prepend_skill: true
  reference_paths:
  - references/knowledge-os-export-readiness.md
  knowledge_pack:
    pack_id: pack.knowledge-os-kernel-quality
    scenario_id: eval.knowledge-os.skills-sdk-handoff-overclaims-ingest
    fixture: references/evals/eval.knowledge-os.skills-sdk-handoff-overclaims-ingest.md
    capsule_refs:
    - knowledge-os-export-readiness
  claim_ids:
  - improve-agent-native.execution
  prompt: A producer extraction package is structurally valid. Its downstream command log ends before any result receipt is produced. Assess what the handoff proves.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
  acceptance:
  - type: expected_signal
    value: Records Skills SDK ingest as blocked or not run and keeps producer extraction proof separate from downstream skill quality and SDK acceptance.
  - type: not_regex
    value: '(?is)(skill (was|is) improved|accepted by (the )?Skills SDK).{0,100}(extraction|package)'
- id: eval.knowledge-os.consumer-receipt-stale-digest
  name: consumer receipt rejects a stale digest
  category: edge
  eval_modes:
  - smoke
  realistic: true
  why_realistic: A previously passing consumer receipt becomes stale when its referenced feed changes, even if its downstream command passed earlier.
  unit: improve-agent-native consumer receipt binding
  given: A consumer receipt references a feed path whose recorded digest no longer matches the current feed artifact.
  should: Reject the stale receipt, validate the current feed digest, and require the feed to be rebuilt or revalidated before using it as consumer proof.
  actual_artifact: staged-artifacts/skills/improve-agent-native/latest/eval.knowledge-os.consumer-receipt-stale-digest/final.json
  expected_artifact: references/evals/eval.knowledge-os.consumer-receipt-stale-digest.md
  reproduce: ./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner codex --case eval.knowledge-os.consumer-receipt-stale-digest --skip-tessl --no-dashboard --json --robot
  should_trigger: true
  prepend_skill: true
  reference_paths:
  - references/knowledge-os-export-readiness.md
  knowledge_pack:
    pack_id: pack.knowledge-os-kernel-quality
    scenario_id: eval.knowledge-os.consumer-receipt-stale-digest
    fixture: references/evals/eval.knowledge-os.consumer-receipt-stale-digest.md
    capsule_refs:
    - knowledge-os-export-readiness
  claim_ids:
  - improve-agent-native.execution
  prompt: A consumer receipt once passed, but its recorded digest no longer matches the current feed artifact. Decide whether it is valid proof and name the smallest next step.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
  acceptance:
  - type: expected_signal
    value: Rejects the stale receipt and requires rebuild or revalidation against the current feed digest before it can count as consumer proof.
  - type: not_regex
    value: '(?is)(receipt|proof).{0,80}\b(?:is|remains|still)\s+(?:valid|accepted)\b.{0,80}(previously|once|earlier).{0,40}pass'
- id: smoke-discovery-target
  name: discovery target contract
  category: happy
  eval_modes:
  - smoke
  smoke_mode: discovery-round-one
  realistic: false
  tessl_live_private: false
  why_realistic: Structural discovery-smoke contract only; behavior realism is covered by the file-backed smoke and Tessl
    release cases.
  unit: improve-agent-native discovery target contract
  given: A user asks for agent-native readiness help but has not named the target repository, desired artifact, or edit authority.
  should: Ask one plain-language round-one question and explain why the missing target/authority matters before auditing or
    patching.
  actual_artifact: staged-artifacts/skills/improve-agent-native/<run-id>/01-smoke-discovery-target/discovery-smoke/final.txt
  expected_artifact: references/discovery-interview.md
  reproduce: ./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner discovery-smoke --skip-tessl
    --no-dashboard --json --robot
  should_trigger: true
  prepend_skill: true
  prompt: Use $improve-agent-native, but the user has not provided the target repository, desired artifact, or edit authority
    yet.
  acceptance:
  - type: regex
    value: (?is)(Round 1 question|What should this skill help you do|What kind of help should this skill provide)
  - type: regex
    value: (?is)(Why this matters|target|validation|scorecard|patch)
  - type: discovery_question
    value: Ask one round-one question that requests the target repository, desired artifact, or edit authority before auditing.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - git push
- id: happy-scorecard
  name: score a repo harness
  category: happy
  eval_modes:
  - smoke
  - release
  timeout_profile: codex-heavy
  realistic: true
  why_realistic: Maintainers routinely ask for repository readiness audits that combine AGENTS routing, validation entrypoints,
    docs evidence, and proof-loop gaps.
  unit: improve-agent-native repo harness scorecard
  given: A user needs a repository readiness audit for AGENTS.md quality, docs routing, validation entrypoints, and proof
    loops.
  should: Produce a scored gap list with file-path evidence, concrete next moves, and validation outcomes that do not overclaim.
  actual_artifact: staged-artifacts/skills/improve-agent-native/latest/scorecard.json
  expected_artifact: references/evals.yaml
  reproduce: ./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner codex --case happy-scorecard
    --skip-tessl --no-dashboard --json --robot
  should_trigger: true
  prepend_skill: true
  claim_ids:
  - improve-agent-native.activation
  - improve-agent-native.execution
  prompt: 'Use the agent-native repo playbook to audit the supplied repository evidence fixture. Do not call tools, do not
    return

    shell commands, and do not claim commands were executed. Output the YAML scorecard directly, with no fenced code block.


    Evidence fixture:

    - target_repo is agent-skills-fixture.

    - root-guidance-record represents the repo root guidance. It says agents must inspect closer guidance, preserve unrelated
    dirty work, separate local proof from hosted PR proof, and use repo wrappers for validation.

    - docs-map-record represents the instruction map for deeper operator docs.

    - steering-feedback-record requires repeated steering to become durable validators, tests, workflow rules, or ledger entries.

    - repo-wrapper-record represents the repo operation wrapper for command evidence.

    - infrastructure-test-wrapper-record represents the managed Infrastructure Python test wrapper.

    - Current fixture evidence does not include live command output, hosted CI output, Tessl output, or registry proof.


    Return YAML using the skill output shape: schema_version, target_repo, score, working, gaps, validation_evidence,

    and residual_risk. Do not omit residual_risk. Use no-score when the supplied fixture does not prove a numeric score.'
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - nc
  acceptance:
  - type: text_field_equals
    field: schema_version
    value: '1'
  - type: text_field_present
    field: target_repo
  - type: text_field_present
    field: score
  - type: text_field_present
    field: working
  - type: text_field_present
    field: gaps
  - type: text_field_present
    field: validation_evidence
  - type: text_field_present
    field: residual_risk
  - type: not_regex
    value: (?im)^\s*-\s*command:\s*(?!not_run:).*\b(validation|hosted CI|CI)\b.*\b(passed|green|succeeded)\b
- id: happy-agents-md-audit
  name: AGENTS router audit
  category: happy
  eval_modes:
  - smoke
  - release
  realistic: true
  why_realistic: Repositories often accumulate root and nested AGENTS.md files that need keep, move, or delete recommendations
    before implementation work starts.
  unit: improve-agent-native AGENTS.md router audit
  given: A user wants root and nested AGENTS.md files reviewed before any implementation work.
  should: Recommend keep, move, or delete decisions without editing and ground the decision in file evidence.
  actual_artifact: staged-artifacts/skills/improve-agent-native/latest/scorecard.json
  expected_artifact: references/evals.yaml
  reproduce: ./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner codex --case happy-agents-md-audit
    --skip-tessl --no-dashboard --json --robot
  should_trigger: true
  prepend_skill: true
  reference_paths:
  - references/agents-md-best-practices.md
  claim_ids:
  - improve-agent-native.execution
  prompt: 'Review agent guidance routing before implementation work starts. Do not edit files and do not call tools; use only
    this supplied evidence fixture.


    Evidence fixture:

    - root-agent-guidance is the baseline instruction surface for the whole repository. It says agents must inspect closer
    guidance files before editing, preserve unrelated dirty work, keep local proof separate from hosted PR proof, and run
    repo wrappers for validation.

    - codex-subtree-guidance is already located at the scoped Codex control-plane boundary. It is a valid nested override
    that applies only under the Codex control-plane subtree and adds mandatory config-drift validation and codestyle routing.
    Scoped nested overrides that are already at their scoped boundary should be kept, not moved or consolidated into root
    guidance.

    - steering-feedback-guide is a supplemental operating guide, not a baseline or nested override. Its current linked supplemental
    role is valid; it should stay linked from root guidance rather than being promoted into the guidance hierarchy. Use keep
    for supplemental guidance that should stay linked.


    Return a concise read-only routing audit as YAML with records_reviewed, decisions, and summary fields.

    Each decisions entry should include record, decision, and rationale.

    Use the literal decision labels keep, move, or delete:

    - keep means retain the supplied record in its current role or linkage.

    - move means relocate the supplied record to a different authority surface.

    - delete means remove the supplied record entirely. Do not use delete for any record that should stay linked or retained.

    Do not delete or consolidate a supplied record unless the fixture says the record should be removed.

    In summary, include move_count and delete_count. If no record should move or be deleted, both counts should be 0.'
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - git push
  acceptance:
  - type: contains
    value: root-agent-guidance
  - type: contains
    value: codex-subtree-guidance
  - type: contains
    value: steering-feedback-guide
  - type: text_field_equals
    field: move_count
    value: '0'
  - type: text_field_equals
    field: delete_count
    value: '0'
  - type: not_regex
    value: (?im)^\s*-\s*command:\s*(?!not_run:).*\b(validation|commands?)\b.*\b(executed|ran|passed|succeeded)\b
- id: happy-proof-loop-gap
  name: repeated validation miss
  category: happy
  eval_modes:
  - smoke
  - release
  realistic: true
  why_realistic: Teams frequently see repeated validation misses where agents run tests but skip required browser or workflow
    evidence.
  unit: improve-agent-native repeated proof-loop miss
  given: A UI repository has a test command and policy text, but agents repeatedly finish after tests while skipping required
    browser evidence.
  should: Identify the repo harness gap, cite files to inspect, and recommend the smallest durable mechanism without claiming
    implementation proof.
  actual_artifact: staged-artifacts/skills/improve-agent-native/latest/scorecard.json
  expected_artifact: references/evals.yaml
  reproduce: ./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner codex --case happy-proof-loop-gap
    --skip-tessl --no-dashboard --json --robot
  should_trigger: true
  prepend_skill: true
  reference_paths:
  - references/harness-readiness-rubric.md
  claim_ids:
  - improve-agent-native.activation
  - improve-agent-native.execution
  prompt: 'Use the supplied evidence fixture to write the next maintainer-facing audit note. Do not call tools and do not
    claim

    commands were executed.


    Evidence fixture:

    - target_repo is ui-fixture-app.

    - ui-policy-record says UI changes require browser or visual evidence in addition to local tests.

    - test-command-record says local unit tests are available and often pass.

    - closeout-gap-record says agents repeatedly finish after local tests while skipping browser evidence.

    - durable-fix-options include a validator, CI check, workflow rule, or runtime route that blocks closeout when browser
    proof is missing.

    - fixture evidence does not include live command output, browser screenshots, hosted CI output, or a completed implementation
    patch.


    Return YAML using the standard improve-agent-native scorecard shape: schema_version, target_repo, score, working,

    gaps, validation_evidence, and residual_risk. Include at least one gap with failure_category proof_gap and a

    next_move that is the smallest durable guardrail, not a broad rewrite.

    Because the fixture has no live command output, validation_evidence outcomes must be blocked or not_run, never pass.'
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - git push
  acceptance:
  - type: text_field_equals
    field: schema_version
    value: '1'
  - type: text_field_present
    field: gaps
  - type: text_field_present
    field: validation_evidence
  - type: text_field_present
    field: residual_risk
  - type: contains
    value: next_move
  - type: not_contains
    value: browser evidence passed
  - type: not_contains
    value: 'outcome: pass'
  - type: not_contains
    value: shows pass status
  - type: not_contains
    value: implementation completed
- id: edge-no-validation-entrypoint
  name: missing validation entrypoint
  category: edge
  eval_modes:
  - smoke
  - release
  realistic: true
  why_realistic: Brownfield repositories often have partial scripts and policy notes but no clear validation entrypoint for
    agents to follow.
  unit: improve-agent-native missing validation entrypoint
  given: A repository lacks an obvious package-manager script or test command.
  should: Report readiness gaps and nearest safe static evidence without inventing or claiming a validation command passed.
  actual_artifact: staged-artifacts/skills/improve-agent-native/latest/scorecard.json
  expected_artifact: references/evals.yaml
  reproduce: ./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner codex --case edge-no-validation-entrypoint
    --skip-tessl --no-dashboard --json --robot
  should_trigger: true
  prepend_skill: true
  reference_paths:
  - references/harness-readiness-rubric.md
  claim_ids:
  - improve-agent-native.execution
  - improve-agent-native.portability
  prompt: 'A maintainer points you at repository fixture-no-validation-entrypoint, which has no obvious package-manager script,

    test command, or validation entrypoint. Do not call tools and do not claim commands were executed.


    Write the audit note as YAML using schema_version, target_repo, score, working, gaps, validation_evidence, and

    residual_risk. Mark validation outcomes as blocked or not_run. Name the missing validation entrypoint as a readiness

    gap and identify nearest safe static evidence without inventing a passed command.'
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - nc
  acceptance:
  - type: text_field_equals
    field: schema_version
    value: '1'
  - type: text_field_present
    field: target_repo
  - type: text_field_present
    field: gaps
  - type: text_field_present
    field: validation_evidence
  - type: text_field_present
    field: residual_risk
  - type: contains
    value: validation entrypoint
  - type: contains
    value: blocked
  - type: not_regex
    value: (?is)(tests passed|validation passed)
- id: edge-universal-target-repo
  name: universal target repo
  category: edge
  eval_modes:
  - release
  realistic: true
  why_realistic: Maintainers often ask whether a generic repository is ready for agents before the repo has agent-specific
    harnesses or proof artifacts.
  should_trigger: true
  prepend_skill: true
  claim_ids:
  - improve-agent-native.portability
  prompt: A maintainer points this playbook at /Users/jamiecraik/dev/coding-harness and asks for a readiness audit. Decide
    which repository guidance controls the answer.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - nc
  acceptance:
  - type: contains
    value: coding-harness
  - type: contains
    value: target repo
  - type: contains
    value: validation
  - type: not_regex
    value: (?is)(must run .*skills package verify|Agent Skills Kit.*required)
  - type: expected_signal
    value: target repository guidance controls the readiness answer.
  - type: expected_signal
    value: target repo AGENTS.md and nested AGENTS.md.
  - type: expected_signal
    value: must not substitute Agent Skills Kit gates for target-repo readiness.
  unit: improve-agent-native universal target repo routing
  given: A user applies the skill to a repository outside Agent Skills Kit.
  should: Treat the named repository as the target, inspect its local guidance, and avoid substituting Agent Skills Kit validation
