    validation entrypoints, and proof loops. Return a scored gap list with file-path evidence.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - nc
  acceptance:
  - type: regex
    value: (?is)(score|scorecard|readiness|harness)
  - type: regex
    value: (?is)(AGENTS\.md|docs|validation|proof)
  - type: regex
    value: (?is)(evidence|file)
  - type: expected_signal
    value: Returns the scorecard shape with score or no-score, working evidence, severity-ranked gaps,
      next_move guardrails, validation_evidence outcomes, and residual_risk without claiming execution
      that did not run.
