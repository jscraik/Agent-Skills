- id: tessl-scenario-knowledge-capsule-uplift
  name: scenario skill knowledge capsule uplift
  category: edge
  eval_modes:
  - smoke
  - release
  realistic: true
  why_realistic: Teams often accumulate repeated review feedback in learning ledgers and need agents to
    turn that feedback into a durable validation or closeout mechanism.
  should_trigger: true
  prepend_skill: true
  tessl:
    generated_by: tessl-labs/tessl-skill-eval-scenarios@0.1.0
    staged_source: /tmp/ask-tessl-scenario-generation/Skills__agent-ops__improve-agent-native-e5d7a86b4e36/target-tile/evals/scenario-3
  claim_ids:
  - improve-agent-native.execution
  prompt: |
    A maintainer reports that agents repeatedly forget the same repo workflow rule. The repository has a learning ledger and a short package manifest that points to reference material. The maintainer wants a compact audit that explains how the repeated correction should become a durable improvement.

    Provided files:

    references/knowledge-capsule.manifest.yaml:
    capsules:
      - path: references/knowledge-capsules/harness-review-feedback.md
        signals: [review_feedback, evidence_boundary]
      - path: references/knowledge-capsules/ryan-environment-design.md
        signals: [environment_failure]

    references/knowledge-capsules/harness-review-feedback.md:
    Repeated review feedback should become a durable guardrail, not another reminder.

    .harness/quality/steering-uptake.md:
    - 2026-06-10: Agents keep saying "done" before recording validation commands.
    - 2026-06-12: Same issue repeated in another PR closeout.

