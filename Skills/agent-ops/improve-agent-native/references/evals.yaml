- id: tessl-scenario-merged-product-workflow-scorecard
  name: scenario skill merged product workflow scorecard
  category: happy
  eval_modes:
  - smoke
  - release
  realistic: true
  why_realistic: Product workflow repositories often expose user actions, assistant tools, and tests that
    need one readiness review with file evidence.
  should_trigger: true
  prepend_skill: true
  tessl:
