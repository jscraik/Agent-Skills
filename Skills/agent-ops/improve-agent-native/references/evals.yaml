    staged_source: /tmp/ask-tessl-scenario-generation/Skills__agent-ops__improve-agent-native-e5d7a86b4e36/target-tile/evals/scenario-0
  claim_ids:
  - improve-agent-native.execution
  - improve-agent-native.product_capability_readiness
  prompt: |
    A small team has added an assistant to an internal operations dashboard. The repository has normal engineering surfaces such as guidance files, scripts, and tests, but it also has a user-facing workflow where operators create, update, and reconcile customer feed items. The team wants one readiness assessment they can hand to maintainers before expanding the assistant to more workflows.

    Provided files:

    AGENTS.md:
    - Run npm test for local verification.
    - Product workflow notes live in docs/workflows/feed.md.
    - Assistant tools are declared in assistant/tools.json.

    docs/workflows/feed.md:
    Operators can list feed items, create draft feed items, approve changes, delete mistaken drafts, and export a reconciliation summary.

    assistant/tools.json:
    {"tools":[{"name":"list_feed_items","description":"List current feed items"},{"name":"approve_feed_item","description":"Approve a pending feed item"}]}

    tests/feed.test.js:
    test("lists feed items", () => {});

    Create a concise maintainer review artifact that explains whether this setup is ready to expand, what evidence supports the answer, what is still missing, and the next smallest change.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - git push
  acceptance:
  - type: regex
    value: (?is)(readiness-scorecard|scorecard|target_repo|score)
  - type: regex
    value: (?is)(docs/workflows/feed.md|assistant/tools.json|AGENTS.md)
  - type: regex
    value: (?is)(create|delete|export|draft|missing|parity|capability)
  - type: regex
    value: (?is)(outcome test|parity test|partial proof|unit test)
  - type: not_regex
    value: (?is)(separate product-readiness report|fully ready|externally verified)
  - type: expected_signal
    value: Produces one readiness scorecard that cites file evidence, folds in product workflow capability parity, treats unit tests as partial proof, and recommends a small durable guardrail.
  unit: improve-agent-native scenario skill merged product workflow
  given: A product workflow exposes user actions that are only partially represented in assistant tools.
  should: Audit the repo and product workflow as one readiness system and avoid overclaiming readiness.
- id: tessl-scenario-dynamic-context-drift
  name: scenario skill dynamic context drift
  category: edge
  eval_modes:
  - smoke
  - release
  realistic: true
  why_realistic: Support assistants commonly drift when product vocabulary and runtime state contracts
    change without prompt or context updates.
  should_trigger: true
  prepend_skill: true
  tessl:
    generated_by: tessl-labs/tessl-skill-eval-scenarios@0.1.0
    staged_source: /tmp/ask-tessl-scenario-generation/Skills__agent-ops__improve-agent-native-e5d7a86b4e36/target-tile/evals/scenario-1
  claim_ids:
  - improve-agent-native.product_capability_readiness
  prompt: |
    A support assistant has started giving stale answers after a product vocabulary change. The repository has prompt material, a small capability description, and a note about the live state the assistant should receive. The maintainer wants an audit artifact that explains what readiness mechanism is missing.

    Provided files:

    prompts/support-system.md:
    You help support agents work with customer queues. The app calls customers "accounts" and calls support work "tickets".

    docs/domain-language.md:
    The current product vocabulary is "workspace", "case", and "case owner". "Account" and "ticket" are legacy words.

    assistant/capabilities.md:
    The assistant can summarize a case and draft a reply.

    app/state-contract.md:
    At runtime the assistant receives the current workspace id, selected case id, current case owner, and available reply templates.

    Create a short maintainer note with the finding, evidence, and smallest durable fix. Include whether this should block the team from expanding the assistant.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - git push
  acceptance:
  - type: regex
    value: (?is)(prompts/support-system.md|docs/domain-language.md|app/state-contract.md)
  - type: regex
    value: (?is)(vocabulary drift|legacy|account|ticket|workspace|case)
  - type: regex
    value: (?is)(dynamic context|runtime state|context routing|durable repo knowledge)
  - type: regex
    value: (?is)(prompt|capabilit|state contract)
  - type: not_regex
    value: (?is)(fully ready|100/100)
  - type: expected_signal
    value: Flags prompt vocabulary and runtime state as agent-facing readiness surfaces, cites evidence, and recommends a small synchronization or state-contract guardrail.
  unit: improve-agent-native scenario skill dynamic context drift
  given: Prompt vocabulary and product state contracts have drifted.
  should: Treat dynamic context and prompt vocabulary as readiness risks with file evidence.
- id: tessl-scenario-local-pass-release-boundary
  name: scenario skill local pass release boundary
  category: edge
  eval_modes:
  - smoke
