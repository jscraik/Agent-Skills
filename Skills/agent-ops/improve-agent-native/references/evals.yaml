- id: happy-proof-loop-gap
  name: repeated validation miss
  category: happy
  eval_modes:
  - smoke
  - release
  realistic: true
  why_realistic: Teams frequently see repeated validation misses where agents run tests but skip required
    browser or workflow evidence.
  unit: improve-agent-native repeated proof-loop miss
  given: A UI repository has a test command and policy text, but agents repeatedly finish after tests
    while skipping required browser evidence.
  should: Identify the repo harness gap, cite files to inspect, and recommend the smallest durable guardrail
    without claiming implementation proof.
  actual_artifact: Infrastructure/artifacts/skills/improve-agent-native/latest/scorecard.json
  expected_artifact: Skills/agent-ops/improve-agent-native/references/evals.yaml
  reproduce: ./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner codex --case
    happy-proof-loop-gap --skip-tessl --no-dashboard --json --robot
  should_trigger: true
  prepend_skill: true
  claim_ids:
  - improve-agent-native.activation
  - improve-agent-native.execution
  prompt: In /Users/jamiecraik/dev/coding-harness, AGENTS.md requires browser proof for UI-visible changes
    and package.json contains a pnpm test path, but agents keep finishing after pnpm test while skipping
    the required Playwright/browser smoke artifact for changed React views. Use the playbook to identify
    the repo harness gap, cite the files you would inspect, and recommend the smallest durable guardrail.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - git push
  acceptance:
  - type: regex
    value: (?is)(browser smoke|artifact|proof|guardrail)
  - type: regex
    value: (?is)(browser smoke/artifact proof is not required|minimal enforced UI-evidence gate|required
      browser proof gate|required CI check|evidence-verify|ui-browser-proof|changed React(/UI)? (views|files)|React/UI files|changed files include React views)
  - type: expected_signal
    value: Identifies the missing proof-loop mechanism and recommends the smallest durable check, validator,
      script, doc boundary, or runtime route fix before expanding scope.
