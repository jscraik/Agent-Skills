- id: eval.harness.feedback-recurs-without-guardrail
  name: Repeated Feedback Needs Durable Capture
  category: edge
  eval_modes:
  - release
  realistic: true
  tessl_live_private: true
  tessl:
    live_private: true
    reason: KnowledgeOS-selected behavioral scenario vendored into the skill package for private Tessl
      assessment.
  unit: improve-agent-native eval.harness.feedback-recurs-without-guardrail
