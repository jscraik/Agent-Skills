schema_version: '2.0'
skill_name: improve-agent-native
claims:
- id: improve-agent-native.activation
  statement: The skill activates for repository harness, AGENTS.md, docs, tool/action parity, dynamic context, and agent-native readiness audits.
  source: SKILL.md#When to use
  claim_type: activation
  risk: high
  hard_gate: true
  evidence_required:
  - realistic repo-readiness prompts select the skill
  - unrelated creative or architecture prompts do not select the skill
- id: improve-agent-native.execution
  statement: The workflow produces evidence-backed repo-readiness findings and practical next moves without
    claiming implementation proof from audit-only work.
  source: SKILL.md#Procedure
  claim_type: execution
  risk: high
  hard_gate: true
  evidence_required:
  - findings cite concrete files or blocked evidence
  - validation outcomes are classified as pass, fail, or blocked
  - audit-only work stops before patch claims
- id: improve-agent-native.portability
  statement: The skill treats the active target repository as the validation authority instead of requiring
    Agent Skills Kit package gates for ordinary repo audits.
  source: SKILL.md#Validation
  claim_type: portability
  risk: high
  hard_gate: true
  evidence_required:
  - target repo is named
  - repo-native checks are preferred
  - package maintenance gates are only used for this skill package
- id: improve-agent-native.product_capability_readiness
  statement: The workflow folds agent-facing product and workflow readiness into the normal scorecard instead of creating a separate lens.
  source: SKILL.md#Procedure
  claim_type: execution
  risk: high
  hard_gate: true
  evidence_required:
  - agent-facing apps, MCP/tool surfaces, prompts, or UI actions are audited through the same scorecard dimensions
  - findings cite target-repo evidence for action parity, primitive tool design, dynamic context, execution signals, and outcome tests
  - static checks are not treated as sufficient proof of product-agent readiness
cases:
- id: smoke-discovery-target
  name: discovery target contract
  category: happy
  eval_modes:
  - smoke
  smoke_mode: discovery-round-one
  realistic: false
  tessl_live_private: false
  why_realistic: Structural discovery-smoke contract only; behavior realism is covered by the file-backed smoke and Tessl release cases.
  unit: improve-agent-native discovery target contract
  given: A user asks for agent-native readiness help but has not named the target repository, desired artifact, or edit authority.
  should: Ask one plain-language round-one question and explain why the missing target/authority matters before auditing or patching.
  actual_artifact: Infrastructure/artifacts/skills/improve-agent-native/<run-id>/01-smoke-discovery-target/discovery-smoke/final.txt
  expected_artifact: Skills/agent-ops/improve-agent-native/references/discovery-interview.md
  reproduce: ./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner discovery-smoke --skip-tessl --no-dashboard --json --robot
  should_trigger: true
  prepend_skill: true
  prompt: Use $improve-agent-native, but the user has not provided the target repository, desired artifact, or edit authority yet.
  acceptance:
  - type: regex
    value: (?is)(Round 1 question|What should this skill help you do|What kind of help should this skill provide)
  - type: regex
    value: (?is)(Why this matters|target|validation|scorecard|patch)
- id: happy-scorecard
  name: score a repo harness
  category: happy
  eval_modes:
  - smoke
  - release
  timeout_profile: codex-heavy
  realistic: true
  why_realistic: Maintainers routinely ask for repository readiness audits that combine AGENTS routing,
    validation entrypoints, docs evidence, and proof-loop gaps.
  unit: improve-agent-native repo harness scorecard
  given: A user needs a repository readiness audit for AGENTS.md quality, docs routing, validation entrypoints,
    and proof loops.
  should: Produce a scored gap list with file-path evidence, concrete next moves, and validation outcomes
    that do not overclaim.
  actual_artifact: Infrastructure/artifacts/skills/improve-agent-native/latest/scorecard.json
  expected_artifact: Skills/agent-ops/improve-agent-native/references/evals.yaml
  reproduce: ./bin/ask evals run Skills/agent-ops/improve-agent-native --mode smoke --runner codex --case
    happy-scorecard --skip-tessl --no-dashboard --json --robot
  should_trigger: true
  prepend_skill: true
  claim_ids:
  - improve-agent-native.activation
  - improve-agent-native.execution
