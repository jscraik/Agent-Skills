schema_version: 1
skill: insight-report
purpose: Generate local Codex usage insight reports from bounded session and telemetry evidence.
triggers: [codex_usage_analytics, weekly_insight_report, prompting_help_from_sessions]
non_goals: [non_codex_writer, guessed_insights, secret_exposure, automatic_remediation]
inputs: [lookback_window, session_evidence, optional_telemetry]
outputs: [insight_evidence_json, insight_prompt_md, insights_generated_json, report_html, report_url]
risks: [partial_evidence, privacy_leakage, invalid_json, browser_launch_gap]
safety: {local_only: true, redact_sensitive_content: true, evidence_required: true}
validation: [evidence_json_valid, prompt_non_empty, insights_json_valid, html_rendered, browser_launch_verified_or_disclosed]
observability: "Report generated artifact paths, REPORT_URL, limitations, and exact command outcomes."
rollback_procedure: "Restore archived context from Infrastructure/references/deferred-skill-context/agent-ops-insight-report/ and rerun strict audit plus Plugin Eval."
