schema_version: 1
skill: coding-harness
purpose: "Operate @brainwav/coding-harness with command-accurate, preview-first validation."
triggers:
  - "Use when a repo needs harness install, bootstrap, upgrade, repair, audit, diagnosis, CI migration, governance checks, command discovery, or Codex environment action sync."
non_goals:
  - "Route unrelated feature work, generic deployment, and auth-free remote-success claims away from this skill."
inputs:
  - user_request
  - target_context
  - evidence
  - execution_mode
  - auth_posture
outputs:
  - result
  - evidence_summary
  - validation_status
  - blocker_summary
  - next_safe_command
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
  - command_surface_drift
  - auth_bound_remote_checks
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
command_truth:
  fresh_agent: "harness next --json"
  focused_help: "harness --help"
  public_agent_catalog: "harness commands --json --for-agent"
  full_catalog: "harness commands --json"
  source_repo_prefix: "pnpm exec tsx src/cli.ts"
current_contracts:
  routine_upgrade: "harness upgrade --dry-run, then harness upgrade"
  rescaffold: "harness init --update only when tracked baselines must be rewritten"
  ci_migration: "harness ci-migrate prepare/verify/commit/abort with snapshots"
  ci_ownership: "CircleCI primary PR gate, CodeRabbit independent review check, Semgrep Cloud independent external security check, GitHub Actions release/fallback only"
  environment_actions: "Only auto-update .codex/environments/environment.toml when harness-autogenerated or explicitly approved"
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
