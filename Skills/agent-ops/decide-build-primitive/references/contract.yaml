schema_version: 1
skill: decide-build-primitive
purpose: "Choose whether a capability should become a Skill, Custom Prompt, or Agent automation."
triggers:
  - "Analyze, compare, and recommend a Codex build primitive. Use when the user is packaging or automating a workflow and the right primitive is unclear."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "capability"
  - "inputs and outputs"
  - "trigger frequency"
  - "autonomy level"
  - "constraints"
outputs:
  - "single recommendation"
  - "tradeoffs"
  - "non-goals"
  - "validation path"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
