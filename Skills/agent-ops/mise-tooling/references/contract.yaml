schema_version: "1.0"
skill: mise-tooling
type: runbook
purpose: >
  Provide trust-aware mise guidance for tool pinning, shell activation, and
  deterministic execution across local and global scopes.
triggers:
  - User asks to pin language/tool versions with mise.
  - User sees mise trust prompts or activation mismatch.
  - User asks how to run commands through mise-managed runtimes.
inputs:
  - project mise config files
  - desired scope and tool versions
  - shell/runtime execution context
outputs:
  - exact mise commands
  - trust and activation guidance
  - version validation steps
non_goals:
  - generic package release workflows
  - non-mise tool managers unless migration is explicit
risks:
  - trusting unknown configs can execute unsafe env/task settings
  - missing shell activation can produce false-positive version checks
source_basis:
  execution_path: cli_primary
  context7_library_id: /jdx/mise
