schema_version: 1
skill: codex-hooks-builder
purpose: "Build Codex hook packs that match runtime behavior, preserve install boundaries, and pass hook validation gates."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "target hook pack"
  - "install boundary"
  - "trigger events"
  - "script runtime"
  - "validation commands"
  - "current Codex hook runtime docs or schema evidence"
  - "effective hook sources: user, project, managed, plugin-bundled, or inline config"
  - "compact lifecycle source evidence when using PreCompact or PostCompact"
outputs:
  - "hook pack changes"
  - "scaffold or audit notes"
  - "runtime contract"
  - "validation evidence"
  - "rollback steps"
runtime_contract:
  feature_keys:
    current: hooks
    compatibility_alias: codex_hooks
    requirement: "Current ~/dev/codex marks hooks as stable and default-enabled. Use hooks for new config only when a toggle is needed; treat codex_hooks as a legacy alias."
    conflict_rule: "When official docs and local runtime/schema evidence disagree, state the conflict and follow the target runtime's schema or validator."
  events:
    - SessionStart
    - SubagentStart
    - SubagentStop
    - PreToolUse
    - PermissionRequest
    - PostToolUse
    - PreCompact
    - PostCompact
    - UserPromptSubmit
    - Stop
  matcher_rules:
    tool_name_events:
      - PreToolUse
      - PermissionRequest
      - PostToolUse
    compact_trigger_events:
      - PreCompact
      - PostCompact
    compact_triggers:
      - manual
      - auto
    session_start_sources:
      - startup
      - resume
      - clear
    ignored_matcher_events:
      - UserPromptSubmit
      - Stop
  subagent_lifecycle:
    start_role: "Inject task envelopes, runtime-card path, freshness requirements, expected artifacts, and role boundary context."
    stop_role: "Verify expected artifacts, record lifecycle outcome, and classify blocked or missing-artifact agents before coordinator synthesis."
    preferred_starting_point: "One shared lifecycle recorder plus one artifact verifier before per-role hook scripts."
    receipt_fields: [agent_id, agent_type, turn_id, session_id, artifact_path, expected_artifacts, completion_class, blocker_class]
  runtime_card:
    candidate_paths: [.harness/runtime/current-card.json, .codex/runtime-card.json]
    fields: [repo, cwd, branch, head_sha, dirty_state, session_id, turn_id, trace_id, goal_state, permission_profile, approval_reviewer, active_hooks_hash, active_agents, expected_artifacts, known_external_refs, last_validation, freshness, generated_at, expires_at]
    freshness_values: [fresh, stale, unknown]
  stop_claim_verifier:
    policy: "Allow by default; block only high-confidence contradictions between final claims and evidence."
    claim_classes: [validation, artifact, pr_readiness, review_thread, goal_completion]
    loop_escape_required: true
  telemetry:
    sink_format: jsonl
    fields: [session_id, turn_id, trace_id, hook_event_name, tool_name, agent_id, artifact_path, decision, blocker_class, runtime_card_freshness]
  compact_lifecycle:
    source_evidence: "Target Codex checkout compact event implementation and generated pre-compact/post-compact schemas, when that checkout is available."
    input_fields:
      - session_id
      - turn_id
      - cwd
      - transcript_path
      - model
      - trigger
      - hook_event_name
    output_fields:
      - continue
      - stopReason
      - suppressOutput
      - systemMessage
    behavior:
      pre_compact: "continue=false stops before compaction; decision=block is invalid."
      post_compact: "runs after compaction and can stop later continuation, but should be used mainly for audit, indexing, and telemetry."
      stdout: "Plain stdout is ignored; use schema-bound JSON only for intentional warning or stop behavior."
  hook_sources:
    - user_hooks_json
    - user_config_inline_hooks
    - project_hooks_json
    - project_config_inline_hooks
    - managed_requirements_hooks
    - plugin_bundled_hooks
  current_runtime_notes:
    executable_handler: "command"
    skipped_handlers: [prompt, agent, async_command]
    trust: "Non-managed command hooks require enabled state and a matching trusted_hash unless trust is bypassed by the runtime."
    managed_only: "allow_managed_hooks_only is requirements-only; config.toml does not enable it."
    plugin_env: [PLUGIN_ROOT, PLUGIN_DATA, CLAUDE_PLUGIN_ROOT, CLAUDE_PLUGIN_DATA]
    plugin_hooks_feature_flag: "Do not document or require a plugin-hooks feature flag unless the target runtime proves it still exists."
    output_spill: "Large model-visible hook text is truncated and saved under the OS temp hook_outputs directory."
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
  - duplicate_layer_execution
  - stale_feature_aliases
  - unmatched_payload_shape
  - stale_runtime_card
  - missing_artifact_receipt
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
  - hook_json_validation
  - effective_hook_listing_when_available
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
