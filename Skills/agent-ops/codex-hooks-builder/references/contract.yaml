schema_version: 1
skill: codex-hooks-builder
purpose: "Build Codex hook packs that match runtime behavior, preserve install boundaries, and pass hook validation gates."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "target hook pack"
  - "install boundary"
  - "trigger events"
  - "script runtime"
  - "validation commands"
  - "current Codex hook runtime docs or schema evidence"
  - "effective hook sources: user, project, managed, plugin-bundled, or inline config"
  - "compact lifecycle source evidence when using PreCompact or PostCompact"
outputs:
  - "hook pack changes"
  - "scaffold or audit notes"
  - "runtime contract"
  - "validation evidence"
  - "rollback steps"
runtime_contract:
  feature_keys:
    current: hooks
    compatibility_alias: codex_hooks
    requirement: "Check the target runtime and official Codex docs before choosing a feature flag. Treat hooks and codex_hooks as compatibility aliases when both are accepted, and do not remove codex_hooks unless the target runtime or docs explicitly deprecate it."
    conflict_rule: "When official docs and local runtime/schema evidence disagree, state the conflict and follow the target runtime's schema or validator."
  events:
    - SessionStart
    - PreToolUse
    - PermissionRequest
    - PostToolUse
    - PreCompact
    - PostCompact
    - UserPromptSubmit
    - Stop
  matcher_rules:
    tool_name_events:
      - PreToolUse
      - PermissionRequest
      - PostToolUse
    compact_trigger_events:
      - PreCompact
      - PostCompact
    compact_triggers:
      - manual
      - auto
    session_start_sources:
      - startup
      - resume
      - clear
    ignored_matcher_events:
      - UserPromptSubmit
      - Stop
  compact_lifecycle:
    source_evidence: "Target Codex checkout compact event implementation and generated pre-compact/post-compact schemas, when that checkout is available."
    input_fields:
      - session_id
      - turn_id
      - cwd
      - transcript_path
      - model
      - trigger
      - hook_event_name
    output_fields:
      - continue
      - stopReason
      - suppressOutput
      - systemMessage
    behavior:
      pre_compact: "continue=false stops before compaction; decision=block is invalid."
      post_compact: "runs after compaction and can stop later continuation, but should be used mainly for audit, indexing, and telemetry."
      stdout: "Plain stdout is ignored; use schema-bound JSON only for intentional warning or stop behavior."
  hook_sources:
    - user_hooks_json
    - user_config_inline_hooks
    - project_hooks_json
    - project_config_inline_hooks
    - managed_hooks_directory
    - plugin_bundled_hooks
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
  - duplicate_layer_execution
  - stale_feature_aliases
  - unmatched_payload_shape
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
  - hook_json_validation
  - effective_hook_listing_when_available
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
