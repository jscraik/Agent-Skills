schema_version: 1
skill: npm-release
purpose: "Prepare, validate, and publish npm package releases with semver, provenance, dist-tags, and 2FA safeguards."
triggers:
  - "Create, review, and validate npm release workflows. Use when preparing or publishing npm packages, release channels, dist-tags, provenance, or 2FA-protected publishes."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "package name"
  - "version or bump"
  - "dist-tag"
  - "provenance/access requirements"
  - "release notes handoff"
outputs:
  - "release plan"
  - "commands"
  - "preflight evidence"
  - "publish verification"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
