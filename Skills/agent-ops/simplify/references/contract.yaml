schema_version: 1
skill: simplify
rubric_profile: skills-sdk.gold-standard.v1
purpose: "Improve changed code while preserving behavior and proving equivalence where risk matters."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - user_request
  - target_context
  - evidence
outputs:
  - result
  - evidence_summary
  - validation_status
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
commands:
  - "./bin/ask skills audit Skills/agent-ops/simplify --level strict --json --robot"
  - "./bin/ask skills package verify Skills/agent-ops/simplify --strict --json --robot"
permission_profile:
  network: false
  filesystem:
    read:
      - target diff and source files
      - repository guidance and validation commands
    write:
      - approved canonical source and test files
observability: "Report validation commands and outcomes."
evidence_requirements:
  - "Report the changed scope and exact validation command outcomes."
  - "Name remaining behavior or evidence boundaries before claiming simplification."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
