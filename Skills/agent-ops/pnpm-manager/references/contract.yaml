schema_version: 1
skill: pnpm-manager
purpose: "Run pnpm workspace operations with scoped recursive and filter selectors."
triggers:
  - "Run, plan, and validate pnpm workspace operations. Use when a user needs pnpm monorepo installs, tests, builds, filters, changed-package selection, or publish routing."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "workspace root"
  - "target packages"
  - "command intent"
  - "filter selector"
  - "risk posture"
outputs:
  - "pnpm command plan"
  - "selector evidence"
  - "validation command"
  - "blockers"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
