schema_version: 1
skill: codex-review
purpose: Run Codex CLI review as an evidence-producing closeout check for local dirty work, branch diffs, PR branches, or single commits.
triggers:
  - Codex review
  - autoreview
  - second-model review
  - review before final response
  - review before commit or PR update
non_goals:
  - CodeRabbit review-thread inventory
  - multi-PR until-green orchestration
  - merge approval
  - branch cleanup
  - unrelated refactors
inputs:
  - repo_path
  - git_status
  - review_mode
  - base_ref
  - commit_ref
  - pr_metadata
  - optional_parallel_test_command
  - auto_parallel_test_detection
  - approval_posture
outputs:
  - selected_review_target
  - review_command
  - accepted_findings
  - rejected_findings
  - validation_evidence
  - clean_review_result_or_blocker
risks:
  - untrusted_review_output
  - sandbox_or_permission_escalation
  - stale_review_after_tests_change_code
  - reviewing_empty_dirty_state_instead_of_branch_work
  - losing already_committed_change coverage on clean main
  - gitcrawl_portable_cache_corruption
  - security_audit_suppression_hiding_active_risk
  - false_clean_result_from_new_review_output_format
  - false_findings_from_quoted_severity_examples
  - false_clean_when_severity_and_clean_prose_coexist
  - false_clean_from_untagged_finding_headings
  - false_findings_from_clean_markdown_findings_heading
  - leaking sensitive local details in final reports
  - networked_review_denied_by_tenant_policy
  - false_blocked_runtime_from_reviewed_policy_text
  - stale_branch_refs_after_fetch_permission_failure
  - nested_review_system_skill_install_denied_without_runtime_skills_dir
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
  raw_reviewer_text_in_shell: false
  external_writes: false
  full_access_default: false
  ambiguous_finding_output_fails_closed: true
validation:
  - helper_help_runs
  - helper_default_dry_run_uses_normal_approval_mode
  - helper_full_access_dry_run_is_explicit
  - helper_dry_run_commit_mode
  - helper_no_yolo_dry_run
  - helper_untagged_finding_output_fails
  - helper_quoted_severity_examples_stay_clean
  - helper_severity_findings_override_clean_prose
  - helper_untagged_finding_headings_fail_closed
  - helper_clean_markdown_findings_heading_stays_clean
  - strict_skill_audit
  - focused_tests_rerun_after_review_triggered_fixes
  - codex_review_rerun_after_review_triggered_fixes
  - filesystem_only_runtime_permission_retry
  - blocked_runtime_fallback_classification
  - degraded_existing_refs_fetch_warning
  - fetch_required_blocks_on_fetch_failure
  - nested_review_adds_runtime_skills_dir
observability: Report target selection, command used, auto test selection when present, findings accepted or rejected, validation outcomes, and blockers.
rollback_procedure: Revert codex-review skill files and rerun strict skill audit.
