schema_version: 1
skill: prek-pro
purpose: "Provide docs-backed prek hook guidance that keeps hook config, shims, validation, and migration behavior reproducible."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "prek.toml path"
  - "hook failure output"
  - "runtime manager"
  - "migration source"
  - "validation command"
outputs:
  - "config guidance or patch"
  - "shim/install notes"
  - "failure diagnosis"
  - "validation evidence"
  - "remaining blockers"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
