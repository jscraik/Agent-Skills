purpose: Use this skill when encountering bugs, test failures, regressions, or unexpected
  behavior to run a root-cause-first debugging workflow before proposing fixes or
  code changes.
schema_version: '1.0'
triggers:
- When requests match systematic-debugging scope and intent.
inputs:
- user request details
outputs:
- structured response or artifacts defined by the skill
non_goals:
- out-of-scope requests outside the skill boundary
risks:
- missing context; mitigated by clarifying questions and explicit assumptions
