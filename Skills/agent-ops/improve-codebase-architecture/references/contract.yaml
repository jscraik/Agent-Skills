schema_version: 2
skill: improve-codebase-architecture
purpose: Proof-backed architecture decisions from current repo evidence.
triggers: [architecture review, dependency graph, modularization, ownership boundary, patch-vs-interface decision]
non_goals: [one-line bug fix, formatting cleanup, dependency upgrade without design pressure]
inputs: [target_path, user_request, capability, callers, tests, public_interfaces]
outputs: [fresh_evidence, capability, boundary_verdict, patch_design, interface_design, recommended_first_move, validation]
risks: [over_triggering, untrusted_input, premature_redesign, generated_projection_authority]
capability_selection: {source: references/knowledge-capsule.manifest.yaml, route: references/knowledge-capsule-routing.md, rule: one facet only}
quality_criteria:
  capability_selection:
    purpose: Select the smallest facet.
    why_it_matters: Prevents loading all capsules or overclaiming producer proof.
    observable_evidence: [selected facet, separate local proof lane]
    scoring: {5: narrow plus proof, 4: relevant minor gaps, 3: implicit, 2: selector missing, 1: loads all}
  architecture_decision_quality:
    purpose: Keep decisions source-backed and verifier-tied.
    why_it_matters: Tests alone do not prove ownership, public surface, or dependency safety.
    observable_evidence: [source, public surface, callers, change class, verdict, first move, verifier]
    scoring: {5: evidence backed, 4: supported, 3: partial proof, 2: weak proof, 1: broad rewrite}
automatic_failure_conditions: [Loads all capsules by default., Overclaims KnowledgeOS producer proof., Migrates interface without owner caller verifier proof.]
evidence_requirements: [Cite manifest or selected flat capsule., Cite local source caller verifier proof., Name blocker class and fallback.]
observability: Report file line evidence, verifier output, and blocker class.
rollback_procedure: Revert scoped edits and rerun package, audit, and Plugin Eval gates.
