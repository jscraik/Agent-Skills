schema_version: 1
skill: improve-codebase-architecture
purpose: "Find architecture moves that reduce cognitive load and improve leverage before broad refactors."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - user_request
  - target_context
  - evidence
outputs:
  - result
  - evidence_summary
  - complexity_symptoms
  - design_options
  - recommended_first_move
  - reversibility
  - tracer_proof
  - decision_surface
  - validation_status
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
  - premature_redesign
  - complexity_displacement
required_deep_review_fields:
  - complexity_symptoms
  - design_options.patch_design
  - design_options.interface_design
  - recommended_first_move
  - tracer_proof
  - reversibility
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
  - tracer_proof_or_blocker
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
