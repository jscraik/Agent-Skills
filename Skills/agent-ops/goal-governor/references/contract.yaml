schema_version: "1.1"
purpose: "Operational contract for Codex goal governance skills."
triggers:
  - "create durable /goal board"
  - "continue Codex goal work"
  - "review or tighten a /goal prompt without starting execution"
  - "doctor or audit goal workflow"
  - "repair stale or invalid goal state"
inputs:
  - "target repository"
  - "goal objective or existing goal path"
  - "editable boundary"
  - "verification command"
  - "stop condition"
outputs:
  - "native and board state reconciliation"
  - "prompt readiness report for review-mode launch packages"
  - "native goal identity and objective-edit reconciliation when available"
  - "next safe action"
  - "validation evidence"
  - "truth lanes for local validation, generated artifacts, remote PR checks, review threads, tracker state, and merge readiness when closeout evidence is used"
  - "receipt closure ledger that distinguishes task progress, pending external rechecks, and final goal-closure eligibility"
  - "MDX implementation notes artifact for governed implementation Worker lanes"
  - "XP operating artifacts: blackboard delta and slack policy for long-running continuation"
  - "receipts or repair proposal"
non_goals:
  - "ordinary one-file fixes"
  - "direct ~/.codex mutation without explicit user request"
  - "native Codex goal API implementation"
risks:
  - "stale board state can mislead continuation"
  - "prompt review can accidentally start native goal machinery without a review-mode guard"
  - "native /goal objective can drift from the repo-visible board"
  - "native blocked and usage-limited stop states can be confused with ordinary validator or environment blockers"
  - "stale local collector or PR evidence can be mistaken for live delivery truth"
  - "a Worker, Governor, or interim Judge/PM receipt can be mistaken for final goal-closure authority"
  - "pass_with, blocked, or requires decisions can hide unfinished rechecks when their closure effect is implicit"
  - "implementation notes can drift from runtime truth when not enforced as a board artifact"
  - "goal tools may be unavailable for ephemeral or state-less turns even when source support exists"
  - "unscoped workers can edit outside the intended boundary"
implementation_notes_contract:
  required_when: "Any task has type=worker."
  path_prefix: ".harness/implementation-notes/"
  extension: ".mdx"
  state_path: "artifacts.implementation_notes"
  required_statuses:
    - "present"
    - "verified"
  required_browser_preview_surface: "localhost"
  browser_preview_statuses:
    - "verified"
    - "blocked"
  live_update_statuses:
    - "enabled"
    - "blocked"
  live_update_required_when: "Browser preview is verified."
  live_update_watched_path: "Must match artifacts.implementation_notes.path."
  required_sections:
    - "Deep Module Topology"
    - "Current Slice Insertion Map"
    - "Runtime Truth Surface"
    - "Blast Radius View"
    - "Validation Coverage"
  required_components:
    - "DeepModuleMap"
    - "InsertionPoint"
    - "RuntimeCardState"
    - "BlastRadiusMap"
    - "ValidatorCoverage"
output_contract:
  schema_version: "1"
  applies_to_modes:
    - "create"
    - "continue"
    - "doctor"
    - "check"
    - "repair"
    - "import"
  mode_specific_overrides:
    review: "Use review_mode_contract.required_fields instead of the global output contract fields."
  required_fields:
    - "schema_version"
    - "mode"
    - "goal_path"
    - "native_goal_status"
    - "board_status"
    - "next_action"
    - "truth_lanes"
    - "receipt_closure_ledger"
    - "validation_evidence"
    - "risks"
receipt_closure_contract:
  applies_when: "A board has receipts, task transitions, or any closeout claim."
  required_fields_per_entry:
    - "task_id"
    - "receipt_id"
    - "role"
    - "decision"
    - "evidence_refs_or_explicit_gap"
    - "current_verifier_outcome_or_not_applicable"
    - "pending_recheck_or_blocker"
    - "closure_eligibility"
  role_semantics:
    scout: "Can establish discovery or recovery evidence; never closes the goal."
    worker: "Can complete its scoped task when its task contract is met; never closes the goal."
    governor: "Can reconcile the board and route recovery; never closes the goal."
    judge_or_pm: "May close the goal only with final decision=complete, all required tasks accounted for, and current completion-contract verification evidence."
  decision_semantics:
    pass: "Task progress only unless the final Judge/PM closure criteria are also met."
    pass_with_suffix: "Task progress with named pending recheck or remediation; goal closure is false until that item is resolved or explicitly classified nonblocking by the board completion contract."
    blocked_or_requires_suffix: "Carry the named blocker or owner work forward; goal closure is false."
    complete: "Eligible only for final Judge/PM closure after all board-required tasks and current verifier evidence are reconciled."
  external_recheck_rule: "Keep external review, CI, tracker, and merge rechecks in their own truth lanes. A pending external recheck does not become local validation evidence and cannot be silently dropped from a closeout claim."
review_mode_contract:
  trigger_phrases:
    - "check this prompt"
    - "review this"
    - "tighten this"
    - "improve this"
    - "not start yet"
  execution_override_phrase: "proceed with governed implementation"
  route_when_override_present: "continue"
  required_fields:
    - "prompt_readiness"
    - "interpreted_objective"
    - "target_repository"
    - "proposed_first_slice"
    - "required_permissions"
    - "external_systems_that_would_be_touched"
    - "expected_artifacts"
    - "stop_conditions"
    - "questions_or_contradictions"
    - "governor_start_command"
  forbidden_actions:
    - "create_goal"
    - "native goal continuation"
    - "spawn agents"
    - "tracker mutation"
    - "commit"
    - "pull request"
    - "CI monitoring"
    - "implementation edits"
rollback_procedure: "Do not mutate implementation files during repair unless the active Worker task allows them; revert board-only changes if validation fails."
observability: "Record exact command, outcome, and note for every verifier and guard."
quality_criteria:
  receipt_closure_truth:
    purpose: "Keep bounded task progress, pending external rechecks, and final goal closure distinct."
    observable_evidence:
      - "receipt_closure_ledger"
      - "receipt role and decision"
      - "current verifier outcome"
      - "pending recheck or blocker"
      - "final Judge or PM decision=complete when closure is claimed"
    scoring:
      "5": "Every material receipt has a closure classification; final closure maps every board-required task and current verifier to the completion contract."
      "3": "Receipt decisions are reported but task progress, rechecks, or final closure authority remain ambiguous."
      "1": "A Worker, pass_with, or interim receipt is treated as implicit goal completion."
evidence_requirements:
  - "exact validator command and outcome before board-health claims"
  - "receipt role, decision, task ID, and receipt ID for task-transition or closeout claims"
  - "current verifier outcome or explicit not-applicable reason for closure candidates"
  - "pending external rechecks retained in their matching truth lane"
  - "final Judge or PM decision=complete plus completion-contract reconciliation before goal closure"
