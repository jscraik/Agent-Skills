schema_version: 1
skill: alignment-checkpoint
purpose: "Create an explicit goal, assumptions, and success-criteria checkpoint before risky or ambiguous work starts."
triggers:
  - "Create, review, and validate an alignment checkpoint. Use when a request is ambiguous, high-stakes, multi-step, or requires explicit approval before tool use."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "user request"
  - "constraints"
  - "risk level"
  - "approval posture"
outputs:
  - "goal extraction"
  - "assumptions"
  - "success criteria"
  - "approach options"
  - "approval gate"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
