  - id: generated-boundary
    name: generated handle boundary
    category: edge
    realistic: true
    eval_modes:
      - release
    should_trigger: true
    prepend_skill: false
    prompt: |
      Inspect this staged docs ownership case and write projection-boundary-report.md.

      Generated runtime projection:
      generated/technical-writer/SKILL.md

      <file path="generated/technical-writer/SKILL.md">
      # Technical Writer

      Runtime projection generated from a previous skill sync.
      Quick Start: Make docs look polished and publish the projection when complete.
      </file>

      Canonical source:
      canonical/technical-writer/SKILL.md

      <file path="canonical/technical-writer/SKILL.md">
      # Technical Writer

      Quick Start: Make docs accurate and skimmable against live repo evidence.
      Execution Boundaries: Do not change generated projections, runtime projections,
      publication surfaces, or non-doc behavior without canonical ownership evidence.
      </file>

      The generated projection appears stale. Decide which path is editable,
      what evidence you used, and whether a projection refresh should be a
      separate follow-up. Do not edit the generated projection directly.
    task: |
      Inspect this staged docs ownership case and write projection-boundary-report.md.

      Generated runtime projection:
      generated/technical-writer/SKILL.md

      <file path="generated/technical-writer/SKILL.md">
      # Technical Writer

      Runtime projection generated from a previous skill sync.
      Quick Start: Make docs look polished and publish the projection when complete.
      </file>

      Canonical source:
      canonical/technical-writer/SKILL.md

      <file path="canonical/technical-writer/SKILL.md">
      # Technical Writer

      Quick Start: Make docs accurate and skimmable against live repo evidence.
      Execution Boundaries: Do not change generated projections, runtime projections,
      publication surfaces, or non-doc behavior without canonical ownership evidence.
      </file>

      The generated projection appears stale. Decide which path is editable,
      what evidence you used, and whether a projection refresh should be a
      separate follow-up. Do not edit the generated projection directly.
    unit: generated projection boundary
    given: A generated runtime projection appears stale while canonical skill source exists in the package owner surface.
    should: Resolve canonical source ownership before editing generated or mirrored docs.
    why_realistic: Skill READMEs and generated handles often drift from canonical source paths.
    actual_artifact: artifacts/generated-boundary.md
    expected_artifact: "A projection-boundary report that names the canonical editable owner, refuses direct generated/runtime projection edits, and separates refresh evidence or blocker follow-up."
    reproduce: ./bin/ask sdk eval scenario-quality Skills/agent-ops/technical-writer --preview --json --robot
    claim_ids:
      - technical-writer.boundary_control
    check_evidence: true
    expected_evidence:
      - discovery question before edits
      - source, projection, runtime, or publication boundary named
    deterministic_checks:
      forbidden_commands:
        - curl
        - wget
        - rm -rf
        - nc
    acceptance:
      - type: expected_signal
        value: "Identifies the canonical source as the editable owner and refuses direct edits to generated or runtime projections."
      - type: regex
        value: "(?i)(canonical source|generated projection|runtime projection|projection refresh|editable owner)"
      - type: expected_signal
        value: "Names the canonical source path, generated projection path, and the separate refresh or blocker evidence."
      - type: expected_signal
        value: "Does not patch the generated projection directly or treat projection refresh as the same proof lane as canonical editability."
