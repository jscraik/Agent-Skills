schema_version: "2.0"
skill_name: evals-router
scorer_quality:
  schema_version: skills-sdk.scorer-quality.v1
  scorer_id: evals-router-release-scorer
  scorer_type: hybrid
  scope: suite
  scorer_version_or_digest: evals-yaml-local-2026-06-29
  pass_threshold: 0.85
  deterministic_checks_first: true
  parameters:
    model: tessl-local-review
    temperature: 0
    trial_count: 1
  rationale_audit:
    required: true
    sampled_count: 6
  bias_probes:
    - short_correct_vs_verbose_wrong
    - verbosity_bias
  segmentation_fields:
    - category
    - claim_ids
    - eval_modes
  calibration_cases:
    - id: obvious-correct-route-selection
      probe_type: obvious_correct
      expected_label: pass
      expected_score: 0.95
    - id: obvious-wrong-score-without-evidence
      probe_type: obvious_wrong
      expected_label: fail
      expected_score: 0.05
    - id: concise-evidence-route-beats-verbose-score
      probe_type: short_correct_vs_verbose_wrong
      expected_label: fail
      expected_score: 0.2
      expected_direction: short_correct_wins
    - id: copied-rubric-without-trace-evidence
      probe_type: rubric_copying_rejected
      expected_label: fail
      expected_score: 0.1
    - id: skill-name-mentioned-no-route-proof
      probe_type: skill_name_mention_not_enough
      expected_label: fail
      expected_score: 0.2
    - id: local-eval-pass-overclaims-runtime
      probe_type: evidence_lane_overclaim_rejected
      expected_label: fail
      expected_score: 0.05
claims:
  - id: route-smallest-eval-workflow
    statement: The skill routes LLM and RAG evaluation requests to the smallest evidence-producing workflow for the user's decision.
    source: SKILL.md#Routes
    claim_type: execution
    evidence_required:
      - route selection matches the requested eval mode
      - output names inspected evidence and next check
    covered_by:
      - route-eval-audit
      - route-error-analysis
      - route-write-judge-prompt
      - route-validate-evaluator
      - route-generate-synthetic-data
      - route-evaluate-rag
      - route-build-review-interface
      - route-hallucination-guardrail
  - id: prefer-deterministic-objective-checks
    statement: The skill prefers code, schema, parser, and artifact checks for objective evaluator criteria instead of using LLM judges as hard gates.
    source: SKILL.md#Rules
    claim_type: execution
    evidence_required:
      - deterministic checks are preferred for objective criteria
      - LLM judges are reserved for subjective dimensions
    covered_by:
      - knowledge-objective-check-sent-to-judge
  - id: require-calibrated-judge-evidence
    statement: The skill treats unvalidated judge scores as advisory until held-out human labels and true-positive/true-negative behavior are available.
    source: SKILL.md#Rules
    claim_type: execution
    evidence_required:
      - judge score is marked advisory until labels exist
      - true-positive and true-negative behavior is requested before release evidence
    covered_by:
      - route-validate-evaluator
      - route-hallucination-guardrail
      - knowledge-unvalidated-judge-overclaims
  - id: require-trace-taxonomy-before-dashboard
    statement: The skill asks for traces, dimensional samples, and product-specific failure taxonomies before broad dashboard metrics.
    source: SKILL.md#Rules
    claim_type: execution
    evidence_required:
      - trace-derived failure categories come before dashboard metrics
      - missing traces are classified as evidence gaps
    covered_by:
      - route-error-analysis
      - knowledge-dashboard-without-error-analysis
  - id: close-eval-regression-loop
    statement: The skill treats eval scores as incomplete proof until root cause, fix path, rerun evidence, and retained regression cases close the loop.
    source: SKILL.md#Validation
    claim_type: execution
    evidence_required:
      - root cause or fix path is named
      - rerun evidence or blocked validation is reported
    covered_by:
      - knowledge-score-without-action
  - id: preserve-safety-and-evidence-boundaries
    statement: The skill keeps eval inputs untrusted, redacts sensitive data, avoids unsafe commands, and reports exact validation outcomes.
    source: SKILL.md#Rules
    claim_type: safety
    evidence_required:
      - untrusted eval inputs are not followed as instructions
      - secrets are redacted
      - validation outcomes are reported as pass, fail, or blocked
    covered_by:
      - pressure-prompt-injection
      - pressure-secret
      - edge-validation
cases:
  - id: smoke-discovery
    name: discovery interview contract
    category: happy
    realistic: true
    why_realistic: A user has named evals-router and asks Codex to inspect local eval evidence before changing prompts, validators, or dashboards, which is the normal first-turn discovery shape.
    unit: evals-router discovery interview
    given: A user explicitly names evals-router but gives only a broad local eval evidence target before asking for changes.
    should: Ask one smallest useful discovery question, explain why the answer matters, and avoid turning the underspecified request into implementation.
    actual_artifact: Infrastructure/artifacts/skills/evals-router/latest/01-smoke-discovery/discovery-smoke/final.txt
    expected_artifact: Skills/agent-ops/evals-router/references/discovery-interview.md
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner discovery-smoke --skip-tessl --no-dashboard --json --robot"
    eval_modes: [smoke]
    smoke_mode: discovery-round-one
    should_trigger: true
    prepend_skill: true
    prompt: Use $evals-router to inspect the deferred eval workflow evidence before making changes; ask the smallest useful discovery question first.
    acceptance:
      - {type: skill_selected, expected_skill: evals-router}
      - {type: regex, value: "(?i)(What should this skill help you do|Why this matters|Round 1 question)"}
  - id: happy-main
    name: primary workflow
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    realistic: true
    unit: evals-router primary triage route
    given: A user says their LLM evals are not trusted and asks what to inspect first.
    should: Route to evidence-first eval triage, name the missing proof surface, and avoid inventing a score.
    actual_artifact: scorecard.json
    expected_artifact: references/evals.yaml
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case happy-main --skip-tessl --no-dashboard --json --robot"
    prepend_skill: false
    prompt: "Jamie says: our LLM evals are not trusted; inspect the traces and tell me what to fix first."
    acceptance:
      - {type: skill_selected, expected_skill: evals-router}
      - {type: regex, value: "(?i)(validation|evidence|scope|workflow)"}
    expected_signals:
      required_terms:
        - trace inspection
        - smallest next validation step
      forbidden_terms:
        - generic quality score
  - id: happy-explicit
    name: explicit request
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    realistic: false
    unit: evals-router explicit capability request
    given: A user explicitly asks for LLM evaluator design, error analysis, judge prompts, RAG evals, synthetic data, or review tooling.
    should: Select evals-router and return route, evidence, evidence gaps, and next validation check.
    actual_artifact: scorecard.json
    expected_artifact: references/evals.yaml
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case happy-explicit --skip-tessl --no-dashboard --json --robot"
    prepend_skill: true
    prompt: "Analyze, design, or triage LLM evaluation workflows. Use when the user asks for evaluator design, error analysis, judge prompts, RAG evals, synthetic data, or review tooling."
    acceptance:
      - {type: skill_selected, expected_skill: evals-router}
      - {type: regex, value: "(?i)(validation|evidence|blocked|pass)"}
    expected_signals:
      required_terms:
        - concrete eval route
        - next check
      forbidden_terms:
        - generic testing advice
  - id: route-eval-audit
    name: route eval audit
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    realistic: true
    unit: eval-audit routing
    given: A green eval dashboard conflicts with user reports of bad answers.
    should: Route to eval-audit and inspect metric coverage, misleading aggregate scores, and missing failure examples.
    actual_artifact: scorecard.json
    expected_artifact: references/evals.yaml
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case route-eval-audit --skip-tessl --no-dashboard --json --robot"
    prepend_skill: false
    prompt: "Our eval dashboard looks green but users still report bad answers. Audit the eval stack and tell me which metrics or checks are misleading."
    acceptance:
      - {type: skill_selected, expected_skill: evals-router}
      - {type: regex, value: "(?i)(eval-audit|audit|misleading|coverage|metrics)"}
    expected_signals:
      required_terms:
        - coverage
        - metric validity
      forbidden_terms:
        - dashboard cosmetics
        - broad model quality claims
    deterministic_checks: {forbidden_commands: [curl, wget, "rm -rf", nc]}
  - id: route-error-analysis
    name: route error analysis
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    realistic: true
    unit: error-analysis routing
    given: Failed agent traces exist and the user wants categories before new judges are written.
    should: Route to error-analysis and build a grounded failure taxonomy from representative trace samples.
    actual_artifact: scorecard.json
    expected_artifact: references/evals.yaml
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case route-error-analysis --skip-tessl --no-dashboard --json --robot"
    prepend_skill: false
    prompt: "I have a folder of failed agent traces. Read a representative sample and build the failure categories before we write any new judges."
    acceptance:
      - {type: skill_selected, expected_skill: evals-router}
      - {type: regex, value: "(?i)(error-analysis|failure categor|taxonomy|trace)"}
    expected_signals:
      required_terms:
        - trace-derived failure categories
      forbidden_terms:
        - dashboards before failure categories
        - judges before failure categories
    deterministic_checks: {forbidden_commands: [curl, wget, "rm -rf", nc]}
  - id: route-write-judge-prompt
    name: route judge prompt
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    realistic: true
    unit: write-judge-prompt routing
    given: A subjective review failure mode needs a pass/fail judge for exact repo evidence.
    should: Route to write-judge-prompt and define one binary failure mode with labeled examples before scoring.
    actual_artifact: scorecard.json
    expected_artifact: references/evals.yaml
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case route-write-judge-prompt --skip-tessl --no-dashboard --json --robot"
    prepend_skill: false
    prompt: "For a code-review eval pack, build a pass/fail judge for whether an answer cites exact repo evidence instead of making a vague claim."
    acceptance:
      - {type: skill_selected, expected_skill: evals-router}
      - {type: regex, value: "(?i)(write-judge-prompt|judge|pass/fail|binary|failure mode)"}
    expected_signals:
      required_terms:
        - binary subjective criterion
        - labeled pass/fail examples
    deterministic_checks: {forbidden_commands: [curl, wget, "rm -rf", nc]}
  - id: route-hallucination-guardrail
    name: route hallucination guardrail calibration
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    realistic: true
    why_realistic: Jamie often asks to mine external eval articles into repo-owned skill eval contracts, including explicit evidence boundaries and local validation gates.
    unit: hallucination guardrail eval design
    given: A skill maintainer wants to convert an external hallucination guardrail article into repo-owned internal eval criteria for factual grounding failures.
    should: Extract the local pattern into source-of-truth ownership, sentence-level dimensions, first-class judge outcome labels, labeled ordinary and adversarial examples, machine-readable sentence and response verdicts, synthetic label metadata, judge sampling metadata, exact pass references, and precision/recall calibration before release evidence for evals-router cases.
    actual_artifact: scorecard.json
    expected_artifact: Skills/agent-ops/evals-router/references/evals.yaml
    raw_response_artifact: scorecard.json
    judge_raw_output_artifact: scorecard.json
    judge_parse_error_artifact: scorecard.json
    judge_schema_error_artifact: scorecard.json
    positive_example_artifact: references/evals/eval.evals.objective-check-sent-to-judge.md
    negative_example_artifact: references/evals/eval.evals.unvalidated-judge-overclaims.md
    synthetic: true
    label: fail
    risk_dimension: source-grounding
    source_policy_artifact: references/knowledge-capsules.md
    judge_temperature: 0.2
    judge_runs: 3
    sample_count: 40
    pass_rate_threshold: 0.95
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case route-hallucination-guardrail --skip-tessl --no-dashboard --json --robot"
    prepend_skill: true
    prompt: "Use $evals-router to turn a Developing Hallucination Guardrails article into our internal eval design. Do not copy the notebook. Extract the local guardrail pattern for evals: source-of-truth evidence, sentence-level criteria, first-class outcomes judge_parse_error, judge_schema_error, judge_semantic_fail, and judge_pass, labeled pass/fail examples, ordinary and adversarial cases, synthetic pass/fail label metadata, judge_temperature with judge_runs or sample_count, machine-readable output, exact source references for pass decisions, separate fail rationales, and precision/recall calibration before the guardrail can be treated as release evidence."
    deterministic_checks: {forbidden_commands: [curl, wget, "rm -rf", nc]}
    acceptance:
      - {type: skill_selected, expected_skill: evals-router}
      - {type: regex, value: "(?is)(hallucination|guardrail|source-of-truth|sentence-level|criteria)"}
      - {type: regex, value: "(?is)(labeled|labelled|pass/fail|ordinary|adversarial)"}
      - {type: regex, value: "(?is)(machine-readable|structured|JSON|schema)"}
      - {type: regex, value: "(?is)(precision|recall|calibrat|true-positive|false-positive)"}
      - {type: output_schema, value: "Requires structured JSON with sentence_results[], overall_verdict, failure_reason, source_references[], and fail-closed aggregation for every unsupported factual claim."}
      - {type: expected_signal, value: "Treats judge_parse_error and judge_schema_error as evaluator-shape failures, judge_semantic_fail as content failure, and judge_pass as grounded success while preserving raw judge output artifacts."}
      - {type: expected_signal, value: "Requires exact supporting source_references for pass decisions and a separate rationale or failure_reason for fail decisions."}
      - {type: expected_signal, value: "Captures synthetic pass/fail label, risk_dimension, source_policy_artifact, judge_temperature, judge_runs or sample_count, and keeps pass_rate_threshold advisory unless calibrated."}
  - id: route-validate-evaluator
    name: route evaluator validation
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    realistic: true
    unit: validate-evaluator routing
    given: A skill-review judge has 40 human-labeled outputs and may miss failures.
    should: Route to validate-evaluator and compare judge output against human labels with TPR, TNR, bias, and held-out evidence.
    actual_artifact: scorecard.json
    expected_artifact: references/evals.yaml
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case route-validate-evaluator --skip-tessl --no-dashboard --json --robot"
    prepend_skill: false
    prompt: "Our skill-review judge has 40 labeled he-plan outputs from Jamie. Check whether it agrees with the human labels and whether it misses failures."
    acceptance:
      - {type: skill_selected, expected_skill: evals-router}
      - {type: regex, value: "(?i)(validate-evaluator|TPR|TNR|human labels|calibrat|held-out)"}
    expected_signals:
      required_terms:
        - true-positive
        - true-negative
        - held-out calibration evidence
    deterministic_checks: {forbidden_commands: [curl, wget, "rm -rf", nc]}
  - id: route-generate-synthetic-data
    name: route synthetic data
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    realistic: true
    unit: generate-synthetic-data routing
    given: Real traces are sparse but suspected failure areas are already known.
    should: Route to generate-synthetic-data and create targeted inputs for known coverage gaps without replacing representative traces.
    actual_artifact: scorecard.json
    expected_artifact: references/evals.yaml
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case route-generate-synthetic-data --skip-tessl --no-dashboard --json --robot"
    prepend_skill: false
    prompt: "Real traffic is sparse. Generate synthetic eval inputs that stress the failure areas we already suspect."
    acceptance:
      - {type: skill_selected, expected_skill: evals-router}
      - {type: regex, value: "(?i)(generate-synthetic-data|synthetic|dimensions|failure areas|coverage gaps)"}
    expected_signals:
      required_terms:
        - named risk dimensions
        - representative real traces
    deterministic_checks: {forbidden_commands: [curl, wget, "rm -rf", nc]}
  - id: route-evaluate-rag
    name: route RAG evaluation
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    realistic: true
    unit: evaluate-rag routing
    given: A docs-search RAG workflow may fail in retrieval, generation, or faithfulness.
    should: Route to evaluate-rag and measure retrieval quality separately from generated-answer faithfulness.
    actual_artifact: scorecard.json
    expected_artifact: references/evals.yaml
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case route-evaluate-rag --skip-tessl --no-dashboard --json --robot"
    prepend_skill: false
    prompt: "Check a docs-search RAG eval by separating whether the retriever found the right skill docs from whether the answer stayed faithful to them."
    acceptance:
      - {type: skill_selected, expected_skill: evals-router}
      - {type: regex, value: "(?i)(evaluate-rag|retrieval|generation|faithfulness|Recall@k)"}
    expected_signals:
      required_terms:
        - retriever evidence
        - answer faithfulness
      forbidden_terms:
        - one score
    deterministic_checks: {forbidden_commands: [curl, wget, "rm -rf", nc]}
  - id: route-build-review-interface
    name: route review interface
    category: happy
    eval_modes: [smoke, release]
    should_trigger: true
    realistic: true
    unit: build-review-interface routing
    given: Humans need to label traces before labels can be trusted.
    should: Route to build-review-interface and specify an annotation UI or review workflow before judge calibration.
    actual_artifact: scorecard.json
    expected_artifact: references/evals.yaml
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case route-build-review-interface --skip-tessl --no-dashboard --json --robot"
    prepend_skill: false
    prompt: "Build a small trace review interface so humans can label pass, fail, or defer without reading raw JSON."
    acceptance:
      - {type: skill_selected, expected_skill: evals-router}
      - {type: regex, value: "(?i)(build-review-interface|review interface|annotation|label|trace)"}
    expected_signals:
      required_terms:
        - human review surface
        - evaluator calibration
    deterministic_checks: {forbidden_commands: [curl, wget, "rm -rf", nc]}
  - id: edge-missing
    name: missing context
    category: edge
    eval_modes: [smoke, release]
    should_trigger: true
    realistic: true
    unit: missing eval target discovery
    given: A user asks for an eval audit without a target skill path, trace folder, command output, or report shape.
    should: Ask for the missing target or evidence and report blocked context instead of inventing a route score.
    actual_artifact: scorecard.json
    expected_artifact: references/discovery-interview.md
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case edge-missing --skip-tessl --no-dashboard --json --robot"
    prepend_skill: false
    prompt: "I need you to audit our skill evals, but I have not provided the target skill path, failed trace folder, command output, or desired report shape yet."
    acceptance:
      - {type: skill_selected, expected_skill: evals-router}
      - {type: regex, value: "(?i)(missing|target|blocked|context)"}
    expected_signals:
      required_terms:
        - missing critical inputs
        - one concrete discovery question
  - id: negative-deterministic-check
    name: deterministic check request
    category: negative
    eval_modes: [smoke, release]
    should_trigger: false
    realistic: true
    unit: non-LLM software test exclusion
    given: A user asks for a normal unit test that checks a scaffolded package file exists.
    should: Avoid selecting evals-router because the task is general software testing, not LLM/RAG evaluation.
    actual_artifact: scorecard.json
    expected_artifact: references/evals.yaml
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case negative-deterministic-check --skip-tessl --no-dashboard --json --robot"
    prepend_skill: false
    prompt: "Add a unit test that checks package.json exists after the scaffold command runs."
    acceptance:
      - {type: skill_not_selected, expected_skill: evals-router}
      - {type: expected_signal, value: "Declines evals-router routing for ordinary deterministic software tests."}
    expected_signals:
      forbidden_terms:
        - route ordinary deterministic software tests through evals-router
  - id: negative-domain
    name: wrong domain
    category: negative
    eval_modes: [smoke, release]
    should_trigger: false
    realistic: true
    unit: unrelated marketing request exclusion
    given: A user asks for a marketing tagline unrelated to LLM/RAG evals or repository validation.
    should: Avoid selecting evals-router because the request is outside the skill domain.
    actual_artifact: scorecard.json
    expected_artifact: references/evals.yaml
    reproduce: "./bin/ask evals run Skills/agent-ops/evals-router --mode smoke --runner codex --case negative-domain --skip-tessl --no-dashboard --json --robot"
    prepend_skill: false
