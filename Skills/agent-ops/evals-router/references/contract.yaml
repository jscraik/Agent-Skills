schema_version: 1
skill: evals-router
purpose: "Route LLM evaluation work to the smallest trustworthy method."
triggers:
  - "Analyze, design, or triage LLM evaluation workflows. Use when the user asks for evaluator design, error analysis, judge prompts, RAG evals, synthetic data, or review tooling."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "eval goal"
  - "available evidence"
  - "environment constraints"
  - "desired artifact"
outputs:
  - "route recommendation"
  - "workflow choice"
  - "evidence gaps"
  - "next validation step"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
