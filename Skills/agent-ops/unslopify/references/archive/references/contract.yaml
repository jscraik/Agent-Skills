schema_version: 1
skill: unslopify
purpose: "Audit and clean code slop with scoped discovery, evidence, and safe change planning before edits."
triggers:
  - "Use when you need to remove unused code, stale exports, dead paths, weak types, or fragile cleanup opportunities with low architectural risk."
non_goals:
  - "Broad design rewrites, contract migration, or package boundary changes."
  - "Changing public APIs, migrations, persisted data formats, or external integrations."
  - "Executing large refactors without repository evidence."
inputs:
  - "target scope (files, folder, or package)"
  - "current behavior evidence"
  - "validation command output"
  - "risk tolerance and rollout constraints"
outputs:
  - "cleanups with evidence-backed classification"
  - "risk register"
  - "verification checklist"
  - "rollback notes"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report exact validation commands, outcomes, and blockers."
rollback_procedure: "Restore archived context and rerun strict audit + Plugin Eval."
