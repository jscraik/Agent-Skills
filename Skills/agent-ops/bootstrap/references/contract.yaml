schema_version: 1
skill: bootstrap
purpose: "Bootstrap and verify a local development environment from a repository."
triggers:
  - "Create, diagnose, and validate a local dev bootstrap. Use when the user asks to clone a repo, install toolchains, install dependencies, and prove the project runs."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "repo URL"
  - "target directory"
  - "toolchain constraints"
  - "setup command"
  - "validation command"
outputs:
  - "bootstrap steps"
  - "installed dependencies"
  - "validation evidence"
  - "blockers"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
