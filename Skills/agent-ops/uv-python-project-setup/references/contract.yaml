schema_version: 1
skill: uv-python-project-setup
purpose: "Create or repair uv-based Python project setup with reproducible runtime contracts."
triggers:
  - "Create, repair, and validate uv Python project setup. Use when initializing Python apps or libraries, managing uv dependencies, virtual environments, or CI-ready uv workflows."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "project type"
  - "Python version"
  - "dependency policy"
  - "execution context"
  - "validation command"
outputs:
  - "setup plan"
  - "uv commands"
  - "dependency notes"
  - "validation evidence"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
