schema_version: 1
skill: ubiquitous-language
purpose: "Convert fuzzy or overloaded project language into a durable CONTEXT.md or vocabulary surface agents can use consistently."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "current user wording"
  - "existing CONTEXT.md or vocabulary file"
  - "nearby repo docs"
  - "domain evidence"
  - "ambiguities"
outputs:
  - "canonical terms"
  - "aliases to avoid"
  - "relationships"
  - "example dialogue"
  - "flagged ambiguities"
  - "integration note"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
