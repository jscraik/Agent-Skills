schema_version: 1
skill: ubiquitous-language
purpose: "Convert fuzzy or overloaded project language into a durable UBIQUITOUS.md, UBIQUITOUS-MAP.md, legacy UBIQUITOUS_LANGUAGE.md, or repo-native vocabulary surface agents can use consistently."
triggers:
  - "Use when the user request matches the skill scope."
  - "Use when the user asks for a relentless domain-language grill or plan stress-test against code and documented decisions."
  - "Use when a specific implementation correction may encode a broader engineering preference, invariant, or architecture rule."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "current user wording"
  - "existing UBIQUITOUS.md, UBIQUITOUS-MAP.md, legacy UBIQUITOUS_LANGUAGE.md, or vocabulary file"
  - "external CONTEXT.md naming only as an alias for the active local ubiquitous-language surface"
  - "nearby repo docs"
  - "domain evidence"
  - "ambiguities"
  - "specific corrective feedback and the visible implementation example"
outputs:
  - "canonical terms"
  - "aliases to avoid"
  - "relationships"
  - "example dialogue"
  - "flagged ambiguities"
  - "integration note"
  - "domain-grill question, recommendation, and resolved-term capture when requested"
  - "feedback intent radius when corrective feedback is the source"
  - "generalized feedback rule without incidental implementation identifiers"
  - "bounded pattern sweep with a similar-case disposition for each relevant sibling"
  - "enforcement handoff when terminology reveals a missing mechanical invariant"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
  - local_only_correction
  - unbounded_systemic_churn
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
