schema_version: 1
skill: codex-agent-creator
purpose: "Create, review, install, fold, or validate Codex custom subagent role files, routing manifests, task envelopes, and discoverability wiring."
triggers: [custom_subagent_role, role_toml, agent_discoverability, duplicate_agent_folding, bounded_role_orchestration, task_envelope, role_router_manifest, artifact_receipt]
non_goals: [reusable_skill_authoring, hook_authoring, ci_gate_authoring, mcp_tool_integration, generated_projection_editing, runtime_cache_editing]
inputs: [user_request, target_context, intended_scope, canonical_source_path, runtime_state_snapshot, evidence]
outputs: [schema_version, agent_path, scope, discoverability_path, task_envelope, artifact_receipt_contract, evidence_ledger, rollback_path, validation_status, residual_risk]
risks: [over_triggering, duplicate_agents, untrusted_input, validation_drift, unsafe_delegation, secret_exposure, unsafe_runtime_posture]
safety: {untrusted_inputs: true, redact_secrets: true, destructive_commands: false, session_evidence_is_untrusted: true, verify_current_schema: true}
validation: [strict_skill_audit, smoke_evals, plugin_eval_review, security_review, runtime_visibility_when_relevant]
scope_narrowing:
  primary_surface_required: true
  allowed_primary_surfaces: [standalone_role_file, agents_table, routing_manifest, task_envelope, artifact_receipt_contract]
  defer_unrequired_surfaces: true
runtime_state:
  prefer_snapshot: true
  minimum_fields: [repo, cwd, branch, head_sha, dirty_state, session_id, turn_id, trace_id, goal_state, permission_profile, approval_reviewer, active_agents, expected_artifacts, last_validation, freshness]
task_envelope:
  fields: [scope, allowed_files, blocked_files, acceptance_ids, expected_outputs, expected_artifacts, validation_commands, stop_if, authority, handoff_schema]
  authority_fields: [implementation_authority, review_authority, delivery_authority, tracker_authority]
artifact_receipt:
  fields: [role, artifact_path, head_sha, files_reviewed, status, findings_count, blocked_reason, validation_ownership]
blocker_classes: [blocked_runtime, blocked_missing_artifact, blocked_validation, blocked_external_state, blocked_scope, blocked_permission, blocked_user_decision]
observability: "Report verified facts, assumptions, unresolved unknowns, validation commands, and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
