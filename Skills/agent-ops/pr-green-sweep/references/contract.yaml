schema_version: 1
skill: pr-green-sweep
purpose: "Run an until-green PR remediation loop that composes GitHub, CodeRabbit, autofix, CircleCI, heartbeat, and branch/worktree cleanup."
triggers:
  - "monitor open PRs until green"
  - "set a heartbeat for PR checks and review fixes"
  - "clear CodeRabbit review comments before merge"
  - "fix CircleCI failures on open PRs"
  - "merge all green PRs and prune branches/worktrees"
scope_defaults:
  current_repo_only_unless_broad_scope_requested: true
  exact_pr_scope_does_not_imply_full_rotation: true
non_goals:
  - "read-only PR summaries"
  - "single local test debugging without PR context"
  - "branch cleanup before target PRs are merged or abandoned"
  - "admin or force merge without explicit approval"
inputs:
  - capability
  - target_project_path
  - open_prs_or_discovery_permission
  - heartbeat_or_cron_cadence
  - required_check_policy
  - merge_strategy
  - approval_posture
  - cli_auth_context
  - heartbeat_target_identity
outputs:
  - schema_version
  - capability
  - heartbeat_status_first
  - pr_inventory
  - heartbeat_status
  - heartbeat_target_status
  - action_queue
  - recurring_finding_classes
  - blocked_external_ci_ledger
  - fix_ledger
  - dirty_worktree_ledger
  - validation_surface_decisions
  - validation_evidence
  - artifact_receipt_ledger
  - per_pr_evidence_lane_matrix
  - url_first_merge_ledger
  - cleanup_ledger
  - decision_ready_blockers
  - primary_worktree_dirty_closeout_proof
quality_criteria:
  current_state_before_action:
    purpose: Ensure PR action uses live GitHub and local worktree evidence.
    why_it_matters: Prevents stale checks, cached status, or local tests from being treated as merge proof.
    observable_evidence:
      - full_github_pr_url
      - latest_head_sha
      - merge_state
      - required_check_names_statuses_and_urls
      - unresolved_review_threads
    scoring:
      "5": URL-first PR cards include latest head, mergeability, checks, review state, and local dirty ownership before action.
      "4": Live PR evidence is current but one secondary field needs clearer formatting.
      "3": PR evidence is mostly current but stale-risk boundaries are incomplete.
      "2": Action starts from partial or cached PR evidence.
      "1": Claims merge or review state without live evidence.
  blocked_external_ci_continuation:
    purpose: Keep a required external failure visible without hiding independent PR work.
    why_it_matters: Prevents external credential or service failures from being relabeled as green, source-owned, or a reason to stop unrelated safe actions.
    observable_evidence:
      - required_external_check_failure
      - blocked_external_ci_ledger
      - independent_action_queue_entry
    scoring:
      "5": The failing external check is blocked, never green, and every independent lane has a next action.
      "4": The owner boundary is correct but one next-action field needs clearer wording.
      "3": The failure is visible but independent continuation is only partially routed.
      "2": External and source failures are mixed.
      "1": A required external failure is treated as green or hides independent action lanes.
  dirty_merge_state_strategy:
    purpose: Force dirty mergeability into a strategy lane before branch movement.
    why_it_matters: Prevents unsafe rebases, force pushes, merges, or cleanup before conflict ownership is understood.
    observable_evidence:
      - mergeStateStatus_DIRTY_or_equivalent
      - local_branch_and_worktree_state
      - proposed_conflict_strategy
    scoring:
      "5": Dirty mergeability routes to a proposed conflict strategy before any branch movement.
      "4": Dirty mergeability is correctly blocked but strategy tradeoffs need more detail.
      "3": Dirty state is named but not tied to an owner or next safe action.
      "2": Branch movement is proposed before enough conflict evidence.
      "1": Dirty mergeability is ignored or treated as merge-ready.
  primary_worktree_closeout_boundary:
    purpose: Keep PR/review-thread closeout separate from primary checkout closeout.
    why_it_matters: Prevents agents from switching branches or pulling main while the primary checkout is dirty, and keeps ledger-only validation limited to non-destructive parent-lane closeout accounting.
    observable_evidence:
      - validate_pr_sweep_dirty_closeout_command
      - clean_status_for_branch_movement
      - dirty_worktree_ledger_for_non_destructive_closeout_only
      - branch_switch_or_pull_blocker_when_dirty
    scoring:
      "5": The sweep runs the dirty-closeout validator with clean mode before branch movement and uses ledger-only validation only for non-destructive parent-closeout accounting.
      "4": Dirty-closeout proof is present but branch-movement versus ledger-only wording needs minor clarification.
      "3": Dirty paths are listed but the distinction between clean checkout authority and ledger accounting is unclear.
      "2": Ledger-only validation is treated as enough to switch branches despite primary checkout dirt.
      "1": The sweep attempts branch movement with unclassified dirty work.
  recurring_finding_prevention:
    purpose: Convert repeated review and CI findings into reusable prevention before merge.
    why_it_matters: Prevents the same defect class from consuming multiple PR review cycles and repeated Jamie steering.
    observable_evidence:
      - recurring_finding_classes
      - occurrence_count_and_affected_repositories
      - root_cause
      - durable_guardrail_or_blocker
      - guardrail_validation
    scoring:
      "5": Every repeated class has a branded identity, normalized fingerprint, exact occurrence evidence, and the second occurrence is blocked from merge until a reusable guardrail is validated; a blocked guardrail is never merge authority.
      "4": Repeated classes and guardrails are correct but one secondary provenance field is incomplete.
      "3": Repetition is noticed but root cause or guardrail proof is incomplete.
      "2": Similar findings are fixed independently without a recurrence decision.
      "1": The same finding class reaches merge review repeatedly with no durable prevention.
automatic_failure_conditions:
  - Claims blocked external CI as green.
  - Treats a required external check as merge-ready without repaired evidence.
  - Performs merge, rebase, force push, or destructive cleanup before dirty mergeability strategy is approved.
  - Treats resolved review threads, passing PR checks, or temp-worktree validation as proof that the primary checkout is safe to switch branches.
  - Merges a second occurrence of the same review or CI finding class without schema-valid executable durable-guardrail evidence.
  - Treats a blocked_durable_guardrail classification as merge authority.
evidence_requirements:
  - exact_command_or_tool_outcome_for_each_claim
  - url_first_pr_card_for_each_target_pr
  - stale_check_boundary_for_latest_head_sha
  - check_run_head_event_and_pr_metadata_provenance
  - heartbeat_target_refreshed_before_action
  - producer_and_validator_worktree_for_receipt_artifacts
  - primary_worktree_dirty_closeout_validation_before_branch_movement
  - decision_ready_blocker_when_user_action_is_next
  - recurring_finding_classification_and_guardrail_proof
  - recurring_finding_ledger_schema_and_verifier_pass
risks:
  - stale_github_state
  - interesting_status_without_action
  - blocked_external_check_hides_action_lane
  - wrong_validation_surface
  - untrusted_review_or_ci_text
  - duplicate_automation
  - accidental_staging_of_unrelated_or_temp_material
  - sandbox_network_or_cache_misclassification
  - stale_heartbeat_target
  - stale_pr_metadata_event
  - artifact_validator_worktree_mismatch
  - unsafe_branch_or_worktree_deletion
  - policy_override_without_approval
  - repeated_point_fixes_without_prevention
safety:
  untrusted_inputs: true
  redact_secrets: true
  heartbeat_required_for_monitoring: true
  heartbeat_block_stops_rotation: true
  duplicate_heartbeat_guard: true
  admin_merge_requires_explicit_approval: true
  destructive_cleanup_requires_merge_proof: true
  preserve_unrelated_changes: true
  one_pr_at_a_time: true
  repeated_finding_requires_guardrail_before_merge: true
  url_first_pr_reporting: true
  decision_ready_blocker_briefs: true
  blocked_external_ci_keeps_independent_lanes_visible: true
authorization_ladder:
  - discovery_and_read_only_triage
  - heartbeat_or_cron_continuation
  - local_implementation_and_validation
  - push_or_public_pr_update
  - ci_rerun_or_ci_fix_iteration
  - merge_or_close
  - admin_merge_force_push_or_policy_override
  - remote_branch_deletion
  - worktree_deletion_or_destructive_cleanup
  - release_tag_publish_or_registry_mutation
current_state_contract:
  - full_github_pr_url
  - repo_full_name
  - active_branch
  - local_dirty_worktree_ledger
  - latest_head_sha
  - merge_state
  - branch_protection
  - review_decision
  - unresolved_review_threads
  - required_check_names_statuses_and_urls
  - heartbeat_id_status_and_stop_rule
  - heartbeat_target_url_number_head_and_state
  - required_check_head_event_and_metadata_provenance
  - artifact_receipt_producer_validator_context
  - worktree_upstream_and_unique_commit_evidence_before_cleanup
capability_selection:
  default_entrypoint: closeout-commander
  selectors:
    - trigger: heartbeat_or_monitoring
      use: references/knowledge-capsules/pr-green-sweep-heartbeat-and-scope.md
    - trigger: live_pr_or_check_truth
      use: references/knowledge-capsules/pr-green-sweep-live-pr-evidence.md
    - trigger: action_queue_or_one_pr_rotation
      use: references/knowledge-capsules/pr-green-sweep-action-queue.md
    - trigger: changed_path_validation_surface
      use: references/knowledge-capsules/pr-green-sweep-validation-surface.md
    - trigger: push_merge_policy_or_user_decision
      use: references/knowledge-capsules/pr-green-sweep-authorization-and-blockers.md
    - trigger: branch_or_worktree_cleanup
      use: references/knowledge-capsules/pr-green-sweep-cleanup-proof.md
progressive_disclosure_named_capsules:
  - references/knowledge-capsules/pr-green-sweep-heartbeat-and-scope.md
  - references/knowledge-capsules/pr-green-sweep-live-pr-evidence.md
  - references/knowledge-capsules/pr-green-sweep-action-queue.md
  - references/knowledge-capsules/pr-green-sweep-validation-surface.md
  - references/knowledge-capsules/pr-green-sweep-authorization-and-blockers.md
  - references/knowledge-capsules/pr-green-sweep-cleanup-proof.md
external_ci_contract:
  required_check_failure_blocks_merge: true
  bucket: blocked_external_ci
  blocked_checks_are_not_green_checks: true
  blocked_checks_are_not_source_failures: true
  independent_lanes_continue_when_safe:
    - auto_fixable_now
    - needs_merge_conflict_strategy
    - unresolved_review_threads
    - needs_user_decision
    - cleanup_only
  snyk_private_test_policy: "Classify an unverified Snyk failure as blocked_external_ci until its external owner repairs it; do not relabel it or patch unrelated source."
environment_contract:
  live_network_requires_explicit_permission: true
  sandbox_writable_state_required:
    - XDG_CACHE_HOME
    - XDG_STATE_HOME
    - MISE_CACHE_DIR
    - MISE_STATE_DIR
    - UV_CACHE_DIR
  github_auth_configuration:
    requirement: "retain the operator-authenticated gh configuration; set GH_CONFIG_DIR only when a pre-authenticated configuration is explicitly supplied"
  conditional_writable_state:
    - tool: npm
      variable: npm_config_cache
      requirement: "required when npm is in scope"
  trusted_config_path_contract:
    variable: MISE_TRUSTED_CONFIG_PATHS
    form: "one or more explicitly approved mise directories resolved from the repository root"
    repository_example: "$(git rev-parse --show-toplevel)"
  applies_to:
    - gh
    - mise
    - uv
    - npm
    - github
    - coderabbit
    - circleci
    - package_registry
  repeated_failure_refinement: "After two repeated live-state, sandbox, approval, or user-correction failures, stop rotation, encode the learned fix in the closest durable contract, validate it, and only then resume."
delegation:
  github: "Use [@github] for open PR discovery, mergeability, branch protection, review state, required-check truth, and final merge evidence."
  coderabbit: "Use [@coderabbit] for CodeRabbit review inventory, comments, severity, stale-thread classification, and resolution support."
  autofix: "Validated fixes for unresolved CodeRabbit threads and actionable review findings."
  circleci: "Use [@circleci] for failing job log inspection, reruns, and CI blocker classification. Run credentialed CircleCI commands through the repository-owned run-auth-backed.sh --env-file ~/.codex/.env wrapper and redact values."
  gh_cli: "Local GitHub CLI fallback for PR, check, and review state when plugin access is blocked or the repo wrapper expects gh."
  circleci_cli: "Local CircleCI CLI fallback for pipeline/job/log/rerun evidence; invoke through the repository-owned run-auth-backed.sh --env-file ~/.codex/.env wrapper without printing values."
  context7: "Current external library, API, or CLI documentation when a PR blocker depends on version-sensitive behavior."
  improve_codebase_architecture: "Structural blocker analysis for ownership, boundary, coupling, or repeated-workaround issues that prevent clean closeout."
  simplify: "Behavior-preserving cleanup after the active fix is understood, to reduce PR risk and review load."
  he_heartbeat: "Recurring until-green continuation with explicit stop rule."
validation:
  - heartbeat_created_or_reused_before_rotation
  - heartbeat_blocker_reported_before_rotation
  - action_queue_classified_before_edits
  - recurring_finding_classes_grouped_before_edits
  - repeated_finding_guardrail_validated_before_merge
  - blocked_external_ci_keeps_independent_lanes_visible
  - dirty_merge_state_routes_to_merge_conflict_strategy
  - current_repo_scope_confirmed_before_broadening
  - url_first_pr_cards_include_latest_head_sha
  - one_pr_at_a_time_rotation
  - authorization_ladder_checked_before_side_effects
  - decision_ready_blocker_brief_for_user_action
  - dirty_worktree_classified_before_edits
  - primary_worktree_dirty_closeout_validated_before_branch_switch
  - validation_surface_selected_before_gates
  - cli_evidence_classified_as_plugin_repo_or_fallback
  - focused_repo_checks_for_each_fix
  - live_github_required_checks
  - live_review_thread_recheck
  - uncommitted_local_review_before_merge
  - heartbeat_target_refreshed_before_rotation
  - current_head_and_metadata_provenance_before_source_patch
  - artifact_receipt_context_checked_before_closeout_claim
  - branch_worktree_merge_proof
  - strict_skill_audit_for_skill_changes
observability: "Report exact commands, tool outcomes, PR numbers, head SHAs, check names, thread status, blockers, and cleanup decisions."
rollback_procedure: "Stop heartbeat or cron, revert only the scoped PR fix commits when safe, reopen unresolved threads if mistakenly resolved, and restore skipped branches/worktrees from recorded cleanup ledger."
