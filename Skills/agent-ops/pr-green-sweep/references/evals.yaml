  anti_overfit_notes: Do not pass by treating the waived check as green or by stopping with no next action.
  prepend_skill: false
  prompt: Snyk quota is waived for this project. PR 296 still says mergeStateStatus=DIRTY and PR 113 is draft with local review fixes. Continue the PR sweep and tell me what action lane owns each remaining blocker.
  knowledge_pack:
    scenario_id: eval.pr-green-sweep.waived-external-ci-does-not-stop-rotation
