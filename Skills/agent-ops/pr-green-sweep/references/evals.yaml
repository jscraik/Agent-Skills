  - type: regex
    value: (?i)(before merge|merge readiness|required checks|re-check|refresh)
  unit: stale checks after push
  given: After a PR fix is pushed, GitHub often still shows older green checks beside pending or stale checks for the new
    head.
  should: Select pr-green-sweep, re-read the latest PR head SHA after push, and refuse to claim merge readiness from checks
    attached to an older commit.
