- id: edge-stale-check-after-push
  name: stale checks after push
  category: edge
  eval_modes:
  - smoke
  - release
  timeout_sec: 180
  should_trigger: true
  realistic: true
  why_realistic: After a PR fix is pushed, GitHub often still shows older green checks beside pending or stale checks for
    the new head.
