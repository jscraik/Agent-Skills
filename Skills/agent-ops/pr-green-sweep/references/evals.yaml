- id: eval.pr-green-sweep.blocked-external-ci-keeps-independent-lanes-visible
  name: blocked external CI keeps independent PR lanes visible
  category: edge
  eval_modes:
  - smoke
  - release
  timeout_sec: 180
  should_trigger: true
  realistic: true
  why_realistic: Covers a required Snyk authentication failure while other PRs still have dirty mergeability, review, draft, or cleanup work.
  expected_behavior: Select pr-green-sweep, put the blocked Snyk failure in blocked_external_ci, and continue the action queue to needs_merge_conflict_strategy or needs_user_decision instead of hiding independent work.
  anti_overfit_notes: Do not pass by treating the blocked check as green, a source failure, or a reason to stop with no next action.
  prepend_skill: false
  prompt: Snyk returned an unauthenticated service failure for this project. PR 296 still says mergeStateStatus=DIRTY and PR 113 is draft with local review fixes. Continue the PR sweep and tell me what action lane owns each remaining blocker.
  knowledge_pack:
    scenario_id: eval.pr-green-sweep.blocked-external-ci-keeps-independent-lanes-visible
    fixture: references/evals/eval.pr-green-sweep.blocked-external-ci-keeps-independent-lanes-visible.md
    capsule_refs:
    - pr-green-sweep
    review_status: reviewed
  acceptance:
  - type: skill_selected
    expected_skill: pr-green-sweep
  - type: regex
    value: (?i)\bblocked_external_ci\b
  - type: not_regex
    value: (?i)\b(?:not|is not|isn't)\s+blocked_external_ci\b|\b(?:is|was|remains|classified as)\s+source-owned\b
  - type: regex
    value: (?i)(needs_merge_conflict_strategy|mergeStateStatus=DIRTY|mergeable_state=dirty|merge conflict)
  - type: regex
    value: (?i)(needs_user_decision|draft).{0,120}(CodeRabbit|review)
  unit: blocked external CI keeps independent PR lanes visible
  given: Snyk has an external authentication failure while another PR remains dirty and another is draft with review work.
  should: Classify Snyk as blocked_external_ci and continue to independent action lanes before stopping.
- id: edge-stale-heartbeat-rebinding
  name: stale heartbeat target is rebound before repair
  category: edge
  eval_modes:
  - smoke
  - release
  timeout_sec: 180
  should_trigger: true
  realistic: true
  why_realistic: A scheduled heartbeat can point at an already merged PR while a user has moved the active follow-up lane.
  expected_behavior: Select pr-green-sweep, refresh the heartbeat target from live PR state, and rebind or retire the heartbeat before repair work.
  anti_overfit_notes: Do not repair the stale target merely because an automation exists.
  prepend_skill: true
  prompt: A heartbeat says to fix PR #273, but live GitHub shows it merged and I say the active follow-up is PR #275. Refresh the target before you repair anything and keep the sweep going on the correct PR.
  acceptance:
  - type: skill_selected
    expected_skill: pr-green-sweep
  - type: regex
    value: (?i)(heartbeat.*(stale|rebound|obsolete)|PR #273.*merged|PR #275.*active|target PR)
  - type: expected_signal
    value: refreshes the heartbeat target, classifies the old target as stale or obsolete, and does not repair the merged PR
  unit: stale heartbeat target is rebound before repair
  given: A scheduled heartbeat can point at an already merged PR while a user has moved the active follow-up lane.
  should: Rebind or retire the stale heartbeat before building the active PR action queue.
- id: edge-pr-metadata-check-provenance
  name: PR metadata check is correlated to current head
  category: edge
  eval_modes:
  - smoke
  - release
  timeout_sec: 180
  should_trigger: true
  realistic: true
  why_realistic: A PR-template or metadata gate can report a failure from an earlier payload after the PR body and head have changed.
  expected_behavior: Select pr-green-sweep, distinguish stale check-event evidence from a source defect, and request or observe a fresh current-head event after metadata repair.
  anti_overfit_notes: Do not edit source to repair a stale PR-body payload.
  prepend_skill: true
  prompt: The PR-template check failed against an earlier PR body, but the current body is corrected. Determine whether the failure belongs to the current head and metadata before editing source, then get fresh validation for the corrected head.
  acceptance:
  - type: skill_selected
    expected_skill: pr-green-sweep
  - type: regex
    value: (?i)(PR.metadata|template|current head|event|payload|stale|fresh)
  - type: expected_signal
    value: records check provenance, classifies stale metadata evidence separately from source failure, and requires a fresh event for the corrected head
  unit: PR metadata check is correlated to current head
  given: A PR-template or metadata gate can report a failure from an earlier payload after the PR body and head have changed.
  should: Correlate the failed check to current PR metadata before selecting a source repair.
- id: edge-cross-worktree-receipt
  name: cross-worktree receipt context remains explicit
  category: edge
  eval_modes:
  - smoke
  - release
  timeout_sec: 180
  should_trigger: true
  realistic: true
  why_realistic: A worker can produce a valid repair and focused test in an authorized linked worktree while a parent validator cannot resolve the artifact path.
  expected_behavior: Select pr-green-sweep, record producer and validator contexts, preserve the focused proof, and block the receipt lane without claiming closeout.
  anti_overfit_notes: Do not turn an inaccessible artifact into passing parent-checkout evidence.
  prepend_skill: true
  prompt: A worker repaired a PR in an authorized linked worktree and reports a passing focused test, but the parent checkout receipt validator cannot see the test path. Classify the receipt and PR evidence before calling the lane ready.
  acceptance:
  - type: skill_selected
    expected_skill: pr-green-sweep
  - type: regex
    value: (?i)(worktree|producer|validator|artifact|blocked_artifact_context|receipt)
  - type: expected_signal
    value: records both worktree contexts, preserves the real focused-test result, marks the parent receipt lane blocked, and avoids merge or cleanup readiness claims
  unit: cross-worktree receipt context remains explicit
  given: A worker can produce a valid repair and focused test in an authorized linked worktree while a parent validator cannot resolve the artifact path.
  should: Keep the receipt context explicit and avoid claiming closeout from an inaccessible artifact.
