schema_version: 1
skill: codex-automation-architect
purpose: "Turn recurring Codex automation ideas into safe, bounded, validated background workflows with clear ownership and rollback."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "automation goal"
  - "target project path"
  - "schedule or trigger"
  - "sandbox posture"
  - "validation and rollback expectations"
  - "existing automation inventory"
  - "Codex app automation tool availability"
outputs:
  - "automation design"
  - "risk and scope review"
  - "preflight plan"
  - "validation evidence"
  - "rollout or consolidation notes"
runtime_contract:
  tools:
    - "codex_app.automation_update"
    - "codex_app.automation_list"
    - "tool_search when dynamic tools are deferred"
  kinds: [cron, heartbeat]
  execution_environments: [local, worktree]
  update_rule: "Prefer updating an existing automation over creating a duplicate; preserve fields unless the user asks to change them."
  review_rule: "Use suggested create/update for worktree automations with non-null local environment setup config."
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
