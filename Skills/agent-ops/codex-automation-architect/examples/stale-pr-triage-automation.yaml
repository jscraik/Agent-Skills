schema_version: "1.0"

automation_spec:
  name: "weekly-stale-pr-triage"
  description: "Weekly automation to triage stale PRs, categorize them, and provide actionable recommendations"
  status: "active"

  # Run every Monday at 9:00 AM
  rrule: "FREQ=WEEKLY;BYDAY=MO;BYHOUR=9;BYMINUTE=0"

  # Target workspaces (relative paths; override per-deployment)
  cwds:
    - "."

  # Approval policy: read-only safe; destructive operations use patch-only fallback
  runtime_constraints:
    approval_policy: "never"
    sandbox: "read-only"
    allow_destructive: false

  prompt: |
    ## Weekly Stale PR Triage Automation

    ### Objective
    Identify and categorize stale PRs, then provide actionable recommendations
    for maintainers. This automation runs read-only and produces Infrastructure/reports/summaries
    rather than executing destructive actions.

    ### Success Criteria
    1. All open PRs older than 7 days are identified
    2. Each stale PR is categorized with clear rationale
    3. Specific action recommendations are provided
    4. Output is formatted for easy maintainer review

    ### Execution Steps

    #### 1. Environment Preflight
    - Verify `gh` CLI is authenticated (`gh auth status`)
    - Confirm repository is a GitHub repo (`gh repo view --json url`)
    - Check approval policy posture; run in patch-only mode (no direct merges/pushes)

    #### 2. Fetch Open PRs
    Run:
    ```bash
    gh pr list --state open --json number,title,author,createdAt,updatedAt,labels,reviewDecision,mergeStateStatus,headRefName,baseRefName,url --limit 100
    ```

    #### 3. Identify Stale PRs
    Filter PRs where `updatedAt` is older than 7 days from now.
    Use `jq` to filter:
    ```bash
    gh pr list --state open --json number,title,author,createdAt,updatedAt,labels,reviewDecision,mergeStateStatus,headRefName,baseRefName,url --limit 100 | jq '[.[] | select(.updatedAt < (now - 7*24*60*60 | todateiso8601))]'
    ```

    #### 4. Categorize Each Stale PR
    For each stale PR, assign ONE category:

    | Category | Criteria |
    |----------|----------|
    | `needs-review` | No reviewer assigned OR review pending for >3 days |
    | `blocked` | CI failing, merge conflicts, or changes requested |
    | `abandoned` | No activity for >14 days AND author unresponsive |
    | `ready-to-merge` | Approved, CI green, no conflicts, just needs merge button |
    | `needs-author-action` | Reviewer feedback provided, waiting on author |

    #### 5. Determine Recommended Action
    Based on category, recommend:

    | Category | Recommended Action |
    |----------|-------------------|
    | `needs-review` | Ping requested reviewers; suggest assigning backup reviewer |
    | `blocked` | Post comment summarizing blockers; suggest author fix CI/conflicts |
    | `abandoned` | Suggest close with friendly message; or label `abandoned` |
    | `ready-to-merge` | Highlight for maintainer attention; ready for merge button |
    | `needs-author-action` | Ping author with friendly reminder; label `waiting-on-author` |

    #### 6. Generate Triage Report
    Produce a structured markdown report with:
    - Summary stats (total stale, by category)
    - Table of stale PRs: # | Title | Author | Last Updated | Category | Recommended Action
    - Per-PR draft comment/pinging text (for copy-paste by maintainers)

    ### Blocker Handling (Patch-Only Mode)
    Since `approval_policy: never` prevents `gh pr merge` and `gh pr close`:
    - DO NOT attempt to merge or close PRs directly
    - DO NOT push comments automatically (requires write access)
    - Instead, output:
      1. Draft comment text for each PR (maintainer can copy-paste)
      2. Direct links to `gh pr view <num>` and `gh pr merge <num>` commands
      3. Suggested `/close` or `/merge` slash commands for maintainers

    ### Output Format
    ```markdown
    # Stale PR Triage Report - {date}

    ## Summary
    - Total open PRs: N
    - Stale (>7 days): N
    - By category: needs-review (N), blocked (N), abandoned (N), ready-to-merge (N), needs-author-action (N)

    ## Action Items

    ### Ready to Merge (Merge These First)
    | PR | Title | Action |
    |----|-------|--------|
    | #123 | Fix login bug | `gh pr merge 123` |

    ### Needs Review (Ping Reviewers)
    | PR | Title | Draft Ping |
    |----|-------|------------|
    | #124 | Add feature X | @reviewer gentle nudge... |

    ### Blocked (Needs Author Fix)
    ...

    ### Abandoned (Suggest Close)
    ...

    ### Needs Author Action
    ...
    ```

    ### Safety Checklist
    - [ ] No destructive commands executed (no `git merge`, `git push`, `gh pr close`)
    - [ ] All recommendations are draft/output only (maintainer executes manually)
    - [ ] Secrets/redacted output (no tokens, no env dumps)
    - [ ] Report written to stdout for logging/capture

    ### Fallback on Errors
    - If `gh` not authenticated: output "GH CLI not authenticated; run `gh auth login`"
    - If not a GitHub repo: output "Not a GitHub repository; skipping"
    - If `jq` missing: use `gh` JSON output with text parsing
    - If API rate limited: sleep 60s and retry once, then fail gracefully

validation:
  tested_runners:
    - codex
    - claude-kimi
  last_validated: "2026-03-04"
  test_commands:
    - "gh pr list --state open --limit 5"
    - "jq --version"

notes:
  - Designed for read-only sandbox with approval_policy=never
  - Maintainer must manually execute recommended actions
  - Safe for unattended weekly execution
  - Output should be captured by automation runner for notifications
