schema_version: 1
skill: vale
purpose: "Set up and verify Vale prose linting across local, pre-commit, and CI workflows."
triggers:
  - "Install, repair, and validate Vale prose linting. Use when users need Vale config, style sync, docs lint gates, or broken Vale workflow diagnosis."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "repo root"
  - "Vale config"
  - "style package policy"
  - "target docs"
  - "CI/pre-commit contract"
outputs:
  - "Vale command plan"
  - "config changes"
  - "style sync evidence"
  - "validation result"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
