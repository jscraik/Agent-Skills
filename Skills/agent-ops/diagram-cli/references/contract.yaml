schema_version: 1
name: diagram-cli
purpose: Generate reproducible architecture artifacts and a concise interpretation brief so users can understand a codebase quickly and safely.
triggers:
  - User asks for architecture mapping, dependency visualization, or repository understanding.
  - User asks to refresh Mermaid/context-pack artifacts for agents or CI.
  - User asks to detect architecture drift or validate rule compliance.
inputs:
  - name: repo_path
    type: string
    description: Repository root to analyze (default current working directory).
  - name: goal
    type: string
    description: onboarding_map | pr_impact | ci_drift_gate | context_refresh.
  - name: output_root
    type: string
    description: Preferred artifact path (.diagram or Infrastructure/artifacts/diagrams).
  - name: focus
    type: string
    description: Optional module/path focus for targeted runs.
outputs:
  - name: diagram_artifacts
    type: array
    description: Generated diagram files (typically .mmd and optional rendered assets).
  - name: manifest_gate
    type: object
    description: Diagram completeness status including required types and placeholder flags.
  - name: architecture_brief
    type: object
    description: Human-readable summary of topology, hotspots, and next steps.
  - name: schema_version
    type: integer
    description: Contract version of the produced interpretation payload when machine-formatted output is requested.
non_goals:
  - Designing marketing/UI diagrams unrelated to code architecture.
  - Performing full threat modeling without generated code-graph evidence.
  - Installing or reconfiguring toolchains without explicit user approval.
risks:
  - Placeholder or partial diagrams causing incorrect conclusions.
  - Overscanning large repos without focus/excludes causing noisy outputs.
  - Sensitive code identifiers leaking into public artifacts if redaction is skipped.
