schema_version: 1
skill: autoreview
purpose: Run structured AI code review as an advisory closeout gate for local dirty work, branch diffs, PR branches, or single commits.
version: "0.1.1"
triggers:
  - autoreview
  - Codex review
  - Claude review
  - second-model review
  - review before final response
  - review before commit or PR update
  - branch review against PR base
  - PR base structured review
non_goals:
  - merge approval
  - CodeRabbit thread inventory
  - CI triage
  - validation-only test execution
  - broad refactoring
  - branch cleanup
  - applying reviewer output without source verification
inputs:
  - repo_path
  - git_status
  - review_mode
  - base_ref
  - commit_ref
  - selected_engine
  - optional_prompt_file
  - optional_dataset
  - optional_parallel_test_command
  - permission_posture
outputs:
  - selected_review_target
  - review_command
  - structured_review_report
  - accepted_findings
  - rejected_findings
  - blocked_findings
  - validation_evidence
  - clean_review_result_or_blocker
risks:
  - untrusted_reviewer_output
  - prompt_file_or_dataset_injection
  - shell_command_boundary_for_parallel_tests
  - stale_review_after_tests_change_code
  - reviewing_empty_local_state
  - external_model_capacity_or_runtime_failure
  - leaking_sensitive_local_details
  - overbroad_review_scope
  - trusting_clean_prose_that_contradicts_findings
  - stale_or_degraded_branch_refs
  - selecting_autoreview_for_thread_mutation
routing:
  local_dirty_closeout: Use local mode only for unstaged, staged, or untracked work in the current checkout.
  branch_pr_base_review: Use branch mode with the PR base for committed branch work, PR updates, or before-push review.
  commit_review: Use commit mode for already-committed changes or clean main after merge or pull.
  second_model_review: Treat as an advisory autoreview request and classify findings as accepted, rejected, or blocked.
  validation_only: Do not select autoreview; route to testing or repo closeout.
  review_thread_mutation: Do not select autoreview; route to GitHub/CodeRabbit/PR workflow owners.
failure_classification:
  blocked_runtime: App-server startup, sandbox launch, nested reviewer startup, or model CLI initialization failed.
  degraded_existing_refs: Remote refs cannot be refreshed but existing refs are acceptable for the review.
  blocked_fetch: Fresh refs are required but FETCH_HEAD or remote fetch cannot be updated.
  contradictory_clean_output: Clean prose is contradicted by Findings, Issues, Risks, or Actionable sections; fail closed.
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
  raw_reviewer_text_in_shell: false
  external_writes: false
  reviewer_findings_are_advisory: true
  operator_parallel_test_command_required: true
validation:
  - helper_scripts_compile
  - helper_help_runs
  - helper_commit_dry_run
  - strict_skill_audit
  - smoke_evals
  - tessl_staged_eval_when_workspace_project_link_available
observability: Report target selection, command used, engine, findings accepted or rejected, validation outcomes, and blockers.
rollback_procedure: Remove Skills/agent-ops/autoreview and rerun workspace skill sync.
