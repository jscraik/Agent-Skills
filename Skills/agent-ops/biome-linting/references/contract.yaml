schema_version: 1
skill: biome-linting
purpose: "Guide Biome linting, formatting, safe fixes, and CI-ready diagnostic triage."
triggers:
  - "Analyze, fix, and validate Biome linting workflows. Use when JavaScript or TypeScript projects need Biome commands, diagnostics, safe fixes, or CI lint gates."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "Biome config"
  - "package scripts"
  - "operation"
  - "risk posture"
  - "failing diagnostics"
outputs:
  - "command sequence"
  - "safe fix plan"
  - "rule guidance"
  - "validation evidence"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
