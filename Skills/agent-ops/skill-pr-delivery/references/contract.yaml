schema_version: 1
skill: skill-pr-delivery
purpose: "Turn a skill edit into a shippable PR checkpoint with source, projection, validation, reviewer, and git evidence aligned."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "target skill path"
  - "authoring intent"
  - "visibility target"
  - "branch and PR context"
  - "reviewer expectations"
outputs:
  - "updated skill source"
  - "projection sync evidence"
  - "audit and eval results"
  - "review status"
  - "commit or PR evidence"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
