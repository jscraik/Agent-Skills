schema_version: 1
skill: autoresearch
purpose: "Run bounded autonomous experiment loops with durable evidence, explicit metrics, and keep/discard/crash/blocked decisions."
triggers:
  - "Use when the user explicitly names $autoresearch."
  - "Use when the user asks to run or refine an Autoresearch-style experiment loop."
  - "Use when iterative skill/plugin quality research needs hypothesis, validation, and keep/discard decisions."
non_goals:
  - "Route unrelated feature work away from this skill."
  - "Do not change fixed evaluation/data-prep contracts without explicit user approval."
inputs:
  - user_request
  - target_repo_or_skill_paths
  - run_tag_or_branch
  - editable_boundaries
  - fixed_boundaries
  - baseline_command
  - success_metric
  - metric_direction
  - verify_command
  - guard_command
  - evaluator_contract
  - keep_policy
  - quality_rubric
  - binary_eval_checks
  - noise_runs
  - min_delta
  - stop_condition
  - evidence_paths
commands:
  - "./bin/ask evals run <target-skill> --mode smoke --json --robot"
  - "./bin/ask skills audit <target-skill> --level strict --json --robot"
  - "python3 <repo>/train.py --json"
outputs:
  - experiment_ledger
  - hypothesis_journal
  - kept_discarded_crash_blocked_summary
  - score_delta
  - decision_policy
  - protected_or_held_out_guard_status
  - pivot_recommendation_when_plateaued
  - evidence_summary
  - validation_status
permission_profile:
  filesystem:
    read:
      - target repo or skill package
      - declared train/selection/test eval fixtures
      - repo-local validation scripts
    write:
      - declared evidence root
      - candidate artifact only until promotion review passes
  shell:
    allowed:
      - declared baseline command
      - declared verify command
      - declared guard command
    forbidden:
      - destructive filesystem operations
      - credential exfiltration
      - evaluator/data/corpus edits without explicit contract change
portability_profile:
  host_agents:
    - codex
    - claude-code
    - cursor
    - openclaw
  runtime_needs:
    - filesystem
    - shell
    - repo-validation
evidence_policy:
  authority: "artifacts_decide"
  required:
    - baseline
    - candidate_result
    - rejected_edit_buffer
    - protected_path_check
    - promotion_manifest
optimization:
  schema_version: "skill-optimization-contract.v1"
  enabled: true
  target_artifact: "SKILL.md"
  optimizer_mode: "bounded_patch"
  roles:
    target_runner:
      may_edit: "none"
      sees:
        - current_target
        - baseline_command
        - verify_command
        - guard_command
    optimizer:
      may_edit: "candidate_patch_only"
      sees:
        - train
        - selection_summary
        - rejected_edit_buffer
    promoter:
      may_edit: "canonical_source_after_review"
      sees:
        - candidate_artifact
        - selection_results
        - held_out_test_report
        - anti_cheat_report
    auditor:
      may_edit: "none"
      sees:
        - diff
        - protected_paths
        - promotion_manifest
  splits:
    train:
      path: ".harness/evals/autoresearch/train.jsonl"
      role: "proposal_generation"
    selection:
      path: ".harness/evals/autoresearch/selection.jsonl"
      role: "candidate_acceptance"
    test:
      path: ".harness/evals/autoresearch/test.jsonl"
      role: "final_report_only"
    split_seed: 42
  edit_policy:
    mode: "patch"
    operations:
      - add
      - delete
      - replace
    max_edits: 4
    schedule: "bounded_rounds"
    protected_paths:
      - "references/evals.yaml"
      - ".harness/evals/**"
      - "data/**"
      - "evaluator/**"
  acceptance_gate:
    metric: "declared_success_metric"
    direction: "maximize"
    rule: "strict_improvement"
    ties: "reject"
    min_delta: 0.01
    noise_runs: 3
    guard_failure: "discard"
    report_test_score_only_after_acceptance: true
  anti_cheat:
    protected_paths:
      - "references/evals.yaml"
      - ".harness/evals/**"
      - "data/**"
      - "evaluator/**"
      - "fixtures/**"
    checks:
      - protected_path_diff_empty
      - held_out_not_visible_to_optimizer
      - evaluator_contract_unchanged
      - no_metric_string_smuggling
  evidence:
    root: ".harness/evidence/autoresearch/<run_tag>"
    rollout_jsonl: "rollouts.jsonl"
    rejected_buffer_jsonl: "rejected-edits.jsonl"
    candidate_artifact: "best_skill.md"
    promotion_manifest: "promotion.json"
    selection_results: "selection-results.json"
    test_results: "test-results.json"
    optimizer_memory: "optimizer-meta.md"
  promotion:
    canonical_edit_requires_review: true
    required_checks:
      - strict_audit_pass
      - selection_gate_pass
      - held_out_test_report
      - anti_cheat_pass
risks:
  - untrusted_input
  - prompt_injection_from_project_files
  - benchmark_contract_drift
  - destructive_git_or_file_operations
  - validation_drift
  - metric_noise
  - stale_experiment_memory
  - unsafe_verify_or_guard_command
  - optimizing_before_rewrite_readiness
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
  fixed_evaluation_contract: true
  log_streaming_limited: true
  verify_guard_command_screening: true
  git_memory_required: true
  noisy_metric_confirmation: true
  bounded_loop_required: true
  regression_guard_absolute: true
  binary_checks_for_autonomous_quality_loops: true
  explicit_approval_required_for_contract_edits: true
  parent_owned_ledger: true
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
  - smoke_evals_when_runner_available
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
failure_behavior: "Repair the smallest failing hypothesis, parser, command, or ledger entry first; otherwise report blocked with exact missing runtime, permission, credential, metric, corpus, or toolchain."
