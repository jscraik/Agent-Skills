schema_version: 1
skill: verification-before-completion
purpose: "Validate completion claims with fresh command evidence before reporting work as done."
triggers:
  - "Review and validate completion claims. Use when you are about to say work is complete, fixed, passing, pushed, or ready for review."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "claimed outcome"
  - "changed files"
  - "relevant validators"
  - "latest command output"
  - "known blockers"
outputs:
  - "verification checklist"
  - "fresh evidence"
  - "unverified gaps"
  - "final claim wording"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
