# Skill Evaluation Cases

schema_version: "1.0"
skill_name: "codex-home-audit"

cases:
  - name: happy-path
    prompt: "Use the codex-home-audit skill to audit my ~/.codex setup."
    context:
      - "User has a Codex home directory with AGENTS.md, rules/, and config.toml."
    acceptance:
      - type: contains
        value: "Wrote report"
      - type: contains
        value: "Surfaces checked"
      - type: contains
        value: "Top findings"
      - type: contains
        value: "Surface Inventory"

  - name: edge-case
    prompt: "Audit CODEX_HOME at /tmp/empty-codex-home (it is missing config.toml)."
    context:
      - "Target path exists but lacks required files."
    acceptance:
      - type: contains
        value: "Missing config.toml"
      - type: contains
        value: "Blockers"
      - type: contains
        value: "Wrote report"

  - name: telemetry-hooks-plugins-scope
    prompt: "Audit my Codex home for telemetry, hooks, plugins, skills, and history retention issues."
    context:
      - "Target Codex home contains config.toml, hooks.json, history.jsonl, and a Plugins/cache directory."
    acceptance:
      - type: contains
        value: "Telemetry:"
      - type: contains
        value: "History:"
      - type: contains
        value: "Hooks:"
      - type: contains
        value: "Plugins:"
      - type: contains
        value: "Skills:"

  - name: failure-mode
    prompt: "Deploy my app from this repo."
    context:
      - "Request is unrelated to auditing Codex home setup."
    acceptance:
      - type: contains
        value: "out of scope"
      - type: contains
        value: "redirect"

metadata:
