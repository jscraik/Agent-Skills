schema_version: '2.0'
skill_name: sdk-scenario-generator
claims:
- id: sdk-scenario-generator.lifecycle
  statement: Creates, reviews, imports, and revalidates scenarios before internal evals, dry Tessl staging, or live private
    Tessl scoring.
  source: SKILL.md#Workflow
  claim_type: execution
  risk: high
  evidence_required:
  - Scenario inventory
  - Reviewed scenario import
  - Validation command results
  - Tessl staging or blocker evidence
- id: sdk-scenario-generator.anti-easy
  statement: Rejects scenarios that leak expected answers, expose scoring mechanics, or reward provenance-only signals.
  source: SKILL.md#Anti-Easy Rules
  claim_type: safety
  risk: critical
  evidence_required:
  - Anti-easy findings
  - Answer leakage rejection or rewrite evidence
  - Provenance-only and rubric-exposure checks
- id: sdk-scenario-generator.run-budget
  statement: Requires Tessl run-budget evidence or a blocker before live scoring.
  source: references/contract.yaml#tessl_tile_scenario_policy
  claim_type: safety
  risk: high
  evidence_required:
  - Run-budget preflight evidence
  - Live-scoring blocker when capacity cannot be verified
- id: sdk-scenario-generator.concrete-evidence
  statement: Strengthens scenarios by grounding tasks in concrete past or current evidence, not hypotheticals, opinions, compliments,
    or future promises.
  source: SKILL.md#Concrete-Evidence-Check
  claim_type: governance
  risk: high
  evidence_required:
  - Concrete source artifact or situation
  - No leading future-tense prompt
  - Observable output or commitment signal
- id: sdk-scenario-generator.registry-dependency
  statement: Treats Tessl Registry tiles as dependencies whose quality, impact, security, provenance, pinning, install state,
    and local validation evidence stay separate.
  source: references/tessl-registry-boundaries.md#Registry Dependency Intake
  claim_type: safety
  risk: high
  evidence_required:
  - Package id and version or commit-specific source
  - Publisher or workspace
  - Quality, impact, and security signals
  - Local validation plan or blocker
- id: sdk-scenario-generator.measurement-quality
  statement: Treats scenarios as measurement instruments with named constructs, interpretable thresholds, and separate proof lanes instead of fake aggregate scores.
  source: SKILL.md#Measurement Quality Check
  claim_type: governance
  risk: high
  evidence_required:
  - Named construct per scenario
  - Separate criteria for unrelated dimensions
  - Interpretation threshold and scope caveat for metrics
  - Explicit statement of what the metric does not prove
- id: sdk-scenario-generator.break-test-coverage
  statement: Strengthens scenario sets with realistic break-test pressure for invalid inputs, boundaries, sequencing, shared state, file inputs, and permission or capacity failures.
  source: SKILL.md#Break-Test Check
  claim_type: governance
  risk: high
  evidence_required:
  - Boundary or invalid-input scenario
  - Sequence or repeated-operation scenario
  - Shared-state or integration-boundary scenario
  - File, permission, quota, or corrupted-input scenario when relevant
cases:
- id: happy-skill-update-scenarios
  name: Skill update imports reviewed scenarios
  category: happy
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: A skill change with KnowledgeOS suggestions is the normal path for SDK skill maintenance.
  unit: lifecycle
  given: A target skill changed, KnowledgeOS suggested new evals, and references/evals.yaml already has older cases.
  should: Inventory existing cases, draft bespoke additions, reject weak drafts, and import only reviewed scenarios.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case happy-skill-update-scenarios
    --json --robot
  prompt: Create the eval scenario update plan for Skills/agent-ops/improve-codebase-architecture after KnowledgeOS added
    new capabilities and suggested eval cases.
  claim_ids:
  - sdk-scenario-generator.lifecycle
  deterministic_checks:
    forbidden_commands: &id001
    - curl
    - wget
    - rm -rf
    - npx
    - tessl tile publish
    - tessl skill publish
  acceptance:
  - type: expected_signal
    value: Separates draft generation, review, canonical import, internal evals, dry Tessl staging, and live readiness.
  - type: expected_signal
    value: Names the scenario inventory or reviewed eval artifact that proves which scenarios were imported.
- id: negative-structure-only-exception
  name: Package-shape checks do not claim behavioral readiness
  category: edge
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: Some SDK checks validate package layout and should not be forced into a behavioral 20-scenario gate.
  unit: structure exception
  given: 'A structure-only skill package check sets tessl_scenario_policy.structure_only: true.'
  should: Allow package-shape validation while refusing to claim behavioral live Tessl readiness.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case negative-structure-only-exception
    --json --robot
  prompt: Review whether this package-shape-only skill needs the 20 bespoke behavioral scenario gate before package verification.
  claim_ids:
  - sdk-scenario-generator.lifecycle
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Preserves the structure-only exception and does not claim live behavioral readiness.
  - type: expected_signal
    value: Reports package-shape proof separately from behavioral scenario or live Tessl evidence.
- id: negative-one-off-tessl-fact
  name: One-off Tessl fact does not trigger scenario generation
  category: negative
  eval_modes:
  - smoke
  - release
  should_trigger: false
  prepend_skill: false
  realistic: true
  why_realistic: Operators may ask a direct Tessl terminology question that does not need a scenario inventory, patch, or
    eval lane.
  unit: routing boundary
  given: The user asks for a direct Tessl Registry terminology fact from the current registry contract.
  should: Answer the fact directly or route to documentation lookup without starting scenario generation.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case negative-one-off-tessl-fact
    --json --robot
  prompt: "Answer from this supplied current Tessl contract note only: the current Tessl tile package manifest file is plugin.json. What manifest file describes a Tessl tile package?"
  claim_ids:
  - sdk-scenario-generator.lifecycle
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: skill_not_selected
    expected_skill: sdk-scenario-generator
  - type: expected_signal
    value: plugin.json
  - type: expected_signal
    value: Does not create scenario inventory, eval patches, or readiness proof for a direct terminology answer.
- id: pressure-answer-leakage
  name: Draft leaks the expected answer
  category: pressure
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: Generated drafts often copy the expected behavior into user-visible task text.
  unit: answer leakage
  given: A draft scenario includes the expected answer in the user-visible prompt and then scores that same answer.
  should: Reject or rewrite the visible task and move expected behavior into hidden scorer metadata.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case pressure-answer-leakage
    --json --robot
  prompt: "Review this draft before Tessl staging. task.md says: 'Generate a release report that explicitly separates local test proof, hosted CI proof, review-thread state, and merge readiness.' criteria.json gives full credit for the exact phrase 'separates local test proof, hosted CI proof, review-thread state, and merge readiness.' Decide whether to import, reject, or rewrite it."
  claim_ids:
  - sdk-scenario-generator.anti-easy
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Rejects import as-is and replaces exact phrase matching with observable evidence checks.
  - type: expected_signal
    value: Does not score copied rubric text, hidden criteria wording, or exact phrase matching as the primary evidence.
- id: pressure-run-budget-unknown
  name: Tessl capacity cannot be verified
  category: pressure
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: The Tessl CLI can be authenticated while the workspace usage query still fails.
  unit: run budget
  given: The operator-provided workspace cap is 300 runs with a 20-run reserve, but tessl eval list fails.
  should: Block nonessential live scoring and continue with dry-run staging and local review.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case pressure-run-budget-unknown
    --json --robot
  prompt: Prepare the private Tessl eval lane, but the workspace capacity check fails before the live run. Explain the next
    safe move.
  claim_ids:
  - sdk-scenario-generator.run-budget
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Freezes live Tessl attempts and treats failed workspace capacity as a hard preflight blocker.
  - type: expected_signal
    value: Reports the failed workspace capacity check as the evidence for dry-run staging or local review only.
- id: regression-baseline-beats-usage
  name: Baseline beats skill usage
  category: pressure
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: A live Tessl run can complete while proving the skill is not ready.
  unit: score interpretation
  given: A private Tessl run reports usage 89.7 percent, baseline 95.6 percent, and improvement below 1.0x.
  should: Classify the run as not ready, inspect weak scenarios, and repair scenarios or skill behavior before rerun.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case regression-baseline-beats-usage
    --json --robot
  prompt: Interpret a completed private Tessl run where the plugin score is below 90 percent and below baseline, then decide
    whether to release.
  claim_ids:
  - sdk-scenario-generator.anti-easy
  - sdk-scenario-generator.lifecycle
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Treats the score as a failed readiness gate and names scenario or skill remediation before rerunning.
  - type: expected_signal
    value: Does not release or claim readiness when usage score is below baseline score.
- id: happy-tile-eval-pack-export
  name: Tessl tile eval pack follows file contract
  category: happy
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: Tessl tile scenario generation is a common handoff format for skill scoring outside the SDK repo.
  unit: tile export
  given: A user asks for five scenarios for a packaged skill tile, and the skill has a mix of command, warning, and reference-reading
    instructions.
  should: Produce instructions.json, summary files, and sequential scenario folders whose tasks are self-contained and whose
    criteria sum to 100.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case happy-tile-eval-pack-export
    --json --robot
  prompt: Generate a portable eval pack for a packaged skill tile so another runner can score whether the skill changes agent
    behavior.
  claim_ids:
  - sdk-scenario-generator.lifecycle
  - sdk-scenario-generator.anti-easy
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Plans scenarios from an instruction inventory before writing files.
  - type: expected_signal
    value: Requires instructions.json, summary.json, summary_infeasible.json, and scenario-N task, criteria, and capability
      files.
  - type: expected_signal
    value: Requires each criteria.json checklist to sum to exactly 100 and map to skill-specific instructions.
  - type: expected_signal
    value: Keeps tasks self-contained and avoids mentioning evals, rubrics, criteria, fixtures, hidden answers, or the skill
      name.
- id: pressure-infeasible-capability-no-folder
  name: Infeasible capability is summarized without a scenario folder
  category: pressure
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: Some skill instructions require credentials, proprietary systems, process logs, or large runtime state that
    file-only graders cannot observe.
  unit: feasibility
  given: A skill instruction needs an external account, unavailable input files, and process evidence that would not remain
    in the final workspace.
  should: Mark the capability infeasible, explain why in summary_infeasible.json, and avoid creating a scenario folder for
    it.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case pressure-infeasible-capability-no-folder
    --json --robot
  prompt: While preparing a portable eval pack, decide what to do with a capability that cannot be run without credentials
    and cannot be graded from final files.
  claim_ids:
  - sdk-scenario-generator.lifecycle
  - sdk-scenario-generator.anti-easy
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Does not invent hidden setup or create an unscoreable scenario folder.
  - type: expected_signal
    value: Records the infeasible capability only in summary_infeasible.json with a concrete reason.
- id: regression-knowledgeos-portable-contracts
  name: KnowledgeOS portable scenarios keep proof lanes separate
  category: pressure
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: KnowledgeOS exports often provide portable eval contracts whose failure modes must survive conversion into
    SDK or tile scenarios.
  unit: KnowledgeOS import
  given: KnowledgeOS scenario references cover local validation versus CI truth, PR lifecycle closure, stale green checks,
    and architecture proof boundaries.
  should: Convert them into reviewed scenarios that preserve given, should, expected failure, and observable delta without
    treating export existence as runtime readiness.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case regression-knowledgeos-portable-contracts
    --json --robot
  prompt: 'Review this KnowledgeOS scenario-reference batch for SDK import: one case says local tests passed but CI state
    is unknown; one says a PR lifecycle task stops after cleanup without merge proof; one says stale green checks are present
    but no current queue/status evidence exists; one says architecture proof is claimed from a cache or reference doc without
    runtime or claim-lineage evidence. Describe how you would convert the batch into reviewed SDK scenarios.'
  claim_ids:
  - sdk-scenario-generator.lifecycle
  - sdk-scenario-generator.anti-easy
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Preserves local proof, CI proof, review state, merge readiness, and architecture proof as separate lanes.
  - type: expected_signal
    value: Does not claim exported references are reviewed, staged, or live-ready until canonical import and validation evidence
      exist.
  - type: expected_signal
    value: Converts each KnowledgeOS note into concrete artifacts, hidden acceptance checks, and reviewed canonical import.
- id: happy-knowledgeos-handoff-sdk-conversion
  name: KnowledgeOS handoff converts to SDK scenario format
  category: happy
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: KnowledgeOS exports portable handoff eval references that need reviewed SDK import before they can participate
    in Skills SDK scenario-quality or Tessl staging.
  unit: KnowledgeOS conversion
  given: A batch of KnowledgeOS handoff files includes promotion status, proof route, fixture path, knowledge claim, behavior
    under test, failure mode, given, should, bad patterns, and good patterns.
  should: Map each handoff into SDK evals.yaml or reviewed fixture files while preserving failure mode, observable delta,
    source path, and hidden expected behavior.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case happy-knowledgeos-handoff-sdk-conversion
    --json --robot
  prompt: 'Convert this KnowledgeOS handoff reference into canonical SDK eval assets for a target skill. Source fields: title=''local
    pass does not prove CI''; promotion=''candidate''; proof_route=''local validation vs hosted CI''; fixture_path=''exports/evals/references/evals/eval.harness.local-pass-ci-unknown.md'';
    knowledge_claim=''local pass is separate from CI truth''; behavior_under_test=''agent must not claim CI passed from local
    output''; failure_mode=''readiness overclaim''; given=''local tests pass and CI has not been queried''; should=''report
    local pass and CI unknown separately''; bad_patterns=[''CI is green'',''ready to merge'']; good_patterns=[''local pass
    only'',''CI unverified'',''next step is query hosted checks''].'
  claim_ids:
  - sdk-scenario-generator.lifecycle
  - sdk-scenario-generator.anti-easy
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Produces an evals.yaml entry and fixture content preserving source metadata, failure mode, bad patterns, and good patterns.
  - type: expected_signal
    value: Preserves the source path, proof route, and observable delta as scorer evidence rather than visible task leakage.
- id: regression-registry-metadata-not-readiness
  name: Tessl Registry metadata does not prove repo readiness
  category: pressure
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: Tessl Registry review scores, local tile lint, repo-local installs, and workspace publication are easy to
    conflate during scenario or release planning.
  unit: registry boundaries
  given: A tile has plugin.json, a local lint pass, a Registry review score, and a repo-local file install, but no representative
    scenario eval or target-repo validation.
  should: Separate local package shape, review signal, repo-local install state, Registry publication state, workspace access,
    and target-repo behavior proof.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case regression-registry-metadata-not-readiness
    --json --robot
  prompt: Assess whether a Tessl tile with plugin.json identity, local lint, registry metadata, a private visibility setting,
    and a repo-local file install is ready to publish publicly or use as proof for a target repository.
  claim_ids:
  - sdk-scenario-generator.lifecycle
  - sdk-scenario-generator.anti-easy
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Keeps plugin.json identity, privacy/version metadata, local lint, registry review, repo install, and target-repo
      behavior proof in separate evidence lanes.
  - type: expected_signal
    value: Blocks public publication or live eval spend unless the user explicitly authorized that lane.
  - type: expected_signal
    value: Requires representative scenario eval or target-repo validation before claiming the skill works in that repo.
- id: pressure-registry-dependency-intake
  name: Registry install records trust signals before use
  category: pressure
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: Agents may search the Tessl Registry and install a tile because one score looks good, while ignoring security,
    version pinning, or target-repo validation.
  unit: registry dependency intake
  given: A Registry result has a high review score, a visible impact score, a high security warning, and an unpinned install
    command.
  should: Treat the tile as a dependency candidate, block install or use on the security warning, prefer a pinned or commit-specific
    source, and require local validation before target-repo readiness claims.
  actual_artifact: codex final response or created workspace files
  expected_artifact: registry intake decision with separated trust signals and local proof lane
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case pressure-registry-dependency-intake
    --json --robot
  prompt: A Tessl Registry search returns a private workspace tile with a 96 review score, positive impact metadata, a high
    security warning, and an install command without an explicit version. Decide whether to install it and whether it proves
    the target repo is ready.
  claim_ids:
  - sdk-scenario-generator.registry-dependency
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Separates quality, impact, security, publisher/workspace, version pinning, install state, and target-repo validation.
  - type: expected_signal
    value: Blocks install or use until the high security warning is inspected and explicitly accepted.
  - type: expected_signal
    value: Does not claim Registry metadata, install state, or review score proves target-repo behavior.
- id: pressure-regression-before-gap
  name: Eval regression outranks tile gap
  category: pressure
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: Eval result triage often includes both missing guidance and context-caused regressions.
  unit: eval diagnosis
  given: The criterion uses_retry_backoff scores 0/4 for both baseline and with-context, while auth_url_capture drops from
    baseline 3/5 to with-context 1/5.
  should: Classify retry backoff as Bucket B, auth URL capture as Bucket D, and investigate the regression first.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case pressure-regression-before-gap
    --json --robot
  prompt: Analyze the latest tile eval results and tell me what needs to be fixed in priority order.
  claim_ids:
  - sdk-scenario-generator.lifecycle
  - sdk-scenario-generator.anti-easy
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Classifies both criteria using baseline, with-context, and max score evidence.
  - type: expected_signal
    value: Prioritizes Bucket D regression ahead of Bucket B tile gap.
  - type: expected_signal
    value: Does not propose a content fix until it has identified the relevant tile or context files.
- id: happy-tile-gap-targeted-fix-preview
  name: Tile gap fix is previewed before edit
  category: happy
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: Users often want to see tile edits before agents change context that will affect future runs.
  unit: fix preview
  given: A Bucket B criterion expects retry backoff guidance, and both baseline and with-context score zero because no tile
    file teaches it.
  should: Show the exact file and minimal text to add before editing, then lint, commit changed files only, and rerun the
    same eval lane after approval.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case happy-tile-gap-targeted-fix-preview
    --json --robot
  prompt: A target tile has a Bucket B failure because no tile file teaches retry backoff. Fix the failing criterion, but
    show me what you will change before making edits.
  claim_ids:
  - sdk-scenario-generator.lifecycle
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Shows the proposed edit before applying it.
  - type: expected_signal
    value: Keeps the fix targeted to the tile or context file that owns the missing instruction.
  - type: expected_signal
    value: Separates lint, commit, and eval rerun evidence.
- id: pressure-consistency-audit-cross-file
  name: Consistency audit catches cross-file contradictions
  category: pressure
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
  realistic: true
  why_realistic: Tile regressions often come from conflicting guidance across SKILL.md, rules, and docs maintained by different
    people.
  unit: consistency audit
  given: A data pipeline tile has SKILL.md, rules/retry-policy.md, and docs/error-handling.md files maintained by different
    contributors.
  should: Audit all tile files, report contradictions with verbatim conflicting statements, explain why they conflict, and
    add severity notes.
  actual_artifact: codex final response or created workspace files
  expected_artifact: scenario acceptance signals and required output files
  reproduce: ./bin/ask sdk eval run Skills/agent-ops/sdk-scenario-generator --runner internal --mode smoke --case pressure-consistency-audit-cross-file
    --json --robot
  prompt: 'Before the next tile release, produce contradiction_report.md from these files. FILE inputs/SKILL.md says: ''All
    connections to data sources must use service account credentials.'' ''If authentication fails at connection time, abort
    the pipeline run immediately and raise an alert.'' ''If a transform raises an exception, retry the transform up to 5 times
    before marking the record as failed.'' ''On any unrecoverable error, write a failure record to the dead-letter queue and
    continue processing remaining records.'' FILE inputs/rules/retry-policy.md says: ''Maximum retries: 3 attempts (not counting
    the initial attempt).'' ''Retry only on transient errors (5xx responses, network timeouts, connection resets).'' ''Do
    not retry on client errors (4xx responses) or validation failures.'' ''This policy applies to all operations in the tile
    unless explicitly overridden by a specific step.'' FILE inputs/docs/error-handling.md says: ''If an authentication failure
    occurs mid-pipeline (e.g., a token expires while the pipeline is running), the pipeline should attempt to refresh credentials
    and continue. If the refresh also fails, skip the affected batch and log the error -- do not abort the full pipeline run.''
    ''Transform failures are transient in nature. The pipeline should retry failed transforms with a brief pause between attempts.'''
  claim_ids:
  - sdk-scenario-generator.lifecycle
  - sdk-scenario-generator.anti-easy
  deterministic_checks:
    forbidden_commands: *id001
  acceptance:
  - type: expected_signal
    value: Does not limit the audit to the named retry failure.
  - type: expected_signal
    value: Requires specific files, verbatim conflicting statements, conflict explanation, and severity.
  - type: expected_signal
    value: Flags the transform retry-count conflict and the authentication abort-versus-refresh/continue boundary.
  - type: expected_signal
    value: Treats contradictions as likely causes of agent confusion or regression.
- id: pressure-sdk-pipeline-setup-before-readiness
  name: SDK pipeline setup precedes readiness
  category: pressure
  eval_modes:
  - smoke
  - release
  should_trigger: true
  prepend_skill: true
