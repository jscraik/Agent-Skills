schema_version: 1
skill: testing
purpose: "Select, run, repair, and report repo-native test and validation evidence without replacing exact behavior proof with broad or guessed checks."
triggers:
  - "Select, run, and report repo-native test and validation evidence."
  - "Use when users ask what tests to run, ask to validate a change, fix failing tests, design test coverage, build eval proof, classify validation failures, or prove behavior before closeout."
non_goals:
  - "Do not own unrelated implementation domains after the correct test route is selected."
  - "Do not mutate external trackers, publish artifacts, or mark lifecycle work complete without an explicit owner skill or user instruction."
inputs:
  - target repo and changed files
  - behavior or artifact claim being tested
  - capability
  - repo instructions and command contracts
  - existing test output or failure text
  - credential, sandbox, network, or dirty-worktree constraints
outputs:
  - selected validation route
  - active persona lens names when used for review-style test strategy
  - capability
  - exact pass/fail/blocked command evidence
  - failure ownership classification
  - coverage gaps and next minimal diagnostic
commands:
  - "./bin/ask skills package verify Skills/agent-ops/testing --json --robot"
  - "./bin/ask skills audit Skills/agent-ops/testing --level strict --json --robot"
  - "./bin/ask skills external-review Skills/agent-ops/testing --json --robot"
permission_profile:
  network: false
  filesystem:
    read:
      - target repo
      - target skill package
      - validation artifacts
    write:
      - target repo tests and fixtures when explicitly in scope
      - target skill references when explicitly in scope
quality_criteria:
  capability_selection:
    purpose: "Select the smallest testing or KnowledgeOS capsule capability needed for the validation question."
    why_it_matters: "The testing skill spans repo validation, eval artifacts, deterministic scorers, judge calibration, regression loops, and production guardrails; loading all guidance hides the exact proof lane."
    observable_evidence:
      - "The response names the selected validation capability or capsule lane."
      - "The response cites the routing index, contract, or source-context entry that justified the selection."
      - "The response avoids loading unrelated capsule bodies by default."
    scoring:
      5: "Selects the narrowest relevant capability, cites routing evidence, and avoids unrelated capsules."
      4: "Selects a relevant capability with minor routing or citation gaps."
      3: "Uses a plausible testing lane but leaves the selection rationale partly implicit."
      2: "Mentions testing capsules but loads or applies unrelated facets."
      1: "Does not select a capability before using capsule material."
  validation_evidence_quality:
    purpose: "Ensure validation claims are backed by exact commands, artifacts, schemas, or calibrated eval evidence."
    why_it_matters: "Closeout claims are only useful when the evidence proves the touched behavior instead of a broad or stale status."
    observable_evidence:
      - "Reports exact commands with pass, fail, or blocked outcomes."
      - "Classifies blocker ownership and nearest meaningful fallback proof."
      - "Keeps deterministic artifacts and calibrated evals above uncalibrated judge summaries."
    scoring:
      5: "Evidence is exact, scoped, classified, and tied to the claimed behavior."
      4: "Evidence is mostly exact with minor missing ownership or fallback detail."
      3: "Evidence is usable but relies partly on broad or indirect proof."
      2: "Evidence is vague, stale, or does not exercise the touched path."
      1: "Claims validation without runnable or artifact-backed proof."
evidence_requirements:
  - "Validation reports must include exact command outcomes as pass, fail, or blocked."
  - "Blocked proof must name the blocker class and nearest meaningful fallback."
  - "Capsule-backed guidance must be selected through references/knowledge-capsule-routing.md and references/source-context.yaml."
  - "Eval or judge claims require deterministic artifacts or calibration evidence before release claims."
risks:
  - over_triggering
  - validation_drift
  - stale_artifact_confidence
  - uncalibrated_judge_authority
  - untrusted_input
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - strict_skill_audit
  - smoke_eval
observability: "Report exact command outcomes as pass, fail, or blocked with blocker reasons."
rollback_procedure: "Remove the testing skill package or restore its previous canonical source, then rerun strict audit for affected skills."
