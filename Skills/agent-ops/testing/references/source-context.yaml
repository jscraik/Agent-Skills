schema_version: 1
skill: testing
references:
- path: references/knowledge-demand.yaml
  kind: knowledge_profile
  provenance: vendored KnowledgeOS extraction
  load_when: deciding which bounded capsule is relevant
  allowed_claims:
  - knowledge demand profile for this skill
  forbidden_claims:
  - target repo readiness
  - raw source availability
  freshness: knowledge_os_snapshot
  context_budget: small
  claim_scope: knowledge_profile
  bounded_unit: true
- path: references/knowledge-capsule.manifest.yaml
  kind: capsule_manifest
  provenance: vendored KnowledgeOS extraction
  load_when: selecting a bounded KnowledgeOS capsule
  allowed_claims:
  - selected capsules and upstream snapshot digests
  forbidden_claims:
  - raw source completeness
  - runtime dependency on KnowledgeOS
  freshness: knowledge_os_snapshot
  context_budget: small
  claim_scope: capsule_manifest
  bounded_unit: true
- path: references/knowledge-capsule-routing.md
  kind: capsule_routing
  provenance: package-maintained index
  load_when: selecting the smallest relevant evidence capsule
  allowed_claims:
  - capsule selection route
  forbidden_claims:
  - claims outside the selected capsule
  freshness: package_current
  context_budget: small
  claim_scope: routing
  bounded_unit: true
- path: references/evals-trace-error-analysis.md
  kind: generated_knowledge_capsule
  provenance: vendored KnowledgeOS extraction
  load_when: traces, sampling, failure taxonomy, or coverage dimensions are in scope
  allowed_claims:
  - bounded trace-analysis guidance
  forbidden_claims:
  - load all capsules by default
  freshness: knowledge_os_snapshot
  context_budget: selective
  claim_scope: bounded_capsule
  bounded_unit: true
- path: references/evals-deterministic-evaluator-design.md
  kind: generated_knowledge_capsule
  provenance: vendored KnowledgeOS extraction
  load_when: objective properties need schemas, fixtures, parsers, or assertions
  allowed_claims:
  - bounded deterministic-evaluator guidance
  forbidden_claims:
  - load all capsules by default
  freshness: knowledge_os_snapshot
  context_budget: selective
  claim_scope: bounded_capsule
  bounded_unit: true
- path: references/evals-judge-calibration.md
  kind: generated_knowledge_capsule
  provenance: vendored KnowledgeOS extraction
  load_when: a judge score is proposed as evidence
  allowed_claims:
  - bounded judge-calibration guidance
  forbidden_claims:
  - load all capsules by default
  freshness: knowledge_os_snapshot
  context_budget: selective
  claim_scope: bounded_capsule
  bounded_unit: true
- path: references/evals-regression-loop.md
  kind: generated_knowledge_capsule
  provenance: vendored KnowledgeOS extraction
  load_when: a failure needs root cause, rerun proof, or regression retention
  allowed_claims:
  - bounded regression-loop guidance
  forbidden_claims:
  - load all capsules by default
  freshness: knowledge_os_snapshot
  context_budget: selective
  claim_scope: bounded_capsule
  bounded_unit: true
- path: references/evals-production-guardrails.md
  kind: generated_knowledge_capsule
  provenance: vendored KnowledgeOS extraction
  load_when: production safety, monitoring, metrics, or online guardrails are in scope
  allowed_claims:
  - bounded production-guardrail guidance
  forbidden_claims:
  - load all capsules by default
  freshness: knowledge_os_snapshot
  context_budget: selective
  claim_scope: bounded_capsule
  bounded_unit: true
- path: references/evals.yaml
  kind: package_eval_contract
  provenance: package-maintained evaluation suite
  load_when: selecting a behavior-proof case
  allowed_claims:
  - package evaluation cases and acceptance conditions
  forbidden_claims:
  - runtime success without execution evidence
  freshness: package_current
  context_budget: selective
  claim_scope: eval_contract
  bounded_unit: true
allowed_claims:
- KnowledgeOS capsules are vendored references, not runtime dependencies
