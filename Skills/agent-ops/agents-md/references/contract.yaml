schema_version: 1
skill: agents-md
purpose: "Use when reviewing, creating, shrinking, or refactoring AGENTS.md instruction surfaces that need scoped routing, dedupe, contradiction fixes, or progressive disclosure."
triggers: ["Use when the user request matches the skill scope."]
non_goals: ["Route unrelated work away from this skill."]
inputs: [user_request, target_context, evidence]
outputs: [result, evidence_summary, context_ledger, context_pointer_map, contradiction_notes, validation_status]
risks: [over_triggering, untrusted_input, validation_drift, context_loss, precedence_confusion, dead_context_pointers, unsafe_contract_deletion]
safety: {untrusted_inputs: true, redact_secrets: true, destructive_commands: false}
validation: [plugin_eval_grade_a_or_documented_budget_risk, strict_skill_audit, smoke_eval_when_available]
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
