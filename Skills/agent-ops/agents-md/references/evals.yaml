- id: edge-zero-setup-workspace
  name: zero setup workspace dissemination
  category: edge
  realistic: true
  eval_modes:
  - release
  should_trigger: true
  prepend_skill: true
  prompt: Use agents-md to review a draft AGENTS.md for a new control-plane repo. The file points to five setup docs but has no single readiness command, no blocker classification, and no guidance for generated/runtime projections. Tighten it so a fresh Codex agent can land in the workspace, self-orient, report readiness, or give exact blockers without asking the user to wire the repo together.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - nc
  acceptance:
  - type: skill_selected
    expected_skill: agents-md
  - type: regex
    value: "(?i)(zero.setup|readiness|bootstrap|blocker|self-orient|generated|runtime projection|workspace)"
  why_realistic: Captures the zero-setup agent workspace posture recently added to the agent-skills and coding-harness instruction surfaces.
- id: edge-real-path-validation
  name: exact production path validation
  category: edge
  realistic: true
  eval_modes:
  - release
  should_trigger: true
  prepend_skill: true
  prompt: Use agents-md to harden AGENTS.md validation guidance for a TypeScript CLI repo. The current text says "run tests" and "looks verified"; change it so agents run the narrowest check first and only claim behavior verified when the exact touched function, CLI command, shell script, validator, route, or workflow actually ran. If credentials or services block the exact path, require blocked evidence instead of optimistic language.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - nc
  acceptance:
  - type: skill_selected
    expected_skill: agents-md
  - type: regex
    value: "(?i)(narrowest|exact.*(path|function|CLI|validator|workflow)|blocked|pass|fail|verified)"
  why_realistic: Reflects the coding-harness validation update that prevents agents from overstating production-path verification.
