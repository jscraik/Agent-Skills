- id: edge-model-documentation-audit
  timeout_sec: 180
  claim_ids: [model-evidence]
  should: Require current official and local evidence, avoid mutating validation, identify committed-diff gaps, and exclude already-fixed defects.
  name: current documentation and semantic audit
  category: edge
  realistic: true
  eval_modes: [release]
  should_trigger: true
  prepend_skill: true
  prompt: >-
    Audit AGENTS.md and linked guidance against current official model docs,
    without editing. All links resolve. A linked validator runs projection sync,
    another checks only uncommitted diffs, and a fallback points to a directory.
    A recorded assistant message says a retry rule was stale, but current source
    already fixes it. Explain the evidence you need and return scoped findings.
  deterministic_checks:
    forbidden_commands: [git reset, git stash, rm -rf]
  acceptance:
  - type: skill_selected
    expected_skill: agents-md
  - type: regex
    value: '(?is)(official|documentation).*(source|URL|retriev|date)'
  - type: regex
    value: '(?is)(sync|projection).*(mutat|side.effect|read.only|avoid)'
  - type: regex
    value: '(?is)(uncommitted|diff.only|diff checks|staged).*(coverage|committed|omit|miss)'
  - type: regex
    value: '(?is)(already.fix|already.applied|current source).*(not|exclude|resolved|open)'
  why_realistic: A recorded audit resolved its links while semantic and validation-side-effect checks remained unfinished.
- id: edge-missing-exact-model-docs
  timeout_sec: 180
  claim_ids: [model-evidence]
  should: Label exact-model claims unverified while continuing independent local conflict review by authority and scope.
  name: unavailable model documentation limits only model claims
  category: edge
  realistic: true
  eval_modes: [release]
  should_trigger: true
  prepend_skill: true
  prompt: >-
    Review AGENTS.md for the model named in my app. Its exact-model official
    documentation is unavailable; only general Codex documentation is accessible.
    The local root and linked guide disagree on mandatory clarification.
    Complete the audit as far as evidence allows without changing files.
  acceptance:
  - type: skill_selected
    expected_skill: agents-md
  - type: regex
    value: '(?is)(model.specific|exact.model).*(unknown|unavailable|gap|unverified|blocked)'
  - type: regex
    value: '(?is)(authority|precedence|scope)'
  - type: regex
    value: '(?is)(local|independent).*(review|conflict|audit)'
  why_realistic: Runtime model labels do not guarantee that matching official guidance can be retrieved.
