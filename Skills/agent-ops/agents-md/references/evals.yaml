- id: smoke-discovery
  name: discovery interview contract
  category: happy
  realistic: true
  why_realistic: A user has named agents-md and asks Codex to inspect a local repo path before making changes, which is the normal first-turn discovery shape.
  eval_modes:
  - smoke
  smoke_mode: discovery-round-one
  should_trigger: true
  prepend_skill: true
  prompt: Use $agents-md to inspect /Users/jamiecraik/dev/agent-skills before making changes; ask the smallest useful discovery question first.
  acceptance:
  - type: skill_selected
    expected_skill: agents-md
  - type: regex
    value: "(?i)(What should this skill help you do|Why this matters|Round 1 question)"
- id: happy-progressive-disclosure
  name: refactor bloated repo AGENTS
  category: edge
  realistic: true
  eval_modes:
  - release
  should_trigger: true
  prepend_skill: false
  prompt: In `payments-api`, root `AGENTS.md` is 900 lines and repeats branch, commit, and PR rules from `docs/workflow.md`. It still says `npm test`, but `package.json` has only `pnpm test` and `.github/workflows/ci.yml` runs `pnpm test -- --runInBand`. Review the root file into a smaller map with verified Context Pointers, preserve the Project Brain and Local Memory sections, and call out the command-policy contradiction before choosing a test command.
  acceptance:
  - type: skill_selected
    expected_skill: agents-md
  - type: regex
    value: "(?i)(context ledger|context pointer|preserve|linked docs|contradiction|validation)"
  why_realistic: The prompt describes a concrete local agent-skills workflow with an action, artifact, or safety constraint that this skill is expected to handle.
