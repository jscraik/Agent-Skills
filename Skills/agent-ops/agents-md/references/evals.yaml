---
schema_version: '2.0'
skill_name: agents-md
claims:
- id: instruction-authority
  source: SKILL.md#workflow
  claim_type: execution
  evidence_required:
  - Findings identify authority, scope, and the resolved instruction or remaining material decision.
  statement: Resolve instruction conflicts through verified authority, scope, and canonical ownership before requesting a decision.
- id: contract-preservation
  source: SKILL.md#execution-boundaries
  claim_type: execution
  evidence_required:
  - Retained binding rules and verified replacement Context Pointers.
  statement: Preserve binding contracts while reducing duplicate instructions and verifying Context Pointers.
- id: conditional-review
  source: references/agents-md-guidance.md#required-subagent-and-review-swarm-contract
  claim_type: execution
  evidence_required:
  - Ordinary mailbox and explicitly selected artifact cases preserve their distinct requirements.
  statement: Require review artifacts only under the selected contract and probes only under that contract or uncertain runtime health.
- id: codestyle-file
  source: references/agents-md-guidance.md#codestyle-fallback
  claim_type: execution
  evidence_required:
  - Output names CODESTYLE.md and verifies readable file type.
  statement: Route missing local codestyle guidance to a verified readable CODESTYLE.md file.
- id: model-evidence
  source: references/model-documentation-audit.md
  claim_type: execution
  evidence_required:
  - Current official sources, local semantic findings, and explicit model-specific gaps.
  statement: Ground model-documentation audits in current official sources and distinguish documentation gaps from independently reviewable local conflicts.
