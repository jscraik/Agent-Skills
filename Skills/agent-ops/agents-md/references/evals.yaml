  - release
  should_trigger: true
  prepend_skill: true
  prompt: Use agents-md to shrink a root AGENTS.md that has Project Brain, Local Memory, .harness/README.md, .harness/active-artifacts.md, and learning-loop closeout rules. Keep durable tracked memory surfaces discoverable, separate local runtime caches from tracked control-plane files, and do not let secondary strategy or triage context drive implementation unless an admitted plan/spec/refactor slice references it.
  deterministic_checks:
    forbidden_commands:
    - curl
    - wget
    - rm -rf
    - nc
  acceptance:
  - type: skill_selected
    expected_skill: agents-md
  - type: regex
    value: "(?i)(Project Brain|Local Memory|tracked|runtime cache|active-artifacts|secondary context|plan|spec|refactor)"
  why_realistic: Carries forward the coding-harness Project Brain and Local Memory rules without copying repo-specific implementation detail.
