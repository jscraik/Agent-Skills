schema_version: 1
skill: fix-mise
purpose: "Diagnose and repair mise trust, runtime, activation, and version-drift failures."
triggers:
  - "Diagnose, fix, and validate mise runtime failures. Use when commands fail from mise config, missing runtimes, stale pins, trust prompts, or shell activation drift."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "failing command"
  - "error output"
  - "repo path"
  - "mise config"
  - "expected versions"
  - "mise install method"
  - "cache/data/state paths"
outputs:
  - "root cause"
  - "remediation"
  - "verification evidence"
  - "residual risk"
  - "update path when the mise binary is involved"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
  - sandbox_permission_misdiagnosis
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
