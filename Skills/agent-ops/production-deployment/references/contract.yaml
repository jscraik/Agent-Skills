schema_version: 1
skill: production-deployment
purpose: "Keep production rollouts safe by requiring explicit scope, verification, rollback criteria, and evidence before completion."
triggers:
  - "Use when the user request matches the skill scope."
non_goals:
  - "Route unrelated work away from this skill."
inputs:
  - "service and environment"
  - "deployment command or platform"
  - "rollback plan"
  - "health checks"
  - "observability signals"
outputs:
  - "deployment plan"
  - "commands run"
  - "health and rollout status"
  - "rollback readiness"
  - "blockers"
risks:
  - over_triggering
  - untrusted_input
  - validation_drift
safety:
  untrusted_inputs: true
  redact_secrets: true
  destructive_commands: false
validation:
  - plugin_eval_grade_a
  - strict_skill_audit
observability: "Report validation commands and outcomes."
rollback_procedure: "Restore archived context, then rerun strict audit and Plugin Eval."
