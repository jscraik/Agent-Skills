schema_version: 1
purpose: >
  Plan, translate, and run Codex-native subagent workflows using installed roles,
  explicit write-boundary decisions, and parent-mediated coordination.

triggers:
  - Requests for Codex subagents
  - Requests for parallel delegation in Codex
  - Requests to translate older swarm workflows into Codex-native orchestration
  - Requests to choose a roster for review, exploration, docs verification, or bounded implementation fan-out

inputs:
  - explicit user permission for subagent or parallel-agent work
  - task or workflow to decompose
  - repository or project context
  - write-safety context for any edit-capable delegated work
  - optional preferred roles or legacy source workflow

outputs:
  - human-readable orchestration plan or execution summary
  - structured output matching required_output fields when requested

risks:
  - Treating Codex like Codex teammate/inbox/task infrastructure
  - Over-delegating simple or tightly coupled work
  - Unsafe same-checkout parallel writes
  - Missing role coverage being papered over instead of escalated
  - Recursive delegation or idle waiting increasing cost and latency

modes:
  - translate_legacy_swarm
  - design_roster
  - execute_parallel_review
  - execute_parallel_research
  - execute_bounded_parallel_implementation

required_output:
  mode: string
  repo:
    localPath: string
  status:
    enum: [ready, blocked, in_progress, completed, failed]
  requested_parallelism: string
  write_strategy:
    enum: [shared_read_only, shared_disjoint_writes, isolated_worktrees, single_agent]
  recommended_roster:
    type: array
    items: string
  companion_skills:
    type: array
    items: string
  actions_taken:
    type: array
    items: string
  evidence:
    type: array
    items:
      type: object
      fields:
        kind: string
        label: string
        value: string
  risks:
    type: array
    items: string
  next_step: string

defaults:
  mode: design_roster
  write_strategy: shared_read_only

non_goals:
  - Pure role creation or config authoring
  - Worktree creation itself
  - Generic single-agent implementation
  - Emulating Codex-specific teammate backends or inbox file mechanics
