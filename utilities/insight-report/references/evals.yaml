schema_version: "2.0"

skill_name: "insight-report"

cases:
  - id: simple-insights-request
    name: simple insights request
    category: happy
    should_trigger: true
    prompt: "Show me how I've been using Codex this week"
    acceptance:
      - type: skill_selected
        expected_skill: "insight-report"
      - type: regex
        value: '(?i)(report\.html|insights|7 days)'

  - id: pattern-analysis
    name: identify friction patterns
    category: happy
    should_trigger: true
    prompt: "What patterns are slowing me down?"
    acceptance:
      - type: skill_selected
        expected_skill: "insight-report"
      - type: regex
        value: '(?i)(friction|slowing|patterns)'

  - id: recent-sessions-summary
    name: recent sessions summary
    category: happy
    should_trigger: true
    prompt: "Give me a summary of my recent sessions"
    acceptance:
      - type: skill_selected
        expected_skill: "insight-report"
      - type: regex
        value: '(?i)(summary|sessions|report)'

  - id: workflow-recommendations
    name: workflow improvement request
    category: happy
    should_trigger: true
    prompt: "What should I change about my workflow?"
    acceptance:
      - type: skill_selected
        expected_skill: "insight-report"
      - type: regex
        value: '(?i)(recommendations|change|workflow)'

  - id: explicit-report-request
    name: explicit report generation
    category: happy
    should_trigger: true
    prompt: "Generate my usage report"
    acceptance:
      - type: skill_selected
        expected_skill: "insight-report"
      - type: regex
        value: '(?i)(usage report|report\.html)'

  - id: custom-time-window
    name: custom 30-day window
    category: edge
    should_trigger: true
    prompt: "Show me insights for the last 30 days as a PDF"
    acceptance:
      - type: skill_selected
        expected_skill: "insight-report"
      - type: regex
        value: '(?i)(30 days|html|report\.html)'

  - id: no-data-scenario
    name: no session data available
    category: edge
    should_trigger: true
    prompt: "Insights for today"
    acceptance:
      - type: skill_selected
        expected_skill: "insight-report"
      - type: regex
        value: '(?i)(no.*data|no.*found|run.*sessions)'

  - id: negative-code-task
    name: not for general coding
    category: negative
    should_trigger: false
    prompt: "Refactor this React component to use hooks"
    acceptance:
      - type: skill_not_selected
        expected_skill: "insight-report"

  - id: negative-real-time
    name: not for real-time monitoring
    category: negative
    should_trigger: false
    prompt: "Monitor my Codex sessions live as they happen"
    acceptance:
      - type: skill_not_selected
        expected_skill: "insight-report"

metadata:
  last_updated: "2026-04-05"
  author: "skill-builder"
  review_status: "active"
