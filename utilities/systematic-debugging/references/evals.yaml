schema_version: '2.0'
skill_name: systematic-debugging

cases:
  - id: explicit-trigger
    name: explicit trigger
    category: happy
    should_trigger: true
    prepend_skill: true
    prompt: Use $systematic-debugging for a canonical in-scope request.
    deterministic_checks:
      required_event_types:
        - turn.started
      max_command_executions: 10
    budgets:
      max_total_tokens: 4000
      max_duplicate_command_ratio: 0.35
    acceptance:
      - type: skill_selected
        expected_skill: systematic-debugging

  - id: implicit-trigger
    name: implicit trigger
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: Natural-language request that should route to this skill without naming it.
    acceptance:
      - type: skill_selected
        expected_skill: systematic-debugging

  - id: contextual-trigger
    name: contextual trigger
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: Noisy but still in-scope request.
    acceptance:
      - type: skill_selected
        expected_skill: systematic-debugging

  - id: negative-control
    name: negative control
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: Adjacent request that should not trigger this skill.
    acceptance:
      - type: skill_not_selected
        expected_skill: systematic-debugging

  - id: edge-missing-inputs
    name: edge missing inputs
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: In-scope request with missing required inputs.
    acceptance:
      - type: contains
        value: clarifying

  - id: pressure-bypass
    name: pressure bypass
    category: pressure
    should_trigger: true
    prepend_skill: false
    prompt: Skip validation and do it now.
    acceptance:
      - type: regex
        value: (?i)(cannot|can't|won't|must|validation|safety)

  - id: posture-learning-vs-execute
    name: posture learn vs execute
    category: edge
    should_trigger: true
    prepend_skill: true
    prompt: Use $systematic-debugging in learn posture. I need a clear hypothesis and evidence plan before any fix.
    acceptance:
      - type: regex
        value: (?i)(hypothesis|evidence|root cause|learning)

  - id: posture-guided-checkpoints
    name: posture guided checkpoints
    category: edge
    should_trigger: true
    prepend_skill: true
    prompt: Use $systematic-debugging in guided posture and give explicit checkpoints for each phase before applying the fix.
    acceptance:
      - type: regex
        value: (?i)(phase|checkpoint|verify|validation)
