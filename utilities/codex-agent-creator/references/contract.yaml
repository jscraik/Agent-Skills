purpose: >
  Define expected behavior for creating, installing, and validating Codex custom subagent files.
schema_version: 1.0
triggers:
  - user asks to create, update, or troubleshoot a custom Codex subagent
  - user asks to tune spawned-agent concurrency/runtime limits for agent fan-out jobs
inputs:
  - agent_name
  - agent_description
  - model
  - model_reasoning_effort
  - developer_instructions
  - optional nickname_candidates for spawned-agent display labels
  - install scope (global by default; project only when explicitly requested)
  - target standalone custom-agent file path
  - canonical global targets (`~/dev/configs/codex/agents/`, `~/dev/configs/codex/config.toml`) unless explicit override is approved
  - optional global limits (agents.max_threads, agents.max_depth, agents.job_max_runtime_seconds)
outputs:
  - updated standalone custom-agent file in canonical path by default
  - optional updated [agents] global limits
  - validation result summary
observability: >
  Record exact command outcomes (pass|fail|blocked) for write/validate/install commands,
  and include effective target paths for the installed agent file and config in handoff summaries.
rollback_procedure: >
  Restore any config backup emitted by install_role.sh when limits are changed, remove
  incorrectly installed agent files, and rerun validation before reattempting install.
non_goals:
  - editing unrelated codex config sections beyond requested [agents] runtime-limit keys
  - guessing missing required custom-agent inputs
risks:
  - missing required standalone keys (name/description/developer_instructions/model/model_reasoning_effort); mitigated by explicit key validation
  - path mistakes; mitigated by explicit path confirmation
  - over-constraining agent runtime globally; mitigated by explicit user confirmation before setting limits
