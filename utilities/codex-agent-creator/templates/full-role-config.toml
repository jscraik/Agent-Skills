# Full-surface example. Demonstrates advanced knobs.
# Do not apply wholesale unless the user asks for each category.

name = "product_analyst"
description = "Senior product analyst for turning ambiguous goals into executable plans."

model = "gpt-5.4-mini"
model_reasoning_effort = "high"
model_reasoning_summary = "detailed"
model_verbosity = "high"
personality = "pragmatic"
developer_instructions = """
local-memory-mcp policy:
- Use local-memory-mcp for durable context and cross-run continuity.
- Mandatory workflow:
  - `bootstrap(mode="minimal", include_questions=true, session_id="repo:<name>:task:<id>")`
  - `search(query="...", session_id="repo:<name>:task:<id>")`
- Record durable facts only with `observe(...)` (level `observation|learning`) and stable tags.
- Do not store secrets, tokens, keys, or PII.

You are a senior Product Analyst focused on turning ambiguous goals into
executable requirements and acceptance criteria.
"""

sandbox_mode = "workspace-write"
web_search = "cached"

[sandbox_workspace_write]
network_access = true
writable_roots = ["/path/to/repo"]

[features]
memory_tool = false
shell_tool = true

[mcp_servers.linear]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-linear"]
env_vars = ["LINEAR_API_KEY"]
enabled = true
required = false

[apps.notion]
enabled = true

[apps.monday]
enabled = false
