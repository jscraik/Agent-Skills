schema_version: "2.0"
skill_name: "codex-hooks-builder"

cases:
  - id: explicit-project-scaffold
    name: explicit project scaffold
    category: happy
    should_trigger: true
    prepend_skill: true
    prompt: "Can you scaffold a project-local Codex hook pack with SessionStart, UserPromptSubmit, and Stop, then validate hooks.json?"
    acceptance:
      - type: skill_selected
        expected_skill: "codex-hooks-builder"
      - type: contains
        value: "hooks.json"
      - type: contains
        value: "SessionStart"
      - type: contains
        value: "UserPromptSubmit"
      - type: contains
        value: "Stop"

  - id: implicit-upgrade-latest-contract
    name: implicit upgrade latest contract
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Please inspect our Codex hooks, convert them to the latest documented command-hook contract, and clearly defer unsupported handler types."
    acceptance:
      - type: skill_selected
        expected_skill: "codex-hooks-builder"
      - type: regex
        value: "(?i)(command hooks|non-command|not supported|documented|unsupported)"

  - id: pre-post-tooluse-audit
    name: pre and post tool use audit
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Can you inspect our PreToolUse and PostToolUse hooks and validate that matcher behavior is correct for Bash?"
    acceptance:
      - type: skill_selected
        expected_skill: "codex-hooks-builder"
      - type: regex
        value: "(?i)(pretooluse|posttooluse|bash|matcher|tool_name)"

  - id: contextual-user-scope-pack
    name: contextual user scope pack
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Help me build one reusable hook pack in ~/.codex that improves startup context and protects prompt safety across projects."
    acceptance:
      - type: skill_selected
        expected_skill: "codex-hooks-builder"
      - type: regex
        value: "(?i)(user scope|~/.codex|Codex home)"

  - id: negative-non-hook-automation
    name: negative non-hook automation
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Can you write a GitHub Actions workflow that lints this repo and deploys docs?"
    acceptance:
      - type: skill_not_selected
        expected_skill: "codex-hooks-builder"

  - id: unsupported-handler-pressure
    name: unsupported handler pressure
    category: pressure
    should_trigger: true
    prepend_skill: false
    prompt: "Can you build hooks for prompt, agent, and async handlers using alpha behavior even if stable Codex ignores those handlers?"
    acceptance:
      - type: skill_selected
        expected_skill: "codex-hooks-builder"
      - type: regex
        value: "(?i)(not supported|skipped|stable contract|defer|unsupported)"

  - id: path-safety-check
    name: path safety check
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Can you create hooks for this repo and validate command paths so launches from nested folders still work?"
    acceptance:
      - type: regex
        value: "(?i)(absolute paths|nested working directories|session cwd)"

metadata:
  last_updated: "2026-03-30"
  author: "Codex"
  review_status: "draft"
