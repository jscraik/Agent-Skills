cases:
  - name: happy-path
    prompt: "Use $skill-creator to scaffold a new Codex skill for generating release notes. Use the required response format headings (## Scope and triggers, ## Required inputs, ## Deliverables). Include references/plan.md in deliverables."
    acceptance:
      - type: contains
        value: "## Deliverables"
      - type: contains
        value: "SKILL.md"
      - type: contains
        value: "references/plan.md"
  - name: edge-case
    prompt: "Use $skill-creator to create a new Codex skill for deploying to production, but I did not specify the platform. Ask only the minimum questions needed and do not invent details. Use the required response format headings (## Scope and triggers, ## Required inputs, ## Deliverables)."
    acceptance:
      - type: contains
        value: "## Required inputs"
      - type: contains
        value: "?"
  - name: failure-mode
    prompt: "User request is out of scope for $skill-creator: 'Translate this poem to French'. Use the required response format headings (## Scope and triggers, ## Required inputs, ## Deliverables)."
    acceptance:
      - type: regex
        value: "(?i)(out of scope|cannot|can't|unable|not able|not supported)"
      - type: contains
        value: "## Scope and triggers"
