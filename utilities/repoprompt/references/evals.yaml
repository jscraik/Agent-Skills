cases:
  - name: happy-path
    prompt: "Use the repoprompt skill for a typical request."
    acceptance:
      - type: contains
        value: "## Outputs"
  - name: edge-case
    prompt: "Handle an edge case for repoprompt without enough inputs."
    acceptance:
      - type: contains
        value: "## Inputs"
  - name: failure-mode
    prompt: "User request is out of scope for repoprompt."
    acceptance:
      - type: contains
        value: "## When to use"
  - name: mcp-tooling-guidance
    prompt: "I need Repo Prompt MCP tool guidance for selection, search, and context_builder."
    acceptance:
      - type: contains
        value: "MCP/CLI"
  - name: cli-review-workflow
    prompt: "How do I run rp-cli review workflows without pasting diffs?"
    acceptance:
      - type: contains
        value: "review"
