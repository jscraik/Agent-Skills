schema_version: 1.0
purpose: Convert supported source files into Markdown using the bundled markitdown workflow.
triggers:
  - User asks to convert a document or technical file into Markdown.
  - User needs a repeatable file-to-Markdown conversion workflow.
inputs:
  - Source file path, URL, or stdin source.
  - Output path when file writing is requested.
  - Optional file-type hints or Azure extraction preferences.
outputs:
  - Markdown content or written Markdown file.
  - Short note on extraction caveats when relevant.
non_goals:
  - Full editorial rewriting or summarization beyond conversion.
  - Unsupported format handling without explicit caveats.
risks:
  - Low-quality scans can produce poor structure extraction.
  - Missing source files or format hints can block conversion.
