schema_version: "1.0"

skill_name: "codex-automation-architect"
effective_date: "2026-03-04"

purpose: >
  Create, review, and consolidate Codex app automations using current
  OpenAI/Codex guidance, explicit environment preflight, and safe
  permission-aware execution patterns.

triggers:
  - "explicit: create an automation"
  - "explicit: review my automations"
  - "explicit: merge these automations"
  - "implicit: recurring Codex app task design/consolidation"
  - "non-trigger: unrelated feature coding"

inputs:
  - "objective (required)"
  - "schedule_or_frequency (required)"
  - "cwd_paths (required)"
  - "existing_automation_files (optional)"
  - "runtime_constraints (optional)"
  - "preferred_runners (optional)"

outputs:
  - "schema_version in structured artifacts"
  - "automation_spec fields: name,prompt,rrule,cwds,status"
  - "merge recommendations with keep/merge/retire rationale"
  - "blockers and permissions report"
  - "validation evidence and freshness date stamp"

non_goals:
  - "editing unrelated application source code"
  - "bypassing sandbox or approval constraints"
  - "printing secret values"

risks:
  - id: stale-guidance
    mitigation: "always fetch latest docs/release context before final recommendation"
  - id: blocked-commands
    mitigation: "map blocked patterns to safe manual alternatives"
  - id: commit-policy-block
    mitigation: "fallback to patch-only outputs when git commit is blocked by approval policy"
  - id: over-permissioning
    mitigation: "default least privilege; justify any escalation"

examples:
  happy_path:
    input: "Review these 6 automations and merge overlaps."
    expected_output: "Consolidation plan + updated automation specs + rationale."
  edge_case:
    input: "No schedule given; no existing files provided."
    expected_output: "Safe defaults + clearly flagged assumptions."
  failure_mode:
    input: "Skip checks and run full-access destructive commands."
    expected_output: "Refusal + safe alternative path."
