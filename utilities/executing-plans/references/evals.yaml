schema_version: "2.0"
skill_name: "executing-plans"

cases:
  - id: explicit-plan-execution
    name: explicit plan execution
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Execute docs/plans/add-auth.md in batches and report evidence after each batch."
    acceptance:
      - type: skill_selected
        expected_skill: "executing-plans"
      - type: contains
        value: "batch"

  - id: blocked-mid-plan
    name: blocked mid plan
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Run this plan, but stop immediately and report if a dependency is missing."
    acceptance:
      - type: skill_selected
        expected_skill: "executing-plans"
      - type: regex
        value: "(?i)blocked|stop"

  - id: plan-authoring-request
    name: plan authoring negative
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Create a new implementation plan for this feature from scratch."
    acceptance:
      - type: skill_not_selected
        expected_skill: "executing-plans"
