purpose: >
  Define expected behavior and outputs for this skill.
schema_version: 1.0
triggers:
  - user requests listing/installing/updating skills or validating an install source
  - user asks for deconflict or dry-run install planning
inputs:
  - install source (curated name, repo/path, or URL)
  - install scope selection (REPO or USER destination root)
  - destination or category
  - overwrite/update consent
outputs:
  - install summary with source and destination
  - validation results (quick_validate, skill_gate, analyze_skill, openclaw_skill_guard)
  - deterministic JSON block for non-trivial outcomes
output_contract:
  schema_version: "1.0"
  required_fields:
    - mode
    - source
    - destination
    - scope
    - staging_path
    - actions
    - risks
    - validations
    - repo_clean
    - retry_rounds
    - next_step
non_goals:
  - unrelated application development
  - generic debugging that does not involve skill installation
risks:
  - missing decisions; mitigated by request_user_input confirmation gates
  - untrusted source content; mitigated by security scan and risk blocking
  - unsafe direct writes from external sources; mitigated by isolated staging then promotion
  - retry thrashing; mitigated by 3-round retry cap and blocker handoff
