schema_version: "1.0"

purpose: >
  Define expected behavior for generating self-contained HTML visual explainers
  (diagrams, tables, and technical recaps) and returning browser-openable artifacts.

triggers:
  - user requests a technical diagram, architecture explainer, visual recap, or plan review
  - user needs a comparison table or matrix better rendered as HTML than ASCII
  - assistant identifies a complex table (4+ rows or 3+ columns) suitable for proactive visual rendering

inputs:
  - source content to visualize (notes, diffs, plans, data, or structured table rows)
  - audience and desired framing (engineering deep dive, executive summary, review artifact)
  - optional aesthetic constraints (theme, palette, brand direction)

outputs:
  - one self-contained HTML file in ~/.agent/diagrams/
  - a concise explanation of what the visual shows
  - explicit file path for reopening/sharing

non_goals:
  - returning only ASCII tables for complex comparisons
  - producing multi-file web apps instead of a single portable HTML artifact

risks:
  - visual polish without sufficient explanatory content; mitigated by explicit structure checks
  - leaking sensitive values from source material; mitigated by default redaction rules

examples:
  happy_path:
    input: "Create a visual architecture explainer for this service map."
    expected_output: "Self-contained HTML architecture explainer with clear sections and flow."
  edge_case:
    input: "Convert this large feature matrix into a readable deliverable."
    expected_output: "Responsive HTML table view with status indicators and summary notes."
  failure_mode:
    input: "Render this with confidential production secrets included verbatim."
    expected_output: "Refuse unsafe disclosure and provide redacted visual guidance."
