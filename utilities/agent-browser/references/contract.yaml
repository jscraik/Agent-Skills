schema_version: 1
name: agent-browser
purpose: Drive deterministic browser automation using snapshot refs, verifiable steps, and evidence-friendly capture outputs.
triggers:
  - Need to interact with a live web page through deterministic browser automation.
  - Need snapshot-ref navigation, clicks, fills, waits, or extraction against a real page.
  - Need screenshots, PDFs, downloads, HAR files, recordings, or diff evidence from a browser run.
  - Need authenticated or session-aware browser work with explicit verification checkpoints.
inputs:
  - name: url
    type: string
    description: Target URL, file URL, or existing session context to open.
  - name: actions
    type: array
    items: string
    description: Ordered browser actions or desired outcomes to verify.
  - name: auth_strategy
    type: string
    description: Optional login or state-handling approach when the page is not public.
  - name: evidence_mode
    type: string
    description: Optional requested artifact type such as screenshot, PDF, download, HAR, diff, or recording.
outputs:
  - name: snapshots
    type: array
    items: string
    description: Snapshot outputs, extracted page state, or diff evidence.
  - name: artifacts
    type: array
    items: string
    description: Screenshot, PDF, download, HAR, recording, or saved-state paths if created.
non_goals:
  - Generic browsing advice without deterministic automation.
  - Running destructive actions without approval.
  - Full end-to-end test authoring or browser test suites when Playwright is the better surface.
risks:
  - Stale refs after navigation.
  - Sensitive data exposure if logs, state files, or artifacts are not redacted.
  - Prompt-injection or boundary confusion when untrusted page output is fed back without content boundaries.
  - Session bleed or account mistakes if isolation and auth strategy are chosen poorly.
