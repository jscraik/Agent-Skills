# Skill Output Contract

schema_version: "1.0"
skill_name: "claude-alias"

purpose: >
  Diagnose, repair, and harden Claude wrapper alias routing so `ck`, `cz`, and `cc`
  consistently target the intended providers and model mappings.

triggers:
  - user reports ck/cz/cc launching the wrong provider or model
  - user reports recurring auth conflicts after alias/config changes
  - user asks to prevent alias drift in shell/config files

inputs:
  - optional config root path (default: /Users/jamiecraik/dev/config)
  - shell startup file path (default: ~/.zshrc)
  - claude settings links under ~/.claude/

outputs:
  - deterministic pass/fail check summary from guard script
  - repaired symlinks, normalized alias source line, and canonical wrapper hardening when repair mode is used
  - explicit remaining blocker if auth still fails after routing checks pass

non_goals:
  - rotating, replacing, or exposing provider secrets
  - debugging provider billing/quotas after routing integrity is confirmed
  - broad shell customization outside Claude alias routing

risks:
  - over-editing user shell files; mitigated by touching only claude-aliases source lines
  - false diagnosis of auth failures as routing failures; mitigated by check-before-auth sequence

examples:
  happy_path:
    input: "ck and cz keep conflicting; harden them"
    expected_output: "Guard check passes, repair if needed, and outputs stable routing summary."
  auth_edge_case:
    input: "Aliases look right but I still get 401"
    expected_output: "Reports routing is healthy and isolates issue as credential/auth scope."
