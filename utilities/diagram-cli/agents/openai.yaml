# OpenAI Agents SDK Configuration
# This file configures how the skill appears in Codex and any MCP dependencies.

interface:
  display_name: "diagram-cli"
  short_description: "Generate architecture diagrams, validate import rules, and analyze PR impact from source code"
  brand_color: "#8B5CF6"  # Purple for architecture/design tools
  icon_small: "./assets/icon.svg"
  default_prompt: "Help me understand and use diagram-cli to analyze this codebase"

policy:
  allow_implicit_invocation: true

# No external MCP dependencies required - diagram-cli runs locally
