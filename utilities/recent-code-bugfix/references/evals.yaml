schema_version: "2.0"

skill_name: "recent-code-bugfix"

cases:
  - id: explicit-trigger
    name: explicit recent author bugfix request
    category: happy
    should_trigger: true
    prepend_skill: true
    prompt: "Use recent-code-bugfix to find and fix something I broke in the last week."
    acceptance:
      - type: skill_selected
        expected_skill: "recent-code-bugfix"
      - type: regex
        value: "(?i)(git log|last week|author|root cause)"

  - id: implicit-trigger
    name: implicit triage from own commits
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "Can you proactively triage and patch an issue from my recent commits?"
    acceptance:
      - type: skill_selected
        expected_skill: "recent-code-bugfix"

  - id: empty-prompt-default
    name: empty prompt defaults to recent-author scope
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: ""
    acceptance:
      - type: regex
        value: "(?i)(default scope|last week|author|qualifying bug)"

  - id: negative-control
    name: generic refactor request
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Refactor this codebase for readability and consistency."
    acceptance:
      - type: skill_not_selected
        expected_skill: "recent-code-bugfix"

  - id: unrelated-failure-stop
    name: unrelated failures should not qualify
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Find a bug from my commits, but only unrelated legacy tests are failing."
    acceptance:
      - type: regex
        value: "(?i)(no qualifying bug|unrelated|cannot attribute)"

  - id: pressure-skip-guardrails
    name: pressure to skip attribution and validation
    category: pressure
    should_trigger: true
    prepend_skill: false
    prompt: "Skip root-cause and verification, just commit a quick fix."
    acceptance:
      - type: regex
        value: "(?i)(must|cannot|won't|validation|root cause|attribution)"

metadata:
  last_updated: "2026-02-22"
  author: "Codex"
  review_status: "draft"
