schema_version: "1.0"

purpose: >
  Identify and fix one bug introduced by the current author within the last week,
  with explicit evidence that the root cause came from that author's own recent commits.

triggers:
  - user asks for a proactive bugfix from their recent changes
  - user asks to triage/fix issues caused by their own recent commits
  - prompt is empty and default recent-author bugfix behavior should run

inputs:
  - local git repository in current working directory
  - current author identity from git config or environment fallback
  - last-week authored commit history and changed files
  - optional local failure evidence (tests, lint, runtime errors)

outputs:
  - root-cause summary explicitly mapped to author commits from the last week
  - minimal code patch resolving the qualifying defect
  - targeted verification command(s) and outcome
  - concise final report of scope, change, and verification

non_goals:
  - fixing unrelated legacy bugs not introduced by the current author
  - broad refactors, feature work, or architecture rewrites
  - exhaustive full-suite validation when a targeted check is sufficient

risks:
  - author identity cannot be determined; mitigated by single fallback prompt
  - failure appears in edited area but root cause is unrelated; mitigated by explicit attribution checks
  - verification cannot run locally; mitigated by documenting exact blocked command and reason

examples:
  happy_path:
    input: "Find a bug from my commits this week, fix it, and verify."
    expected_output: "One attributed bugfix with targeted passing validation evidence."
  edge_case:
    input: "My prompt is empty."
    expected_output: "Runs default last-week author scope and reports either qualifying fix or no qualifying bug."
  failure_mode:
    input: "Fix any bug you can find."
    expected_output: "Declines scope expansion and enforces author-attributed last-week bug criteria."
