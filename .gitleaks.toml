title = "Project gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allowlist for test fixtures, examples, and documentation."
paths = [
  "(^|/)docs?/",
  "(^|/)examples?/",
  "(^|/)references?/",
  "(^|/)test/",
  "(^|/)tests?/",
  "(^|/)spec/",
  "(^|/)__tests__/",
  "(^|/)test-data/",
  "(^|/)[^.]+\\.(test|spec)\\.[^.]+$",
  "frontend/ui/figma-implement-design/SKILL\\.md$",
  "(^|/)artifacts/skill-graphs/runs/",
]
regexes = [
  "\\[REDACTED\\]",
  "YOUR_API_TOKEN",
  "YOUR_TOKEN",
  "sk_live_abc123",
  "mkL9xQn2VwM8pYrTb4ZcHjF",
  "pR8mNv5KqXzGwY2JtCfL4D",
]
