id: skill-builder-sdk-pipeline
skills:
  - skill-builder
handles:
  - skill-builder
target_skill_set: skill-factory
target_module: skill-builder
target_source_path: Plugins/skill-factory/skills/code_quality_review/skill-builder/SKILL.md
level: molecule
projection_mode: flat
seed: seed.sh
verify: verify.py
max_attempts: 3
max_skill_context_tokens: 2200
