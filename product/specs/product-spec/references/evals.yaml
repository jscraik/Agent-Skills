cases:
  - name: end-to-end-pipeline
    prompt: "Use the product-spec skill to turn an idea into a Foundation Spec, UX Spec, and Build Plan. Keep scope MVP-only."
    acceptance:
      - type: contains
        value: "Foundation"
      - type: contains
        value: "UX"
      - type: contains
        value: "Build Plan"
      - type: contains
        value: ".spec/"
  - name: docs-only-boundary
    prompt: "Does the product-spec skill implement code, or does it only produce documentation/specs?"
    acceptance:
      - type: regex
        value: "(?i)does not.*implement|documentation only|specs only"
  - name: out-of-scope-ux-audit
    prompt: "Do a heuristic UX/UI audit of my app and suggest improvements."
    acceptance:
      - type: contains
        value: "product-design-review"
