purpose: >
  Guide structured brainstorming so the user clarifies WHAT to build before planning HOW to build it.
schema_version: 1.0
triggers:
  - ambiguous or exploratory feature requests
  - user explicitly asks to brainstorm or explore options
inputs:
  - user goal and context
  - constraints, risks, and success criteria when available
outputs:
  - clarified problem statement
  - 2-3 approaches with tradeoffs
  - recommended direction and open questions
non_goals:
  - implementation-ready code changes
  - skipping clarification when requirements are ambiguous
risks:
  - over-questioning; mitigate with one-question-at-a-time flow
  - over-design; mitigate with YAGNI checks
