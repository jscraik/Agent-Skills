cases:
  - name: clarify-ambiguous-request
    prompt: "Let’s brainstorm a better notifications experience for our app."
    acceptance:
      - type: contains
        value: "Phase 1"
      - type: contains
        value: "approaches"
  - name: skip-when-clear
    prompt: "Implement exactly this acceptance criteria with no ambiguity."
    acceptance:
      - type: contains
        value: "requirements seem clear"
  - name: capture-decisions
    prompt: "Brainstorm options and then summarize decisions and next steps."
    acceptance:
      - type: contains
        value: "Key Decisions"
      - type: contains
        value: "Next Steps"
