schema_version: "1.0"

purpose: >
  Produce high-novelty, launchable ideas from deep repository excavation,
  explicitly avoiding incremental optimization framing.

triggers:
  - user asks for radical/asymmetric/non-obvious ideas from an existing repository
  - user asks for category-creating concepts with concrete launch paths

inputs:
  - repository path or workspace scope
  - desired idea count (default 10)
  - launch window (default 30 days)
  - optional novelty/risk constraints

outputs:
  - markdown with exactly N ideas (default N=10)
  - "each idea includes: Name, Core Concept, Why It’s Asymmetric, Why It Would Surprise the Founder, 30-Day Launch Path, Long-Term Optionality"
  - optional trace metadata artifact without sensitive content

non_goals:
  - backlog optimization and routine roadmap suggestions
  - bug fixing, code refactoring, or implementation execution
  - investor-style pitch decks unless explicitly requested

risks:
  - accidental incrementality; mitigate with rejection gate
  - thematic repetition; mitigate with diversity constraints and seen-theme ledger
  - leaking sensitive repo information; mitigate with redaction and no raw dumps

acceptance_criteria:
  - exactly requested idea count
  - all ideas include all six required fields
  - constraint coverage satisfied:
      - at least 3 outside current domains
      - at least 2 tools/systems
      - at least 2 frameworks/cultural artifacts
      - at least 1 playful/experimental
      - at least 1 unsettling but generative
  - no hidden-audit section exposed unless user requests it

examples:
  happy_path:
    input: "Scan this repo and give me 10 asymmetric ideas I can launch in 30 days."
    expected_output: "10 formatted ideas with constraint coverage and concrete launch paths"
  edge_case:
    input: "Give me only 3 ideas, but make them highly experimental."
    expected_output: "Exactly 3 ideas, still fully structured and launchable"
  failure_mode:
    input: "Just optimize our existing roadmap."
    expected_output: "Decline/reroute to improvement/prioritization skill"
