schema_version: 1
purpose: >-
  Generate a breadth-first, evidence-backed improvement strategy by privately exploring
  100 candidate ideas, running a premortem, and returning the 10 strongest ranked
  opportunities with pragmatic implementation slices and risk controls.
triggers:
  - roadmap ideation for an existing product, repository, workflow, or AI app
  - prioritization requests asking what to build next or how to make a system more compelling
  - requests for ranked improvement opportunities grounded in current best practices
inputs:
  - user request details
  - repository, product, or workflow context
  - intended audience and constraints
  - latest/current verification scope when freshness matters
outputs:
  - assumptions
  - freshness check with sources and date when needed
  - premortem
  - premortem-adjusted selection filters
  - top 10 ranked ideas with implementation slices, risks, and score snapshots
  - score summary
  - reserve bench themes
non_goals:
  - bug fixing or direct implementation
  - generic unranked brainstorming dumps
  - unsourced claims about current best practices when freshness matters
risks:
  - stale external assumptions; mitigated by primary-source freshness checks
  - novelty bias; mitigated by premortem-driven filters and feasibility scoring
  - complexity creep; mitigated by MVP slices and tie-breakers favoring simpler wedges
  - weak repo grounding; mitigated by explicit assumptions and evidence limits
