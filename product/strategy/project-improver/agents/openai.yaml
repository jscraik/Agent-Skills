interface:
  display_name: "Project Improver"
  short_description: "Generate, filter, pressure-test, and implement the best project improvements"
  default_prompt: "Use $project-improver to inspect the current project or plan, generate many candidate improvements, reject weak ideas explicitly, keep only the strongest practical upgrades, run a premortem when useful, and implement the best high-leverage ideas when requested."

policy:
  allow_implicit_invocation: true
