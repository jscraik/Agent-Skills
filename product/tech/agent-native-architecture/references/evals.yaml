cases:
  - name: positive-explicit-invocation
    prompt: "$agent-native-architecture design an agent-native doc triage system."
    acceptance:
      - type: contains
        value: "Parity"

  - name: positive-implicit-agent-loop
    prompt: "Help me redesign this app around autonomous agent loops with safe completion semantics."
    acceptance:
      - type: contains
        value: "completion"

  - name: positive-architecture-audit
    prompt: "Review this architecture for parity and composability gaps."
    acceptance:
      - type: contains
        value: "parity"

  - name: edge-hybrid-architecture-and-implementation-hints
    prompt: "Give architecture guidance and only minimal implementation hints for agent-native refactor."
    acceptance:
      - type: contains
        value: "planning"

  - name: edge-missing-constraints
    prompt: "Design agent-native architecture for my app; I have no constraints to share yet."
    acceptance:
      - type: contains
        value: "Evidence gap"

  - name: edge-mobile-patterns
    prompt: "How should we design an agent-native mobile architecture with resume behavior?"
    acceptance:
      - type: contains
        value: "resume"

  - name: negative-ci-fix
    prompt: "Fix failing CI checks on my PR."
    acceptance:
      - type: not_contains
        value: "agent-native"

  - name: negative-youtube-packaging
    prompt: "Write me YouTube title and thumbnail options."
    acceptance:
      - type: not_contains
        value: "parity"

  - name: negative-translation
    prompt: "Translate this paragraph to Spanish."
    acceptance:
      - type: not_contains
        value: "tool design"

  - name: collision-policy
    prompt: "A duplicate skill name exists in user scope; provide collision handling for this skill rollout."
    acceptance:
      - type: contains
        value: "agent-native-architecture-codex"

  - name: rollback-disable-path
    prompt: "Show how to disable this skill quickly without deleting files."
    acceptance:
      - type: contains
        value: "skills.config"
