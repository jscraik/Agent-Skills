purpose: >
  Define expected behavior and outputs for Codex-oriented agent-native architecture planning and review.
schema_version: 1.0
triggers:
  - user asks to design, audit, or refactor an agent-native architecture
  - request mentions parity, primitive tools, completion loops, context injection, or agent capability mapping
inputs:
  - user objective and constraints
  - current architecture context or assumptions
  - risk and governance requirements when available
outputs:
  - architecture recommendation package with parity map, tool audit, execution model, and rollout/rollback guidance
non_goals:
  - implementing product code
  - editing upstream codex core templates by default
risks:
  - missing architecture context; mitigated by explicit assumptions and Evidence gap markers
