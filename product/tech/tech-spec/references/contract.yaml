purpose: >
  Define canonical behavior for converting a tech spec into one focused artifact via mode routing.
schema_version: 1.0
triggers:
  - user asks for data, migration, ops, or performance planning from an existing tech spec
inputs:
  - source tech spec path or content
  - selected mode (data_spec, migration_plan, ops_spec, performance_plan)
outputs:
  - mode-specific planning artifact with explicit assumptions and measurable criteria
non_goals:
  - implementation code changes
  - broad product ideation unrelated to a source tech spec
risks:
  - ambiguous or incomplete source specs; mitigated by explicit assumptions and gap reporting
