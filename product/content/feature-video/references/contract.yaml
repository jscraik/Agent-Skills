schema_version: 1

purpose: >
  Produce a concise feature walkthrough video or capture plan tied to a real
  shipped change, then package the result for PR, release, or handoff use.

triggers:
  - the user wants a feature walkthrough video for a PR, release note, or team handoff
  - static screenshots are not enough to explain the user flow
  - the user wants a demo artifact tied to a specific product change

inputs:
  - target feature or flow
  - source material such as a running app, Stitch screens, Remotion project, recording plan, or existing MP4
  - intended destination such as PR comment, release artifact, internal demo, or handoff note
  - for browser PR walkthroughs, a PR number or current branch plus optional base URL and draft-PR preference

outputs:
  - a walkthrough video plan or rendered artifact
  - output path and primary generation or export command
  - short PR-ready or handoff-ready summary copy
  - unresolved accuracy or asset limitations

non_goals:
  - generic title or thumbnail ideation
  - synthetic AI video unrelated to the actual product flow
  - inventing scenes when stable source material is unavailable

risks:
  - stale or inaccurate walkthroughs; mitigate with final behavior recheck before signoff
  - broken PR upload flow; mitigate with native GitHub URL validation before editing the PR body
  - missing source assets; mitigate with capture-plan fallback instead of fabricated footage
