purpose: >
  Define expected behavior and outputs for the changelog skill.
schema_version: 1.0
triggers:
  - user requests a changelog, weekly summary, or release-note style merge recap
inputs:
  - repository or PR scope
  - time window
  - audience or delivery target
outputs:
  - changelog summary grouped by change type and impact
non_goals:
  - executing a software release
  - full PR review or merge gating
risks:
  - incomplete PR metadata; mitigated by explicit traceability and bounded claims
