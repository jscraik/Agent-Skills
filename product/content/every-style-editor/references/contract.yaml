schema_version: 1
name: every-style-editor
purpose: Review or edit prose against Every's editorial style guide with concrete, rule-backed corrections.
triggers:
  - User asks for line editing or proofreading against Every's style guide.
  - User wants grammar, punctuation, mechanics, or house-style compliance feedback for Every content.
  - User wants a structured editorial review memo plus optional clean rewrite.
inputs:
  - name: source_text
    type: string
    description: The text to review or edit.
  - name: document_type
    type: string
    description: Article, newsletter, social post, memo, or other prose form.
  - name: review_mode
    type: enum
    values: [review-only, rewrite-only, review-and-rewrite]
    description: Desired editorial output mode.
  - name: audience
    type: string
    description: Optional intended audience or channel context.
outputs:
  - name: editorial_summary
    type: string
    description: High-level editorial assessment.
  - name: corrections
    type: array
    description: Exact issue-by-issue corrections with rule references.
  - name: recurring_issues
    type: array
    description: Repeated patterns that should be fixed across the draft.
  - name: clean_rewrite
    type: string
    description: Optional revised version when requested.
success_criteria:
  - Corrections quote exact source text where possible.
  - Every-specific claims are backed by the preserved style guide.
  - The author's meaning and tone are preserved while improving compliance.
non_goals:
  - Generic repo documentation QA.
  - Content strategy or headline ideation without editorial review.
  - Brand-agnostic rewriting with no Every style requirement.
risks:
  - Applying generic style opinions as if they were Every rules.
  - Over-editing the draft and flattening the author's voice.
  - Losing important edge-case rules by over-compressing the guide.
