schema_version: 1.1
skill: context7
type: library_api_reference
purpose: >
  Retrieve current third-party library documentation through Context7 and support
  Context7 CLI skill-wizard workflows (`ctx7 skills ...`) with source-backed guidance.
triggers:
  - user needs current API details for an external dependency
  - user asks for version-sensitive behavior checks against library docs
  - user requests troubleshooting guidance grounded in current third-party documentation
  - user asks for Context7 Skill Wizard help (`ctx7 skills generate`)
  - user asks how to install/manage skills with Context7 CLI
inputs:
  - library or product name to resolve in Context7
  - specific implementation question to answer from docs
  - optional version or environment constraints
  - optional Context7 CLI intent (`search|install|list|remove|info|suggest|generate`)
  - optional install target flags (`--claude|--cursor|--universal|--antigravity|--global|--all`)
outputs:
  - resolved Context7 library id used for lookup
  - focused docs-backed guidance tied to the user question
  - explicit clarification or assumptions when the match is ambiguous
  - wizard command sequence and target flags for `ctx7 skills` requests
output_contract:
  schema_version: "1.0"
  required_fields:
    - guidance
    - source_basis
  optional_fields:
    - library_id
    - assumptions
    - version_scope
    - wizard_commands
    - install_targets
non_goals:
  - replacing first-party product documentation
  - providing speculative answers without retrieval
  - dumping full documentation instead of targeted guidance
  - inventing undocumented Context7 CLI flags
risks:
  - incorrect library id selection can return irrelevant guidance
  - broad queries can return noisy snippets that obscure answers
  - undocumented assumptions can produce false confidence
  - wrong wizard flag mapping can install into the wrong target directory
rollback_procedure: >
  If contract or eval updates regress routing or validation behavior, restore the previous
  known-good files under product/docs/context7/references/ from git and rerun:
  `bin/ask skills audit product/docs/context7 --level strict --robot` plus the family
  benchmark validator command. Re-apply only the minimal failing section.
observability: >
  Track health via strict skill audit output, family benchmark validation output, and live
  Context7 resolve/query smoke checks. Treat schema failures, missing pressure/negative eval
  coverage, repeated ambiguous id matches, or wizard option drift as regression signals
  requiring remediation.
