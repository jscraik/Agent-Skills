purpose: 'Use when the user asks how to build with OpenAI products or APIs and needs
  up-to-date official documentation with citations (for example: Codex, Responses
  API, Chat Completions, Apps SDK, Agents SDK, Realtime, model capabilities or limits);
  prioritize OpenAI docs MCP tools and restrict any fallback browsing to official
  OpenAI domains.'
schema_version: '1.0'
triggers:
- When requests match openai-docs scope and intent.
inputs:
- user request details
outputs:
- structured response or artifacts defined by the skill
non_goals:
- out-of-scope requests outside the skill boundary
risks:
- missing context; mitigated by clarifying questions and explicit assumptions
