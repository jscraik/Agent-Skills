schema_version: 1.1
skill: llm-wiki
type: knowledge_management
purpose: >
  Design and operate a persistent markdown wiki that an LLM continuously maintains
  through ingest, query, and lint workflows so knowledge compounds over time.
triggers:
  - user asks to create a persistent LLM-maintained wiki
  - user wants ingest/query/lint workflows for long-running knowledge bases
  - user needs schema guidance for wiki governance in AGENTS.md or CLAUDE.md
  - user wants index/log conventions for markdown knowledge repositories
inputs:
  - user domain and outcome (personal research, team wiki, due diligence, etc.)
  - location and formats of source material
  - sensitivity profile for source material (public/internal/confidential/highly sensitive)
  - mixed-media policy (text-only or text-plus-selective-image-review)
  - preferred wiki repository path and folder conventions
  - operational constraints (supervision, cadence, citation strictness)
  - governance documents in scope (AGENTS.md, CLAUDE.md, runbooks)
outputs:
  - architecture recommendation for raw/wiki/schema layers
  - ingest/query/lint playbook with explicit steps
  - starter layout guidance with required index.md/log.md control files
  - file layout guidance including index/log conventions
  - append-only parseable log heading convention (## [YYYY-MM-DD] ingest|query|lint | summary)
  - privacy-controls plan covering classification, minimization, and redaction
  - risk and hygiene checklist for contradictions, staleness, and orphan pages
output_contract:
  schema_version: "1.0"
  required_fields:
    - schema_version
    - architecture
    - workflow
    - safety_constraints
    - validation_plan
    - starter_layout
    - index_conventions
    - log_format
    - log_append_only
    - log_heading_pattern
    - privacy_controls
  optional_fields:
    - lint_checklist
    - follow_up_questions
non_goals:
  - one-off summarization with no persistent wiki maintenance
  - implementing full vector retrieval infrastructure by default
  - editing raw source files as part of wiki maintenance
risks:
  - stale claims can persist without regular lint passes
  - weak provenance if citations are omitted during updates
  - wiki sprawl from missing index and cross-link hygiene
rollback_procedure: >
  If guidance changes introduce confusion or regress strict audits, restore
  product/docs/llm-wiki/SKILL.md and references files from the previous known-good
  git state, then rerun quick_validate and ask skills audit strict.
observability: >
  Monitor strict skill audit results and check that generated responses always include
  architecture boundaries, workflow steps, and safety constraints with citation-first behavior.
