schema_version: "1.1"

purpose: >
  Define expected behavior and outputs for the claude-md skill, including
  concise, layered CLAUDE.md authoring with include/exclude filtering and
  progressive disclosure via @path imports.

triggers:
  - user requests CLAUDE.md creation or update
  - user requests CLAUDE.md refactor for brevity and clarity
  - user requests layered Claude instructions (home/root/child files)

inputs:
  - repo_root_path
  - existing_claude_file_state
  - verified_repo_commands_and_paths
  - conflicting_instruction_sources
  - target_scope_for_changes

outputs:
  - minimal_claude_md_for_target_scope
  - include_exclude_matrix
  - contradictions_list_with_resolution_questions
  - flag_for_deletion_list
  - optional_import_block_with_verified_paths

required_response_sections:
  - "When to use"
  - "Outputs"
  - "Inputs"

non_goals:
  - implementing product code
  - inventing non-existent commands or paths
  - writing long tutorial-style CLAUDE.md content

risks:
  - risk: bloated_always_on_context
    mitigation: enforce delete-test ("Would removing this cause mistakes?")
  - risk: contradictory_instruction_layers
    mitigation: surface conflict and ask user which rule should win
  - risk: broken_import_links
    mitigation: verify every @path exists before finalizing
