schema_version: "2.0"

skill_name: "agent-native-architecture"

cases:
  - id: explicit-agent-native-architecture
    name: explicit agent-native architecture request
    category: happy
    should_trigger: true
    prepend_skill: true
    prompt: "Use $agent-native-architecture to design an agent-native product where the agent can act like a first-class user."
    acceptance:
      - type: skill_selected
        expected_skill: "agent-native-architecture"
      - type: regex
        value: "(?i)(parity|primitive tools|shared workspace|agent-native)"

  - id: mcp-tool-surface
    name: mcp tool surface design
    category: happy
    should_trigger: true
    prepend_skill: false
    prompt: "I need architecture guidance for an MCP server. When should I keep tools primitive versus adding domain tools?"
    acceptance:
      - type: skill_selected
        expected_skill: "agent-native-architecture"
      - type: regex
        value: "(?i)(mcp|primitive|domain tool|granularity)"

  - id: parity-and-context-review
    name: parity and context review
    category: edge
    should_trigger: true
    prepend_skill: false
    prompt: "Review this design for agent parity, dynamic context injection, and explicit completion signals before we build it."
    acceptance:
      - type: skill_selected
        expected_skill: "agent-native-architecture"
      - type: regex
        value: "(?i)(parity|context|completion|checklist)"

  - id: audit-instead-of-architecture
    name: audit instead of architecture
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Audit this repo and tell me whether the workflow is actually agent-native in practice."
    acceptance:
      - type: skill_not_selected
        expected_skill: "agent-native-architecture"

  - id: adr-interview-request
    name: adr interview request
    category: negative
    should_trigger: false
    prepend_skill: false
    prompt: "Help me choose between these architecture options by interviewing me and producing an ADR."
    acceptance:
      - type: skill_not_selected
        expected_skill: "agent-native-architecture"

metadata:
  last_updated: "2026-03-30"
  author: "Codex"
  review_status: "draft"
