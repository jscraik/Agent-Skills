schema_version: 1
name: agent-native-architecture
purpose: Guide the design and review of systems where agents operate as first-class users through parity, primitive tools, shared workspace patterns, and explicit completion loops.
triggers:
  - Need architecture guidance for an agent-native product or major subsystem.
  - Need help mapping UI parity, tool granularity, prompt composition, or shared workspace design.
  - Need recommendations for MCP tool design, context injection, agent-native testing, or self-modification guardrails.
inputs:
  - name: architecture_surface
    type: string
    description: Product, workflow, subsystem, or platform surface being designed or reviewed.
  - name: primary_outcome
    type: string
    description: Main user or agent outcome the system should achieve.
  - name: constraints
    type: array
    items: string
    description: Relevant constraints around data, approvals, safety, UI parity, platform limits, or deployment.
  - name: design_mode
    type: string
    description: Greenfield design, refactor guidance, tool design, testing, self-modification, or another named architecture surface.
outputs:
  - name: recommendation
    type: string
    description: Architecture recommendation grounded in the imported doctrine.
  - name: checklist
    type: array
    items: string
    description: Focused review checklist or design criteria for the chosen surface.
  - name: references
    type: array
    items: string
    description: Exact imported references to read next when nuance matters.
non_goals:
  - Repository audits of whether a workflow is already agent-native in practice.
  - ADR-style facilitation when the user primarily needs a forced decision record.
  - File-level implementation work once the architecture target is already known.
risks:
  - Agent-as-router designs that bury judgment in workflow code.
  - Missing parity between user actions and agent capabilities.
  - Overly static or incomplete tool surfaces that block emergent capability.
  - Hidden platform constraints that invalidate an otherwise good architecture recommendation.
