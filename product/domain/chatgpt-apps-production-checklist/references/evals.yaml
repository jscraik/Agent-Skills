schema_version: "1.0"
skill_name: "chatgpt-apps-production-checklist"

cases:
  - name: happy-path-full-checklist
    prompt: "Create a P0/P1/P2 production checklist for our ChatGPT App and map each lesson to tasks/tests/widget/tool output patterns."
    acceptance:
      - type: contains
        value: "P0"
      - type: contains
        value: "tasks"
      - type: contains
        value: "tests"
      - type: contains
        value: "widget"
      - type: contains
        value: "tool"

  - name: happy-path-flow-map
    prompt: "Document the widget-server-model message flow and explicit API routing for tool calls, model follow-ups, and context updates."
    acceptance:
      - type: contains
        value: "flow"
      - type: contains
        value: "routing"
      - type: contains
        value: "widget"
      - type: contains
        value: "model"

  - name: edge-no-widget
    prompt: "We only have tools and no widget yet; give us a launch checklist anyway."
    acceptance:
      - type: contains
        value: "API-only prototype"
      - type: contains
        value: "P0"
      - type: contains
        value: "pending"

  - name: edge-mobile-and-csp
    prompt: "Our app breaks on mobile and CSP keeps failing in review. Prioritize fixes."
    acceptance:
      - type: contains
        value: "safe-area"
      - type: contains
        value: "CSP"
      - type: contains
        value: "publish"

  - name: negative-non-apps-sdk
    prompt: "Design a generic React dashboard with no ChatGPT integration."
    acceptance:
      - type: contains
        value: "Don’t use"

  - name: negative-generic-code-review
    prompt: "Review this Python function for style and naming."
    acceptance:
      - type: contains
        value: "Don’t use"

metadata:
  last_updated: "2026-02-12"
  author: "codex"
  review_status: "draft"
