schema_version: "1.0"

purpose: >
  Define expected behavior for producing a production-readiness checklist for ChatGPT Apps,
  mapping 15 key lessons into tasks, tests, widget changes, and tool-result patterns.

triggers:
  - user asks to plan, audit, or operationalize a ChatGPT App build
  - user requests lesson-to-implementation mapping for Apps SDK production readiness
  - user asks for P0/P1/P2 launch checklist with validation and publishability gates

inputs:
  - product goal and user journey
  - current app architecture context (widget, tools, bridge, backend)
  - known constraints (security, compliance, platform modes, timeline)
  - existing CI/testing setup if available

outputs:
  - prioritized checklist (P0/P1/P2) with tasks/tests/widget/tool-output mappings
  - flow map for widget, server, and model interactions
  - validation matrix and release-gate recommendations
  - risk register and sequencing guidance
  - optional filled template artifact from assets/checklist-template.md

required_sections_in_response:
  - scope_and_triggers
  - requirements_and_context
  - deliverables
  - workflow
  - validation
  - anti_patterns
  - constraints_and_safety

tool_output_contract:
  required_guidance:
    - structured_content_vs_meta_boundary
    - stable_entity_ids
    - result_envelope_versioning
    - ui_hints_and_next_actions

non_goals:
  - writing full product code for the app
  - replacing framework-specific implementation docs
  - providing legal/security sign-off as final authority
  - advising non-ChatGPT app architectures outside this domain

risks:
  - risk: mismatched context visibility causes model hallucination or leakage
    mitigation: classify fields by visibility and enforce typed model-visible subset
  - risk: fragmented bridge usage creates routing bugs
    mitigation: require explicit flow map and bridge abstraction boundaries
  - risk: late CSP/publishability checks block release
    mitigation: move metadata/CSP validation to P0/P1 checklist gates
  - risk: checklist too generic for project reality
    mitigation: require project-specific assumptions and measurable tests per item

sources:
  - https://developers.openai.com/blog/15-lessons-building-chatgpt-apps/
  - https://developers.openai.com/apps-sdk/reference/
