schema_version: 1

purpose: >
  Run the compound-engineering reliability-review stage so services, APIs,
  and multi-component systems receive severity-ranked reliability findings
  with failure mode analysis, resilience coverage assessment, dependency
  failure matrices, and SLO readiness evaluation.

triggers:
  - the user wants a reliability review of a service, API, or system
  - the user wants failure mode analysis for an architecture
  - the user wants resilience pattern coverage assessed
  - the user wants to understand cascading failure risk
  - the user wants SLO readiness evaluated
  - ce-plan routes to reliability review via production-considerations criteria

inputs:
  - a review target such as service code, architecture doc, PR with service changes, or infrastructure config
  - access to the relevant code, configs, or design documents
  - enough architectural context to map service boundaries and dependencies

outputs:
  - severity-ranked reliability findings with failure scenario, blast radius, location, mitigation, and confidence
  - resilience coverage assessment against the resilience checklist
  - dependency failure matrix when multiple external dependencies exist
  - SLO readiness assessment when the target is user-facing
  - explicit no-critical-findings statement when appropriate
  - schema_version: 1 when the caller requests structured output

non_goals:
  - implementing resilience fixes
  - performance optimization without reliability context
  - general code quality review without reliability focus
  - security threat modeling
  - planning reliability implementation

risks:
  - theoretical scenarios without grounding; mitigate with code/architecture evidence
  - missing cascading paths; mitigate with dependency mapping before analysis
  - over-engineering recommendations; mitigate with scale-appropriate patterns
  - assuming cloud guarantees; mitigate with application-level verification
