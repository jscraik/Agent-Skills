schema_version: 1

purpose: >
  Run the execution stage of the compound-engineering workflow so approved work
  lands with synchronized task state, contract-drift control, validation
  evidence, UI execution discipline, and shipping-ready handoff notes.

triggers:
  - the user wants to implement an approved plan, todo file, or tightly scoped spec
  - the user explicitly requests the ce:work stage
  - the user wants execution with contract traceability, testing, and rollout hygiene
  - the user wants delegate-mode implementation for scoped tasks

inputs:
  - a plan path, UI plan path, todo path, small low-risk spec path, or an obviously tiny low-risk bare work request
  - linked artifacts such as origin brainstorms, parent specs, UI specs, or related issue context
  - repo conventions and validation commands from AGENTS.md
  - optional execution posture signals such as test-first, characterization-first, or external-delegate

outputs:
  - a chosen execution lane such as plan-led, todo-led, or small-spec-direct
  - synchronized task and markdown execution progress
  - implemented code plus validation evidence
  - updated contract artifacts when execution reveals drift
  - a shipping handoff package with monitoring and validation notes
  - a review-tier decision that defaults to full ce-review before handoff
  - UI evidence when user-visible surfaces changed

non_goals:
  - creating first-pass specs or plans when those stages are still missing
  - silently expanding product scope during implementation
  - skipping validation to optimize for speed
  - treating prototype artifacts as production output by default
  - relying on stale harness-specific commit or PR templates

risks:
  - executing from the wrong artifact; mitigate with explicit lane selection and linked-artifact reads
  - inventing structure for an underspecified bare request; mitigate with tiny-scope-only direct execution and upstream routing for anything larger
  - plan/task drift; mitigate with synchronized markdown and task updates
  - contract drift during execution; mitigate with stop-and-update rules
  - unsafe direct raw-spec execution; mitigate with plan-first escalation for medium/high-risk work
  - UI churn from skipped prototype decisions; mitigate with explicit UI execution gates
  - brittle shipping notes; mitigate with a standard handoff package and operational validation section
