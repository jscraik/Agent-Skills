schema_version: 1
name: resolve-todo-parallel
purpose: Resolve file-based todo artifacts with dependency-aware execution, bounded parallelism when allowed, optional lesson capture, and safe cleanup.
triggers:
  - User asks to resolve pending todo files from a `todos/` directory.
  - User wants dependency-aware or bounded-parallel execution across multiple todo items.
  - User wants todo cleanup after verified resolution.
inputs:
  - name: todo_scope
    type: string
    description: Specific todo ID, filename pattern, or all pending todos.
  - name: repo_has_todos
    type: boolean
    description: Whether the target repo has a file-based `todos/` workflow.
  - name: execution_preference
    type: enum
    values: [serial, bounded-parallel, auto]
    description: Requested or inferred execution mode.
  - name: cleanup_approval
    type: boolean
    description: Whether completed todo cleanup is approved.
  - name: commit_push_approval
    type: boolean
    description: Whether commit or push actions are approved.
outputs:
  - name: execution_plan
    type: string
    description: Dependency-aware plan for serial or bounded-parallel execution.
  - name: resolved_todos
    type: array
    description: Todos resolved during the run.
  - name: blocked_todos
    type: array
    description: Todos blocked by dependencies, missing context, or approval limits.
  - name: lessons_documented
    type: string
    description: Optional docs/solutions path created via compound capture.
  - name: cleanup_summary
    type: string
    description: What todo cleanup happened and what remains pending approval.
success_criteria:
  - Todo discovery happens before execution.
  - Parallel execution is used only for genuinely independent items.
  - Protected CE artifacts are not deleted by cleanup.
  - Commit, push, and deletion actions respect explicit approval boundaries.
non_goals:
  - Installing local task tooling.
  - Generic plan execution with no todo workflow.
  - Auto-merging or auto-pushing changes without approval.
risks:
  - Parallelizing overlapping todo items and causing collisions.
  - Deleting protected compound-engineering artifacts.
  - Inheriting upstream commit-and-push behavior without local adaptation.
