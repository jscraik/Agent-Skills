schema_version: 1

purpose: >
  Run the brainstorm stage of the compound-engineering workflow so the user clarifies
  what to build, compares a few viable directions, and decides whether the next step
  should be spec or planning.

triggers:
  - the user wants to brainstorm a feature, improvement, or product direction before planning
  - the user wants the compound-engineering brainstorm stage explicitly
  - the user needs help deciding whether a spec is required
  - the user wants a brainstorm artifact written to docs/brainstorms

inputs:
  - a feature idea, problem, or improvement to explore
  - relevant context, constraints, risks, and success criteria when available
  - optional repo context and prior artifacts

outputs:
  - a clarified problem statement
  - 2-3 approaches with trade-offs and a recommendation
  - explicit `spec_required`, `risk_level`, and `complexity` values
  - exact parallel research support via `repo-research-analyst` and `learnings-researcher` when repo context matters
  - a brainstorm artifact when the work is substantial
  - a recommended next workflow stage

non_goals:
  - direct implementation
  - detailed task sequencing
  - forcing brainstorm when the request is already clear enough for planning

risks:
  - over-questioning; mitigate with one-question-at-a-time clarification
  - over-design; mitigate with YAGNI and recommendation-first output
  - weak handoff; mitigate with explicit next-stage guidance and artifact writing
  - shallow recommendations without repo context; mitigate with bounded parallel subagent research when relevant
