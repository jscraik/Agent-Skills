# Skill Output Contract
# Source: templates/contract.yaml - Copy and customize for your skill.

schema_version: "1.0"

purpose: >
  Define expected behavior and outputs for this skill.
  This skill designs backend architecture, data models, API contracts,
  auth, reliability, observability, and integrations.

triggers:
  - user requests backend design/specs
  - system architecture discussion
  - API contract design

inputs:
  - user requirements
  - constraints and assumptions
  - existing system context

outputs:
  - architecture specification
  - data models
  - API contracts
  - implementation guidance

non_goals:
  - frontend UI implementation
  - product requirements documentation

risks:
  - missing inputs; mitigated by clarifying questions
  - scope creep; mitigated by explicit boundaries
