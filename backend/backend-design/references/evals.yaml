# Skill Evaluation Cases
# Source: templates/evals.yaml - Copy and customize for your skill.

schema_version: "1.0"

skill_name: "backend-design"

cases:
  - name: happy-path
    prompt: "Design a backend system for a social media app."
    context:
      - "Need to handle user profiles, posts, and feeds"
    acceptance:
      - type: contains
        value: "## Outputs"
      - type: contains
        value: "architecture"

  - name: edge-case
    prompt: "Design backend for unknown requirements."
    context:
      - "Vague project description"
    acceptance:
      - type: contains
        value: "## Inputs"
      - type: contains
        value: "clarifying"

  - name: failure-mode
    prompt: "Create a UI mockup for my app."
    context:
      - "Request is for frontend work"
    acceptance:
      - type: contains
        value: "## When to use"
      - type: not_contains
        value: "mockup"

metadata:
  last_updated: "2026-02-05"
  review_status: "draft"
