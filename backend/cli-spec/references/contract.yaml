# Skill Output Contract
# Source: templates/contract.yaml - Copy and customize for your skill.

schema_version: "1.0"

purpose: >
  Define expected behavior and outputs for this skill.
  This skill designs CLI surface area including commands, flags,
  subcommands, help text, output formats, and UX behavior.

triggers:
  - user requests CLI design
  - command-line interface specification needed
  - CLI refactoring or standardization

inputs:
  - command name and purpose
  - user type (humans, scripts, or both)
  - constraints and requirements

outputs:
  - command tree and usage synopsis
  - flags/args specification
  - output contracts (json/plain)
  - exit code definitions

non_goals:
  - GUI or web interface design
  - implementation code generation

risks:
  - ambiguous requirements; mitigated by clarifying questions
  - scope creep beyond CLI surface
