# Skill Evaluation Cases
# Source: templates/evals.yaml - Copy and customize for your skill.

schema_version: "1.0"

skill_name: "cli-spec"

cases:
  - name: happy-path
    prompt: "Design a CLI for managing deployments."
    context:
      - "Need commands for deploy, rollback, status"
    acceptance:
      - type: contains
        value: "## Outputs"
      - type: contains
        value: "subcommand"

  - name: edge-case
    prompt: "Design CLI without knowing target users."
    context:
      - "Unclear if for humans or scripts"
    acceptance:
      - type: contains
        value: "## Inputs"
      - type: contains
        value: "user"

  - name: failure-mode
    prompt: "Create a web dashboard for my app."
    context:
      - "Request is for GUI, not CLI"
    acceptance:
      - type: contains
        value: "## When to use"
      - type: not_contains
        value: "dashboard"

metadata:
  last_updated: "2026-02-05"
  review_status: "draft"
