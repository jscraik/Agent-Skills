purpose: Use when a user asks to debug or fix failing GitHub PR checks that run in
  GitHub Actions; use `gh` to inspect checks and logs, summarize failure context,
  draft a fix plan, and implement only after explicit approval. Treat external providers
  (for example Buildkite) as out of scope and report only the details URL.
schema_version: '1.0'
triggers:
- When requests match gh-fix-ci scope and intent.
inputs:
- user request details
outputs:
- structured response or artifacts defined by the skill
non_goals:
- out-of-scope requests outside the skill boundary
risks:
- missing context; mitigated by clarifying questions and explicit assumptions
