purpose: >
  Define expected behavior for installing and configuring the automate-github-issues
  pipeline in a target repository.
schema_version: 1.0
triggers:
  - user asks to automate GitHub issue triage/planning/dispatch/merge with Jules
inputs:
  - target repository path and branch context
  - workflow/write permission expectations
  - required secret availability (JULES_API_KEY, GitHub token scope)
outputs:
  - setup steps for scripts/workflows/env
  - validation checklist before dispatch/merge
  - troubleshooting guidance
non_goals:
  - unmanaged deployment or unrelated CI refactors
  - backward-compatibility shims unless explicitly requested
risks:
  - overlapping task ownership causing merge conflicts
  - secret exposure in logs or committed files
