schema_version: 1
purpose: >
  Canonical contract for consolidated GitHub lifecycle execution across intake,
  issue fixing, PR preparation, review request/reception, review comment handling, CI diagnosis, and
  server-side PR merge.

triggers:
  - Requests involving GitHub issues, pull requests, review intake, review comments, PR checks, or server-side merge

inputs:
  - mode
  - repo context (local path or owner/repo)
  - pr identifier (number or URL) when mode requires PR context
  - issue identifier when mode requires issue context

outputs:
  - Human-readable summary of result
  - Structured output matching required_output fields

risks:
  - Missing gh authentication or repository permissions
  - Missing PR/issue identifiers when auto-discovery fails
  - External CI failures where only links are available

modes:
  - intake
  - issue_fix
  - pr_prepare
  - pr_request_review
  - pr_receive_review
  - pr_review_comments
  - ci_diagnose
  - pr_merge_server
  - full_lifecycle

required_output:
  mode: string
  repo:
    nameWithOwner: string
    localPath: string
  pr:
    number: integer
    url: string
    head: string
    base: string
    state: string
  issue:
    number: integer
    url: string
    state: string
    required: false
  status:
    enum: [ready, blocked, in_progress, completed, failed]
  actions_taken:
    type: array
    items: string
  evidence:
    type: array
    items:
      type: object
      fields:
        kind: string
        label: string
        value: string
  merge:
    strategy:
      enum: [squash, merge, rebase]
    auto_merge_enabled: boolean
    delete_branch: boolean
    result:
      enum: [not_attempted, queued, merged, blocked, failed]
    required: false
  next_step: string
  risks:
    type: array
    items: string

defaults:
  merge_strategy: squash
  merge_delete_branch: true
  merge_auto: true
  ci_scope: github_actions_plus_external_links

non_goals:
  - Deep integration with non-GitHub Actions CI providers
  - Release management and version publishing
