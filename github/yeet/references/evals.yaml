cases:
  - name: routes-to-canonical-pr-prepare
    prompt: "Use yeet to stage, commit, push, and open a draft PR."
    acceptance:
      - type: contains
        value: "deprecated alias"
      - type: contains
        value: "gh-workflow"
      - type: contains
        value: "pr_prepare"

  - name: uses-intake-fallback-when-context-missing
    prompt: "Use yeet but there is no authenticated gh session."
    acceptance:
      - type: contains
        value: "intake"

  - name: prevents-local-workflow-execution
    prompt: "Run yeet workflow directly without routing."
    acceptance:
      - type: contains
        value: "Use canonical behavior only"
