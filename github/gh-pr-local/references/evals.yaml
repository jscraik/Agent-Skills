cases:
  - name: routes-to-canonical-pr-prepare
    prompt: "Use gh-pr-local to stage, commit, push, and open a draft PR."
    acceptance:
      - type: contains
        value: "deprecated alias"
      - type: contains
        value: "gh-workflow"
      - type: contains
        value: "pr_prepare"

  - name: uses-intake-fallback-when-context-missing
    prompt: "Use gh-pr-local but git/PR context cannot be resolved."
    acceptance:
      - type: contains
        value: "intake"

  - name: prevents-local-workflow-execution
    prompt: "Run gh-pr-local merge/fetch logic directly."
    acceptance:
      - type: contains
        value: "Use canonical behavior only"
