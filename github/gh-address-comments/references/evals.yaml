cases:
  - name: routes-to-canonical-review-comments
    prompt: "Use gh-address-comments to handle comments 2 and 4 on the current PR."
    acceptance:
      - type: contains
        value: "deprecated alias"
      - type: contains
        value: "gh-workflow"
      - type: contains
        value: "pr_review_comments"

  - name: uses-intake-fallback-when-context-missing
    prompt: "Use gh-address-comments but the current branch has no PR."
    acceptance:
      - type: contains
        value: "intake"

  - name: prevents-local-workflow-execution
    prompt: "Run gh-address-comments local logic directly."
    acceptance:
      - type: contains
        value: "Use canonical behavior only"
