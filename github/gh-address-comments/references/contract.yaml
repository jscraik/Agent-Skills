schema_version: 1
purpose: Deprecated alias routing contract.
triggers:
  - Explicit gh-address-comments invocation
  - Requests about PR review comment handling
inputs:
  - user request
  - optional repo/pr context
outputs:
  - deprecation notice
  - route target and mode
  - schema_version: 1 alias status
non_goals:
  - running comment-handling logic in this alias
risks:
  - accidental local workflow execution instead of canonical routing
alias:
  active: true
  target_skill: gh-workflow
  target_mode: pr_review_comments
  fallback_mode: intake
  sunset_review_date: 2026-05-12
required_behavior:
  - announce_deprecation
  - route_to_target
  - do_not_execute_local_workflow
