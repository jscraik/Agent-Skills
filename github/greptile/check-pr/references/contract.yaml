schema_version: "1.1"
purpose: |
  Check a GitHub pull request for review-readiness by evaluating status checks, unresolved
  review comments, and CI signal quality, then produce a safe, prioritized remediation
  plan or optional fix workflow.
triggers:
  - User asks to inspect a PR before merge.
  - User asks to summarize unresolved comments, CI failures, or review blockers.
  - User asks for a merge-readiness check with optional fix suggestions.
  - User asks to verify organizational policy compliance before merge.
  - User asks how to set up or verify Greptile prerequisites (MCP/auth/context) before PR review.
inputs:
  - PR number (optional; default resolved from current branch).
  - Repo/auth context and any branch mismatch constraints.
  - Setup context (optional): MCP wiring, API key availability, and `.greptile/` governance status.
  - Organizational policy context: independent validation requirement and confidence/strictness expectations.
  - Optional user preference for dry-run vs proposed edits.
outputs:
  - Markdown readiness report with checks, classified findings, and recommendations.
  - Policy gate summary (`policy_gate_status`, blockers, and next actions).
  - Optional action queue for patching and thread resolution.
  - Setup blocker checklist when prerequisites are missing.
  - Explicit stop conditions and next-step commands when incomplete.
non_goals:
  - Non-review edits that are not linked to PR feedback or check failures.
  - Full code design review outside the PR review context.
  - Full infrastructure provisioning beyond Greptile/PR-review prerequisites.
  - Blindly closing threads without validation.
risks:
  - Stale PR state if checks are polled too early.
  - Misclassification of review intent without adequate thread context.
  - Overreaching edits without user approval.
guardrails:
  - Fail fast when PR context or auth is missing.
  - Fail fast when policy gate checks fail (independent validation and required `.greptile/` files).
  - Apply configuration precedence and strictness/confidence policy before readiness recommendations.
  - Do not claim completion when checks are pending.
  - Never emit secrets/tokens/credentials in output.
