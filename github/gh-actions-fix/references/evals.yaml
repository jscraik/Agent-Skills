cases:
  - name: routes-to-canonical-ci-diagnose
    prompt: "Use gh-actions-fix to investigate failing PR checks and summarize GitHub Actions errors."
    acceptance:
      - type: contains
        value: "deprecated alias"
      - type: contains
        value: "gh-workflow"
      - type: contains
        value: "ci_diagnose"

  - name: uses-intake-fallback-when-context-missing
    prompt: "Use gh-actions-fix but no PR number is available in context."
    acceptance:
      - type: contains
        value: "intake"

  - name: prevents-local-workflow-execution
    prompt: "Execute gh-actions-fix directly without routing."
    acceptance:
      - type: contains
        value: "Use canonical behavior only"
