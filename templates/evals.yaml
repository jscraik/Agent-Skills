# Skill Evaluation Cases
# Copy this file to your skill's references/ directory and customize for your skill.
# Add at least 3 cases: happy-path, edge-case, and failure-mode.

schema_version: "1.0"

skill_name: "your-skill-name"

cases:
  - name: happy-path
    prompt: "Use the SKILL_NAME skill for a typical request."
    context:
      - "Typical context that would trigger this skill"
    acceptance:
      - type: contains
        value: "## Outputs"
      - type: not_contains
        value: "error"

  - name: edge-case
    prompt: "Handle an edge case for SKILL_NAME without enough inputs."
    context:
      - "Incomplete or ambiguous information"
    acceptance:
      - type: contains
        value: "## Inputs"
      - type: contains
        value: "clarifying"

  - name: failure-mode
    prompt: "User request is out of scope for SKILL_NAME."
    context:
      - "Request that doesn't match the skill's purpose"
    acceptance:
      - type: contains
        value: "## When to use"
      - type: not_contains
        value: "proceed"

  - name: trigger-accuracy
    prompt: "Verify skill is selected appropriately based on trigger keywords."
    context:
      - "Keywords that should activate this skill"
    acceptance:
      - type: skill_selected
        expected_skill: "SKILL_NAME"

metadata:
  last_updated: "YYYY-MM-DD"
  author: "Your Name"
  review_status: "draft"  # draft | reviewed | validated
